      folding:
        title: Metrics
        enabled: false
      description: ""
      availability: []
      scopes:
        - name: global
          description: "These metrics show how often file lookups were resolved by the kernel directory cache, host-wide."
          labels: []
          metrics:
            - name: filesystem.dc_hit_ratio
              description: "Percentage of directory lookups resolved by the cache — `(reference - miss) / reference`. It measures lookup resolution, not how many files are held in the cache. Computed from cumulative counters since the eBPF program attached, matching the legacy dcstat contract."
              unit: "%"
              chart_type: line
              dimensions:
                - name: ratio
            - name: filesystem.dc_reference
              description: "Variables used to calculate hit ratio. Published as per-interval totals with the `absolute` algorithm, preserving the legacy dcstat metric contract."
              unit: "files"
