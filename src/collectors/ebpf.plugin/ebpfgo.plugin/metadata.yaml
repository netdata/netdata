          description: "The plugin checks kernel compilation flags (CONFIG_KPROBES, CONFIG_BPF, CONFIG_BPF_SYSCALL, CONFIG_BPF_JIT), presence of BTF files, and the configured object flavor to decide which eBPF program will be attached. Because `lookup_fast` is a static kernel function, the collector resolves its real symbol name from `/proc/kallsyms` before attaching."
        limits:
          description: ""
        performance_impact:
          description: "This thread will add overhead every time that an internal kernel function monitored by this thread is called."
