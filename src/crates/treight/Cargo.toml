[package]
name = "treight"
version = "0.1.0"
edition.workspace = true
description = "Compressed bitmap using an 8-way bit-tree (as used by GNU idutils)"

[features]
roaring = ["dep:roaring"]
serde = ["dep:serde"]

[dependencies]
roaring = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
