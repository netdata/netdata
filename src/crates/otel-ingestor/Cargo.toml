[package]
name = "otel-ingestor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "otel_ingestor"
path = "src/lib.rs"

[dependencies]
bridge = { workspace = true }
ferryboat = { workspace = true }
flatten_otel = { workspace = true }
ng-flatten = { workspace = true }
netdata-plugin-types = { workspace = true }

# WAL writing
file-registry = { workspace = true }
otel-logs-identity = { workspace = true }
otel-catalog = { workspace = true }
prost = { workspace = true }
serde = { workspace = true, features = ["rc"] }
sfst = { workspace = true }
wal = { workspace = true }

# OTLP/HTTP receiver: axum router plus HTTP request plumbing, gzip
# Content-Encoding handling, and the `with-serde` proto types that back the
# OTLP/JSON codec. TLS for the HTTP listener terminates via tokio-rustls,
# separate from tonic's gRPC TLS.
anyhow = { workspace = true }
axum = { workspace = true }
flate2 = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["with-serde"] }
regex = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_regex = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tonic = { workspace = true, features = ["gzip", "tls-ring"] }
tracing = { workspace = true }
twox-hash = { workspace = true, features = ["xxhash64"] }
uuid = { workspace = true }

[dev-dependencies]
bytesize = { workspace = true }
# TLS listener tests: certificates generated per run, the test client config,
# and the process crypto provider the otel-plugin binary installs at startup.
rcgen = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
# oneshot() request/response assertions against the OTLP/HTTP axum router.
tower = { workspace = true, features = ["util"] }
