# netdata statsd.plugin configuration
#
# This file is in YAML format. Jobs live under /etc/netdata/statsd/listen.conf;
# this file only controls plugin-wide defaults and module toggles.

# Enable/disable the whole statsd.plugin.
enabled: yes

# Enable/disable default value for all modules.
default_run: yes

# Maximum number of used CPUs. Zero means no limit.
max_procs: 0

modules:
  listen: yes
