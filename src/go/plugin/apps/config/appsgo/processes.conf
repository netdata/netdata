# One canonical host scan. This file is YAML.
jobs:
  - name: processes
    update_every: 1
    # proc_path: /proc # Defaults to NETDATA_HOST_PREFIX + /proc.
    collect_fds: true
    collect_pss: true
    groups:
      - name: netdata
        match:
          - comm: 'glob:netdata*'
      - name: postgres
        match:
          - comm: 'glob:postgres*'
      - name: web
        match:
          - cmdline: 'regexp:gunicorn|uvicorn'
