# StatsD receiver jobs. No listener is enabled by default.
#
# Every listed listener must bind for the job to start. The C statsd plugin
# built into the Netdata Agent listens on localhost:8125 (UDP and TCP) by
# default, so use another port or disable it ([plugins] statsd = no in
# netdata.conf) before using 8125 here.
#
# Profiles are YAML files selected by name from /etc/netdata/statsd.d/statsd.profiles/.

