# Collect the local OpenIPMI device by default. Hosts without a device do not collect.
# Replace this job to collect a remote BMC instead, or use jobs: [] to disable local collection.
# Netdata selects one IPMI implementation at startup. To use this plugin explicitly:
# [plugins]
#     ipmi = yes
# To switch back to the C implementation, set ipmi = no and freeipmi = yes, then restart Netdata.
# Packaged installations grant ipmi.plugin the privileges needed to access the device.

jobs:
  - name: local
    driver: open
    device: 0
    # update_every: 10
    # timeout: 5s
    # collect_sel: true  # System Event Log entry count and new records charts, and the ipmi-sel Function

