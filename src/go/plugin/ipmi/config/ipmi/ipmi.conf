# Disable freeipmi in netdata.conf before activating this collector:
# [plugins]
#     freeipmi = no
#
# Local access requires read/write permission on /dev/ipmi0.
# The installer grants no additional privileges to ipmi.plugin.
#
# jobs:
#   - name: ipmi
#     driver: open
#     device: 0
#     update_every: 5
#     timeout: 5s
#     collect_sel: true
#
# Remote example (manual vnode mapping is optional):
#   - name: remote
#     driver: lanplus
#     hostname: bmc.example.com
#     port: 623
#     username: monitoring
#     password: ''
#     vnode: ''
