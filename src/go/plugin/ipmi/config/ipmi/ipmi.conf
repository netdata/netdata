# Disable freeipmi when collecting the same host with the canonical ipmi job:
# [plugins]
#     freeipmi = no
#
# Local access requires read/write permission on /dev/ipmi0.
# The installer grants no additional privileges to ipmi.plugin.
#
# jobs:
#   - name: ipmi
#     driver: open
#     device: 0
#     update_every: 5
#     timeout: 5s
#     collect_sel: true
#
# Remote BMC (no local device permissions needed):
# jobs:
#   - name: server-bmc
#     driver: lanplus  # Use lan for BMCs that require IPMI 1.5.
#     hostname: bmc.example
#     port: 623
#     username: monitor
#     password: '${env:IPMI_PASSWORD}'
#     privilege_level: user
#     # Optional: define server-node in vnodes.conf before setting vnode.
#     # Without vnode, metrics belong to the Agent host.
#     # vnode: server-node
