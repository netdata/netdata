# SPDX-License-Identifier: GPL-3.0-or-later
# Service/model rollups and built-in detail are admitted independently under the existing limits.
# Scheduler pressure uses extrema because ranks may report replicated observations.
# Unknown source families remain available to generic fallback.

match: sglang:*
app: sglang
relabeling:
- match: sglang:http_requests_total
  metric_relabel_configs:
  - target_label: method_class
    replacement: other
  - source_labels:
    - method
    regex: (GET|HEAD|POST|PUT|DELETE|CONNECT|OPTIONS|TRACE|PATCH)
    target_label: method_class
    replacement: ${1}
- match: sglang:http_responses_total
  metric_relabel_configs:
  - target_label: method_class
    replacement: other
  - source_labels:
    - method
    regex: (GET|HEAD|POST|PUT|DELETE|CONNECT|OPTIONS|TRACE|PATCH)
    target_label: method_class
    replacement: ${1}
- match: sglang:http_responses_total
  metric_relabel_configs:
  - target_label: status_class
    replacement: unclassified
  - source_labels:
    - status_code
    regex: ([1-5])[0-9]{2}
    target_label: status_class
    replacement: ${1}xx
- match: sglang:http_requests_active
  metric_relabel_configs:
  - target_label: method_class
    replacement: other
  - source_labels:
    - method
    regex: (GET|HEAD|POST|PUT|DELETE|CONNECT|OPTIONS|TRACE|PATCH)
    target_label: method_class
    replacement: ${1}
template:
  context_namespace: sglang
  chart_defaults:
    label_promotion: []
  groups:
  - family: Service
    context_namespace: service
    chart_defaults:
      priority: 70000
    metrics:
    - sglang:num_requests_total
    - sglang:prompt_tokens_total
    - sglang:generation_tokens_total
    - sglang:e2e_request_latency_seconds_bucket
    - sglang:e2e_request_latency_seconds_count
    - sglang:e2e_request_latency_seconds_sum
    - sglang:time_to_first_token_seconds_bucket
    - sglang:time_to_first_token_seconds_count
    - sglang:time_to_first_token_seconds_sum
    - sglang:inter_token_latency_seconds_bucket
    - sglang:inter_token_latency_seconds_count
    - sglang:inter_token_latency_seconds_sum
    - sglang:failed_session_recoveries_total
    - sglang:routing_keys_active
    - sglang:http_requests_total
    - sglang:http_responses_total
    - sglang:http_requests_active
    charts:
    - title: Finished Inference Requests
      context: finished_requests
      units: requests/s
      dimensions:
      - selector: sglang:num_requests_total
        name_from_label: is_streaming
      aggregation: sum
    - title: Finished Request Tokens
      context: tokens
      units: tokens/s
      dimensions:
      - selector: sglang:prompt_tokens_total
        name: prompt
      - selector: sglang:generation_tokens_total
        name: generated
      aggregation: sum
    - title: End-to-End Request Latency Distribution (seconds)
      context: e2e_request_latency_distribution
      units: observations/s
      dimensions:
      - selector: sglang:e2e_request_latency_seconds_bucket
      aggregation: sum
    - title: End-to-End Request Latency Observation Rate
      context: e2e_request_latency_observations
      units: requests/s
      dimensions:
      - selector: sglang:e2e_request_latency_seconds_count
        name: observations
      aggregation: sum
    - title: End-to-End Request Latency Accumulated Observations
      context: e2e_request_latency_observation_sum
      units: seconds/s
      dimensions:
      - selector: sglang:e2e_request_latency_seconds_sum
        name: observation_sum
      aggregation: sum
    - title: Time to First Token Distribution (seconds)
      context: time_to_first_token_distribution
      units: observations/s
      dimensions:
      - selector: sglang:time_to_first_token_seconds_bucket
      aggregation: sum
    - title: Time to First Token Observation Rate
      context: time_to_first_token_observations
      units: requests/s
      dimensions:
      - selector: sglang:time_to_first_token_seconds_count
        name: observations
      aggregation: sum
    - title: Time to First Token Accumulated Observations
      context: time_to_first_token_observation_sum
      units: seconds/s
      dimensions:
      - selector: sglang:time_to_first_token_seconds_sum
        name: observation_sum
      aggregation: sum
    - title: Inter-Token Latency Distribution (seconds)
      context: inter_token_latency_distribution
      units: observations/s
      dimensions:
      - selector: sglang:inter_token_latency_seconds_bucket
      aggregation: sum
    - title: Inter-Token Latency Observation Rate
      context: inter_token_latency_observations
      units: tokens/s
      dimensions:
      - selector: sglang:inter_token_latency_seconds_count
        name: observations
      aggregation: sum
    - title: Inter-Token Latency Accumulated Observations
      context: inter_token_latency_observation_sum
      units: seconds/s
      dimensions:
      - selector: sglang:inter_token_latency_seconds_sum
        name: observation_sum
      aggregation: sum
    - title: Failed Streaming-Session Recoveries
      context: failed_session_recoveries_total
      units: sessions/s
      dimensions:
      - selector: sglang:failed_session_recoveries_total
        name: failed_session_recoveries_total
    - title: Active Routing Keys
      context: routing_keys_active
      units: routing keys
      dimensions:
      - selector: sglang:routing_keys_active
        name: routing_keys_active
    - title: HTTP Request Arrivals
      context: http_requests_total
      units: requests/s
      dimensions:
      - selector: sglang:http_requests_total
        name_from_label: method_class
      aggregation: sum
    - title: Returned HTTP Responses
      context: http_responses_total
      units: requests/s
      dimensions:
      - selector: sglang:http_responses_total
        name_from_label: status_class
      aggregation: sum
    - title: Active HTTP Requests
      context: http_requests_active
      units: requests
      dimensions:
      - selector: sglang:http_requests_active
        name_from_label: method_class
      aggregation: sum
