  - family: Runtime
    context_namespace: runtime
    chart_defaults:
      priority: 77000
    metrics:
    - sglang:process_cpu_seconds_total
    - sglang:func_latency_seconds_bucket
    - sglang:func_latency_seconds_count
    - sglang:func_latency_seconds_sum
    - sglang:startup_time_seconds
    - sglang:startup_cuda_graph_time_seconds
    - sglang:spec_verify_calls_total
    - sglang:get_loads_duration_seconds_bucket
    - sglang:get_loads_duration_seconds_count
    - sglang:get_loads_duration_seconds_sum
    - sglang:startup_latency_breakdown_seconds_max
    charts:
    - title: Component CPU Time
      context: process_cpu_seconds_total
      units: seconds/s
      dimensions:
      - selector: sglang:process_cpu_seconds_total
