      charts:
      - title: Worker Request Queues
        context: worker_requests
        units: requests
        dimensions:
        - selector: sglang:num_running_reqs{priority!~".+"}
          name: running
        - selector: sglang:num_queue_reqs{priority!~".+"}
          name: waiting
        instances:
          by_labels:
          - model_name
          - engine_type
          - tp_rank
          - pp_rank
          - moe_ep_rank
          optional_by_labels:
          - dp_rank
