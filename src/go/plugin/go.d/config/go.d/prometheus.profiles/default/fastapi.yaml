# prometheus-fastapi-instrumentator HTTP server instrumentation shared by applications.
# Generated *_created gauges are registration timestamps rather than operational signals.

match: 'http_requests* http_request_duration* http_request_size* http_response_size*'
relabeling:
  - match: >-
      http_request_duration_highr_seconds_created
      http_request_duration_seconds_created
      http_request_size_bytes_created
      http_requests_created
      http_response_size_bytes_created
    metric_relabel_configs:
      - action: drop
template:
  family: FastAPI
  context_namespace: fastapi
  groups:
    - family: HTTP Endpoints
      context_namespace: http_endpoints
      chart_defaults:
        instances:
          by_labels: [handler, method]
      metrics:
        - http_requests_total
        - http_request_duration_seconds_bucket
        - http_request_duration_seconds_count
        - http_request_duration_seconds_sum
      charts:
        - title: HTTP Request Outcomes
          context: request_outcomes
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: http_requests_total
              name_from_label: status

        - title: HTTP Request Duration
          context: request_duration
          units: observations/s
          algorithm: incremental
          type: heatmap
          dimensions:
            - selector: http_request_duration_seconds_bucket

        - title: HTTP Request Measurements
          context: request_measurements
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: http_request_duration_seconds_count
              name: requests

        - title: HTTP Request Concurrency
          context: request_concurrency
          units: in-flight
          algorithm: incremental
          type: line
          dimensions:
            - selector: http_request_duration_seconds_sum
              name: requests

    - family: HTTP Service
      context_namespace: http_service
      metrics:
        - http_request_duration_highr_seconds_bucket
        - http_request_duration_highr_seconds_count
        - http_request_duration_highr_seconds_sum
      charts:
        - title: High-Resolution HTTP Request Duration
          context: request_duration
          units: observations/s
          algorithm: incremental
          type: heatmap
          dimensions:
            - selector: http_request_duration_highr_seconds_bucket

        - title: HTTP Request Measurements
          context: request_measurements
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: http_request_duration_highr_seconds_count
              name: requests

        - title: HTTP Request Concurrency
          context: request_concurrency
          units: in-flight
          algorithm: incremental
          type: line
          dimensions:
            - selector: http_request_duration_highr_seconds_sum
              name: requests
