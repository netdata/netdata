  - match: ceph_rocksdb_cache_*
    metric_relabel_configs:
      - source_labels:
          - __name__
        regex: ceph_rocksdb_cache_(.+?)_(capacity|inserts|lookups|misses|pinned|elems|usage|hits)
        target_label: rocksdb_cache_key
        replacement: ${1}
