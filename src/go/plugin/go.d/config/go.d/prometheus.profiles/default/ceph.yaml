                - 'ceph_pg_creating'
                - 'ceph_pg_down'
                - 'ceph_pg_incomplete'
                - 'ceph_pg_laggy'
                - 'ceph_pg_peered'
                - 'ceph_pg_peering'
                - 'ceph_pg_premerge'
                - 'ceph_pg_stale'
                - 'ceph_pg_unknown'
                - 'ceph_pg_wait'
              charts:
                - title: Placement Groups
                  context: pg_state
                  units: PGs
                  algorithm: absolute
                  type: line
                  priority: 4250
                  dimensions:
