                    - selector: 'ceph_osd_flag_nodown'
                      name: nodown
                    - selector: 'ceph_osd_flag_noin'
                      name: noin
                    - selector: 'ceph_osd_flag_noout'
                      name: noout
                    - selector: 'ceph_osd_flag_norebalance'
