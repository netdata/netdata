# One Ceph profile for cluster-wide MGR and host-local official ceph-exporter surfaces.
# Exact source bases: Ceph 19.2.5, Ceph 20.2.2, and the current official NVMe-oF gateway.
# The hierarchy follows cluster impact -> service/daemon owner -> causal capability.
# Long-running-average sums use incremental semantics across the MGR counter and
# ceph-exporter gauge wire-type variants. Wildcard identity preserves every official
# pool/daemon/image/user/bucket/gateway/device axis instead of silently merging entities.
match: 'ceph_*'
app: ceph
autogen:
  selector:
    deny:
      - 'ceph_objecter_0x*'
template:
  family: Ceph
  context_namespace: ceph
  groups:
    - family: Cluster MGR
      context_namespace: cluster_mgr
      groups:
        - family: Capacity
          context_namespace: capacity
          groups:
            - family: Object Health
              context_namespace: object_health
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_num_objects_degraded'
                - 'ceph_num_objects_misplaced'
                - 'ceph_num_objects_unfound'
              charts:
                - title: Objects
                  context: object_state
                  units: objects
                  algorithm: absolute
                  type: line
                  priority: 4000
                  dimensions:
                    - selector: 'ceph_num_objects_degraded'
                      name: degraded
                    - selector: 'ceph_num_objects_misplaced'
                      name: misplaced
                    - selector: 'ceph_num_objects_unfound'
                      name: unfound

            - family: Overall Cluster Space
              context_namespace: overall_cluster_space
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_cluster_total_bytes'
                - 'ceph_cluster_total_used_bytes'
                - 'ceph_cluster_total_used_raw_bytes'
              charts:
                - title: Space and Memory
                  context: space
                  units: bytes
                  algorithm: absolute
                  type: line
                  priority: 4010
                  dimensions:
                    - selector: 'ceph_cluster_total_bytes'
                      name: bytes
                    - selector: 'ceph_cluster_total_used_bytes'
                      name: used_bytes
                    - selector: 'ceph_cluster_total_used_raw_bytes'
                      name: used_raw_bytes

            - family: Space by Device Class
              context_namespace: space_by_device_class
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_cluster_by_class_total_bytes'
                - 'ceph_cluster_by_class_total_used_bytes'
                - 'ceph_cluster_by_class_total_used_raw_bytes'
              charts:
                - title: Space and Memory
                  context: space
                  units: bytes
                  algorithm: absolute
                  type: line
                  priority: 4020
                  dimensions:
                    - selector: 'ceph_cluster_by_class_total_bytes'
                      name: bytes
                    - selector: 'ceph_cluster_by_class_total_used_bytes'
                      name: used_bytes
                    - selector: 'ceph_cluster_by_class_total_used_raw_bytes'
                      name: used_raw_bytes

        - family: CephFS Metadata
          context_namespace: cephfs_metadata
          groups:
            - family: Filesystem Metadata
              context_namespace: filesystem_metadata
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_fs_metadata'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4030
                  dimensions:
                    - selector: 'ceph_fs_metadata'
                      name: value

            - family: MDS Metadata
              context_namespace: mds_metadata
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_mds_metadata'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4040
                  dimensions:
                    - selector: 'ceph_mds_metadata'
                      name: value

        - family: Cluster Overview
          context_namespace: cluster_overview
          chart_defaults:
            instances:
              by_labels: ['*']
          metrics:
            - 'ceph_prometheus_collect_duration_seconds_count'
            - 'ceph_prometheus_collect_duration_seconds_sum'
            - 'ceph_cluster_osd_blocklist_count'
            - 'ceph_disk_occupation'
            - 'ceph_disk_occupation_human'
          charts:
            - title: Latency Measurements
              context: latency_measurements
              units: operations/s
              algorithm: incremental
              type: line
              priority: 4050
              dimensions:
                - selector: 'ceph_prometheus_collect_duration_seconds_count'
                  name: value

            - title: Accumulated Latency
              context: accumulated_latency
              units: seconds/s
              algorithm: incremental
              type: line
              priority: 4060
              dimensions:
                - selector: 'ceph_prometheus_collect_duration_seconds_sum'
                  name: value

            - title: Current Work
              context: current_work
              units: items
              algorithm: absolute
              type: line
              priority: 4070
              dimensions:
                - selector: 'ceph_cluster_osd_blocklist_count'
                  name: value

            - title: State and Metadata
              context: state
              units: state
              algorithm: absolute
              type: line
              priority: 4080
              dimensions:
                - selector: 'ceph_disk_occupation'
                  name: occupation
                - selector: 'ceph_disk_occupation_human'
                  name: human

        - family: Control Plane
          context_namespace: control_plane
          groups:
            - family: Cephadm
              context_namespace: cephadm
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_cephadm_daemon_status'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4090
                  dimensions:
                    - selector: 'ceph_cephadm_daemon_status'
                      name: value

            - family: Manager
              context_namespace: manager
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_mgr_metadata'
                - 'ceph_mgr_status'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4100
                  dimensions:
                    - selector: 'ceph_mgr_metadata'
                      name: metadata
                    - selector: 'ceph_mgr_status'
                      name: status

            - family: Manager Modules
              context_namespace: manager_modules
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_mgr_module_can_run'
                - 'ceph_mgr_module_status'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4110
                  dimensions:
                    - selector: 'ceph_mgr_module_can_run'
                      name: can_run
                    - selector: 'ceph_mgr_module_status'
                      name: status

            - family: Monitor
              context_namespace: monitor
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_mon_metadata'
                - 'ceph_mon_quorum_status'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4120
                  dimensions:
                    - selector: 'ceph_mon_metadata'
                      name: metadata
                    - selector: 'ceph_mon_quorum_status'
                      name: quorum_status

        - family: Health
          context_namespace: health
          groups:
            - family: Cluster Status
              context_namespace: cluster_status
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_health_status'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4130
                  dimensions:
                    - selector: 'ceph_health_status'
                      name: value

            - family: Daemon Health
              context_namespace: daemon_health
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_daemon_health_metrics'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4140
                  dimensions:
                    - selector: 'ceph_daemon_health_metrics'
                      name: value

            - family: Health Checks
              context_namespace: health_checks
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_health_detail'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4150
                  dimensions:
                    - selector: 'ceph_health_detail'
                      name: value

            - family: Slow Operations
              context_namespace: slow_operations
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_healthcheck_slow_ops'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4160
                  dimensions:
                    - selector: 'ceph_healthcheck_slow_ops'
                      name: value

        - family: OSD Capacity and State
          context_namespace: osd_capacity_and_state
          groups:
            - family: Cluster Flags
              context_namespace: cluster_flags
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_osd_flag_nodeep_scrub'
                - 'ceph_osd_flag_nodown'
                - 'ceph_osd_flag_noin'
                - 'ceph_osd_flag_noout'
                - 'ceph_osd_flag_norebalance'
                - 'ceph_osd_flag_noscrub'
                - 'ceph_osd_flag_noup'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4170
                  dimensions:
                    - selector: 'ceph_osd_flag_nodeep_scrub'
                      name: nodeep_scrub
                    - selector: 'ceph_osd_flag_nodown'
                      name: nodown
                    - selector: 'ceph_osd_flag_noin'
                      name: noin
                    - selector: 'ceph_osd_flag_noout'
                      name: noout
                    - selector: 'ceph_osd_flag_norebalance'
                      name: norebalance
                    - selector: 'ceph_osd_flag_noscrub'
                      name: noscrub
                    - selector: 'ceph_osd_flag_noup'
                      name: noup

            - family: Fullness Thresholds
              context_namespace: fullness_thresholds
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_osd_full_ratio'
                - 'ceph_osd_nearfull_ratio'
              charts:
                - title: Ratios
                  context: ratio
                  units: ratio
                  algorithm: absolute
                  type: line
                  priority: 4180
                  dimensions:
                    - selector: 'ceph_osd_full_ratio'
                      name: full_ratio
                    - selector: 'ceph_osd_nearfull_ratio'
                      name: nearfull_ratio

            - family: Metadata
              context_namespace: metadata
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_osd_metadata'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4190
                  dimensions:
                    - selector: 'ceph_osd_metadata'
                      name: value

            - family: OSD State
              context_namespace: osd_state
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_osd_in'
                - 'ceph_osd_up'
                - 'ceph_osd_weight'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4200
                  dimensions:
                    - selector: 'ceph_osd_in'
                      name: in
                    - selector: 'ceph_osd_up'
                      name: up
                    - selector: 'ceph_osd_weight'
                      name: weight

        - family: OSD Overview
          context_namespace: osd_overview
          chart_defaults:
            instances:
              by_labels: ['*']
          metrics:
            - 'ceph_osd_apply_latency_ms'
            - 'ceph_osd_commit_latency_ms'
          charts:
            - title: Latency
              context: latency
              units: milliseconds
              algorithm: absolute
              type: line
              priority: 4210
              dimensions:
                - selector: 'ceph_osd_apply_latency_ms'
                  name: apply_latency_ms
                - selector: 'ceph_osd_commit_latency_ms'
                  name: commit_latency_ms

        - family: Object Gateway Metadata
          context_namespace: object_gateway_metadata
          chart_defaults:
            instances:
              by_labels: ['*']
          metrics:
            - 'ceph_rgw_metadata'
          charts:
            - title: State and Metadata
              context: state
              units: state
              algorithm: absolute
              type: line
              priority: 4220
              dimensions:
                - selector: 'ceph_rgw_metadata'
                  name: value

        - family: Placement Groups and Recovery
          context_namespace: placement_groups_and_recovery
          groups:
            - family: Backfill
              context_namespace: backfill
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pg_backfill_toofull'
                - 'ceph_pg_backfill_unfound'
                - 'ceph_pg_backfill_wait'
                - 'ceph_pg_backfilling'
                - 'ceph_pg_forced_backfill'
                - 'ceph_pg_remapped'
              charts:
                - title: Placement Groups
                  context: pg_state
                  units: PGs
                  algorithm: absolute
                  type: line
                  priority: 4230
                  dimensions:
                    - selector: 'ceph_pg_backfill_toofull'
                      name: backfill_toofull
                    - selector: 'ceph_pg_backfill_unfound'
                      name: backfill_unfound
                    - selector: 'ceph_pg_backfill_wait'
                      name: backfill_wait
                    - selector: 'ceph_pg_backfilling'
                      name: backfilling
                    - selector: 'ceph_pg_forced_backfill'
                      name: forced_backfill
                    - selector: 'ceph_pg_remapped'
                      name: remapped

            - family: Healthy State
              context_namespace: healthy_state
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pg_active'
                - 'ceph_pg_clean'
                - 'ceph_pg_deep'
                - 'ceph_pg_total'
              charts:
                - title: Placement Groups
                  context: pg_state
                  units: PGs
                  algorithm: absolute
                  type: line
                  priority: 4240
                  dimensions:
                    - selector: 'ceph_pg_active'
                      name: active
                    - selector: 'ceph_pg_clean'
                      name: clean
                    - selector: 'ceph_pg_deep'
                      name: deep
                    - selector: 'ceph_pg_total'
                      name: pg_total

            - family: Peering and Availability
              context_namespace: peering_and_availability
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pg_activating'
                - 'ceph_pg_creating'
                - 'ceph_pg_down'
                - 'ceph_pg_incomplete'
                - 'ceph_pg_laggy'
                - 'ceph_pg_peered'
                - 'ceph_pg_peering'
                - 'ceph_pg_premerge'
                - 'ceph_pg_stale'
                - 'ceph_pg_unknown'
                - 'ceph_pg_wait'
              charts:
                - title: Placement Groups
                  context: pg_state
                  units: PGs
                  algorithm: absolute
                  type: line
                  priority: 4250
                  dimensions:
                    - selector: 'ceph_pg_activating'
                      name: activating
                    - selector: 'ceph_pg_creating'
                      name: creating
                    - selector: 'ceph_pg_down'
                      name: down
                    - selector: 'ceph_pg_incomplete'
                      name: incomplete
                    - selector: 'ceph_pg_laggy'
                      name: laggy
                    - selector: 'ceph_pg_peered'
                      name: peered
                    - selector: 'ceph_pg_peering'
                      name: peering
                    - selector: 'ceph_pg_premerge'
                      name: premerge
                    - selector: 'ceph_pg_stale'
                      name: stale
                    - selector: 'ceph_pg_unknown'
                      name: unknown
                    - selector: 'ceph_pg_wait'
                      name: wait

            - family: Recovery Flags
              context_namespace: recovery_flags
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_osd_flag_nobackfill'
                - 'ceph_osd_flag_norecover'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4260
                  dimensions:
                    - selector: 'ceph_osd_flag_nobackfill'
                      name: nobackfill
                    - selector: 'ceph_osd_flag_norecover'
                      name: norecover

            - family: Recovery and Degradation
              context_namespace: recovery_and_degradation
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pg_degraded'
                - 'ceph_pg_forced_recovery'
                - 'ceph_pg_recovering'
                - 'ceph_pg_recovery_toofull'
                - 'ceph_pg_recovery_unfound'
                - 'ceph_pg_recovery_wait'
                - 'ceph_pg_undersized'
              charts:
                - title: Placement Groups
                  context: pg_state
                  units: PGs
                  algorithm: absolute
                  type: line
                  priority: 4270
                  dimensions:
                    - selector: 'ceph_pg_degraded'
                      name: degraded
                    - selector: 'ceph_pg_forced_recovery'
                      name: forced_recovery
                    - selector: 'ceph_pg_recovering'
                      name: recovering
                    - selector: 'ceph_pg_recovery_toofull'
                      name: recovery_toofull
                    - selector: 'ceph_pg_recovery_unfound'
                      name: recovery_unfound
                    - selector: 'ceph_pg_recovery_wait'
                      name: recovery_wait
                    - selector: 'ceph_pg_undersized'
                      name: undersized

            - family: Scrub and Repair State
              context_namespace: scrub_and_repair_state
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pg_failed_repair'
                - 'ceph_pg_inconsistent'
                - 'ceph_pg_repair'
                - 'ceph_pg_scrubbing'
                - 'ceph_pg_snaptrim'
                - 'ceph_pg_snaptrim_error'
                - 'ceph_pg_snaptrim_wait'
              charts:
                - title: Placement Groups
                  context: pg_state
                  units: PGs
                  algorithm: absolute
                  type: line
                  priority: 4280
                  dimensions:
                    - selector: 'ceph_pg_failed_repair'
                      name: failed_repair
                    - selector: 'ceph_pg_inconsistent'
                      name: inconsistent
                    - selector: 'ceph_pg_repair'
                      name: repair
                    - selector: 'ceph_pg_scrubbing'
                      name: scrubbing
                    - selector: 'ceph_pg_snaptrim'
                      name: snaptrim
                    - selector: 'ceph_pg_snaptrim_error'
                      name: snaptrim_error
                    - selector: 'ceph_pg_snaptrim_wait'
                      name: snaptrim_wait

        - family: Pools
          context_namespace: pools
          groups:
            - family: Capacity and Quotas
              context_namespace: capacity_and_quotas
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pool_quota_objects'
                - 'ceph_pool_avail_raw'
                - 'ceph_pool_bytes_used'
                - 'ceph_pool_compress_bytes_used'
                - 'ceph_pool_compress_under_bytes'
                - 'ceph_pool_max_avail'
                - 'ceph_pool_quota_bytes'
                - 'ceph_pool_stored'
                - 'ceph_pool_stored_raw'
                - 'ceph_pool_percent_used'
              charts:
                - title: Objects
                  context: object_state
                  units: objects
                  algorithm: absolute
                  type: line
                  priority: 4290
                  dimensions:
                    - selector: 'ceph_pool_quota_objects'
                      name: value

                - title: Pool Capacity and Data Volume
                  context: space
                  units: bytes
                  algorithm: absolute
                  type: line
                  priority: 4300
                  dimensions:
                    - selector: 'ceph_pool_avail_raw'
                      name: avail_raw
                    - selector: 'ceph_pool_bytes_used'
                      name: bytes_used
                    - selector: 'ceph_pool_compress_bytes_used'
                      name: compress_bytes_used
                    - selector: 'ceph_pool_compress_under_bytes'
                      name: compress_under_bytes
                    - selector: 'ceph_pool_max_avail'
                      name: max_avail
                    - selector: 'ceph_pool_quota_bytes'
                      name: quota_bytes
                    - selector: 'ceph_pool_stored'
                      name: stored
                    - selector: 'ceph_pool_stored_raw'
                      name: stored_raw

                - title: Utilization
                  context: utilization
                  units: percentage
                  algorithm: absolute
                  type: line
                  priority: 4310
                  dimensions:
                    - selector: 'ceph_pool_percent_used'
                      name: value

            - family: Client I/O
              context_namespace: client_i_o
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pool_rd_bytes'
                - 'ceph_pool_wr_bytes'
                - 'ceph_pool_rd'
                - 'ceph_pool_wr'
              charts:
                - title: Byte Throughput
                  context: byte_throughput
                  units: bytes/s
                  algorithm: incremental
                  type: line
                  priority: 4320
                  dimensions:
                    - selector: 'ceph_pool_rd_bytes'
                      name: rd_bytes
                    - selector: 'ceph_pool_wr_bytes'
                      name: wr_bytes

                - title: Operations
                  context: operations
                  units: operations/s
                  algorithm: incremental
                  type: line
                  priority: 4330
                  dimensions:
                    - selector: 'ceph_pool_rd'
                      name: rd
                    - selector: 'ceph_pool_wr'
                      name: wr

            - family: Metadata
              context_namespace: metadata
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pool_metadata'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4340
                  dimensions:
                    - selector: 'ceph_pool_metadata'
                      name: value

            - family: Objects
              context_namespace: objects
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pool_dirty'
                - 'ceph_pool_objects'
              charts:
                - title: Objects
                  context: object_state
                  units: objects
                  algorithm: absolute
                  type: line
                  priority: 4350
                  dimensions:
                    - selector: 'ceph_pool_dirty'
                      name: dirty
                    - selector: 'ceph_pool_objects'
                      name: objects

            - family: Recovery
              context_namespace: recovery
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_pool_recovering_bytes_per_sec'
                - 'ceph_pool_recovering_keys_per_sec'
                - 'ceph_pool_recovering_objects_per_sec'
                - 'ceph_pool_num_objects_recovered'
                - 'ceph_pool_objects_repaired'
                - 'ceph_pool_num_bytes_recovered'
              charts:
                - title: Current Throughput
                  context: current_throughput_bytes_s
                  units: bytes/s
                  algorithm: absolute
                  type: line
                  priority: 4360
                  dimensions:
                    - selector: 'ceph_pool_recovering_bytes_per_sec'
                      name: value

                - title: Current Throughput
                  context: current_throughput_keys_s
                  units: keys/s
                  algorithm: absolute
                  type: line
                  priority: 4370
                  dimensions:
                    - selector: 'ceph_pool_recovering_keys_per_sec'
                      name: value

                - title: Current Throughput
                  context: current_throughput_objects_s
                  units: objects/s
                  algorithm: absolute
                  type: line
                  priority: 4380
                  dimensions:
                    - selector: 'ceph_pool_recovering_objects_per_sec'
                      name: value

                - title: Objects
                  context: object_state
                  units: objects
                  algorithm: absolute
                  type: line
                  priority: 4390
                  dimensions:
                    - selector: 'ceph_pool_num_objects_recovered'
                      name: value

                - title: Object Work
                  context: object_work
                  units: objects/s
                  algorithm: incremental
                  type: line
                  priority: 4400
                  dimensions:
                    - selector: 'ceph_pool_objects_repaired'
                      name: value

                - title: Pool Capacity and Data Volume
                  context: space
                  units: bytes
                  algorithm: absolute
                  type: line
                  priority: 4410
                  dimensions:
                    - selector: 'ceph_pool_num_bytes_recovered'
                      name: value

        - family: RBD Images
          context_namespace: rbd_images
          groups:
            - family: I/O
              context_namespace: i_o
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_rbd_read_bytes'
                - 'ceph_rbd_write_bytes'
                - 'ceph_rbd_read_ops'
