# One Ceph profile for cluster-wide MGR and host-local official ceph-exporter surfaces.
# Exact source bases: Ceph 18.2.8, Ceph 19.2.5, Ceph 20.2.2, and the current official NVMe-oF gateway.
# The hierarchy follows cluster impact -> service/daemon owner -> causal capability.
# Netdata algorithms follow source lifecycle rather than Prometheus wire type: cumulative
# and snapshot totals are incremental, while increment/decrement populations remain absolute. Wildcard identity preserves every official
# pool/daemon/image/user/bucket/gateway/device axis instead of silently merging entities.
# Priority-0 counters are curated because the official exporter can expose them with prio-limit=0.
# Job relabeling normalizes every unambiguous dynamic group grammar in the declared releases.
# The declared source union is fully curated; unknown future ceph families remain eligible for
# generic fallback until their semantics can be added to the operator model.
match: 'ceph_*'
app: ceph
template:
  family: Ceph
  context_namespace: ceph
  groups:
    - family: Cluster MGR
      context_namespace: cluster_mgr
      groups:
        - family: Capacity
          context_namespace: capacity
          groups:
            - family: Object Health
              context_namespace: object_health
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_num_objects_degraded'
                - 'ceph_num_objects_misplaced'
                - 'ceph_num_objects_unfound'
              charts:
                - title: Objects
                  context: object_state
                  units: objects
                  algorithm: absolute
                  type: line
                  priority: 4000
                  dimensions:
                    - selector: 'ceph_num_objects_degraded'
                      name: degraded
                    - selector: 'ceph_num_objects_misplaced'
                      name: misplaced
                    - selector: 'ceph_num_objects_unfound'
                      name: unfound

            - family: Overall Cluster Space
              context_namespace: overall_cluster_space
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_cluster_total_bytes'
                - 'ceph_cluster_total_used_bytes'
                - 'ceph_cluster_total_used_raw_bytes'
              charts:
                - title: Space and Memory
                  context: space
                  units: bytes
                  algorithm: absolute
                  type: line
                  priority: 4010
                  dimensions:
                    - selector: 'ceph_cluster_total_bytes'
                      name: bytes
                    - selector: 'ceph_cluster_total_used_bytes'
                      name: used_bytes
                    - selector: 'ceph_cluster_total_used_raw_bytes'
                      name: used_raw_bytes

            - family: Space by Device Class
              context_namespace: space_by_device_class
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_cluster_by_class_total_bytes'
                - 'ceph_cluster_by_class_total_used_bytes'
                - 'ceph_cluster_by_class_total_used_raw_bytes'
              charts:
                - title: Space and Memory
                  context: space
                  units: bytes
                  algorithm: absolute
                  type: line
                  priority: 4020
                  dimensions:
                    - selector: 'ceph_cluster_by_class_total_bytes'
                      name: bytes
                    - selector: 'ceph_cluster_by_class_total_used_bytes'
                      name: used_bytes
                    - selector: 'ceph_cluster_by_class_total_used_raw_bytes'
                      name: used_raw_bytes

        - family: CephFS Metadata
          context_namespace: cephfs_metadata
          groups:
            - family: Filesystem Metadata
              context_namespace: filesystem_metadata
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_fs_metadata'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4030
                  dimensions:
                    - selector: 'ceph_fs_metadata'
                      name: value

            - family: MDS Metadata
              context_namespace: mds_metadata
              chart_defaults:
                instances:
                  by_labels: ['*']
              metrics:
                - 'ceph_mds_metadata'
              charts:
                - title: State and Metadata
                  context: state
                  units: state
                  algorithm: absolute
                  type: line
                  priority: 4040
                  dimensions:
                    - selector: 'ceph_mds_metadata'
                      name: value

        - family: Cluster Overview
          context_namespace: cluster_overview
          chart_defaults:
            instances:
              by_labels: ['*']
          metrics:
            - 'ceph_prometheus_collect_duration_seconds_count'
            - 'ceph_prometheus_collect_duration_seconds_sum'
            - 'ceph_cluster_osd_blocklist_count'
            - 'ceph_disk_occupation'
            - 'ceph_disk_occupation_human'
          charts:
            - title: Latency Measurements
              context: latency_measurements
              units: operations/s
              algorithm: incremental
              type: line
              priority: 4050
              dimensions:
                - selector: 'ceph_prometheus_collect_duration_seconds_count'
                  name: value

            - title: Accumulated Latency
              context: accumulated_latency
              units: seconds/s
              algorithm: incremental
              type: line
              priority: 4060
              dimensions:
                - selector: 'ceph_prometheus_collect_duration_seconds_sum'
                  name: value

            - title: Current Work
              context: current_work
              units: items
              algorithm: absolute
              type: line
              priority: 4070
              dimensions:
                - selector: 'ceph_cluster_osd_blocklist_count'
                  name: value

            - title: State and Metadata
              context: state
              units: state
              algorithm: absolute
              type: line
              priority: 4080
              dimensions:
                - selector: 'ceph_disk_occupation'
                  name: occupation
                - selector: 'ceph_disk_occupation_human'
                  name: human

        - family: Control Plane
          context_namespace: control_plane
