    metric_relabel_configs:
      - source_labels:
          - __name__
        regex: ceph_throttle_(.+?)_(get_or_fail_success|get_or_fail_fail|get_started|wait_count|take_sum|wait_sum|get_sum|put_sum|take|get|max|put|val)
