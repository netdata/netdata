      - source_labels:
          - __name__
        regex: ceph_mclock_shard_queue_(.+?)_(mclock_best_effort_queue_len|mclock_immediate_queue_len|mclock_all_type_queue_len|mclock_recovery_queue_len|mclock_client_queue_len)
        target_label: __name__
