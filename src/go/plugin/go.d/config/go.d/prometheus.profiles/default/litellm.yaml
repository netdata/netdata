# LiteLLM profile derived from exact 1.92.0 and current upstream metric registrations.
# Charts follow the gateway -> policy -> routing -> provider -> accounting causal path.
# Additive metrics always have service/domain totals and selected explicit-label breakdowns.
# Non-timestamp gauges preserve every emitted label because their populations are not generally additive.
# Optional identity views disappear when their keys are omitted; optional status dimensions become unclassified.
# LiteLLM serializes an unset service tier as the literal "None"; only non-whitespace, non-sentinel values are tiers.
# Keep every service_tier positive/complement selector on this canonical rule; the stock-catalog test prevents drift.
# Known generated timestamps and deprecated aliases are excluded exactly; unknown future LiteLLM families remain generic.
match: 'litellm_*'
app: litellm
relabeling:
  - match: >-
      litellm_auth_failed_requests_created
      litellm_auth_latency_created
      litellm_auth_total_requests_created
      litellm_batch_write_to_db_failed_requests_created
      litellm_batch_write_to_db_latency_created
      litellm_batch_write_to_db_total_requests_created
      litellm_cache_hits_metric_created
      litellm_cache_misses_metric_created
      litellm_cached_tokens_metric_created
      litellm_callback_logging_failures_metric_created
      litellm_check_batch_cost_errors_created
      litellm_check_batch_cost_jobs_processed_created
      litellm_deployment_cooled_down_created
      litellm_deployment_failed_fallbacks_created
      litellm_deployment_failure_responses_created
      litellm_deployment_latency_per_output_token_created
      litellm_deployment_success_responses_created
      litellm_deployment_successful_fallbacks_created
      litellm_deployment_total_requests_created
      litellm_guardrail_errors_created
      litellm_guardrail_latency_seconds_created
      litellm_guardrail_requests_created
      litellm_images_generated_metric_created
      litellm_input_audio_tokens_metric_created
      litellm_input_cache_creation_tokens_metric_created
      litellm_input_cached_tokens_metric_created
      litellm_input_tokens_metric_created
      litellm_llm_api_failed_requests_metric_created
      litellm_llm_api_latency_metric_created
      litellm_llm_api_time_to_first_token_metric_created
      litellm_managed_batch_created_created
      litellm_managed_batch_duration_seconds_created
      litellm_managed_file_created_created
      litellm_managed_file_deleted_created
      litellm_mcp_tool_call_spend_metric_created
      litellm_mcp_tool_calls_created
      litellm_output_audio_tokens_metric_created
      litellm_output_reasoning_tokens_metric_created
      litellm_output_tokens_metric_created
      litellm_overhead_latency_metric_created
      litellm_overhead_with_guardrails_latency_metric_created
      litellm_postgres_failed_requests_created
      litellm_postgres_latency_created
      litellm_postgres_total_requests_created
      litellm_provider_cache_creation_input_tokens_metric_created
      litellm_provider_cache_read_input_tokens_metric_created
      litellm_proxy_failed_requests_metric_created
      litellm_proxy_pre_call_failed_requests_created
      litellm_proxy_pre_call_latency_created
      litellm_proxy_pre_call_total_requests_created
      litellm_proxy_total_requests_metric_created
      litellm_redis_daily_org_spend_update_queue_failed_requests_created
      litellm_redis_daily_org_spend_update_queue_latency_created
      litellm_redis_daily_org_spend_update_queue_total_requests_created
      litellm_redis_daily_tag_spend_update_queue_failed_requests_created
      litellm_redis_daily_tag_spend_update_queue_latency_created
      litellm_redis_daily_tag_spend_update_queue_total_requests_created
      litellm_redis_daily_team_spend_update_queue_failed_requests_created
      litellm_redis_daily_team_spend_update_queue_latency_created
      litellm_redis_daily_team_spend_update_queue_total_requests_created
      litellm_redis_failed_requests_created
      litellm_redis_latency_created
      litellm_redis_total_requests_created
      litellm_request_queue_time_seconds_created
      litellm_request_total_latency_metric_created
      litellm_requests_metric_created
      litellm_reset_budget_job_failed_requests_created
      litellm_reset_budget_job_latency_created
      litellm_reset_budget_job_total_requests_created
      litellm_router_failed_requests_created
      litellm_router_latency_created
      litellm_router_total_requests_created
      litellm_self_failed_requests_created
      litellm_self_latency_created
      litellm_self_total_requests_created
      litellm_spend_metric_created
      litellm_total_tokens_metric_created
      litellm_video_duration_seconds_metric_created
      litellm_requests_metric_total
      litellm_llm_api_failed_requests_metric_total
      litellm_check_batch_cost_last_run_timestamp
    metric_relabel_configs:
      - action: drop
template:
  family: LiteLLM
  context_namespace: litellm
  groups:
    - family: Gateway
      context_namespace: gateway
      metrics:
        - 'litellm_proxy_total_requests_metric_total'
        - 'litellm_proxy_failed_requests_metric_total'
        - 'litellm_in_flight_requests'
        - 'litellm_request_queue_time_seconds_bucket'
        - 'litellm_request_total_latency_metric_bucket'
        - 'litellm_overhead_latency_metric_bucket'
        - 'litellm_overhead_with_guardrails_latency_metric_bucket'
        - 'litellm_request_queue_time_seconds_count'
        - 'litellm_request_total_latency_metric_count'
        - 'litellm_overhead_latency_metric_count'
        - 'litellm_overhead_with_guardrails_latency_metric_count'
        - 'litellm_request_queue_time_seconds_sum'
        - 'litellm_request_total_latency_metric_sum'
        - 'litellm_overhead_latency_metric_sum'
        - 'litellm_overhead_with_guardrails_latency_metric_sum'
      charts:
        - title: Client Responses by Status
          context: client_responses_by_status
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_proxy_total_requests_metric_total{status_code=~".*[^[:space:]].*"}'
              name_from_label: status_code
            - selector: 'litellm_proxy_total_requests_metric_total{status_code!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Client Responses by Stream Mode
          context: client_responses_by_stream_mode
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_proxy_total_requests_metric_total{stream=~".*[^[:space:]].*"}'
              name_from_label: stream
            - selector: 'litellm_proxy_total_requests_metric_total{stream!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Client Failures by Status
          context: client_failures_by_status
          units: failures/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_proxy_failed_requests_metric_total{exception_status=~".*[^[:space:]].*"}'
              name_from_label: exception_status
            - selector: 'litellm_proxy_failed_requests_metric_total{exception_status!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Client Failures by Rate-Limit Category
          context: client_failures_by_rate_limit_category
          units: failures/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_proxy_failed_requests_metric_total{rate_limit_category=~".*[^[:space:]].*"}'
              name_from_label: rate_limit_category
            - selector: 'litellm_proxy_failed_requests_metric_total{rate_limit_category!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Client Failures by Rate-Limit Type
          context: client_failures_by_rate_limit_type
          units: failures/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_proxy_failed_requests_metric_total{rate_limit_type=~".*[^[:space:]].*"}'
              name_from_label: rate_limit_type
            - selector: 'litellm_proxy_failed_requests_metric_total{rate_limit_type!~".*[^[:space:]].*"}'
              name: unclassified

        - title: In-Flight Requests
          context: in_flight_requests
          units: requests
          algorithm: absolute
          type: line
          dimensions:
            - selector: 'litellm_in_flight_requests'
              name: requests

        - title: Request Queue-Time Distribution
          context: request_queue_time_distribution
          units: observations/s
          algorithm: incremental
          type: heatmap
          dimensions:
            - selector: 'litellm_request_queue_time_seconds_bucket'

        - title: End-to-End Request-Latency Distribution
          context: request_total_latency_distribution
          units: observations/s
          algorithm: incremental
          type: heatmap
          dimensions:
            - selector: 'litellm_request_total_latency_metric_bucket'

        - title: LiteLLM Overhead-Latency Distribution
          context: overhead_latency_distribution
          units: observations/s
          algorithm: incremental
          type: heatmap
          dimensions:
            - selector: 'litellm_overhead_latency_metric_bucket'

        - title: Guardrail-Inclusive Overhead Distribution
          context: overhead_with_guardrails_distribution
          units: observations/s
          algorithm: incremental
          type: heatmap
          dimensions:
            - selector: 'litellm_overhead_with_guardrails_latency_metric_bucket'

        - title: Client Request-Latency Measurements
          context: client_request_latency_measurements
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_request_queue_time_seconds_count'
              name: queue
            - selector: 'litellm_request_total_latency_metric_count'
              name: end_to_end

        - title: End-to-End Request-Latency Measurements by Service Tier
          family: By Service Tier
          context: request_total_latency_measurements_by_service_tier
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_request_total_latency_metric_count{service_tier=~"^([^N[:space:]][^[:space:]]*|N|N[^o[:space:]][^[:space:]]*|No|No[^n[:space:]][^[:space:]]*|Non|Non[^e[:space:]][^[:space:]]*|None[^[:space:]]+)$"}'
              name_from_label: service_tier
            - selector: 'litellm_request_total_latency_metric_count{service_tier!~"^([^N[:space:]][^[:space:]]*|N|N[^o[:space:]][^[:space:]]*|No|No[^n[:space:]][^[:space:]]*|Non|Non[^e[:space:]][^[:space:]]*|None[^[:space:]]+)$"}'
              name: unclassified

        - title: Internal Overhead Measurements
          context: internal_overhead_measurements
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_overhead_latency_metric_count'
              name: overhead
            - selector: 'litellm_overhead_with_guardrails_latency_metric_count'
              name: guardrail_overhead

        - title: Accumulated Client Request Time
          context: accumulated_client_request_time
          units: seconds/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_request_queue_time_seconds_sum'
              name: queue
            - selector: 'litellm_request_total_latency_metric_sum'
              name: end_to_end

        - title: Accumulated End-to-End Request Time by Service Tier
          family: By Service Tier
          context: accumulated_request_total_latency_by_service_tier
          units: seconds/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_request_total_latency_metric_sum{service_tier=~"^([^N[:space:]][^[:space:]]*|N|N[^o[:space:]][^[:space:]]*|No|No[^n[:space:]][^[:space:]]*|Non|Non[^e[:space:]][^[:space:]]*|None[^[:space:]]+)$"}'
              name_from_label: service_tier
            - selector: 'litellm_request_total_latency_metric_sum{service_tier!~"^([^N[:space:]][^[:space:]]*|N|N[^o[:space:]][^[:space:]]*|No|No[^n[:space:]][^[:space:]]*|Non|Non[^e[:space:]][^[:space:]]*|None[^[:space:]]+)$"}'
              name: unclassified

        - title: Accumulated Internal Overhead
          context: accumulated_internal_overhead
          units: seconds/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_overhead_latency_metric_sum'
              name: overhead
            - selector: 'litellm_overhead_with_guardrails_latency_metric_sum'
              name: guardrail_overhead

        - title: Client Responses by Status, Provider, and Deployment
          family: By Provider and Deployment
          context: client_responses_by_status_by_provider_deployment
          units: requests/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [api_provider, model_id]
          dimensions:
            - selector: 'litellm_proxy_total_requests_metric_total{api_provider=~".+",model_id=~".+",status_code=~".*[^[:space:]].*"}'
              name_from_label: status_code
            - selector: 'litellm_proxy_total_requests_metric_total{api_provider=~".+",model_id=~".+",status_code!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Client Failures by Status, Provider, and Deployment
          family: By Provider and Deployment
          context: client_failures_by_status_by_provider_deployment
          units: failures/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [api_provider, model_id]
          dimensions:
            - selector: 'litellm_proxy_failed_requests_metric_total{api_provider=~".+",model_id=~".+",exception_status=~".*[^[:space:]].*"}'
              name_from_label: exception_status
            - selector: 'litellm_proxy_failed_requests_metric_total{api_provider=~".+",model_id=~".+",exception_status!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Request Queue-Time Distribution by Provider and Model
          family: By Provider and Model
          context: request_queue_time_distribution_by_provider_model
          units: observations/s
          algorithm: incremental
          type: heatmap
          instances:
            by_labels: [api_provider, model]
          dimensions:
            - selector: 'litellm_request_queue_time_seconds_bucket{api_provider=~".+",model=~".+"}'

        - title: End-to-End Request-Latency Distribution by Provider and Model
          family: By Provider and Model
          context: request_total_latency_distribution_by_provider_model
          units: observations/s
          algorithm: incremental
          type: heatmap
          instances:
            by_labels: [api_provider, model]
          dimensions:
            - selector: 'litellm_request_total_latency_metric_bucket{api_provider=~".+",model=~".+"}'

        - title: LiteLLM Overhead-Latency Distribution by Provider and LiteLLM Model
          family: By Provider and LiteLLM Model
          context: overhead_latency_distribution_by_provider_litellm_model
          units: observations/s
          algorithm: incremental
          type: heatmap
          instances:
            by_labels: [api_provider, litellm_model_name]
          dimensions:
            - selector: 'litellm_overhead_latency_metric_bucket{api_provider=~".+",litellm_model_name=~".+"}'

        - title: Guardrail-Inclusive Overhead Distribution by Provider and LiteLLM Model
          family: By Provider and LiteLLM Model
          context: overhead_with_guardrails_distribution_by_provider_litellm_model
          units: observations/s
          algorithm: incremental
          type: heatmap
          instances:
            by_labels: [api_provider, litellm_model_name]
          dimensions:
            - selector: 'litellm_overhead_with_guardrails_latency_metric_bucket{api_provider=~".+",litellm_model_name=~".+"}'

        - title: Client Request-Latency Measurements by Provider and Model
          family: By Provider and Model
          context: client_request_latency_measurements_by_provider_model
          units: requests/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [api_provider, model]
          dimensions:
            - selector: 'litellm_request_queue_time_seconds_count{api_provider=~".+",model=~".+"}'
              name: queue
            - selector: 'litellm_request_total_latency_metric_count{api_provider=~".+",model=~".+"}'
              name: end_to_end

        - title: Internal Overhead Measurements by Provider and LiteLLM Model
          family: By Provider and LiteLLM Model
          context: internal_overhead_measurements_by_provider_litellm_model
          units: requests/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [api_provider, litellm_model_name]
          dimensions:
            - selector: 'litellm_overhead_latency_metric_count{api_provider=~".+",litellm_model_name=~".+"}'
              name: overhead
            - selector: 'litellm_overhead_with_guardrails_latency_metric_count{api_provider=~".+",litellm_model_name=~".+"}'
              name: guardrail_overhead

        - title: Accumulated Client Request Time by Provider and Model
          family: By Provider and Model
          context: accumulated_client_request_time_by_provider_model
          units: seconds/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [api_provider, model]
          dimensions:
            - selector: 'litellm_request_queue_time_seconds_sum{api_provider=~".+",model=~".+"}'
              name: queue
            - selector: 'litellm_request_total_latency_metric_sum{api_provider=~".+",model=~".+"}'
              name: end_to_end

        - title: Accumulated Internal Overhead by Provider and LiteLLM Model
          family: By Provider and LiteLLM Model
          context: accumulated_internal_overhead_by_provider_litellm_model
          units: seconds/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [api_provider, litellm_model_name]
          dimensions:
            - selector: 'litellm_overhead_latency_metric_sum{api_provider=~".+",litellm_model_name=~".+"}'
              name: overhead
            - selector: 'litellm_overhead_with_guardrails_latency_metric_sum{api_provider=~".+",litellm_model_name=~".+"}'
              name: guardrail_overhead

        - title: Client Responses by Status and Route
          family: By Route
          context: client_responses_by_status_by_route
          units: requests/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [route]
          dimensions:
            - selector: 'litellm_proxy_total_requests_metric_total{route=~".+",status_code=~".*[^[:space:]].*"}'
              name_from_label: status_code
            - selector: 'litellm_proxy_total_requests_metric_total{route=~".+",status_code!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Client Failures by Status and Route
          family: By Route
          context: client_failures_by_status_by_route
          units: failures/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [route]
          dimensions:
            - selector: 'litellm_proxy_failed_requests_metric_total{route=~".+",exception_status=~".*[^[:space:]].*"}'
              name_from_label: exception_status
            - selector: 'litellm_proxy_failed_requests_metric_total{route=~".+",exception_status!~".*[^[:space:]].*"}'
              name: unclassified

    - family: Routing and Deployments
      context_namespace: routing_and_deployments
      metrics:
        - 'litellm_deployment_total_requests_total'
        - 'litellm_deployment_success_responses_total'
        - 'litellm_deployment_failure_responses_total'
        - 'litellm_deployment_successful_fallbacks_total'
        - 'litellm_deployment_failed_fallbacks_total'
        - 'litellm_deployment_cooled_down_total'
        - 'litellm_deployment_state'
        - 'litellm_deployment_rpm_limit'
        - 'litellm_deployment_tpm_limit'
        - 'litellm_remaining_requests_metric'
        - 'litellm_remaining_tokens_metric'
        - 'litellm_deployment_latency_per_output_token_bucket'
        - 'litellm_deployment_latency_per_output_token_count'
        - 'litellm_deployment_latency_per_output_token_sum'
      charts:
        - title: Deployment Request Workload
          context: deployment_request_workload
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_deployment_total_requests_total'
              name: requests
            - selector: 'litellm_deployment_success_responses_total'
              name: successful

        - title: Deployment Failures by Status
          context: deployment_failures_by_status
          units: failures/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_deployment_failure_responses_total{exception_status=~".*[^[:space:]].*"}'
              name_from_label: exception_status
            - selector: 'litellm_deployment_failure_responses_total{exception_status!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Fallback Outcomes
          context: fallback_outcomes
          units: fallbacks/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_deployment_successful_fallbacks_total'
              name: successful
            - selector: 'litellm_deployment_failed_fallbacks_total'
              name: failed

        - title: Deployment Cooldowns by Status
          context: deployment_cooldowns_by_status
          units: cooldowns/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_deployment_cooled_down_total{exception_status=~".*[^[:space:]].*"}'
              name_from_label: exception_status
            - selector: 'litellm_deployment_cooled_down_total{exception_status!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Deployment State
          family: Deployments
          context: deployment_state
          units: state
          algorithm: absolute
          type: line
          instances:
            by_labels: ['*']
          dimensions:
            - selector: 'litellm_deployment_state'
              name: state

        - title: Deployment Request Limit
          family: Deployments
          context: deployment_request_limit
          units: requests/min
          algorithm: absolute
          type: line
          instances:
            by_labels: ['*']
          dimensions:
            - selector: 'litellm_deployment_rpm_limit'
              name: limit

        - title: Deployment Token Limit
          family: Deployments
          context: deployment_token_limit
          units: tokens/min
          algorithm: absolute
          type: line
          instances:
            by_labels: ['*']
          dimensions:
            - selector: 'litellm_deployment_tpm_limit'
              name: limit

        - title: Provider Remaining Requests
          family: Provider Headroom
          context: provider_remaining_requests
          units: requests
          algorithm: absolute
          type: line
          instances:
            by_labels: ['*']
          dimensions:
            - selector: 'litellm_remaining_requests_metric'
              name: remaining

        - title: Provider Remaining Tokens
          family: Provider Headroom
          context: provider_remaining_tokens
          units: tokens
          algorithm: absolute
          type: line
          instances:
            by_labels: ['*']
          dimensions:
            - selector: 'litellm_remaining_tokens_metric'
              name: remaining

        - title: Deployment Output-Token Latency Distribution
          context: deployment_output_token_latency_distribution
          units: observations/s
          algorithm: incremental
          type: heatmap
          dimensions:
            - selector: 'litellm_deployment_latency_per_output_token_bucket'

        - title: Deployment Output-Token Latency Measurements
          context: deployment_output_token_latency_measurements
          units: requests/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_deployment_latency_per_output_token_count'
              name: requests

        - title: Accumulated Deployment Output-Token Latency
          context: accumulated_deployment_output_token_latency
          units: seconds/s
          algorithm: incremental
          type: line
          dimensions:
            - selector: 'litellm_deployment_latency_per_output_token_sum'
              name: time

        - title: Request Workload by Deployment
          family: By Deployment
          context: deployment_request_workload_by_deployment
          units: requests/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [model_id]
          dimensions:
            - selector: 'litellm_deployment_total_requests_total{model_id=~".+"}'
              name: requests
            - selector: 'litellm_deployment_success_responses_total{model_id=~".+"}'
              name: successful

        - title: Failures by Deployment and Status
          family: By Deployment
          context: deployment_failures_by_status_by_deployment
          units: failures/s
          algorithm: incremental
          type: line
          instances:
            by_labels: [model_id]
          dimensions:
            - selector: 'litellm_deployment_failure_responses_total{model_id=~".+",exception_status=~".*[^[:space:]].*"}'
              name_from_label: exception_status
            - selector: 'litellm_deployment_failure_responses_total{model_id=~".+",exception_status!~".*[^[:space:]].*"}'
              name: unclassified

        - title: Cooldowns by Deployment and Status
          family: By Deployment
          context: deployment_cooldowns_by_status_by_deployment
          units: cooldowns/s
          algorithm: incremental
          type: line
          instances:
