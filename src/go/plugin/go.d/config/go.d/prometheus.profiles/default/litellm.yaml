        - 'litellm_input_cache_creation_tokens_metric_total'
        - 'litellm_input_cached_tokens_metric_total'
        - 'litellm_provider_cache_creation_input_tokens_metric_total'
        - 'litellm_provider_cache_read_input_tokens_metric_total'
      charts:
