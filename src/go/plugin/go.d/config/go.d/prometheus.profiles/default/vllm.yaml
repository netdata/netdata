        - 'vllm:kv_offload_cpu_cache_write_usage_perc'
        - 'vllm:kv_offload_cpu_cache_read_usage_perc'
        - 'vllm:kv_offload_cpu_allocation_size_bucket'
        - 'vllm:kv_offload_cpu_allocation_size_count'
        - 'vllm:kv_offload_cpu_allocation_size_sum'
        - 'vllm:kv_offload_stores_skipped_total'
        - 'vllm:kv_offload_tiering_lookup_sync_delay_seconds_bucket'
        - 'vllm:kv_offload_tiering_lookup_sync_delay_seconds_count'
        - 'vllm:kv_offload_tiering_lookup_sync_delay_seconds_sum'
        - 'vllm:kv_offload_tiering_lookup_async_delay_seconds_bucket'
        - 'vllm:kv_offload_tiering_lookup_async_delay_seconds_count'
        - 'vllm:kv_offload_tiering_lookup_async_delay_seconds_sum'
      charts:
        - title: KV Offload Load Size
          context: load_size
          units: observations/s
          dimensions:
            - selector: 'vllm:kv_offload_load_size_bucket'

        - title: KV Offload Store Size
          context: store_size
          units: observations/s
          dimensions:
            - selector: 'vllm:kv_offload_store_size_bucket'

        - title: KV Offload Transfer Operations
          context: transfer_operations
          units: operations/s
          dimensions:
            - selector: 'vllm:kv_offload_load_size_count'
              name: loads
            - selector: 'vllm:kv_offload_store_size_count'
              name: stores

        - title: KV Offload Transfer Throughput
          context: transfer_bytes
          units: bytes/s
          dimensions:
            - selector: 'vllm:kv_offload_load_bytes_total'
              name: loaded
            - selector: 'vllm:kv_offload_store_bytes_total'
              name: stored

        - title: Completed KV Offload Transfer Time
          context: completed_transfer_time
          units: seconds/s
          dimensions:
            - selector: 'vllm:kv_offload_load_time_total'
              name: load
            - selector: 'vllm:kv_offload_store_time_total'
              name: store

        - title: KV Offload Synchronous Lookup Delay
          context: lookup_sync_delay
          units: observations/s
          dimensions:
            - selector: 'vllm:kv_offload_lookup_sync_delay_seconds_bucket'

        - title: KV Offload Asynchronous Lookup Delay
          context: lookup_async_delay
          units: observations/s
          dimensions:
            - selector: 'vllm:kv_offload_lookup_async_delay_seconds_bucket'

        - title: KV Offload Lookup Measurements
          context: lookup_measurements
          units: lookups/s
          dimensions:
            - selector: 'vllm:kv_offload_lookup_sync_delay_seconds_count'
              name: synchronous
            - selector: 'vllm:kv_offload_lookup_async_delay_seconds_count'
              name: asynchronous

        - title: KV Offload Lookup Delay Accumulation
          context: lookup_delay_accumulation
          units: seconds/s
          dimensions:
            - selector: 'vllm:kv_offload_lookup_sync_delay_seconds_sum'
              name: synchronous
            - selector: 'vllm:kv_offload_lookup_async_delay_seconds_sum'
              name: asynchronous

        - title: CPU KV Cache Usage
          context: cpu_cache_usage
          units: percentage
          dimensions:
            - selector: 'vllm:kv_offload_cpu_cache_usage_perc'
