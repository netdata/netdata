                multiplier: 100
            - selector: 'vllm:kv_offload_cpu_cache_write_usage_perc'
              name: writes
              options:
                multiplier: 100
            - selector: 'vllm:kv_offload_cpu_cache_read_usage_perc'
              name: reads
              options:
                multiplier: 100

        - title: CPU KV Allocation Size
          context: cpu_allocation_size
