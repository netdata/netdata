          dimensions:
            - selector: 'vllm:kv_offload_cpu_allocation_size_bucket'

        - title: CPU KV Allocation Measurements
          context: cpu_allocation_measurements
          units: allocations/s
          dimensions:
            - selector: 'vllm:kv_offload_cpu_allocation_size_count'
              name: allocations

        - title: CPU KV Allocation Volume
          context: cpu_allocation_volume
          units: blocks/s
          dimensions:
            - selector: 'vllm:kv_offload_cpu_allocation_size_sum'
              name: blocks

        - title: KV Offload Admission Outcomes
          context: admission_outcomes
          units: events/s
          dimensions:
            - selector: 'vllm:kv_offload_allocation_failure_total'
              name: allocation_failures
            - selector: 'vllm:kv_offload_stores_skipped_total'
              name: stores_skipped

        - title: Tiered KV Offload Synchronous Lookup Delay
          context: tiering_lookup_sync_delay
          units: observations/s
          dimensions:
            - selector: 'vllm:kv_offload_tiering_lookup_sync_delay_seconds_bucket'

        - title: Tiered KV Offload Asynchronous Lookup Delay
          context: tiering_lookup_async_delay
          units: observations/s
          dimensions:
            - selector: 'vllm:kv_offload_tiering_lookup_async_delay_seconds_bucket'

        - title: Tiered KV Offload Lookup Measurements
          context: tiering_lookup_measurements
          units: lookups/s
          dimensions:
            - selector: 'vllm:kv_offload_tiering_lookup_sync_delay_seconds_count'
              name: synchronous
            - selector: 'vllm:kv_offload_tiering_lookup_async_delay_seconds_count'
              name: asynchronous

        - title: Tiered KV Offload Lookup Delay Accumulation
          context: tiering_lookup_delay_accumulation
          units: seconds/s
          dimensions:
            - selector: 'vllm:kv_offload_tiering_lookup_sync_delay_seconds_sum'
              name: synchronous
            - selector: 'vllm:kv_offload_tiering_lookup_async_delay_seconds_sum'
              name: asynchronous

