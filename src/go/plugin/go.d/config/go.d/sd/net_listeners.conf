disabled: no

## SECURITY: setting this to "yes" enables secret references in generated collector jobs,
## including ${env:...}, ${file:...}, ${cmd:...} and ${store:...} supplied by targets.
## Target-controlled values used by service rules can make Netdata read local files,
## run commands, or fetch stored secrets with the secret providers' permissions. A collector
## may send the resolved values back to the target as credentials or other request fields.
## Enable only if you control and trust every target this pipeline can discover. Enabling
## accepts that risk for the whole pipeline; one untrusted target is enough to abuse it.
## Discovery connection credentials are unaffected. Default "no" keeps references literal.
# trust_discovered_targets: no

discoverer:
  net_listeners: { }

services:
  - id: "activemq"
    match: '{{ and (eq .Port "8161") (eq .Comm "activemq") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) "webadmin" "admin" }}

  - id: "apache"
    match: '{{ and (eq .Port "80" "8080") (eq .Comm "apache" "apache2" "httpd") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/server-status?auto" .Address) }}

  - id: "apcupsd"
    match: '{{ or (eq .Port "3551") (eq .Comm "apcupsd") }}'
    config_template: |
      {{ job "name" (printf "local_%s" .Port) "address" .Address }}

  - id: "beanstalk"
    match: '{{ or (eq .Port "11300") (eq .Comm "beanstalkd") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "bind"
    match: '{{ and (eq .Port "8653") (eq .Comm "bind" "named") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/json/v1" .Address) }}

  - id: "boinc"
    match: '{{ and (eq .Port "31416") (eq .Comm "boinc") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "cassandra"
    match: '{{ and (eq .Port "7072") (glob .Cmdline "*cassandra*") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/metrics" .Address) }}

  - id: "ceph"
    match: '{{ and (eq .Port "8443") (eq .Comm "ceph-mgr") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "https://%s" .Address) }}

  - id: "chrony"
    match: '{{ and (eq .Port "323") (eq .Comm "chronyd") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "clickhouse"
    match: '{{ and (eq .Port "8123") (eq .Comm "clickhouse-server") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "cockroachdb"
    match: '{{ and (eq .Port "8080") (eq .Comm "cockroach") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/_status/vars" .Address) }}

  - id: "consul"
    match: '{{ and (eq .Port "8500") (eq .Comm "consul") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "coredns"
    match: '{{ and (eq .Port "9153") (eq .Comm "coredns") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/metrics" .Address) }}

  - id: "couchbase"
    match: '{{ or (eq .Port "8091") (glob .Cmdline "*couchbase*") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "couchdb"
    match: '{{ or (eq .Port "5984") (glob .Cmdline "*couchdb*") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) "node" "_local" }}

  - id: "dcgm"
    match: '{{ eq .Comm "dcgm-exporter" }}'
    config_template: |
      {{ job "name" "local" "update_every" 30 "url" (printf "http://%s/metrics" .Address) }}

  - id: "dnsdist"
    match: '{{ and (eq .Port "8083") (eq .Comm "dnsdist") }}'
    config_template: |
      {{ job
        "name" "local"
        "url" (printf "http://%s" .Address)
        "headers" (dict "X-API-Key" "dnsdist-api-key")
      }}

  - id: "dnsmasq"
    match: '{{ and (eq .Protocol "UDP") (eq .Port "53") (eq .Comm "dnsmasq") }}'
    config_template: |
      {{ job "name" "local" "protocol" "udp" "address" .Address }}

  - id: "docker_engine"
    match: '{{ and (eq .Port "9323") (eq .Comm "dockerd") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/metrics" .Address) }}

  - id: "dovecot"
    match: '{{ and (eq .Port "24242") (eq .Comm "dovecot") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "elasticsearch"
    match: '{{ or (eq .Port "9200") (glob .Cmdline "*elasticsearch*" "*opensearch*") }}'
    config_template: |
      {{ $job := dict "name" "local" }}
      {{ if glob .Cmdline "*elastic*" }}
      {{ $_ := set $job "url" (printf "http://%s" .Address) }}
      {{ else }}
      {{ $_ := set $job "url" (printf "https://%s" .Address) }}
      {{ $_ := set $job "tls_skip_verify" true }}
      {{ $_ := set $job "username" "admin" }}
      {{ $_ := set $job "password" "admin" }}
      {{ end }}
      {{ job $job }}

  - id: "envoy"
    match: '{{ and (eq .Port "9901") (eq .Comm "envoy") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/stats/prometheus" .Address) }}

  - id: "fluentd"
    match: '{{ and (eq .Port "24220") (glob .Cmdline "*fluentd*") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "freeradius"
    match: '{{ and (eq .Port "18121") (eq .Comm "freeradius") }}'
    config_template: |
      {{ job "name" "local" "address" .IPAddress "port" (atoi .Port) "secret" "adminsecret" }}

  - id: "gearman"
    match: '{{ or (eq .Port "4730") (eq .Comm "gearmand") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "geth"
    match: '{{ and (eq .Port "6060") (eq .Comm "geth") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/debug/metrics/prometheus" .Address) }}

  - id: "hddtemp"
    match: '{{ and (eq .Port "7634") (eq .Comm "hddtemp") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "hdfs_namenode"
    match: '{{ and (eq .Port "9870") (eq .Comm "hadoop") }}'
    config_template: |
      {{ job "module" "hdfs" "name" "namenode_local" "url" (printf "http://%s/jmx" .Address) }}

  - id: "hdfs_datanode"
    match: '{{ and (eq .Port "9864") (eq .Comm "hadoop") }}'
    config_template: |
      {{ job "module" "hdfs" "name" "datanode_local" "url" (printf "http://%s/jmx" .Address) }}

  - id: "icecast"
    match: '{{ and (eq .Port "8000") (eq .Comm "icecast") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "ipfs"
    match: '{{ and (eq .Port "5001") (eq .Comm "ipfs") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "k8s_kubelet"
    match: '{{ and (eq .Port "10250" "10255") (eq .Comm "kubelet") }}'
    config_template: |
      {{ $job := dict "name" "local" }}
      {{ if eq .Port "10255" }}
      {{ $_ := set $job "url" (printf "http://%s/metrics" .Address) }}
      {{ else }}
      {{ $_ := set $job "url" (printf "https://%s/metrics" .Address) }}
      {{ $_ := set $job "tls_skip_verify" true }}
      {{ end }}
      {{ job $job }}

  - id: "k8s_kubeproxy"
    match: '{{ and (eq .Port "10249") (eq .Comm "kube-proxy") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/metrics" .Address) }}

  - id: "lighttpd"
    match: '{{ and (eq .Port "80" "8080") (eq .Comm "lighttpd") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/server-status?auto" .Address) }}

  - id: "logstash"
    match: '{{ and (eq .Port "9600") (glob .Cmdline "*logstash*") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "maxscale"
    match: '{{ or (eq .Port "8989") (eq .Comm "maxscale") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "memcached"
    match: '{{ or (eq .Port "11211") (eq .Comm "memcached") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "mongodb"
    match: '{{ or (eq .Port "27017") (eq .Comm "mongod") }}'
    config_template: |
      {{ job "name" "local" "uri" (printf "mongodb://%s" .Address) }}

  - id: "monit"
    match: '{{ or (eq .Port "2812") (eq .Comm "monit") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) "username" "admin" "password" "monit" }}

  - id: "mysql"
    match: '{{ or (eq .Port "3306") (eq .Comm "mysqld" "mariadbd") }}'
    config_template: |
      {{ job "name" "local" "dsn" "netdata@unix(/var/run/mysqld/mysqld.sock)/" }}
      {{ job "name" "local" "dsn" (printf "netdata@tcp(%s)/" .Address) }}

  - id: "nats"
    match: '{{ and (eq .Port "8222") (eq .Comm "nats-server") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "nginx"
    match: '{{ and (eq .Port "80" "8080") (eq .Comm "nginx") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/stub_status" .Address) }}
      {{ job "name" "local" "url" (printf "http://%s/basic_status" .Address) }}
      {{ job "name" "local" "url" (printf "http://%s/nginx_status" .Address) }}
      {{ job "name" "local" "url" (printf "http://%s/status" .Address) }}

  - id: "nginxunit"
    match: '{{ and (eq .Port "8000") (eq .Comm "unit") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "ntpd"
    match: '{{ or (eq .Port "123") (eq .Comm "ntpd") }}'
    config_template: |
      {{ job "name" "local" "address" .Address "collect_peers" false }}

  - id: "openldap"
    match: '{{ eq .Comm "slapd" }}'
    config_template: |
      {{ job "name" "local" "url" (printf "ldap://%s" .Address) }}

  - id: "openvpn"
    match: '{{ and (eq .Port "7505") (eq .Comm "openvpn") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "oracledb"
    match: '{{ and (eq .Port "1521" "2484") (eq .Comm "tnslsnr") }}'
    config_template: |
      {{ $job := dict "name" "local" }}
      {{ if eq .Port "1521" }}
      {{ $_ := set $job "dsn" (printf "oracle://username:password@%s/XE" .Address) }}
      {{ else }}
      {{ $_ := set $job "dsn" (printf "oracle://username:password@%s/XE?ssl=true&ssl verify=false" .Address) }}
      {{ end }}
      {{ job $job }}

  - id: "pgbouncer"
    match: '{{ or (eq .Port "6432") (eq .Comm "pgbouncer") }}'
    config_template: |
      {{ job "name" "local" "dsn" (printf "postgres://netdata:postgres@%s/pgbouncer" .Address) }}

  - id: "pihole"
    match: '{{ and (eq .Port "80") (eq .Comm "pihole-FTL") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "pika"
    match: '{{ and (eq .Port "9221") (eq .Comm "pika") }}'
    config_template: |
      {{ job "name" "local" "address" (printf "redis://@%s:%s" .IPAddress .Port) }}

  - id: "postgres"
    match: '{{ or (eq .Port "5432") (eq .Comm "postgres") }}'
    config_template: |
      {{ job "name" "local" "dsn" ("host=/var/run/postgresql dbname=postgres user=postgres") }}
      {{ job "name" "local" "dsn" ("host=/var/run/postgresql dbname=postgres user=netdata") }}
      {{ job "name" "local" "dsn" (printf "postgresql://netdata@%s/postgres" .Address) }}

  - id: "powerdns"
    match: '{{ and (eq .Port "8081") (eq .Comm "pdns_server") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) "headers" (dict "X-API-KEY" "secret") }}

  - id: "powerdns_recursor"
    match: '{{ and (eq .Port "8081") (eq .Comm "pdns_recursor") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) "headers" (dict "X-API-KEY" "secret") }}

  - id: "proxysql"
    match: '{{ or (eq .Port "6032") (eq .Comm "proxysql") }}'
    config_template: |
      {{ job "name" "local" "dsn" (printf "stats:stats@tcp(%s)/" .Address) }}

  - id: "puppet"
    match: '{{ or (eq .Port "8140") (glob .Cmdline "*puppet-server*") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "https://%s" .Address) "tls_skip_verify" true }}

  - id: "rabbitmq"
    match: '{{ or (eq .Port "15672") (glob .Cmdline "*rabbitmq*") }}'
    config_template: |
      {{ job
        "name" "local"
        "url" (printf "http://%s" .Address)
        "username" "guest"
        "password" "guest"
        "collect_queues_metrics" false
      }}

  - id: "redis"
    match: '{{ or (eq .Port "6379") (eq .Comm "redis-server") }}'
    config_template: |
      {{ job "name" "local" "address" (printf "redis://@%s" .Address) }}

  - id: "rethinkdb"
    match: '{{ and (eq .Port "28015") (eq .Comm "rethinkdb") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "riak"
    match: '{{ and (eq .Port "8098") (glob .Cmdline "*riak*") }}'
    config_template: |
      {{ job "module" "riakkv" "name" "local" "url" (printf "http://%s/stats" .Address) }}

  - id: "rspamd"
    match: '{{ and (eq .Port "11334") (eq .Comm "rspamd") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "squid"
    match: '{{ and (eq .Port "3128") (eq .Comm "squid") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "spigotmc"
    match: '{{ and (eq .Port "25575") (glob .Cmdline "*spigot*") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "supervisord"
    match: '{{ and (eq .Port "9001") (eq .Comm "supervisord") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/RPC2" .Address) }}

  - id: "tomcat"
    match: '{{ and (eq .Port "8080") (glob .Cmdline "*tomcat*") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s" .Address) }}

  - id: "tor"
    match: '{{ and (eq .Port "9051") (eq .Comm "tor") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "traefik"
    match: '{{ and (eq .Port "80" "8080") (eq .Comm "traefik") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/metrics" .Address) }}

  - id: "typesense"
    match: '{{ and (eq .Port "8108") (eq .Comm "typesense-server") }}'
    config_template: |
      {{ job
        "name" "local"
        "url" (printf "http://%s" .Address)
        "api_key" (trimPrefix "--api-key=" (regexFind "--api-key=[^ ]+" .Cmdline))
      }}

  - id: "unbound"
    match: '{{ and (eq .Port "8953") (eq .Comm "unbound") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "upsd"
    match: '{{ or (eq .Port "3493") (eq .Comm "upsd") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "uwsgi"
    match: '{{ and (eq .Port "1717") (eq .Comm "uwsgi") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "vernemq"
    match: '{{ and (eq .Port "8888") (glob .Cmdline "*vernemq*") }}'
    config_template: |
      {{ job "name" "local" "url" (printf "http://%s/metrics" .Address) }}

  - id: "yugabytedb"
    match: '{{ and (eq .Port "7000" "9000" "12000" "13000") (or (glob .Cmdline "*YSQL*") (eq .Comm "yb-master" "yb-tserver")) }}'
    config_template: |
      {{ $job := dict "module" "yugabytedb" }}
      {{ if eq .Port "7000" }}
      {{ $_ := set $job "name" "local_master" }}
      {{ else if eq .Port "9000" }}
      {{ $_ := set $job "name" "local_tserver" }}
      {{ else if eq .Port "12000" }}
      {{ $_ := set $job "name" "local_ycql" }}
      {{ else if eq .Port "13000" }}
      {{ $_ := set $job "name" "local_ysql" }}
      {{ else }}
      {{ $_ := set $job "name" "local" }}
      {{ end }}
      {{ $_ := set $job "url" (printf "http://%s/prometheus-metrics" .Address) }}
      {{ job $job }}

  - id: "zookeeper"
    match: '{{ or (eq .Port "2181" "2182") (glob .Cmdline "*zookeeper*") }}'
    config_template: |
      {{ job "name" "local" "address" .Address }}

  - id: "exporter"
    match: '{{ or (and (not (empty (promPort .Port))) (not (eq .Comm "docker-proxy"))) (glob .Comm "*exporter*") }}'
    config_template: |
      {{ $job := dict }}
      {{ $name := promPort .Port }}
      {{ if empty $name }}
      {{ $name = printf "%s_%s" .Comm .Port }}
      {{ end }}
      {{ $_ := set $job "module" "prometheus" }}
      {{ $_ := set $job "name" (printf "%s_local" $name) }}
      {{ $_ := set $job "url" (printf "http://%s/metrics" .Address) }}
      {{ if eq $name "caddy" }}
      {{ $_ := set $job "expected_prefix" "caddy_" }}
      {{ else if eq $name "openethereum" }}
      {{ $_ := set $job "expected_prefix" "blockchaincache_" }}
      {{ else if eq $name "crowdsec" }}
      {{ $_ := set $job "expected_prefix" "cs_" }}
      {{ else if eq $name "netbox" }}
      {{ $_ := set $job "expected_prefix" "django_" }}
      {{ else if eq $name "traefik" }}
      {{ $_ := set $job "expected_prefix" "traefik_" }}
      {{ else if eq $name "ripe_atlas_exporter" }}
      {{ $_ := set $job "expected_prefix" "atlas_" }}
      {{ else if eq $name "pushgateway" }}
      {{ $_ := set $job "expected_prefix" "pushgateway_" }}
      {{ $_ := set $job "selector" (dict "allow" (list "pushgateway_*")) }}
      {{ else if eq $name "wireguard_exporter" }}
      {{ $_ := set $job "expected_prefix" "wireguard_exporter" }}
      {{ else if eq $name "clickhouse" }}
      {{ $_ := set $job "max_time_series" 3000 }}
      {{ end }}
      {{ job $job }}
