disabled: no

## SECURITY: setting this to "yes" enables secret references in generated collector jobs,
## including ${env:...}, ${file:...}, ${cmd:...} and ${store:...} supplied by targets.
## Target-controlled values used by service rules can make Netdata read local files,
## run commands, or fetch stored secrets with the secret providers' permissions. A collector
## may send the resolved values back to the target as credentials or other request fields.
## Enable only if you control and trust every target this pipeline can discover. Enabling
## accepts that risk for the whole pipeline; one untrusted target is enough to abuse it.
## Discovery connection credentials are unaffected. Default "no" keeps references literal.
# trust_discovered_targets: no

discoverer:
  docker:
    address: "unix:///var/run/docker.sock"

services:
  - id: "skip"
    match: |
      {{ $netNOK := eq .NetworkMode "host" -}}
      {{ $protoNOK := not (eq .PortProtocol "tcp") -}}
      {{ $portNOK := empty .PrivatePort -}}
      {{ $addrNOK := or (empty .IPAddress) (glob .PublicPortIP "*:*") -}}
      {{ or $netNOK $protoNOK $portNOK $addrNOK }}

  - id: "apache"
    match: '{{ match "sp" .Image "httpd httpd:* */apache */apache:* */apache2 */apache2:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/server-status?auto" .Address) | toYaml -}}

  - id: "beanstalk"
    match: '{{ match "sp" .Image "*/beanstalkd */beanstalkd:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" .Address | toYaml -}}

  - id: "boinc"
    match: '{{ match "sp" .Image "boinc/client boinc/client:* */boinc */boinc:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" .Address | toYaml -}}

  - id: "cockroachdb"
    match: '{{ match "sp" .Image "cockroachdb/cockroach cockroachdb/cockroach:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/_status/vars" .Address) | toYaml -}}

  - id: "consul"
    match: '{{ match "sp" .Image "consul consul:* */consul */consul:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address) | toYaml -}}

  - id: "coredns"
    match: '{{ match "sp" .Image "*/coredns */coredns:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/metrics" .Address) | toYaml -}}

  - id: "couchbase"
    match: '{{ or (eq .PrivatePort "8091") (match "sp" .Image "couchbase couchbase:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address) | toYaml -}}

  - id: "couchdb"
    match: '{{ or (eq .PrivatePort "5984") (match "sp" .Image "couchdb couchdb:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address) | toYaml -}}

  - id: "dovecot"
    match: '{{ or (eq .PrivatePort "24242") (match "sp" .Image "*/dovecot */dovecot:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" .Address | toYaml -}}

  - id: "elasticsearch"
    match: '{{ or (eq .PrivatePort "9200") (match "sp" .Image "elasticsearch elasticsearch:* */elasticsearch */elasticsearch:* */opensearch */opensearch:*") }}'
    config_template: |
      {{- $job := dict -}}
      {{- $_ := set $job "name" (printf "docker_%s" .Name) -}}
      {{- if glob .Image "*elastic*" -}}
      {{- $_ := set $job "url" (printf "http://%s" .Address) -}}
      {{- else -}}
      {{- $_ := set $job "url" (printf "https://%s" .Address) -}}
      {{- $_ := set $job "tls_skip_verify" true -}}
      {{- $_ := set $job "username" "admin" -}}
      {{- $_ := set $job "password" "admin" -}}
      {{- end -}}
      {{ $job | toYaml -}}

  - id: "gearman"
    match: '{{ and (eq .PrivatePort "4730") (match "sp" .Image "*/gearmand */gearmand:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" .Address | toYaml -}}

  - id: "ipfs"
    match: '{{ and (eq .PrivatePort "5001") (match "sp" .Image "ipfs/kubo ipfs/kubo:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address) | toYaml -}}

  - id: "lighttpd"
    match: '{{ match "sp" .Image "*/lighttpd */lighttpd:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/server-status?auto" .Address) | toYaml -}}

  - id: "maxscale"
    match: '{{ or (eq .PrivatePort "8989") (match "sp" .Image "mariadb/maxscale mariadb/maxscale:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address) | toYaml -}}

  - id: "memcached"
    match: '{{ or (eq .PrivatePort "11211") (match "sp" .Image "memcached memcached:* */memcached */memcached:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" .Address | toYaml -}}

  - id: "mongodb"
    match: '{{ or (eq .PrivatePort "27017") (match "sp" .Image "mongo mongo:* */mongodb */mongodb:* */mongodb-community-server */mongodb-community-server:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "uri" (printf "mongodb://%s" .Address) | toYaml -}}

  - id: "mysql"
    match: '{{ or (eq .PrivatePort "3306") (match "sp" .Image "mysql mysql:* */mysql */mysql:* mariadb mariadb:* */mariadb */mariadb:* percona percona:* */percona-mysql */percona-mysql:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "dsn" (printf "netdata@tcp(%s)/" .Address) | toYaml -}}

  - id: "nats"
    match: '{{ and (eq .PrivatePort "8222") (match "sp" .Image "nats nats:*") }}'
    config_template: |
      {{ list (dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address)) | toYaml -}}

  - id: "nginx"
    match: '{{ match "sp" .Image "nginx nginx:*" }}'
    config_template: |
      {{- list
        (dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/stub_status" .Address))
        (dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/basic_status" .Address))
        (dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/nginx_status" .Address))
        (dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/status" .Address))
      | toYaml -}}

  - id: "nginxunit"
    match: '{{ match "sp" .Image "nginx/unit nginx/unit:*" }}'
    config_template: |
      {{ list (dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address)) | toYaml -}}

  - id: "oracledb"
    match: '{{ and (eq .PrivatePort "1521" "2484") (match "sp" .Image "oracle/database oracle/database:*") }}'
    config_template: |
      {{- $job := dict -}}
      {{- $_ := set $job "name" (printf "docker_%s" .Name) -}}
      {{- if eq .PrivatePort "1521" -}}
      {{- $_ := set $job "dsn" (printf "oracle://username:password@%s/XE" .Address) -}}
      {{- else -}}
      {{- $_ := set $job "dsn" (printf "oracle://username:password@%s/XE?ssl=true&ssl verify=false" .Address) -}}
      {{- end -}}
      {{ $job | toYaml -}}

  - id: "pgbouncer"
    match: '{{ or (eq .PrivatePort "6432") (match "sp" .Image "*/pgbouncer */pgbouncer:*") }}'
    config_template: |
      {{- dict
        "name" (printf "docker_%s" .Name)
        "dsn" (printf "postgres://netdata:postgres@%s/pgbouncer" .Address)
      | toYaml -}}

  - id: "pika"
    match: '{{ match "sp" .Image "pikadb/pika pikadb/pika:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" (printf "redis://@%s" .Address) | toYaml -}}

  - id: "postgres"
    match: '{{ or (eq .PrivatePort "5432") (match "sp" .Image "postgres postgres:* */postgres */postgres:* */postgresql */postgresql:*") }}'
    config_template: |
      {{- dict
        "module" "postgres"
        "name" (printf "docker_%s" .Name)
        "dsn" (printf "postgres://netdata:postgres@%s/postgres" .Address)
      | toYaml -}}

  - id: "proxysql"
    match: '{{ or (eq .PrivatePort "6032") (match "sp" .Image "*/proxysql */proxysql:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "dsn" (printf "stats:stats@tcp(%s)/" .Address) | toYaml -}}

  - id: "puppet"
    match: '{{ or (eq .PrivatePort "8140") (match "sp" .Image "puppet/puppetserver puppet/puppetserver:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "https://%s" .Address) "tls_skip_verify" true | toYaml -}}

  - id: "rabbitmq"
    match: '{{ or (eq .PrivatePort "15672") (match "sp" .Image "rabbitmq rabbitmq:* */rabbitmq */rabbitmq:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address) | toYaml -}}

  - id: "redis"
    match: '{{ or (eq .PrivatePort "6379") (match "sp" .Image "redis redis:* */redis */redis:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" (printf "redis://@%s" .Address) | toYaml -}}

  - id: "rethinkdb"
    match: '{{ and (eq .PrivatePort "28015") (match "sp" .Image "rethinkdb rethinkdb:* */rethinkdb */rethinkdb:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" .Address | toYaml -}}

  - id: "squid"
    match: '{{ match "sp" .Image "*/squid */squid:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address) | toYaml -}}

  - id: "tengine"
    match: '{{ match "sp" .Image "*/tengine */tengine:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/us" .Address) | toYaml -}}

  - id: "tor"
    match: '{{ and (eq .PrivatePort "9051") (match "sp" .Image "*/tor */tor:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" .Address | toYaml -}}

  - id: "tomcat"
    match: '{{ match "sp" .Image "tomcat tomcat:* */tomcat */tomcat:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s" .Address) | toYaml -}}

  - id: "typesense"
    match: '{{ match "sp" .Image "typesense/typesense typesense/typesense:*" }}'
    config_template: |
      {{- dict
        "name" (printf "docker_%s" .Name)
        "url" (printf "http://%s" .Address)
        "api_key" (trimPrefix "--api-key=" (regexFind "--api-key=[^ ]+" .Command))
      | toYaml -}}

  - id: "varnish"
    match: '{{ match "sp" .Image "varnish varnish:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "docker_container" .Name | toYaml -}}

  - id: "vernemq"
    match: '{{ match "sp" .Image "*/vernemq */vernemq:*" }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "url" (printf "http://%s/metrics" .Address) | toYaml -}}

  - id: "zookeeper"
    match: '{{ or (eq .PrivatePort "2181") (match "sp" .Image "*/zookeeper */zookeeper:*") }}'
    config_template: |
      {{ dict "name" (printf "docker_%s" .Name) "address" .Address | toYaml -}}
