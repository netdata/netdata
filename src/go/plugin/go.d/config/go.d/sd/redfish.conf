## ======================================================================
## WARNING: REDFISH DISCOVERY IS DISABLED BY DEFAULT
## To enable it, change "disabled: yes" to "disabled: no" below and
## configure the exact networks, ports, credentials, and TLS policy.
## ======================================================================

disabled: yes

discoverer:
  redfish:
    ## How often to scan the configured networks (default: 30m).
    ## Set to 0 to scan once when this pipeline starts.
    #rescan_interval: 30m

    ## How long a previously validated endpoint remains trusted (default: 12h).
    ## Set to 0 to disable age-based expiry.
    #device_cache_ttl: 12h

    ## Maximum simultaneous unauthenticated ServiceRoot probes across this pipeline.
    #max_concurrent_scans: 32

    ## Connection profiles are copied into the generated redfish jobs.
    ## Discovery itself performs only an unauthenticated structural ServiceRoot probe.
    profiles:
      - name: secure-bmc
        scheme: https
        node_mode: system_vnodes
        auth_method: auto
        username: monitoring
        password: ${file:/etc/netdata/redfish-password}
        update_every: 60
        timeout: 15
        retries: 2
        max_concurrent_requests: 3
        # Keep verification enabled when the BMC certificate can be trusted.
        #tls_ca: /etc/netdata/redfish-ca.pem
        #tls_skip_verify: false
        collect: "*"
        charts:
          aggregates: true
          details: true
          max_detailed_components_per_family: 100
        alarms:
          evaluate_thresholds: true
        logs:
          ## Retention starts only when an enabled redfish_logs job named
          ## "default" is ready. Metrics continue when that backend is absent.
          enabled: true
          backend: default

    ## Each entry is limited to 512 addresses. More-specific overlapping
    ## networks win; equal prefixes with the same profile merge their ports.
    networks:
      - subnet: 192.0.2.0/24
        ports: [443]
        profile: secure-bmc

services:
  - id: redfish
    match: '{{ true }}'
    config_template: |
      name: discovered-{{ .EndpointKey }}
      url: {{ .URL }}
      {{ .JobConfig | toYaml }}
