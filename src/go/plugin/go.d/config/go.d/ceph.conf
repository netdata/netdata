## All available configuration options, their descriptions and default values:
## https://github.com/netdata/netdata/tree/master/src/go/plugin/go.d/collector/ceph#readme

## Deploy this Dashboard API job once per Ceph cluster, on a designated child
## or on-prem Parent that can reach ceph-mgr. Do not duplicate it on every OSD.
##
## Use Ceph's Prometheus producers for continuous telemetry:
##   - on Reef 18 and later, scrape ceph-exporter on every Ceph node for
##     daemon/admin-socket metrics;
##   - scrape the active ceph-mgr Prometheus endpoint once per cluster.
## On Reef 18 and later, ceph-exporter refreshes its cache every 5s by default.
## The ceph-mgr Prometheus module refreshes its enabled cache every 15s by
## default. Match scrape intervals to the configured producer periods. Changing
## a scraper interval does not change either cache refresh workload; ceph-mgr
## cache=false is the request-time collection exception.
##
## This native collector complements those streams. By default it collects the
## complete Dashboard health, OSD, and pool metric set every 10 seconds and
## exposes bounded on-demand health, OSD, pool, and daemon Functions.

#jobs:
#  - name: local
#    url: https://127.0.0.1:8443
#    username: netdata
#    password: change-me
#    # Alternatively, omit username/password and use an externally managed token:
#    # bearer_token_file: /etc/netdata/ceph-dashboard.jwt
#    # The file owner must replace the token before it expires. The collector
#    # rereads the file for every request, so replacements take effect without
#    # restarting it.
#
