## All available configuration options, their descriptions and default values:
## https://github.com/netdata/netdata/tree/master/src/go/plugin/go.d/collector/ceph#readme

## Deploy this Dashboard API job once per Ceph cluster, on a designated child
## or on-prem Parent that can reach ceph-mgr. Do not duplicate it on every OSD.
##
## Use Ceph's Prometheus producers for continuous telemetry:
##   - scrape ceph-exporter on every Ceph node for daemon/admin-socket metrics;
##   - scrape the active ceph-mgr Prometheus endpoint once per cluster.
## By default, ceph-exporter refreshes its cache every 5s and the ceph-mgr
## Prometheus module refreshes its enabled cache every 15s. Match scrape
## intervals to the configured producer periods. Changing a scraper interval
## does not change either cache refresh workload; ceph-mgr cache=false is the
## request-time collection exception.
##
## This native collector complements those streams. By default it checks only
## Dashboard API/auth/active-MGR reachability and exposes bounded on-demand RCA
## and inventory Functions. Legacy overlapping or potentially expensive metric
## features are opt-in.

