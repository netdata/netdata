extends:
  - _ubiquiti.yaml

selector:
  # Some UniFi switches and gateways expose Net-SNMP's generic Linux identity.
  # Require a Ubiquiti firmware marker so ordinary Net-SNMP hosts do not match.
  - sysobjectid:
      include:
        - 1.3.6.1.4.1.8072.3.2.10
    sysdescr:
      include:
        - Linux UBNT
        - ui-ipq9574
        - UniFi UDR7

metadata:
  device:
    fields:
      model:
        symbol:
          OID: 1.3.6.1.2.1.1.1.0
          name: sysDescr
          match_pattern: '(?i)UniFi[[:space:]]+UDR7'
          match_value: 'UniFi UDR7'
