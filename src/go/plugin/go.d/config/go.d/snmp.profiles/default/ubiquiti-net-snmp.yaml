extends:
  - _ubiquiti.yaml

selector:
  # Some UniFi switches and gateways expose Net-SNMP's generic Linux identity.
  # Require a Ubiquiti firmware marker so ordinary Net-SNMP hosts do not match.
  - sysobjectid:
      include:
        - 1.3.6.1.4.1.8072.3.2.10
    sysdescr:
      include:
        - Linux UBNT
        - ui-ipq9574
