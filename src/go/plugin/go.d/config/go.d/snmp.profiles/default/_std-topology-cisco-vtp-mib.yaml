# Supplemental topology profile for Cisco VTP VLAN metadata enrichment.
# Source: CISCO-VTP-MIB.

topology:
  - kind: vtp_vlan
    MIB: CISCO-VTP-MIB
    table:
      OID: 1.3.6.1.4.1.9.9.46.1.3.1.1
      name: vtpVlanTable
    symbols:
      # Use VLAN state as the row-presence anchor.
      - OID: 1.3.6.1.4.1.9.9.46.1.3.1.1.2
        name: vtp_vlan
    metric_tags:
      - tag: vtp_vlan_index
        index: 2
      - tag: vtp_vlan_state
        symbol:
          OID: 1.3.6.1.4.1.9.9.46.1.3.1.1.2
          name: vtpVlanState
        mapping:
          1: operational
          2: suspended
          3: mtuTooBigForDevice
          4: mtuTooBigForTrunk
      - tag: vtp_vlan_type
        symbol:
          OID: 1.3.6.1.4.1.9.9.46.1.3.1.1.3
          name: vtpVlanType
      - tag: vtp_vlan_name
        symbol:
          OID: 1.3.6.1.4.1.9.9.46.1.3.1.1.4
          name: vtpVlanName
