# IP-MIB neighbor cache topology.

topology:
  - kind: arp_entry
    MIB: IP-MIB
    table:
      OID: 1.3.6.1.2.1.4.35.1
      name: ipNetToPhysicalTable
    symbols:
      - OID: 1.3.6.1.2.1.4.35.1.4
        name: arp_entry
    metric_tags:
      - tag: arp_if_index
        index: 1
      - tag: arp_if_name
        table: ifXTable
        symbol:
          OID: 1.3.6.1.2.1.31.1.1.1.1
          name: ifName
        index_transform:
          - start: 0
            end: 0
      - tag: arp_addr_type
        index: 2
        symbol:
          name: ipNetToPhysicalNetAddressType
        mapping:
          0: unknown
          1: ipv4
          2: ipv6
          16: dns
      - tag: arp_ip
        symbol:
          name: ipNetToPhysicalNetAddress
          format: ip_address
        index_transform:
          - start: 3
      - tag: arp_mac
        symbol:
          OID: 1.3.6.1.2.1.4.35.1.4
          name: ipNetToPhysicalPhysAddress
          format: hex
      - tag: arp_type
        symbol:
          OID: 1.3.6.1.2.1.4.35.1.6
          name: ipNetToPhysicalType
        mapping:
          1: other
          2: invalid
          3: dynamic
          4: static
          5: local
      - tag: arp_state
        symbol:
          OID: 1.3.6.1.2.1.4.35.1.7
          name: ipNetToPhysicalState
        mapping:
          1: reachable
          2: stale
          3: delay
          4: probe
          5: invalid
          6: unknown
          7: incomplete

  - kind: arp_legacy_entry
    MIB: IP-MIB
    table:
      OID: 1.3.6.1.2.1.4.22
      name: ipNetToMediaTable
    symbols:
      - OID: 1.3.6.1.2.1.4.22.1.2
        name: arp_legacy_entry
    metric_tags:
      - tag: arp_if_index
        index: 1
      - tag: arp_if_name
        table: ifXTable
        symbol:
          OID: 1.3.6.1.2.1.31.1.1.1.1
          name: ifName
        index_transform:
          - start: 0
            end: 0
      - tag: arp_ip
        symbol:
          name: ipNetToMediaNetAddress
          format: ip_address
        index_transform:
          - start: 1
            end: 4
      - tag: arp_mac
        symbol:
          OID: 1.3.6.1.2.1.4.22.1.2
          name: ipNetToMediaPhysAddress
          format: hex
      - tag: arp_type
        symbol:
          OID: 1.3.6.1.2.1.4.22.1.4
          name: ipNetToMediaType
        mapping:
          1: other
          2: invalid
          3: dynamic
          4: static
