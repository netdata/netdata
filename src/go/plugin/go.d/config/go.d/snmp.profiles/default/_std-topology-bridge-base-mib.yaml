# Shared BRIDGE-MIB identity and bridge-port-to-interface mapping.

metadata:
  device:
    fields:
      bridge_base_address:
        consumers: [topology]
        symbol:
          OID: 1.3.6.1.2.1.17.1.1.0
          name: dot1dBaseBridgeAddress
          format: hex

topology:
  - kind: bridge_port_if_index
    MIB: BRIDGE-MIB
    table:
      OID: 1.3.6.1.2.1.17.1.4
      name: dot1dBasePortTable
    symbols:
      - OID: 1.3.6.1.2.1.17.1.4.1.2
        name: bridge_port_if_index
    metric_tags:
      - tag: bridge_base_port
        index: 1
      - tag: bridge_if_index
        symbol:
          OID: 1.3.6.1.2.1.17.1.4.1.2
          name: dot1dBasePortIfIndex
