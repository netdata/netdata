# Topology-only IEEE 802.1AB-2016 LLDP-V2 capability.
#
# LLDP-V2 table indexes are not-accessible and are decoded from instance OID
# suffixes. Remote identity combines the destination-address table index with
# the remote index; TimeFilter is intentionally excluded because RFC 4502 does
# not define it as stable row identity.

metadata:
  device:
    fields:
      lldp_loc_chassis_id:
        consumers: [topology]
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.2.0
          name: lldpV2LocChassisId
      lldp_loc_chassis_id_subtype:
        consumers: [topology]
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.1.0
          name: lldpV2LocChassisIdSubtype
          mapping:
            1: chassisComponent
            2: interfaceAlias
            3: portComponent
            4: macAddress
            5: networkAddress
            6: interfaceName
            7: local
      lldp_loc_sys_name:
        consumers: [topology]
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.3.0
          name: lldpV2LocSysName
      lldp_loc_sys_desc:
        consumers: [topology]
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.4.0
          name: lldpV2LocSysDesc
      lldp_loc_sys_cap_supported:
        consumers: [topology]
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.5.0
          name: lldpV2LocSysCapSupported
          format: hex
      lldp_loc_sys_cap_enabled:
        consumers: [topology]
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.6.0
          name: lldpV2LocSysCapEnabled
          format: hex

topology:
  - kind: lldp_loc_port
    MIB: LLDP-V2-MIB
    table:
      OID: 1.3.111.2.802.1.1.13.1.3.7
      name: lldpV2LocPortTable
    symbols:
      - OID: 1.3.111.2.802.1.1.13.1.3.7.1.2
        name: lldp_loc_port
    metric_tags:
      - tag: lldp_loc_port_num
        index: 1
      - tag: lldp_loc_port_id
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.7.1.3
          name: lldpV2LocPortId
      - tag: lldp_loc_port_id_subtype
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.7.1.2
          name: lldpV2LocPortIdSubtype
        mapping:
          1: interfaceAlias
          2: portComponent
          3: macAddress
          4: networkAddress
          5: interfaceName
          6: agentCircuitId
          7: local
      - tag: lldp_loc_port_desc
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.7.1.4
          name: lldpV2LocPortDesc

  - kind: lldp_loc_man_addr
    MIB: LLDP-V2-MIB
    table:
      OID: 1.3.111.2.802.1.1.13.1.3.8
      name: lldpV2LocManAddrTable
    symbols:
      # The subtype and address are not-accessible INDEX objects. Use the
      # readable management-address length column as the row anchor.
      - OID: 1.3.111.2.802.1.1.13.1.3.8.1.3
        name: lldp_loc_man_addr
    metric_tags:
      - tag: lldp_loc_mgmt_addr_subtype
        index: 1
      - tag: lldp_loc_mgmt_addr
        symbol:
          name: lldpV2LocManAddr
          format: hex
        index_transform:
          - start: 2
      - tag: lldp_loc_mgmt_addr_if_subtype
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.8.1.4
          name: lldpV2LocManAddrIfSubtype
      - tag: lldp_loc_mgmt_addr_if_id
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.8.1.5
          name: lldpV2LocManAddrIfId
      - tag: lldp_loc_mgmt_addr_oid
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.3.8.1.6
          name: lldpV2LocManAddrOID

  - kind: lldp_rem
    MIB: LLDP-V2-MIB
    table:
      OID: 1.3.111.2.802.1.1.13.1.4.1
      name: lldpV2RemTable
    symbols:
      # Use a required numeric column to ensure rows are emitted by ddsnmp.
      - OID: 1.3.111.2.802.1.1.13.1.4.1.1.7
        name: lldp_rem
    metric_tags:
      - tag: lldp_loc_port_num
        index: 2
      - tag: lldp_rem_index
        index_transform:
          - start: 2
            end: 3
      - tag: lldp_rem_chassis_id_subtype
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.1.1.5
          name: lldpV2RemChassisIdSubtype
        mapping:
          1: chassisComponent
          2: interfaceAlias
          3: portComponent
          4: macAddress
          5: networkAddress
          6: interfaceName
          7: local
      - tag: lldp_rem_chassis_id
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.1.1.6
          name: lldpV2RemChassisId
      - tag: lldp_rem_port_id_subtype
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.1.1.7
          name: lldpV2RemPortIdSubtype
        mapping:
          1: interfaceAlias
          2: portComponent
          3: macAddress
          4: networkAddress
          5: interfaceName
          6: agentCircuitId
          7: local
      - tag: lldp_rem_port_id
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.1.1.8
          name: lldpV2RemPortId
      - tag: lldp_rem_port_desc
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.1.1.9
          name: lldpV2RemPortDesc
      - tag: lldp_rem_sys_name
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.1.1.10
          name: lldpV2RemSysName
      - tag: lldp_rem_sys_desc
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.1.1.11
          name: lldpV2RemSysDesc
      - tag: lldp_rem_sys_cap_supported
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.1.1.12
          name: lldpV2RemSysCapSupported
          format: hex
      - tag: lldp_rem_sys_cap_enabled
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.1.1.13
          name: lldpV2RemSysCapEnabled
          format: hex

  - kind: lldp_rem_man_addr
    MIB: LLDP-V2-MIB
    table:
      OID: 1.3.111.2.802.1.1.13.1.4.2
      name: lldpV2RemManAddrTable
    symbols:
      # The address subtype and address are not-accessible INDEX objects. Use
      # the readable interface-subtype column as the row anchor.
      - OID: 1.3.111.2.802.1.1.13.1.4.2.1.3
        name: lldp_rem_man_addr
    metric_tags:
      - tag: lldp_loc_port_num
        index: 2
      - tag: lldp_rem_index
        index_transform:
          - start: 2
            end: 3
      - tag: lldp_rem_mgmt_addr_subtype
        index: 5
      - tag: lldp_rem_mgmt_addr_len
        index: 6
      - tag: lldp_rem_mgmt_addr
        symbol:
          name: lldpV2RemManAddr
          format: hex
        index_transform:
          - start: 6
      - tag: lldp_rem_mgmt_addr_if_subtype
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.2.1.3
          name: lldpV2RemManAddrIfSubtype
      - tag: lldp_rem_mgmt_addr_if_id
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.2.1.4
          name: lldpV2RemManAddrIfId
      - tag: lldp_rem_mgmt_addr_oid
        symbol:
          OID: 1.3.111.2.802.1.1.13.1.4.2.1.5
          name: lldpV2RemManAddrOID
