# Cisco Meraki Dashboard API: one organization per job.
# Every assigned device creates a separate virtual node.
# API access and read permissions for the organization are required.
#
# jobs:
#   - name: meraki
#     organization_id: "123456"
#     api_key: ${env:MERAKI_API_KEY}
#     # Alternatively, reread a mounted bearer token for every request:
#     # bearer_token_file: /run/secrets/meraki_token
#     # url: https://api.meraki.com/api/v1
#     # update_every: 300
#     # autodetection_retry: 0
#     # timeout: 60  # Whole collection, including every page and request pacing.
#     # vnode: summary-node  # Organization summary only; devices have their own nodes.
#     # proxy_url: http://127.0.0.1:3128
#     # tls_ca: /path/to/ca.pem
#     # tls_cert: /path/to/client.pem
#     # tls_key: /path/to/client.key
#     # tls_skip_verify: no
