plugin_name: go.d.plugin
modules:
  - &module
    meta: &meta
      id: collector-go.d.plugin-mssql
      plugin_name: go.d.plugin
      module_name: mssql
      monitored_instance:
        name: Microsoft SQL Server
        link: https://www.microsoft.com/en-us/sql-server
        categories:
          - data-collection.databases
        icon_filename: mssql.svg
      related_resources:
        integrations:
          list:
            - plugin_name: apps.plugin
              module_name: apps
            - plugin_name: cgroups.plugin
              module_name: /sys/fs/cgroup
              monitored_instance_name: Containers
      info_provided_to_referring_integrations:
        description: ""
      keywords:
        - "mssql"
        - "sql server"
        - "microsoft sql server"
        - "microsoft"
        - "azure sql"
        - "azure sql managed instance"
        - "always on"
        - "sql server agent"
        - "query store"
    overview:
      multi_instance: true
      data_collection:
        metrics_description: |
          Monitor Microsoft SQL Server performance, databases, SQL Server Agent jobs, replication, and Always On
          Availability Groups. Charts cover connections, throughput, buffer and memory pressure, waits and locks,
          per-database transactions and transaction logs, and the health of every job, publication, and availability
          group.

          All SQL Server editions (Express, Web, Standard, Enterprise, Developer) and Azure SQL Managed Instance are
          supported. Azure SQL Database is not supported: required instance-level memory and file views are unavailable,
          so the job cannot start. Charts appear only for what the instance actually has and the monitoring login can read:

          | Area | Charts appear |
          |:-----|:--------------|
          | Instance: connections, batch requests, compilations, SQL errors, buffer manager, memory, process and OS memory | Always |
          | Database: transactions, transaction log usage and growth, data and log file sizes, I/O stall, state | For every database |
          | Locks and waits | For every lock resource type and wait type observed |
          | SQL Server Agent jobs: enabled state, last execution result, duration, age, current run time | When the instance has SQL Server Agent (not on Express) and the login can read `msdb` |
          | Replication: publication status, warnings, latency, subscriptions | When the instance is a distributor and the login can read the `distribution` database |
          | Always On Availability Groups: group, replica, database replica, WSFC cluster health, automatic page repair | When Always On is enabled on the instance |

          Three Functions add on-demand troubleshooting from the dashboard: `top-queries` lists the most expensive query
          patterns from Query Store or the plan cache, `deadlock-info` shows the most recent deadlock graph, and
          `error-info` lists recent SQL errors from an Extended Events session. See Live Data below.
        method_description: |
          The collector connects to the instance over TCP with the Tabular Data Stream (TDS) protocol, using the `dsn`
          connection string. It authenticates with a SQL Server login, with Windows integrated authentication when the
          DSN carries no credentials (Windows only), or with a Microsoft Entra ID token when `cloud_auth` is configured
          for Azure SQL Managed Instance.

          Every `update_every` seconds it runs read-only queries against system views on one connection, each bounded
          by `timeout`:

          | Area | Views |
          |:-----|:------|
          | Counters, sessions, waits, locks | `sys.dm_os_performance_counters`, `sys.dm_exec_sessions`, `sys.dm_exec_requests`, `sys.dm_os_wait_stats`, `sys.dm_tran_locks` |
          | Memory and files | `sys.dm_os_process_memory`, `sys.dm_os_sys_memory`, `sys.dm_io_virtual_file_stats`, `sys.master_files`, `sys.databases` |
          | SQL Server Agent | `msdb.dbo.sysjobs`, `msdb.dbo.sysjobhistory`, `msdb.dbo.sysjobactivity` |
          | Replication | `distribution.dbo.MSreplication_monitordata`, `distribution.dbo.MSpublications`, `distribution.dbo.MSsubscriptions` |
          | Always On | `sys.availability_groups`, `sys.availability_replicas`, and the `sys.dm_hadr_*` views for group, replica, database, cluster, failover readiness, page repair and thread state |

          Functions open a second connection the first time one is used, keeping the metrics connection available.
          Both workloads still share SQL Server CPU, I/O and locks. The collector never writes to the server: it creates no
          objects, changes no settings, and leaves the Extended Events sessions it reads untouched.
      default_behavior:
        auto_detection:
          description: ""
        limits:
          description: |
            - SQL Server Agent execution charts (last result, duration, age, current run time) are created only for
              enabled jobs. Disabled jobs keep their status chart; set `collect_disabled_jobs: yes` to chart their
              executions too.
            - The current run time of a job comes from the latest SQL Server Agent activity session, so a job whose run
              was cut short by an Agent service crash can show as running until Agent starts a new session.
            - A job that succeeded with failed intermediate steps is reported as `warning` only while that step history
              still exists; if the history is purged before collection, it is reported as `ok`.
            - `top-queries` returns at most `functions.top_queries.limit` query patterns (500) from the last
              `functions.top_queries.time_window_days` days (7), with query text cut at 4096 characters. `error-info`
              returns at most the same number of rows. `deadlock-info` returns only the most recent deadlock.
        performance_impact:
          description: |
            Negligible on the Agent host. On the monitored instance, each collection runs about 20 to 30 lightweight
            queries on one connection against in-memory counters and system views; the per-database and Always On
            queries grow with the number of databases and replicas but typically finish in milliseconds. Raise
            `update_every` to lower the query rate.

            Functions are heavier and run only when requested: `top-queries` aggregates Query Store runtime statistics
            or scans the plan cache, and `error-info` and `deadlock-info` read Extended Events files, which for the
            built-in `system_health` session can hold about 1 GB. They use a separate connection but compete with your
            workload for SQL Server CPU and I/O. Lower `functions.top_queries.time_window_days`, or set
            `functions.<name>.disabled: yes` for Functions you do not need.
      additional_permissions:
        description: |
          The monitoring login needs these grants. `VIEW SERVER STATE` is the only mandatory one; without an optional
          grant the collector keeps running and omits the affected charts.

          | Grant | Needed for |
          |:------|:-----------|
          | `VIEW SERVER STATE` | All metrics (dynamic management views and performance counters). On SQL Server 2022 and later the narrower `VIEW SERVER PERFORMANCE STATE` can be granted instead. |
          | `VIEW ANY DEFINITION` | Data file size and I/O stall values (read through `sys.master_files`; without it those charts exist but stay empty) and Always On Availability Group charts (availability group catalog views) |
          | `SELECT` on `msdb.dbo.sysjobs` | SQL Server Agent job status chart |
          | `SELECT` on `msdb.dbo.sysjobhistory` and `msdb.dbo.sysjobactivity` | SQL Server Agent job execution charts |
          | `SELECT` on `distribution.dbo.MSreplication_monitordata`, `MSpublications` and `MSsubscriptions` | Replication charts (distributor instances only) |
          | `VIEW DATABASE STATE` (SQL Server 2016 to 2019) or `VIEW DATABASE PERFORMANCE STATE` (2022 and later) in each user database | `top-queries` reading Query Store; see the Function's prerequisites under Live Data |

          The login only reads. No `ALTER`, `EXECUTE`, or write permission is needed.
      supported_platforms:
        include: []
        exclude: []
    setup:
      prerequisites:
        list:
          - title: Create a monitoring login
            description: |
              For SQL authentication, create a login with the grants below. Skip this step if you use Windows
              Authentication or Microsoft Entra ID (next steps). SQL logins need the instance to run in mixed
              authentication mode ("SQL Server and Windows Authentication mode").

              ```sql
              CREATE LOGIN netdata_user WITH PASSWORD = 'YourStrongPassword!';
              GRANT VIEW SERVER STATE TO netdata_user;
              -- Data file sizes, I/O stall, and Always On Availability Groups
              GRANT VIEW ANY DEFINITION TO netdata_user;

              -- SQL Server Agent jobs (skip on Express, which has no Agent)
              USE msdb;
              CREATE USER netdata_user FOR LOGIN netdata_user;
              GRANT SELECT ON dbo.sysjobs TO netdata_user;
              GRANT SELECT ON dbo.sysjobhistory TO netdata_user;
              GRANT SELECT ON dbo.sysjobactivity TO netdata_user;

              -- Replication (distributor instances only)
              USE distribution;
              CREATE USER netdata_user FOR LOGIN netdata_user;
              GRANT SELECT ON dbo.MSreplication_monitordata TO netdata_user;
              GRANT SELECT ON dbo.MSpublications TO netdata_user;
              GRANT SELECT ON dbo.MSsubscriptions TO netdata_user;
              ```

              To verify, run the collector's first query as the new login; it must return a row:

              ```sql
              EXECUTE AS LOGIN = 'netdata_user';
              SELECT TOP 1 counter_name FROM sys.dm_os_performance_counters;
              REVERT;
              ```
          - title: Grant Windows Authentication access
            description: |
              Only when the DSN carries no username and password (Windows only). The Netdata service then authenticates
              with its own Windows account, `Local System` by default, and that account needs a SQL Server login.

              For an instance on the same machine, `Local System` is seen as `NT AUTHORITY\SYSTEM`:

              ```sql
              CREATE LOGIN [NT AUTHORITY\SYSTEM] FROM WINDOWS;
              GRANT VIEW SERVER STATE TO [NT AUTHORITY\SYSTEM];
              GRANT VIEW ANY DEFINITION TO [NT AUTHORITY\SYSTEM];
              USE msdb;
              CREATE USER [NT AUTHORITY\SYSTEM] FOR LOGIN [NT AUTHORITY\SYSTEM];
              GRANT SELECT ON dbo.sysjobs TO [NT AUTHORITY\SYSTEM];
              GRANT SELECT ON dbo.sysjobhistory TO [NT AUTHORITY\SYSTEM];
              GRANT SELECT ON dbo.sysjobactivity TO [NT AUTHORITY\SYSTEM];
              ```

              For an instance on another machine, a domain-joined Netdata host is seen as its computer account,
              `DOMAIN\COMPUTERNAME$` (for example `MYDOM\SQLBOX01$`):

              ```sql
              CREATE LOGIN [DOMAIN\COMPUTERNAME$] FROM WINDOWS;
              GRANT VIEW SERVER STATE TO [DOMAIN\COMPUTERNAME$];
              GRANT VIEW ANY DEFINITION TO [DOMAIN\COMPUTERNAME$];
              USE msdb;
              CREATE USER [DOMAIN\COMPUTERNAME$] FOR LOGIN [DOMAIN\COMPUTERNAME$];
              GRANT SELECT ON dbo.sysjobs TO [DOMAIN\COMPUTERNAME$];
              GRANT SELECT ON dbo.sysjobhistory TO [DOMAIN\COMPUTERNAME$];
              GRANT SELECT ON dbo.sysjobactivity TO [DOMAIN\COMPUTERNAME$];
              ```

              `Local System` cannot authenticate to a remote instance from a workgroup machine. Run the Netdata service
              as a domain account instead, or use a SQL login. To see which account SQL Server receives, connect with
              Windows Authentication and run `SELECT SYSTEM_USER`.
          - title: Grant a Microsoft Entra identity access to Azure SQL Managed Instance
            description: |
              Only when `cloud_auth.provider` is `azure_ad`. The service principal or managed identity that Netdata
              signs in with needs a login created from the external provider, named after the app registration or the
              managed identity. Create database users and grant the optional database permissions listed above for
              SQL Server Agent jobs and replication. See Microsoft's guide to
              [Microsoft Entra authentication for Azure SQL](https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure).

              ```sql
              -- Azure SQL Managed Instance
              CREATE LOGIN [netdata-monitoring] FROM EXTERNAL PROVIDER;
              GRANT VIEW SERVER STATE TO [netdata-monitoring];
              GRANT VIEW ANY DEFINITION TO [netdata-monitoring];
              ```
      configuration:
        file:
          name: go.d/mssql.conf
        options:
          description: |
            The following options can be defined globally: `update_every`, `autodetection_retry`.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              description: Data collection interval, in seconds.
              default_value: 10
              required: false
              group: Base
            - name: autodetection_retry
              description: How often to retry the initial connection when the job fails to start, in seconds. Zero disables retries.
              default_value: 0
              required: false
              group: Base
            - name: dsn
              description: Connection string in [go-mssqldb DSN format](https://github.com/microsoft/go-mssqldb#connection-parameters-and-dsn), such as `sqlserver://user:password@host:1433`. With `cloud_auth.provider` set to `azure_ad`, only the `sqlserver://` URL form is accepted.
              default_value: "sqlserver://localhost:1433"
              required: true
              group: Base
              detailed_description: |
                The URL form covers the common cases:

                | Scenario | DSN |
                |:---------|:----|
                | SQL login | `sqlserver://netdata_user:password@host:1433` |
                | Windows Authentication (Windows only) | `sqlserver://host:1433`, with no username and password |
                | Named instance | `sqlserver://netdata_user:password@host/INSTANCENAME`; the SQL Server Browser service must be reachable |
                | Azure SQL Managed Instance (private endpoint) | `sqlserver://my-instance.dns-zone.database.windows.net:1433?database=master` |
                | Encrypted connection to a trusted certificate | append `?encrypt=true` |

                The password may come from a secret store instead of the file, for example `${env:MSSQL_PASSWORD}`.
                Percent-encode reserved characters in a literal password (`@` as `%40`).
            - name: timeout
              description: Query timeout, in seconds.
              default_value: 5
              required: false
              group: Base
            - name: vnode
              description: Associates this job with a [Virtual Node](https://learn.netdata.cloud/docs/netdata-agent/configuration/organize-systems-metrics-and-alerts#virtual-nodes).
              default_value: ""
              required: false
              group: Base

            - name: collect_disabled_jobs
              description: Also create execution charts for disabled SQL Server Agent jobs. The enabled/disabled status chart always covers every job.
              default_value: false
              required: false
              group: SQL Agent
              detailed_description: |
                Each disabled job then gets the same four execution charts as an enabled one: last execution status,
                duration, age, and current run time. The stock last-execution alerts still fire only for enabled jobs.

            - name: cloud_auth.provider
              description: Authentication provider for Azure SQL Managed Instance. `none` uses the credentials in `dsn`; `azure_ad` signs in with a Microsoft Entra ID token.
              default_value: none
              required: false
              group: Cloud Auth
            - name: cloud_auth.azure_ad.mode
              description: How Netdata obtains the Microsoft Entra ID token. `service_principal` uses an app registration with a client secret, `managed_identity` the identity of the Azure resource running Netdata, and `default` the Azure SDK credential chain.
              default_value: default
              required: true
              group: Cloud Auth
              detailed_description: |
                Required in the configuration file whenever `cloud_auth.provider` is `azure_ad`; the configuration form
                preselects `default`. The `default` chain tries environment credentials, a managed identity, and local
                developer sign-ins in turn, which suits development more than production.
            - name: cloud_auth.azure_ad.mode_service_principal.tenant_id
              description: Directory (tenant) ID of the Microsoft Entra tenant that holds the service principal. Required in `service_principal` mode.
              default_value: ""
              required: false
              group: Cloud Auth
            - name: cloud_auth.azure_ad.mode_service_principal.client_id
              description: Application (client) ID of the service principal. Required in `service_principal` mode.
              default_value: ""
              required: false
              group: Cloud Auth
            - name: cloud_auth.azure_ad.mode_service_principal.client_secret
              description: Client secret of the service principal. Required in `service_principal` mode.
              default_value: ""
              required: false
              group: Cloud Auth
            - name: cloud_auth.azure_ad.mode_managed_identity.client_id
              description: Client ID of a user-assigned managed identity. Leave empty to use the system-assigned identity of the Azure resource.
              default_value: ""
              required: false
              group: Cloud Auth

            - name: functions.top_queries.disabled
              description: Disable the top-queries Function.
              default_value: false
              required: false
              group: Functions
            - name: functions.top_queries.timeout
              description: Query timeout for top-queries requests, in seconds, independent of the metrics `timeout`. Zero uses the built-in 30 seconds.
              default_value: 30
              required: false
              group: Functions
            - name: functions.top_queries.limit
              description: Maximum number of query patterns top-queries returns. Zero uses the built-in 500.
              default_value: 500
              required: false
              group: Functions
              detailed_description: |
                The same limit caps the number of rows `error-info` returns.
            - name: functions.top_queries.time_window_days
              description: Days of query statistics top-queries covers. Zero uses the built-in 7 days; -1 covers all retained history.
              default_value: 7
              required: false
              group: Functions
              detailed_description: |
                With Query Store, the window selects the runtime statistics intervals to aggregate. On the plan-cache
                fallback it keeps only plans executed within the window, because the plan cache has no interval
                history. Shorter windows make the query cheaper on busy servers.
            - name: functions.deadlock_info.disabled
              description: Disable the deadlock-info Function.
              default_value: false
              required: false
              group: Functions
            - name: functions.deadlock_info.timeout
              description: Query timeout for deadlock-info requests, in seconds, independent of the metrics `timeout`. Zero uses the built-in 30 seconds.
              default_value: 30
              required: false
              group: Functions
            - name: functions.deadlock_info.use_ring_buffer
              description: Read deadlock reports from the ring_buffer target of the built-in `system_health` session instead of its event_file target.
              default_value: false
              required: false
              group: Functions
              detailed_description: |
                The ring buffer is volatile: its contents are lost on restart or failover and its capacity is small, so
                older deadlocks disappear sooner than from the event files, and parsing it costs more CPU on the server.
                Applies to SQL Server and Azure SQL Managed Instance. Azure SQL Database has no `system_health`
                session, so `deadlock-info` is unavailable there regardless of this option.
            - name: functions.error_info.disabled
              description: Disable the error-info Function.
              default_value: false
              required: false
              group: Functions
            - name: functions.error_info.timeout
              description: Query timeout for error-info requests, in seconds, independent of the metrics `timeout`. Zero uses the built-in 30 seconds.
              default_value: 30
              required: false
              group: Functions
            - name: functions.error_info.session_name
              description: Name of the server-scoped Extended Events session that captures `error_reported` events.
              default_value: netdata_errors
              required: false
              group: Functions
              detailed_description: |
                Create the session as described under Live Data. When it is missing or its target is unavailable, SQL
                Server and Managed Instance fall back to the built-in `system_health` session, which records only
                selected errors.
            - name: functions.error_info.use_ring_buffer
              description: Read error events from the session's ring_buffer target instead of its event_file target.
              default_value: false
              required: false
              group: Functions
              detailed_description: |
                Use it where event files cannot be stored, such as Managed Instance without configured Blob Storage. The session
                must be running; events are lost on restart or failover, capacity is limited, and XML parsing costs more
                CPU than reading event files.
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Basic configuration
              description: A local instance with a SQL login.
              config: |
                jobs:
                  - name: local
                    dsn: "sqlserver://netdata_user:password@localhost:1433"
            - name: Windows Authentication
              description: |
                A local instance on Windows, signing in as the Netdata service account. Leave the username and password
                out of the DSN and complete the [Grant Windows Authentication access](#grant-windows-authentication-access)
                prerequisite.
              config: |
                jobs:
                  - name: local
                    dsn: "sqlserver://localhost:1433"
            - name: Named instance
              description: A named instance, resolved through the SQL Server Browser service.
              config: |
                jobs:
                  - name: named_instance
                    dsn: "sqlserver://netdata_user:password@localhost/INSTANCENAME"
            - name: Remote server
              description: An instance on another host, reachable on TCP port 1433.
              config: |
                jobs:
                  - name: remote
                    dsn: "sqlserver://netdata_user:password@192.168.1.100:1433"
            - name: Azure SQL Managed Instance with a service principal
              description: |
                A managed instance, authenticated with a Microsoft Entra app registration through its private endpoint.
                Replace the hostname with the managed instance's fully qualified domain name.
              config: |
                jobs:
                  - name: azure_sql_sp
                    dsn: "sqlserver://my-instance.dns-zone.database.windows.net:1433?database=master"
                    cloud_auth:
                      provider: azure_ad
                      azure_ad:
                        mode: service_principal
                        mode_service_principal:
                          tenant_id: "00000000-0000-0000-0000-000000000000"
                          client_id: "11111111-1111-1111-1111-111111111111"
                          client_secret: "${env:AZURE_CLIENT_SECRET}"
            - name: Azure SQL Managed Instance with a managed identity
              description: |
                Netdata runs on an Azure resource and signs in with its system-assigned managed identity. Set
                `mode_managed_identity.client_id` to use a user-assigned identity instead.
              config: |
                jobs:
                  - name: azure_sql_mi
                    dsn: "sqlserver://my-instance.dns-zone.database.windows.net:1433?database=master"
                    cloud_auth:
                      provider: azure_ad
                      azure_ad:
                        mode: managed_identity
            - name: Multi-instance
              description: |
                > **Note**: When you define multiple jobs, their names must be unique.

                Several instances monitored by one Agent.
              config: |
                jobs:
                  - name: production
                    dsn: "sqlserver://netdata_user:password@prod-sql:1433"

                  - name: development
                    dsn: "sqlserver://netdata_user:password@dev-sql:1433"
            - name: Metrics only, no Functions
              description: |
                The Functions return raw query text, which can contain personal or business data. Disable them where
                the dashboard audience must not see it.
              config: |
                jobs:
                  - name: local
                    dsn: "sqlserver://netdata_user:password@localhost:1433"
                    functions:
                      top_queries:
                        disabled: yes
                      deadlock_info:
                        disabled: yes
                      error_info:
                        disabled: yes
            - name: Custom Extended Events session for error-info
              description: |
                The error capture session was created under a name other than `netdata_errors`, with a ring_buffer
                target.
              config: |
                jobs:
                  - name: local
                    dsn: "sqlserver://netdata_user:password@localhost:1433"
                    functions:
                      error_info:
                        session_name: app_errors
                        use_ring_buffer: yes
    troubleshooting:
      errors:
        list:
          - error: "`check failed: error pinging database: unable to open tcp connection with host 'localhost:1433': dial tcp [::1]:1433: connect: connection refused`"
            when: |
              At job start, before any metric is collected. The message ends with the address the driver dialed.
            cause: |
              Nothing accepts TCP connections at the address and port in `dsn`. SQL Server may have the TCP/IP protocol
              disabled, listen on another port, or sit behind a firewall that blocks port 1433.
            fix: |
              Enable TCP/IP in SQL Server Configuration Manager and restart the instance, or point `dsn` at the port the
              instance uses. Find it from a working session with:

              ```sql
              SELECT local_tcp_port FROM sys.dm_exec_connections WHERE session_id = @@SPID;
              ```
          - error: "`check failed: error pinging database: no instance matching 'INSTANCENAME' returned from host 'localhost'`"
            when: |
              The DSN names an instance (`host/INSTANCENAME`) instead of a port.
            cause: |
              Named instances are resolved through the SQL Server Browser service on UDP port 1434. The service is
              stopped, the port is blocked, or no instance of that name exists on the host.
            fix: |
              Check the instance name, start the SQL Server Browser service, or give the instance a static TCP port and
              use `host:port` in `dsn`.
          - error: "`check failed: error pinging database: mssql: Login failed for user 'netdata_user'. (18456)`"
            cause: |
              The login or password in `dsn` is wrong, the login does not exist on this instance, or the instance
              accepts Windows Authentication only and rejects every SQL login.
            fix: |
              Check the credentials and that the login exists. For SQL logins, switch the instance to "SQL Server and
              Windows Authentication mode" (Server Properties, Security) and restart it. The SQL Server error log
              records the reason for every failed login.
          - error: "`check failed: error pinging database: mssql: Login failed for user 'NT AUTHORITY\\ANONYMOUS LOGON'. (18456)`"
            when: |
              Windows Authentication (no credentials in `dsn`) against an instance on another machine.
            cause: |
              The Netdata service runs as `Local System` on a machine that is not in the instance's domain, so it cannot
              present a Windows identity over the network.
            fix: |
              Join the Netdata host to the domain and grant its computer account as described under Prerequisites, run
              the Netdata service as a domain account with a SQL Server login, or use a SQL login in `dsn`.
          - error: "`check failed: batch requests query failed: mssql: VIEW SERVER PERFORMANCE STATE permission was denied on object 'server', database 'master'. (300)`"
            when: |
              At job start, right after the connection succeeded. A second line, `mssql: The user does not have
              permission to perform this action. (297)`, follows. SQL Server 2019 and earlier name `VIEW SERVER STATE`
              instead.
            cause: |
              The login lacks `VIEW SERVER STATE`, so the first performance counter query is rejected and the job does
              not start.
            fix: |
              ```sql
              GRANT VIEW SERVER STATE TO netdata_user;
              ```

              On SQL Server 2022 and later, `GRANT VIEW SERVER PERFORMANCE STATE` is enough for the metrics.
          - error: "`SQL Server Agent jobs query failed; job metrics will be unavailable: mssql: The SELECT permission was denied on the object 'sysjobs', database 'msdb', schema 'dbo'. (229)`"
            cause: |
              The login has no access to the SQL Server Agent tables in `msdb`. Every other metric keeps being collected;
              the message is logged once.
            fix: |
              ```sql
              USE msdb;
              CREATE USER netdata_user FOR LOGIN netdata_user;
              GRANT SELECT ON dbo.sysjobs TO netdata_user;
              GRANT SELECT ON dbo.sysjobhistory TO netdata_user;
              GRANT SELECT ON dbo.sysjobactivity TO netdata_user;
              ```
          - error: "Some SQL Server Agent jobs have only a status chart, or no charts at all"
            cause: |
              Disabled jobs get execution charts only when `collect_disabled_jobs` is set. On Express there is no SQL
              Server Agent, so no job charts exist at all. Missing `SELECT` on `msdb.dbo.sysjobhistory` or
              `msdb.dbo.sysjobactivity` removes the execution charts for every job.
            fix: |
              Set `collect_disabled_jobs: yes` for disabled jobs, or grant the two missing `msdb` permissions.
          - error: "No Always On Availability Group charts appear although Always On is enabled"
            cause: |
              The availability group catalog views return rows only to logins with `VIEW ANY DEFINITION`; without it the
              queries succeed with no rows and nothing is logged. The same grant feeds the data file size and I/O stall
              charts through `sys.master_files`, so those exist but stay empty.
            fix: |
              ```sql
              GRANT VIEW ANY DEFINITION TO netdata_user;
              ```
          - error: "`top-queries requires VIEW SERVER STATE for the plan cache, or VIEW DATABASE STATE in every queried user database for Query Store`"
            when: |
              Opening `top-queries` in the dashboard; the response is HTTP 403. On SQL Server 2022 and later the message
              names `VIEW SERVER PERFORMANCE STATE` and `VIEW DATABASE PERFORMANCE STATE`.
            cause: |
              The login can collect metrics but lacks the permission the query statistics source needs: Query Store is
              read per database, the plan cache at server level.
            fix: |
              Grant the permission the message names, following the `top-queries` prerequisites under Live Data. For
              Query Store, the login needs a user and the database-level grant in every user database it should cover.
          - error: "`deadlock-info requires VIEW SERVER STATE permission. Grant with: GRANT VIEW SERVER STATE TO [netdata_user];`"
            when: |
              Opening `deadlock-info` in the dashboard; the response is HTTP 403. On SQL Server 2022 and later the message
              names `VIEW SERVER PERFORMANCE STATE`.
            cause: |
              Reading the `system_health` Extended Events session needs the server-level state permission the message
              names.
            fix: |
              Run the `GRANT` statement from the message as an administrator.
          - error: "`error-info requires VIEW SERVER STATE permission. Grant with: GRANT VIEW SERVER STATE TO [netdata_user];`"
            when: |
              Opening `error-info` in the dashboard; the response is HTTP 403. The message names `VIEW SERVER PERFORMANCE
              STATE` on SQL Server 2022 and later.
            cause: |
              Reading the Extended Events session target needs the state permission the message names, at the scope of
              the session.
            fix: |
              Run the `GRANT` statement from the message as an administrator.
          - error: "`error-info not enabled: Extended Events session not found or event_file target missing`"
            when: |
              Opening `error-info` in the dashboard; the response is HTTP 503. With `functions.error_info.use_ring_buffer`
              set, the message ends in `ring_buffer target missing`.
            cause: |
              No Extended Events session named by `functions.error_info.session_name` exists with the expected target,
              and no `system_health` fallback is available.
            fix: |
              Create the session as described in the `error-info` prerequisites under Live Data, or set
              `functions.error_info.session_name` to the name of an existing session and
              `functions.error_info.use_ring_buffer` to match its target.
          - error: "`top_queries query timed out; Function timeout is 30s (functions.top_queries.timeout), but the request deadline may be shorter`"
            when: |
              Any Function; the response is HTTP 504 and the message names the Function and its timeout option.
            cause: |
              The diagnostic query did not finish within `functions.<name>.timeout`: a large Query Store history, a big
              plan cache, or gigabytes of `system_health` event files to scan.
            fix: |
              Raise `functions.<name>.timeout`, and for `top-queries` lower `functions.top_queries.time_window_days` or
              `functions.top_queries.limit`. For `error-info`, create the dedicated session from the prerequisites so
              the read stays within its small rollover files instead of the `system_health` history.
    alerts:
      - name: mssql_database_log_percent_used
        metric: mssql.database_log_percent_used
        info: SQL Server transaction log percent used has been above 90% for the last 15 minutes
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/mssql.conf
      - name: mssql_sql_agent_job_last_execution_warning
        metric: mssql.job_last_execution_status
        info: Enabled SQL Server Agent job succeeded, but at least one step failed in the last completed execution
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/mssql.conf
      - name: mssql_sql_agent_job_last_execution_failed
        metric: mssql.job_last_execution_status
        info: Enabled SQL Server Agent job failed in the last completed execution
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/mssql.conf
    functions:
      description: |
        Three Functions run diagnostic queries on demand from the dashboard's Live tab. They keep the metrics
        connection available, but share SQL Server CPU, I/O and locks. They return raw query text, so restrict
        access to people who may see it.
      list:
        - id: top-queries
          name: Top Queries
          description: |
            Retrieves aggregated SQL query performance metrics from Microsoft SQL Server, preferring [Query Store](https://learn.microsoft.com/en-us/sql/relational-databases/performance/monitoring-performance-by-using-the-query-store) runtime statistics and falling back to the plan cache.

            With Query Store, this function queries `sys.query_store_runtime_stats` and related views across all databases with Query Store enabled, aggregating execution statistics by query hash. It provides comprehensive timing, I/O, memory, and parallelism metrics.

            Query Store was introduced in SQL Server 2016 (13.x). When it is missing or turned off everywhere, the function falls back to [`sys.dm_exec_query_stats`](https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-exec-query-stats-transact-sql), the plan cache, and the `Source` column reports which store answered. The plan cache differs in important ways:

            - It only covers plans that are cached right now. Statistics are lost on restart, recompilation, memory pressure, or `DBCC FREEPROCCACHE`, so they are not query history.
            - Rows are aggregated by query hash across the whole instance, not per database. `Database` is selected from the cached statements (currently the minimum value), so it is not reliable per-database attribution when the same query hash occurs in multiple databases, and it is empty for ad-hoc or prepared batches that carry no database context.
            - Standard deviation, memory grant, log bytes, and tempdb usage metrics are unavailable on the plan-cache source, so their columns are omitted. Plan-shape columns (hash match joins, merge joins, nested loops, sorts) remain present with empty values.
            - `time_window_days` filters on last execution time instead of aggregating a period, because the plan cache keeps no interval history.

            Use cases:
            - Identify slow or resource-intensive queries consuming excessive CPU time or memory
            - Analyze I/O patterns (logical reads, physical reads, writes) to detect bottlenecks
            - Monitor parallelism (DOP) and tempdb usage for capacity planning

            Query text is truncated at 4096 characters. Columns that the active source or SQL Server release does not provide are omitted.
          parameters:
            - id: __sort
              name: Filter By
              description: Select the primary sort column. The available options depend on your SQL Server version and include metrics like total execution time, number of calls, CPU time, logical I/O, memory grants, and more. Default is Total Time to focus on most resource-intensive queries.
              type: select
              required: true
              default: totalTime
              options: []
          returns:
            description: Aggregated query execution statistics from Query Store runtime views, or from the plan cache when Query Store is unavailable, providing performance analysis across all monitored databases. Each row represents a unique query pattern (normalized query hash) with cumulative metrics across all its executions.
            columns:
              - name: Source
                type: string
                unit: ""
                visibility: hidden
                description: "Statistics store that produced the row: query-store or plan-cache. Hidden while Query Store answers; shown on the plan-cache fallback, where the numbers cover only currently cached plans."
              - name: Query Hash
                type: string
                unit: ""
                visibility: hidden
                description: Unique hash identifier for the normalized query pattern. Queries with identical structure but different literal values share the same digest.
              - name: Query
                type: string
                unit: ""
                description: The SQL query text with literal values truncated at 4096 characters. Use this to identify the actual SQL being executed and spot parameterized queries or injection risks.
              - name: Database
                type: string
                unit: ""
                description: Database name where the query was executed. Essential for multi-database analysis to identify which database is experiencing query load.
              - name: Calls
                type: integer
                unit: ""
                description: Total number of times this query pattern has been executed. High values indicate frequently run queries that may impact server performance significantly.
              - name: Error Attribution
                type: string
                unit: ""
                description: "Status of error detail attribution for this query. Values: enabled, no_data, not_enabled, not_supported."
              - name: Error Number
                type: integer
                unit: ""
                description: "Most recent error number observed for this query (when error attribution is enabled)."
              - name: Error State
                type: integer
                unit: ""
                visibility: hidden
                description: "SQL Server error state for the most recent error (when error attribution is enabled)."
              - name: Error Message
                type: string
                unit: ""
                description: "Most recent error message for this query (when error attribution is enabled)."
              - name: Hash Match Joins
                type: integer
                unit: ""
                description: "Count of Hash Match join operators across all stored plans for this query."
              - name: Merge Joins
                type: integer
                unit: ""
                description: "Count of Merge Join operators across all stored plans for this query."
              - name: Nested Loops
                type: integer
                unit: ""
                description: "Count of Nested Loops operators across all stored plans for this query."
              - name: Sorts
                type: integer
                unit: ""
                description: "Count of Sort operators across all stored plans for this query."
              - name: Total Time
                type: duration
                unit: "milliseconds"
                description: Cumulative execution time across all query executions. This is a key metric for identifying the most resource-intensive queries in terms of total server time consumption.
              - name: Avg Time
                type: duration
                unit: "milliseconds"
                description: Average execution time per query run, calculated as weighted average when execution count is greater than zero. Compare with Total Time to determine if individual executions or high frequency drives resource usage.
              - name: Last Time
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Execution time of the most recent execution for this query pattern. Useful for identifying recent performance changes or individual outlier executions.
              - name: Min Time
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Minimum execution time observed. Helps identify variability in query performance and spot potential optimization opportunities for outliers.
              - name: Max Time
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Maximum execution time observed. Large gaps between Min Time and Max Time may indicate performance instability due to parameter sniffing, data skew, or lock contention.
              - name: StdDev Time
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Standard deviation of execution time. High values indicate inconsistent query performance, making capacity planning difficult and suggesting need for query optimization or consistent indexing.
              - name: Avg CPU
                type: duration
                unit: "milliseconds"
                description: Average CPU time consumed per query execution. High values indicate CPU-intensive operations that may include complex calculations, string manipulations, or excessive function calls. Available in SQL Server 2016+.
              - name: Last CPU
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: CPU time of the most recent execution. Useful for identifying recent changes in query patterns and resource usage.
              - name: Min CPU
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Minimum CPU time observed. Helps identify variability in CPU consumption and spot efficient vs. inefficient query executions.
              - name: Max CPU
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Maximum CPU time observed. Spikes may indicate complex queries, large result sets, or parallelism issues.
              - name: StdDev CPU
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Standard deviation of CPU time. High variability suggests inconsistent performance due to varying data volumes, plan cache hit rates, or changing execution contexts.
              - name: Avg Logical Reads
                type: float
                unit: ""
                description: Average number of logical read operations (8KB pages) per execution. High values indicate queries scanning large amounts of data through indexes or table scans. Monitor for I/O subsystem impact.
              - name: Last Logical Reads
                type: integer
                unit: ""
                visibility: hidden
                description: Logical reads from the most recent execution. Useful for identifying immediate query patterns and recent performance changes.
              - name: Min Logical Reads
                type: integer
                unit: ""
                visibility: hidden
                description: Minimum logical reads observed. Helps identify data access patterns and spot outliers.
              - name: Max Logical Reads
                type: integer
                unit: ""
                visibility: hidden
                description: Maximum logical reads observed. Very high values may indicate full table scans, missing indexes, or inefficient join operations requiring excessive data access.
              - name: StdDev Logical Reads
                type: float
                unit: ""
                visibility: hidden
                description: Standard deviation of logical reads. High variability suggests inconsistent access patterns, potentially indicating performance issues with certain queries or data volumes.
              - name: Avg Logical Writes
                type: float
                unit: ""
                description: Average number of logical write operations per execution. High values indicate heavy write workloads that may benefit from batching or optimization.
              - name: Last Logical Writes
                type: integer
                unit: ""
                visibility: hidden
                description: Logical writes from the most recent execution. Helps track recent write activity and identify immediate performance impact.
              - name: Min Logical Writes
                type: integer
                unit: ""
                visibility: hidden
                description: Minimum logical writes observed. Helps identify read-heavy vs. write-heavy query patterns and data access characteristics.
              - name: Max Logical Writes
                type: integer
                unit: ""
                visibility: hidden
                description: Maximum logical writes observed. Spikes may indicate bulk insert/update operations, large transactions, or data migration activities.
              - name: StdDev Logical Writes
                type: float
                unit: ""
                visibility: hidden
                description: Standard deviation of logical writes. High values indicate write performance variability, potentially suggesting inconsistent transaction sizes or periodic bulk operations.
              - name: Avg Physical Reads
                type: float
                unit: ""
                description: Average number of physical read operations from storage per execution. High values indicate queries requiring substantial disk I/O for data retrieval, potentially due to full table scans or missing covering indexes.
              - name: Last Physical Reads
                type: integer
                unit: ""
                visibility: hidden
                description: Physical reads from the most recent execution. Useful for identifying immediate I/O patterns and recent storage subsystem pressure.
              - name: Min Physical Reads
                type: integer
                unit: ""
                visibility: hidden
                description: Minimum physical reads observed. Helps baseline I/O patterns and identify read-intensive query scenarios.
              - name: Max Physical Reads
                type: integer
                unit: ""
                visibility: hidden
                description: Maximum physical reads observed. Extremely high values may indicate storage subsystem bottlenecks, full table scans without covering indexes, or queries processing very large data volumes.
              - name: StdDev Physical Reads
                type: float
                unit: ""
                visibility: hidden
                description: Standard deviation of physical reads. High variability suggests inconsistent disk access patterns, potentially indicating intermittent I/O performance issues or storage contention.
              - name: Avg CLR Time
                type: duration
                unit: "milliseconds"
                description: Average CLR (Common Language Runtime) time per execution. High values indicate managed code (stored procedures, functions, triggers) with heavy computations, garbage collection pressure, or inefficient memory allocations. Available in SQL Server 2016+.
              - name: Last CLR Time
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: CLR time of the most recent execution. Useful for identifying recent managed code performance changes and detecting inefficient code deployments.
              - name: Min CLR Time
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Minimum CLR time observed. Helps identify efficient managed code executions and spot expensive CLR operations.
              - name: Max CLR Time
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Maximum CLR time observed. Spikes may indicate complex managed code operations, large object allocations, or expensive .NET framework method calls.
              - name: StdDev CLR Time
                type: duration
                unit: "milliseconds"
                visibility: hidden
                description: Standard deviation of CLR time. High variability suggests inconsistent managed code execution patterns, potentially varying by execution parameters, data volumes, or different code paths being taken.
              - name: Avg DOP
                type: float
                unit: ""
                description: Average Degree of Parallelism (DOP) per query. Higher values indicate queries utilizing more CPU cores through parallelism, potentially consuming significant server resources. Values above 1 indicate intra-query parallelism; values of 1 indicate serial execution.
              - name: Last DOP
                type: integer
                unit: ""
                visibility: hidden
                description: DOP of the most recent execution. Helps track recent parallelism patterns and identify changes in query execution behavior.
              - name: Min DOP
                type: integer
                unit: ""
                visibility: hidden
                description: Minimum DOP observed. Values of 0 may indicate serial execution; values above 1 suggest parallel query execution within individual queries.
              - name: Max DOP
                type: integer
                unit: ""
                visibility: hidden
                description: Maximum DOP observed. Very high values (>4) may indicate aggressive parallelism consuming excessive resources and potentially affecting concurrent workloads. Available in SQL Server 2016+.
              - name: StdDev DOP
                type: float
                unit: ""
                visibility: hidden
                description: Standard deviation of DOP. High variability suggests inconsistent parallelism patterns across executions, potentially indicating performance variability based on data characteristics or query complexity.
              - name: Avg Memory (8KB pages)
                type: float
                unit: ""
                description: Average memory grant (in 8KB pages) per execution. High values indicate memory-intensive queries that may benefit from index optimization, reduced result sets, or query tuning to reduce working memory usage.
              - name: Last Memory (8KB pages)
                type: integer
                unit: ""
                visibility: hidden
                description: Memory grant from the most recent execution. Useful for identifying recent memory pressure and tracking immediate impact of resource-intensive queries.
              - name: Min Memory (8KB pages)
                type: integer
                unit: ""
                visibility: hidden
                description: Minimum memory grant observed. Helps identify memory-efficient queries and baseline memory requirements for common operations.
              - name: Max Memory (8KB pages)
                type: integer
                unit: ""
                visibility: hidden
                description: Maximum memory grant observed. Spikes may indicate queries with large sort operations, hash joins, temporary table creation, or excessive parameter lengths consuming working memory.
              - name: StdDev Memory
                type: float
                unit: ""
                visibility: hidden
                description: Standard deviation of memory grants. High variability suggests inconsistent memory usage patterns, potentially varying by execution parameters, result set sizes, or different code paths being executed.
              - name: Avg Rows
                type: float
                unit: ""
                description: Average number of rows processed per query execution. High values indicate queries returning large result sets that may consume significant network bandwidth, memory for result buffers, and client application resources.
              - name: Last Rows
                type: integer
                unit: ""
                visibility: hidden
                description: Row count from the most recent execution. Helps identify recent query patterns and track immediate data processing requirements.
              - name: Min Rows
                type: integer
                unit: ""
                visibility: hidden
                description: Minimum rows observed. Helps identify data access patterns and spot outliers in result set sizes.
              - name: Max Rows
                type: integer
                unit: ""
                visibility: hidden
                description: Maximum rows observed. Extremely high values may indicate full table scans without WHERE clauses, missing or inefficient filters, or data export operations.
              - name: StdDev Rows
                type: float
                unit: ""
                visibility: hidden
                description: Standard deviation of rows processed. High variability suggests inconsistent result set sizes, potentially due to varying query filters, parameterized inputs, or different data distributions across executions.
              - name: Avg Log Bytes
                type: float
                unit: ""
                description: Average transaction log bytes written per query execution (SQL Server 2017+). High values indicate write-intensive operations (INSERT/UPDATE/DELETE), large transactions, or bulk modifications. This measures WAL activity, not diagnostic logging.
              - name: Last Log Bytes
                type: integer
                unit: ""
                visibility: hidden
                description: Transaction log bytes from the most recent execution. Useful for tracking recent write activity.
              - name: Min Log Bytes
                type: integer
                unit: ""
                visibility: hidden
                description: Minimum transaction log bytes observed. Helps identify write-efficient queries and baseline requirements.
              - name: Max Log Bytes
                type: integer
                unit: ""
                visibility: hidden
                description: Maximum transaction log bytes observed. Spikes may indicate bulk operations, large transactions, or queries affecting many rows.
              - name: StdDev Log Bytes
                type: float
                unit: ""
                visibility: hidden
                description: Standard deviation of transaction log bytes. High variability suggests inconsistent write patterns, potentially varying by the number of rows affected or transaction sizes.
              - name: Avg TempDB (8KB pages)
                type: float
                unit: ""
                description: Average tempdb space usage (in 8KB pages) per execution. High values indicate queries that create or use large temporary objects, work tables, sort operations, or have heavy tempdb spillage from disk. High tempdb usage can lead to disk I/O contention and overall performance degradation.
              - name: Last TempDB (8KB pages)
                type: integer
                unit: ""
                visibility: hidden
                description: Tempdb space from the most recent execution. Useful for identifying recent tempdb pressure and tracking immediate disk I/O impact of resource-intensive queries.
              - name: Min TempDB (8KB pages)
                type: integer
                unit: ""
                visibility: hidden
                description: Minimum tempdb space observed. Helps identify tempdb-efficient queries and baseline temporary object requirements for common operations.
              - name: Max TempDB (8KB pages)
                type: integer
                unit: ""
                visibility: hidden
                description: Maximum tempdb space observed. Spikes may indicate queries with large sort operations, hash joins, index spool usage, or temporary table creation consuming substantial tempdb space. Can lead to tempdb autogrow and disk space issues.
              - name: StdDev TempDB
                type: float
                unit: ""
                visibility: hidden
                description: Standard deviation of tempdb space usage. High variability suggests inconsistent temporary object usage patterns, potentially varying by query complexity, parameter types, or different data access patterns affecting temporary object creation.
          performance: |
            On SQL Server and Azure SQL Managed Instance, Query Store queries span enabled user databases; the plan-cache fallback reads cached statements across the instance.<br/>• Execution time depends on retained Query Store history or qualifying cached statements and their text<br/>• Aggregation and latest-execution selection process the matching input before the default 500-row result limit<br/>• Error attribution also reads the configured Extended Events target or the system_health fallback. On Standard/Enterprise editions, system_health can retain about 1 GB of event files, which are scanned before selecting recent errors<br/>• Functions keep the metrics connection available, but compete for SQL Server CPU, I/O and locks<br/>• Bounded by `functions.top_queries.timeout`, independent of the metrics timeout
          security: |
            Query text may contain unmasked literal values including potentially sensitive data:<br/>• Personal information in WHERE clauses or INSERT values<br/>• Business data and internal identifiers<br/>• Access should be restricted to authorized personnel only
          prerequisites:
            list:
              - title: Grant plan-cache access
                description: |
                  Query Store is optional. SQL Server 2008–2014, and newer instances without an enabled Query Store,
                  use the plan cache automatically. Grant the monitoring login the server permission for its version:

                  ```sql
                  -- SQL Server 2008–2019
                  GRANT VIEW SERVER STATE TO [netdata_user];

                  -- SQL Server 2022 and later
                  GRANT VIEW SERVER PERFORMANCE STATE TO [netdata_user];
                  ```

              - title: Enable Query Store for persistent history
                description: |
                  On SQL Server 2016 and later, enable Query Store on the databases whose persistent query history
                  you want to inspect. SQL Server and Azure SQL Managed Instance query all enabled user databases.
                  These steps are not required for the plan-cache fallback.

                  1. Verify Query Store state:

                     ```sql
                     -- SQL Server and Azure SQL Managed Instance
                     SELECT name, is_query_store_on
                     FROM sys.databases
                     WHERE name NOT IN ('master', 'tempdb', 'model', 'msdb');

                     ```

                  2. Enable Query Store where it is disabled:

                     ```sql
                     ALTER DATABASE [YourDatabaseName] SET QUERY_STORE = ON;
                     ```

                  3. Grant the monitoring account the permissions required by your engine:

                     Map the login to a database user in every queried user database before granting the database
                     permission.

                     ```sql
                     -- SQL Server 2022+ and Azure SQL Managed Instance 2022+
                     GRANT VIEW SERVER PERFORMANCE STATE TO [netdata_user];
                     USE [YourDatabaseName];
                     CREATE USER [netdata_user] FOR LOGIN [netdata_user]; -- once per database
                     GRANT VIEW DATABASE PERFORMANCE STATE TO [netdata_user];

                     -- SQL Server 2016-2019 and corresponding Managed Instance versions
                     GRANT VIEW SERVER STATE TO [netdata_user];
                     USE [YourDatabaseName];
                     CREATE USER [netdata_user] FOR LOGIN [netdata_user]; -- once per database
                     GRANT VIEW DATABASE STATE TO [netdata_user];

                     ```

                  :::info

                  - Query Store is available in SQL Server 2016+ and Azure SQL Managed Instance
                  - Requires ALTER DATABASE permission to enable Query Store
                  - Query Store queries exclude system databases (master, tempdb, model, msdb). The plan cache excludes
                    statements identified as belonging to those databases, but can include statements with unknown database context

                  :::
          availability: |
            Available when:<br/>• The collector has successfully connected<br/>• `functions.top_queries.disabled` is false<br/>• Query Store answers when the engine exposes it (SQL Server 2016 (13.x) and later, or Azure SQL Managed Instance) and it is enabled on at least one user database<br/>• Otherwise the plan cache (`sys.dm_exec_query_stats`) answers, which requires `query_hash`, available since SQL Server 2008<br/>• Returns HTTP 403 when required permissions are missing<br/>• Returns HTTP 499 when the caller cancels the request<br/>• Returns HTTP 503 if the collector is still initializing, the function is disabled, or neither Query Store nor the plan cache can answer<br/>• Returns HTTP 500 if the query fails<br/>• Returns HTTP 504 if the query times out
          require_cloud: true
        - id: deadlock-info
          name: Deadlock Info
          description: |
            Retrieves the most recent deadlock event from SQL Server's `system_health` Extended Events session (`xml_deadlock_report`).

            The deadlock graph XML is parsed to attribute the deadlock to the participating processes and their query text, lock mode, lock status, and wait resource.

            Use cases:
            - Identify which process was chosen as the deadlock victim
            - Inspect the waiting resource and lock mode involved in the deadlock
            - Correlate deadlocks with recent application changes or deployments

            Query text and wait resource strings are truncated at 4096 characters for display purposes.
          parameters: []
          returns:
            description: Parsed deadlock participants from the latest detected deadlock event. Each row represents one process involved in the deadlock.
            columns:
              - name: Row ID
                type: string
                unit: ""
                visibility: hidden
                description: "Unique row identifier composed of deadlock ID and process ID."
              - name: Deadlock ID
                type: string
                unit: ""
                description: "Identifier for the deadlock event, derived from the deadlock timestamp to group participating processes."
              - name: Timestamp
                type: timestamp
                unit: ""
                description: "Timestamp of the deadlock event from Extended Events when available; otherwise the function execution time."
              - name: Process ID
                type: string
                unit: ""
                description: "Deadlock graph process identifier for the process involved in the deadlock."
              - name: SPID
                type: integer
                unit: ""
                description: "SQL Server session ID (SPID) for the process when available."
              - name: ECID
                type: integer
                unit: ""
                description: "Execution context ID (ECID) for parallel execution contexts when available."
              - name: Victim
                type: string
                unit: ""
                description: "\"true\" when the process was chosen as the deadlock victim and rolled back; otherwise \"false\"."
              - name: Query
                type: string
                unit: ""
                description: "SQL query text for the process involved in the deadlock. Truncated to 4096 characters."
              - name: Lock Mode
                type: string
                unit: ""
                description: "Lock mode reported for the process within the deadlock graph (for example X or S)."
              - name: Lock Status
                type: string
                unit: ""
                description: "Lock status for the process. WAITING indicates the process was waiting on a lock."
              - name: Wait Resource
                type: string
                unit: ""
                description: "Lock resource identifier from the deadlock graph showing what the process was waiting on."
              - name: Database
                type: string
                unit: ""
                description: "Database name mapped from the deadlock graph database ID when available."
          performance: |
            Executes on-demand queries against the selected `system_health` event_file or ring_buffer target:<br/>• Not part of regular metric collection<br/>• Overhead is limited to function execution time and XML parsing
          security: |
            Query text and wait resource strings may include unmasked literal values including sensitive data (PII/secrets):<br/>• SQL literals such as emails, IDs, or tokens<br/>• Schema and table names that may be sensitive in some environments<br/>• Restrict dashboard access to authorized personnel only
          availability: |
            Available on SQL Server and Azure SQL Managed Instance when:<br/>• The collector has successfully connected<br/>• `functions.deadlock_info.disabled` is false<br/>• SQL Server 2022+ has `VIEW SERVER PERFORMANCE STATE`; older versions have `VIEW SERVER STATE`<br/>• Returns HTTP 200 with empty data when no deadlock is found<br/>• Returns HTTP 403 when permission is missing<br/>• Returns HTTP 499 when the caller cancels the request<br/>• Returns HTTP 500 if the query fails or the required ring-buffer target is unavailable<br/>• Returns HTTP 561 when the deadlock graph cannot be parsed<br/>• Returns HTTP 503 if the collector is still initializing or the function is disabled<br/>• Returns HTTP 504 if the query times out
          require_cloud: true
        - id: error-info
          name: Error Info
          description: |
            Retrieves recent SQL errors from a user-managed Extended Events session that captures `sqlserver.error_reported`
            with both the `sql_text` and `query_hash` actions.

            When the configured session or target is unavailable, the function falls back to the built-in `system_health`
            session on SQL Server 2012+. The `Source` column identifies which source produced each row; `system_health`
            captures only selected errors and is not a complete replacement for a dedicated error session.

            The session should be created by an administrator and include either an `event_file` target (the default) or a
            `ring_buffer` target when `functions.error_info.use_ring_buffer` is enabled. If it is unavailable, Netdata uses
            the built-in `system_health` target as a reduced-coverage fallback. Netdata returns recent error events with
            error number, message, and SQL text. The `query_hash` action is required for reliable mapping into `top-queries`
            (query text fallback is best-effort).

            Use cases:
            - Identify recent query errors and their messages
            - Correlate errors to query text
            - Validate error rates seen in top-queries
          parameters: []
          returns:
            description: Recent error events from the configured Extended Events session or the system_health fallback.
            columns:
              - name: Source
                type: string
                unit: ""
                description: "Event source: configured-session or system-health. The system-health fallback contains only selected errors."
              - name: Timestamp
                type: timestamp
                unit: ""
                description: "Timestamp of the error event."
              - name: Error Number
                type: integer
                unit: ""
                description: "SQL Server error number."
              - name: Error State
                type: integer
                unit: ""
                description: "SQL Server error state."
              - name: Error Message
                type: string
                unit: ""
                description: "Error message text."
              - name: Query
                type: string
                unit: ""
                description: "SQL text captured with the error event."
              - name: Query Hash
                type: string
                unit: ""
                visibility: hidden
                description: "Query hash captured with the error event (used for mapping into top-queries)."
          performance: |
            Executes on-demand queries against the configured Extended Events target, falling back to `system_health` when unavailable:<br/>• Also used for error attribution by top-queries, but not by regular metric collection<br/>• event_file reads scan retained files and parse matching errors before returning the newest rows<br/>• On SQL Server, the dedicated-session settings of 6 MB per file and three rollover files keep the conservative filesystem scan envelope near 24 MB (current file plus rollovers)<br/>• The system_health fallback has separate retention settings: Standard/Enterprise editions can retain about 1 GB. A small response limit does not bound the files scanned<br/>• Existing sessions keep their own retention settings; the collector does not alter them<br/>• Keeps the metrics connection available, but shares SQL Server CPU, I/O and locks
          security: |
            Error messages and query text may include unmasked literal values including sensitive data (PII/secrets):<br/>• Restrict dashboard access to authorized personnel only
          prerequisites:
            list:
              - title: Create an Extended Events session for error capture
                description: |
                  Create an Extended Events session that captures `sqlserver.error_reported` with `sql_text` and
                  `query_hash` actions. Choose the engine scope and target that match your deployment and
                  `functions.error_info.use_ring_buffer` setting.

                  **SQL Server — event_file (default):**

                  ```sql
                  CREATE EVENT SESSION [netdata_errors] ON SERVER
                  ADD EVENT sqlserver.error_reported(
                    ACTION(sqlserver.sql_text, sqlserver.query_hash)
                  )
                  ADD TARGET package0.event_file(
                    SET filename=N'netdata_errors',
                        max_file_size=6,
                        max_rollover_files=3
                  );
                  GO

                  ALTER EVENT SESSION [netdata_errors] ON SERVER STATE = START;
                  GO
                  ```

                  Netdata resolves the configured filename from catalog metadata and can read retained event files
                  after the session stops. The 6 MB file size and three rollover files preserve recent history while
                  bounding the amount of retained XML that one request must scan. These settings affect only a session
                  created from this example; Netdata does not modify existing sessions.

                  **SQL Server and Azure SQL Managed Instance — ring_buffer:**

                  ```sql
                  CREATE EVENT SESSION [netdata_errors] ON SERVER
                  ADD EVENT sqlserver.error_reported(
                    ACTION(sqlserver.sql_text, sqlserver.query_hash)
                  )
                  ADD TARGET package0.ring_buffer
                  WITH (STARTUP_STATE = ON);
                  GO

                  ALTER EVENT SESSION [netdata_errors] ON SERVER STATE = START;
                  GO
                  ```

                  Set `functions.error_info.use_ring_buffer: true`. The session starts automatically after restart or
                  failover, but events previously held in memory are lost.

                  **Azure SQL Managed Instance — event_file (default):**

                  Managed Instance requires Azure Blob Storage for event files. Create a server-scoped credential in
                  `master` and grant the Database Engine access to the storage container first. See Microsoft's [event_file setup guide](https://learn.microsoft.com/en-us/azure/azure-sql/database/xevent-code-event-file).

                  ```sql
                  CREATE EVENT SESSION [netdata_errors] ON SERVER
                  ADD EVENT sqlserver.error_reported(
                    ACTION(sqlserver.sql_text, sqlserver.query_hash)
                  )
                  ADD TARGET package0.event_file(
                    SET filename=N'https://<storage-account>.blob.core.windows.net/<container>/netdata_errors.xel',
                        max_file_size=6
                  );
                  GO

                  ALTER EVENT SESSION [netdata_errors] ON SERVER STATE = START;
                  GO
                  ```

                  On Managed Instance, `max_rollover_files` does not currently limit retained blobs. Configure an Azure
                  Storage lifecycle policy to bound retention; `max_file_size` alone does not bound the total data scanned.
                  Alternatively, use the server-scoped ring buffer example above.

                  ```sql
                  -- SQL Server 2022+ and Azure SQL Managed Instance 2022+
                  GRANT VIEW SERVER PERFORMANCE STATE TO [netdata_user];

                  -- SQL Server 2019 and earlier
                  GRANT VIEW SERVER STATE TO [netdata_user];

                  ```

                  If you use a different session name, set it in the collector config:

                  ```yaml
                  jobs:
                    - name: local
                      dsn: "sqlserver://user:pass@localhost:1433"
                      functions:
                        error_info:
                          session_name: your_session_name
                  ```
          availability: |
            Available on SQL Server 2012+ and Azure SQL Managed Instance when:<br/>• The collector has successfully connected<br/>• `functions.error_info.disabled` is false<br/>• The configured session is used when its selected target is available; otherwise SQL Server/Managed Instance falls back to the built-in `system_health` target<br/>• When `functions.error_info.use_ring_buffer` is false, the configured session has an event_file target. Its configured `filename` is resolved from catalog metadata, so it need not match the session name or be running<br/>• When `functions.error_info.use_ring_buffer` is true, the configured session is running and has a ring_buffer target<br/>• SQL Server 2022+/Managed Instance 2022+ has `VIEW SERVER PERFORMANCE STATE`; older SQL Server has `VIEW SERVER STATE`<br/>• Returns HTTP 200 with empty data when no errors are found<br/>• Returns HTTP 403 when permission is missing<br/>• Returns HTTP 499 when the caller cancels the request<br/>• Returns HTTP 500 if the query fails<br/>• Returns HTTP 503 if neither the selected target nor the applicable `system_health` fallback is available, or the function is disabled<br/>• Returns HTTP 504 if the query times out
          require_cloud: true
