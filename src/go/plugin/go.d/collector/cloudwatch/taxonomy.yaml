taxonomy_version: 1
plugin_name: go.d.plugin
module_name: cloudwatch
taxonomy_optout:
  reason: CloudWatch service-profile charts are generated at runtime from the active profiles under the cloudwatch namespace and vary by loaded profile. The four stable collector-activity contexts describe SDK invocations, calculated request units, profile-level cost estimates, and query items rather than an AWS service resource, so neither surface has a meaningful shared dashboard taxonomy placement.
