# Generated by redfish/chartgen from this template and the executable Redfish registry.
plugin_name: go.d.plugin
modules:
  - meta:
      id: collector-go.d.plugin-redfish_logs
      plugin_name: go.d.plugin
      module_name: redfish_logs
      monitored_instance:
        name: Redfish log backend
        link: https://www.dmtf.org/standards/redfish
        icon_filename: hardware.svg
        categories:
          - data-collection.hardware-and-sensors
      keywords:
        - redfish
        - logs
        - bmc
        - out-of-band
      related_resources:
        integrations:
          list:
            - plugin_name: go.d.plugin
              module_name: redfish
      info_provided_to_referring_integrations:
        description: Provides named retained journal backends used by Redfish endpoint jobs.
    overview:
      data_collection:
        metrics_description: |
          Retain Redfish LogService entries in one named local backend and monitor its readiness, storage, file, producer,
          append-pipeline, retention, and synchronization metrics.
        method_description: |
          The job owns one private directory under `${NETDATA_LOG_DIR}/redfish/`, identified by a stable digest of the normalized
          backend job name. It acquires an exclusive writer lock, opens the Netdata journal SDK, registers the backend route for
          endpoint jobs, commits synchronized batches, and applies size-based retention to archived files.

          It never polls a BMC. Redfish endpoint jobs perform LogService polling on their own `update_every` cadence and append
          only while their selected backend is ready.
      supported_platforms:
        include: []
        exclude: []
      multi_instance: true
      additional_permissions:
        description: The Netdata Agent must be able to create and write its private Redfish directory below the configured log directory.
      default_behavior:
        auto_detection:
          description: No backend is created automatically. The stock configuration is comment-only.
        limits:
          description: Each configured backend has an independent positive size-retention target of 10GB by default.
        performance_impact:
          description: |
            Operational metrics refresh every second by default. Journal write cost is driven by LogEntry volume from the endpoint
            jobs routed to this backend, not by the backend's `update_every`.
    setup:
      prerequisites:
        list:
          - title: Size the retained log storage
            description: Choose a positive `retention.max_size` for each backend. Multiple configured backends have additive disk targets.
      configuration:
        file:
          name: go.d/redfish_logs.conf
        options:
          description: |
            Configure one job for each desired log segment. A job named `default` receives endpoints with omitted routing.

            Do not name a backend `all`, `all-local-logs`, `all-local-namespaces`, `all-local-system-logs`,
            `all-local-user-logs`, `all-remote-systems`, or `all-uncategorized`. The journal query interface reserves these names
            for grouped source selectors, so they cannot identify one backend uniquely.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              group: Collection
              description: Operational chart refresh interval. It does not control BMC polling.
              default_value: 1
              required: false
            - name: autodetection_retry
              group: Collection
              description: Failed initial-check retry interval in seconds. Zero disables retries.
              default_value: 0
              required: false
            - name: vnode
              group: Virtual Node
              description: Associates backend operational metrics with an existing configured virtual node.
              default_value: ""
              required: false
            - name: retention.max_size
              group: Retention
              description: Positive retained-size target for this backend, such as `10GB`.
              default_value: 10GB
              required: false
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Default backend
              description: Receive endpoints whose `logs.backend` setting is omitted or explicitly `default`.
              config: |
                jobs:
                  - name: default
                    retention:
                      max_size: 10GB
            - name: Segmented backends
              description: Keep independent retention envelopes for different endpoint groups.
              config: |
                jobs:
                  - name: production
                    retention:
                      max_size: 50GB
                  - name: lab
                    retention:
                      max_size: 5GB
    troubleshooting:
      problems:
        list:
          - name: Backend remains unavailable
            description: |
              Verify that the Netdata log directory exists and is writable, no other process owns the backend writer lock, and
              the private backend identity marker matches the configured job name.
          - name: Actual usage is temporarily above the target
            description: |
              `retention.max_size` is a target rather than a hard filesystem ceiling. The active file is protected from deletion
              and can temporarily leave total usage above the target.
    alerts:
      - name: redfish_log_backend_pipeline
        metric: redfish.log_backend.pipeline
        info: "Redfish backend ${label:backend_name} reports a non-healthy state for Redfish Log Backend Pipeline"
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/redfish.conf
      - name: redfish_log_backend_state
        metric: redfish.log_backend.state
        info: "Redfish backend ${label:backend_name} reports a non-healthy state for Redfish Log Backend State"
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/redfish.conf
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: Operational state of each named Redfish retained-log backend.
      availability: []
      scopes:
        - name: backend
          description: One configured `redfish_logs` job and retained journal directory.
          labels:
            - name: backend_name
              description: Normalized backend job name.
            - name: backend_key
              description: Stable digest-derived backend key.
          metrics:
            - name: redfish.log_backend.state
              description: Backend route readiness.
              unit: state
              chart_type: stacked
              dimensions:
                - name: ready
                - name: unavailable
            - name: redfish.log_backend.storage
              description: Current used bytes and configured retention target.
              unit: bytes
              chart_type: line
              dimensions:
                - name: used
                - name: target
            - name: redfish.log_backend.files
              description: Active and archived journal files.
              unit: files
              chart_type: line
              dimensions:
                - name: active
                - name: archived
            - name: redfish.log_backend.producers
              description: Endpoint jobs currently routed to this backend.
              unit: producers
              chart_type: line
              dimensions:
                - name: active
            - name: redfish.log_backend.pipeline
              description: Received, committed, duplicate-suppressed, and failed LogEntry rates.
              unit: entries/s
              chart_type: line
              dimensions:
                - name: received
                - name: committed
                - name: duplicate_suppressed
                - name: write_failed
            - name: redfish.log_backend.retention_files
              description: Archived journal files deleted by retention.
              unit: files/s
              chart_type: line
              dimensions:
                - name: deleted
            - name: redfish.log_backend.retention_bytes
              description: Archived journal bytes deleted by retention.
              unit: bytes/s
              chart_type: line
              dimensions:
                - name: deleted
            - name: redfish.log_backend.sync_duration
              description: Last append synchronization duration.
              unit: seconds
              chart_type: line
              dimensions:
                - name: duration
