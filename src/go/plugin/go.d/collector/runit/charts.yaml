version: v1
context_namespace: runit
groups:
  - family: state
    chart_defaults:
      priority: 70000
      instances:
        by_labels: [service_name]
    metrics:
      - service_state
      - service_enabled
    charts:
      - title: Service State
        context: service_state
        units: state
        type: stacked
        dimensions:
          - selector: service_state{service_state="running"}
            name: running
          - selector: service_state{service_state="down"}
            name: down
          - selector: service_state{service_state="failed"}
            name: failed
          - selector: service_state{service_state="starting"}
            name: starting
          - selector: service_state{service_state="stopping"}
            name: stopping
          - selector: service_state{service_state="paused"}
            name: paused
          - selector: service_enabled
            name: enabled
            options:
              hidden: true
  - family: restarts
    chart_defaults:
      priority: 70100
      instances:
        by_labels: [service_name]
    metrics:
      - service_restarts
    charts:
      - title: Service Restarts
        context: service_restarts
        units: restarts/s
        dimensions:
          - selector: service_restarts
            name: restarts
  - family: duration
    chart_defaults:
      priority: 70200
      instances:
        by_labels: [service_name]
    metrics:
      - service_state_duration
    charts:
      - title: Service State Duration (single-service view)
        context: service_state_duration
        units: seconds
        dimensions:
          - selector: service_state_duration
            name: duration
