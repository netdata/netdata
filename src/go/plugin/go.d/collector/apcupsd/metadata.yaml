plugin_name: go.d.plugin
modules:
  - meta:
      id: collector-go.d.plugin-apcupsd
      plugin_name: go.d.plugin
      module_name: apcupsd
      monitored_instance:
        name: APC UPS
        link: https://www.apc.com
        icon_filename: apc.svg
        categories:
          - data-collection.hardware-and-sensors
      keywords:
        - ups
        - apcupsd
        - apc
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: ""
    overview:
      data_collection:
        metrics_description: |
          This collector monitors Uninterruptible Power Supplies by polling the Apcupsd daemon.
        method_description: ""
      supported_platforms:
        include: []
        exclude: []
      multi_instance: true
      additional_permissions:
        description: ""
      default_behavior:
        auto_detection:
          description: |
            By default, it detects Apcupsd instances running on localhost that are listening on port 3551.
            On startup, it tries to collect metrics from:

            - 127.0.0.1:3551
        limits:
          description: ""
        performance_impact:
          description: ""
    setup:
      prerequisites:
        list: []
      configuration:
        file:
          name: go.d/apcupsd.conf
        options:
          description: |
            The following options can be defined globally: update_every, autodetection_retry.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              description: Data collection interval (seconds).
              default_value: 1
              required: false
              group: Collection
            - name: autodetection_retry
              description: Autodetection retry interval (seconds). Set 0 to disable.
              default_value: 0
              required: false
              group: Collection

            - name: address
              description: apcupsd daemon address (`IP:PORT`).
              default_value: 127.0.0.1:3551
              required: true
              group: Target
            - name: timeout
              description: Connection, read, write, and name resolution timeout (seconds).
              default_value: 2
              required: false
              group: Target

            - name: vnode
              description: Associates this data collection job with a [Virtual Node](https://learn.netdata.cloud/docs/netdata-agent/configuration/organize-systems-metrics-and-alerts#virtual-nodes).
              default_value: ""
              required: false
              group: Virtual Node
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Basic
              description: A basic example configuration.
              config: |
                jobs:
                  - name: local
                    address: 127.0.0.1:3551
            - name: Multi-instance
              description: |
                > **Note**: When you define multiple jobs, their names must be unique.
                
                Collecting metrics from local and remote instances.
              config: |
                jobs:
                  - name: local
                    address: 127.0.0.1:3551
                
                  - name: remote
                    address: 203.0.113.0:3551
    troubleshooting:
      problems:
        list: []
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: ""
      availability: []
      scopes:
        - name: ups
          description: These metrics refer to the UPS unit.
          labels: []
          metrics:
            - name: apcupsd.ups_status
              description: UPS Status
              unit: status
              chart_type: line
              dimensions:
                - name: TRIM
                - name: BOOST
                - name: CAL
                - name: ONLINE
                - name: ONBATT
                - name: OVERLOAD
                - name: LOWBATT
                - name: REPLACEBATT
                - name: NOBATT
                - name: SLAVE
                - name: SLAVEDOWN
                - name: COMMLOST
                - name: SHUTTING_DOWN
            - name: apcupsd.ups_selftest
              description: UPS Self-Test Status
              unit: status
              chart_type: line
              dimensions:
                - name: NO
                - name: NG
                - name: WN
                - name: IP
                - name: OK
                - name: BT
                - name: UNK
            - name: apcupsd.ups_battery_charge
              description: UPS Battery Charge
              unit: percent
              chart_type: area
              dimensions:
                - name: charge
            - name: apcupsd.ups_battery_time_remaining
              description: UPS Estimated Runtime on Battery
              unit: seconds
              chart_type: line
              dimensions:
                - name: timeleft
            - name: apcupsd.ups_battery_time_since_replacement
              description: UPS Time Since Battery Replacement
              unit: seconds
              chart_type: line
              dimensions:
                - name: since_replacement
            - name: apcupsd.ups_battery_voltage
              description: UPS Battery Voltage
              unit: Volts
              chart_type: line
              dimensions:
                - name: voltage
                - name: nominal_voltage
            - name: apcupsd.ups_load_capacity_utilization
              description: UPS Load Capacity Utilization
              unit: percent
              chart_type: area
              dimensions:
                - name: load
            - name: apcupsd.ups_load
              description: UPS Load
              unit: Watts
              chart_type: line
              dimensions:
                - name: load
            - name: apcupsd.ups_temperature
              description: UPS Internal Temperature
              unit: Celsius
              chart_type: line
              dimensions:
                - name: temperature
            - name: apcupsd.ups_input_voltage
              description: UPS Input Voltage
              unit: Volts
              chart_type: line
              dimensions:
                - name: voltage
                - name: min_voltage
                - name: max_voltage
            - name: apcupsd.ups_input_frequency
              description: UPS Input Frequency
              unit: Hz
              chart_type: line
              dimensions:
                - name: frequency
            - name: apcupsd.ups_output_voltage
              description: UPS Output Voltage
              unit: Volts
              chart_type: line
              dimensions:
                - name: voltage
