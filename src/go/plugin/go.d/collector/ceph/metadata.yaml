plugin_name: go.d.plugin
modules:
  - meta:
      plugin_name: go.d.plugin
      module_name: ceph
      monitored_instance:
        name: Ceph
        link: "https://ceph.io/"
        categories:
          - data-collection.storage
        icon_filename: "ceph.svg"
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: "Ceph cluster metrics, control-plane RCA, storage policy, and daemon inventory."
      keywords:
        - ceph
        - storage
        - osd
        - pool
        - rgw
        - s3
        - prometheus
    overview:
      data_collection:
        metrics_description: |
          Monitor Ceph cluster, OSD, and pool metrics. Use the on-demand Functions for detailed health checks, OSD and
          daemon inventory, and pool policy.

          This collector can coexist with Ceph's Prometheus producers. Use the MGR Prometheus module for additional cluster
          telemetry and, on Reef 18 and later, `ceph-exporter` on Ceph hosts for daemon/admin-socket telemetry.
        method_description: |
          The collector uses the authenticated Ceph Dashboard REST API. It does not read daemon admin sockets and does
          not scrape Prometheus.

          The collector verifies the cluster identity, then periodically queries cluster health, OSD, and pool endpoints.
          A JWT obtained through Dashboard's JSON login is cached and renewed after an authorization failure. Alternatively,
          the collector rereads an externally managed bearer-token file for every request; the file owner must replace the
          token before it expires.

          If a standby MGR redirects to the active MGR, the collector discovers the active origin without credentials,
          validates the destination against `allowed_redirect_origins`, reconstructs the original API path, and then
          authenticates. The configured origin is trusted implicitly; cross-origin redirects require an explicit exact
          origin. It rejects redirect loops, URL credentials, unsupported schemes, and HTTPS-to-HTTP downgrade.

          Periodic collection uses:

          - `/api/health/minimal` for cluster health and summary metrics.
          - `/api/osd` for selected, bounded per-OSD charts.
          - `/api/pool?stats=true` for selected, bounded per-pool charts.

          Functions query the Dashboard only when opened. Result rows and long health text are bounded.

          Coverage ownership is deliberately split:

          - MGR Prometheus owns continuous cluster telemetry such as PG states, OSD up/in, MON quorum, and capacity.
          - On Reef 18 and later, per-host `ceph-exporter` owns continuous daemon/admin-socket telemetry.
          - The native Health Function supplies exact current health-check detail for slow operations, scrub/damage
            errors, quorum symptoms, and other RCA; the other Functions supply bounded policy and inventory gaps.
          Release contracts cover Pacific 16, Quincy 17, Reef 18, Squid 19, and Tentacle 20.
      supported_platforms:
        include: [Linux]
        exclude: []
      multi_instance: true
      additional_permissions:
        description: |
          No host capabilities are required. The Dashboard account needs read access to the Ceph scopes queried by the
          metric endpoints and Functions. The built-in Ceph Dashboard `read-only` role grants read access to all Dashboard
          scopes. Prefer a dedicated account and the narrowest custom role that covers the selected endpoints.
      default_behavior:
        auto_detection:
          description: |
            Listener discovery can find Ceph Dashboard endpoints on port 8443, including container listeners, but it
            cannot discover credentials. A discovered job remains unavailable until Dashboard credentials are supplied.
        limits:
          description: |
            The default job collects the complete cluster metric set every 10 seconds. Health, OSD, pool, and daemon
            Functions are available on demand. Per-OSD and per-pool charts are capped at 100 selected entities each; when a
            selected set exceeds its cap, that entity metric set is skipped rather than truncated.
        performance_impact:
          description: |
            On Reef 18 and later, standalone `ceph-exporter` refreshes daemon/admin-socket metrics every 5 seconds by
            default. The MGR Prometheus module refreshes its enabled cache every 15 seconds by default. Scrapes read these
            caches and do not schedule refresh work, so match scraper intervals to the configured producer periods to avoid
            duplicate or skipped cached samples. If the MGR Prometheus `cache` option is disabled, its metrics are instead
            collected in the scrape request path.

            Dashboard endpoints execute inside the active MGR. `/api/health/minimal` aggregates several subsystems and
            iSCSI status may synchronously contact gateways; OSD and pool detail grows with cluster size. Choose an
            appropriate `update_every`, selectors, and entity caps for the deployment.
    setup:
      prerequisites:
        list:
          - title: Enable and secure the Ceph Dashboard module
            description: |
              Enable Ceph Dashboard on the MGRs, configure TLS, and make the active/standby Dashboard addresses
              reachable from the Netdata node that will run this once-per-cluster job.
          - title: Create a read-only Dashboard account
            description: |
              Create a dedicated Ceph Dashboard user. Assign the built-in `read-only` role or a custom role with read
              permissions for only the scopes needed by the enabled features. Store its password in a protected Netdata
              configuration file or provide an externally managed bearer token through `bearer_token_file`. When using a
              token file, its owner must replace the token before it expires; file updates take effect without restarting
              the collector.
          - title: Place the Dashboard job and optional Prometheus collectors
            description: |
              Run one native Dashboard job per Ceph cluster. If using Ceph's Prometheus telemetry, use one MGR Prometheus
              scrape per cluster and, on Reef 18 and later, `ceph-exporter` on Ceph hosts for daemon/admin-socket telemetry.
              Place the Dashboard job on a Netdata node with stable network access to the configured Dashboard and every
              allowed active-MGR origin; its Functions execute on that node.
      configuration:
        file:
          name: go.d/ceph.conf
        options:
          description: |
            Options apply per job. The collector uses Dashboard JSON/JWT authentication, not HTTP Basic authentication.
            Core Functions run on demand with internal execution and response limits.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              description: "Data collection interval, in seconds. It does not change the ceph-exporter or MGR Prometheus module refresh rates."
              detailed_description: |
                The standalone ceph-exporter refreshes every 5 seconds by default on Reef 18 and later, and the MGR Prometheus module
                caches for 15 seconds by default; neither follows this interval.
              default_value: 10
              required: false
              group: Base
            - name: autodetection_retry
              description: "How often to retry the initial connection when the job fails to start, in seconds. Zero disables retries."
              default_value: 60
              required: false
              group: Base
            - name: function_only
              description: "Run only on-demand Functions, without creating charts or making periodic metric requests."
              default_value: false
              required: false
              group: Base
            - name: osd_selector
              description: "Simple-pattern selector matched against `osd.<id>` or OSD UUID before the cap."
              default_value: "*"
              required: false
              group: Metrics
            - name: max_osds
              description: "Maximum selected OSDs with individual charts. If the selected set exceeds this operator policy, no per-OSD metrics are collected."
              default_value: 100
              required: false
              group: Metrics
            - name: pool_selector
              description: "Simple-pattern selector matched against pool names before the cap."
              default_value: "*"
              required: false
              group: Metrics
            - name: max_pools
              description: "Maximum selected pools with individual charts. If the selected set exceeds this operator policy, no per-pool metrics are collected."
              default_value: 100
              required: false
              group: Metrics
            - name: url
              description: "Base URL of the Ceph Dashboard API. Redirects from a standby to the active MGR are followed securely."
              default_value: https://127.0.0.1:8443
              required: true
              group: Base
            - name: timeout
              description: "Deadline for one Dashboard operation, in seconds, including discovery, login, retries, and decoding. At least 0.5."
              default_value: 2
              required: false
              group: Base
            - name: username
              description: "Username for the Ceph Dashboard JSON login, not HTTP basic authentication. Required with `password` unless a bearer token file is used."
              default_value: ""
              required: false
              group: Auth
            - name: password
              description: "Password for the Ceph Dashboard JSON login. Required with `username` unless a bearer token file is used."
              default_value: ""
              required: false
              group: Auth
            - name: bearer_token_file
              description: "Path to a bearer token file managed outside Netdata. It takes priority over username and password and is reread on every request."
              detailed_description: |
                The file owner must replace the token before it expires. Because the collector rereads the file for every request,
                a replacement takes effect without a restart.
              default_value: ""
              required: false
              group: Auth
            - name: not_follow_redirects
              description: "Reject Dashboard redirects instead of following them to the active MGR."
              default_value: false
              required: false
              group: Base
            - name: allowed_redirect_origins
              description: "Scheme and host origins that may receive credentials after active-MGR discovery. The configured URL's origin is always trusted."
              detailed_description: |
                Cross-origin redirects are rejected unless the destination is listed as `scheme://host:port`. After a
                credentialless discovery request, only a trusted origin may receive Dashboard login credentials or a
                bearer token. List every possible MGR Dashboard origin and validate TLS with a cluster CA.
              default_value: "[]"
              required: false
              group: Base
            - name: headers
              description: "Additional HTTP headers. `Authorization`, `Cookie`, and `Host` are managed by the collector and rejected here."
              default_value: ""
              required: false
              group: Headers
            - name: force_http2
              description: "Force HTTP/2, including h2c over plain TCP."
              default_value: false
              required: false
              group: Base
            - name: tls_skip_verify
              description: "Skip TLS certificate and hostname verification. Insecure; on by default only for self-signed Dashboard deployments."
              default_value: true
              required: false
              group: TLS
            - name: tls_ca
              description: "Absolute path to a CA bundle used to validate the Dashboard certificate."
              default_value: ""
              required: false
              group: TLS
            - name: tls_cert
              description: "Absolute path to a client certificate for mTLS."
              default_value: ""
              required: false
              group: TLS
            - name: tls_key
              description: "Absolute path to the client private key for mTLS."
              default_value: ""
              required: false
              group: TLS
            - name: proxy_url
              description: "HTTP proxy URL. Leave empty to use the proxy environment variables."
              default_value: ""
              required: false
              group: Proxy
            - name: proxy_username
              description: "Username for proxy authentication."
              default_value: ""
              required: false
              group: Proxy
            - name: proxy_password
              description: "Password for proxy authentication."
              default_value: ""
              required: false
              group: Proxy
            - name: vnode
              description: "Associates this once-per-cluster job with a Virtual Node. Functions stay attached to the physical Agent job."
              default_value: ""
              required: false
              group: Base
        examples:
          folding:
            title: Config examples
            enabled: true
          list:
            - name: Once-per-cluster job
              description: Collect the complete native Dashboard metric set and provide bounded core Functions.
              config: |
                jobs:
                  - name: ceph-site-a
                    url: https://ceph-mgr.example:8443
                    username: netdata
                    password: change-me
            - name: Function-only control-plane job
              description: No periodic Dashboard charts; query RCA and inventory on demand.
              config: |
                jobs:
                  - name: ceph-control-plane
                    url: https://ceph-mgr.example:8443
                    username: netdata
                    password: change-me
                    function_only: true
            - name: Bounded native entity metrics
              description: Select entity charts and reject the complete selected set when it exceeds the configured cap.
              config: |
                jobs:
                  - name: ceph-native-detail
                    url: https://ceph-mgr.example:8443
                    username: netdata
                    password: change-me
                    osd_selector: "osd.* !osd.0"
                    max_osds: 50
    troubleshooting:
      problems:
        list:
          - name: Dashboard job follows a redirect but returns HTML
            description: |
              Do not put a generic reverse-proxy login page in front of the job. Configure `url` to a Ceph Dashboard
              endpoint. Leave `not_follow_redirects: false`, list every possible active MGR under
              `allowed_redirect_origins`, and configure CA verification. The collector reconstructs the API request but
              rejects untrusted origins, HTTPS downgrade, URL credentials, and redirect loops.
          - name: Charts or Functions are missing
            description: |
              Confirm that the Dashboard user has read permission for the corresponding scope. Permission-filtered
              sections are treated as unavailable; they are not emitted as healthy-looking zero values. The daemon
              Function also requires a configured Ceph orchestrator. When an OSD or pool selection exceeds its configured
              cap, the collector deliberately emits no metrics for that entity set.
          - name: Long retention or capacity planning is required
            description: |
              Retention and Agent capacity are Netdata deployment concerns, not Ceph collector settings. Use the
              [Agent sizing guide](/docs/netdata-agent/sizing-netdata-agents/README.md) and the
              [disk and retention sizing guide](/docs/netdata-agent/sizing-netdata-agents/disk-requirements-and-retention.md)
              to size the intended Child/Parent topology from measured Ceph chart cardinality and retention requirements.

              The collector reports current capacity; it does not emit a pool-fill forecast. Use retained history and
              the presentation/query layer for projections, and validate the model against planned growth and rebalance.
          - name: Existing Prometheus or Grafana monitoring must remain
            description: |
              Keep Ceph Prometheus exporters and existing dashboards until equivalent coverage is verified. This native
              collector adds Dashboard metrics, Functions, and alerts; it does not replace every Ceph Prometheus series.
              Netdata metric names are context-based, so Grafana dashboards that expect original `ceph_*` series are not
              automatically compatible. On-demand Function tables are not Prometheus time series.
          - name: More preconfigured Ceph alerts are expected
            description: |
              This integration ships a notifying collection-failure alert and a silent-by-default native capacity-utilization
              policy. Existing installations that relied on automatic capacity notifications must explicitly route the
              capacity alert after upgrade.
              Health Function rows are on-demand tables and do not create alerts. When the Ceph Prometheus profile is
              configured, its MGR-owned alert layer supplies tested cluster health, crash, slow-operation, and cephadm
              conditions; this native collector remains the owner of Dashboard API component-collection failures. Keep Ceph
              mixin/Alertmanager rules for conditions without an explicitly implemented and tested Netdata equivalent,
              including any required PG, OSD, MON, scrub, or RGW policy. Slack, webhook, and PagerDuty are notification
              transports, not Ceph threshold definitions.
    alerts:
      - name: ceph_component_collection_failed
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/ceph.conf
        metric: ceph.component_collection_status
        info: "Metric collection for the Ceph ${label:component} component is failing while other Ceph metrics continue to be collected"
      - name: ceph_cluster_physical_capacity_utilization
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/ceph.conf
        metric: ceph.cluster_physical_capacity_utilization
        info: 'Ceph cluster ${label:fsid} disk space utilization. This stock capacity policy is silent by default; explicitly route it when notifications are required.'
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: |
        The default job emits the complete metric set. Per-entity metrics additionally honor their selectors and caps.
      availability: []
      scopes:
        - name: component
          description: These metrics refer to one Ceph API collection component.
          labels:
            - name: fsid
              description: Unique Ceph cluster identifier.
            - name: component
              description: Ceph API collection component.
          metrics:
            - name: ceph.component_collection_status
              description: Ceph Component Collection Status
              unit: status
              chart_type: line
              dimensions: [{name: success}, {name: failed}]
        - name: cluster
          description: These metrics refer to the entire Ceph cluster.
          labels:
            - name: fsid
              description: Unique Ceph cluster identifier.
          metrics:
            - name: ceph.cluster_status
              description: Ceph Cluster Status
              unit: status
              chart_type: line
              dimensions: [{name: ok}, {name: err}, {name: warn}]
            - name: ceph.cluster_hosts_count
              description: Ceph Cluster Hosts
              unit: hosts
              chart_type: line
              dimensions: [{name: hosts}]
            - name: ceph.cluster_monitors_count
              description: Ceph Cluster Monitors
              unit: monitors
              chart_type: line
              dimensions: [{name: monitors}]
            - name: ceph.cluster_osds_count
              description: Ceph Cluster OSDs
              unit: osds
              chart_type: line
              dimensions: [{name: osds}]
            - name: ceph.cluster_osds_by_status_count
              description: Ceph Cluster OSDs by Status
              unit: osds
              chart_type: line
              dimensions: [{name: up}, {name: down}, {name: in}, {name: out}]
            - name: ceph.cluster_managers_count
              description: Ceph Cluster Managers
              unit: managers
              chart_type: line
              dimensions: [{name: active}, {name: standby}]
            - name: ceph.cluster_object_gateways_count
              description: Ceph Cluster Object Gateways
              unit: gateways
              chart_type: line
              dimensions: [{name: object}]
            - name: ceph.cluster_iscsi_gateways_count
              description: Ceph Cluster iSCSI Gateways
              unit: gateways
              chart_type: line
              dimensions: [{name: iscsi}]
            - name: ceph.cluster_iscsi_gateways_by_status_count
              description: Ceph Cluster iSCSI Gateways by Status
              unit: gateways
              chart_type: line
              dimensions: [{name: up}, {name: down}]
            - name: ceph.cluster_physical_capacity_utilization
              description: Ceph Cluster Physical Capacity Utilization
              unit: percent
              chart_type: area
              dimensions: [{name: utilization}]
            - name: ceph.cluster_physical_capacity_usage
              description: Ceph Cluster Physical Capacity Usage
              unit: bytes
              chart_type: stacked
              dimensions: [{name: avail}, {name: used}]
            - name: ceph.cluster_objects_count
              description: Ceph Cluster Logical Objects
              unit: objects
              chart_type: line
              dimensions: [{name: objects}]
            - name: ceph.cluster_object_copies_health
              description: Ceph Cluster Object Copy Health
              unit: percent
              chart_type: line
              dimensions: [{name: degraded}, {name: misplaced}]
            - name: ceph.cluster_objects_unfound
              description: Ceph Cluster Unfound Objects
              unit: percent
              chart_type: line
              dimensions: [{name: unfound}]
            - name: ceph.cluster_pools_count
              description: Ceph Cluster Pools
              unit: pools
              chart_type: line
              dimensions: [{name: pools}]
            - name: ceph.cluster_pgs_count
              description: Ceph Cluster Placement Groups
              unit: pgs
              chart_type: line
              dimensions: [{name: pgs}]
            - name: ceph.cluster_pgs_by_status_count
              description: Ceph Cluster Placement Groups by Compatibility Category
              unit: pgs
              chart_type: stacked
              dimensions: [{name: clean}, {name: working}, {name: warning}, {name: unknown}]
            - name: ceph.cluster_pgs_per_osd_count
              description: Ceph Cluster Placement Groups per OSD
              unit: pgs
              chart_type: line
              dimensions: [{name: per_osd}]
            - name: ceph.cluster_client_io
              description: Ceph Cluster Client I/O
              unit: bytes/s
              chart_type: area
              dimensions: [{name: read}, {name: written}]
            - name: ceph.cluster_client_iops
              description: Ceph Cluster Client Operations
              unit: ops/s
              chart_type: line
              dimensions: [{name: read}, {name: write}]
            - name: ceph.cluster_recovery_throughput
              description: Ceph Cluster Recovery Throughput
              unit: bytes/s
              chart_type: line
              dimensions: [{name: recovery}]
            - name: ceph.cluster_scrub_status
              description: Ceph Cluster Scrubbing Status
              unit: status
              chart_type: line
              dimensions: [{name: disabled}, {name: active}, {name: inactive}]
        - name: osd
          description: >-
            These optional metrics refer to a selected OSD. When the selected inventory exceeds `max_osds`, the collector
            emits no per-OSD metrics rather than returning a partial set.
          labels:
            - name: fsid
              description: Unique Ceph cluster identifier.
            - name: osd_uuid
              description: OSD UUID.
            - name: osd_name
              description: OSD name.
            - name: device_class
              description: OSD CRUSH device class.
          metrics:
            - name: ceph.osd_status
              description: Ceph OSD Status
              unit: status
              chart_type: line
              dimensions: [{name: up}, {name: down}, {name: in}, {name: out}]
            - name: ceph.osd_space_usage
              description: Ceph OSD Space Usage
              unit: bytes
              chart_type: stacked
              dimensions: [{name: avail}, {name: used}]
            - name: ceph.osd_io
              description: Ceph OSD I/O Rate
              unit: bytes/s
              chart_type: area
              dimensions: [{name: read}, {name: written}]
            - name: ceph.osd_iops
              description: Ceph OSD Operation Rate
              unit: ops/s
              chart_type: line
              dimensions: [{name: read}, {name: write}]
            - name: ceph.osd_latency
              description: Ceph OSD Latency
              unit: milliseconds
              chart_type: line
              dimensions: [{name: commit}, {name: apply}]
        - name: pool
          description: >-
            These optional metrics refer to a selected pool. When the selected inventory exceeds `max_pools`, the
            collector emits no per-pool metrics rather than returning a partial set.
          labels:
            - name: fsid
              description: Unique Ceph cluster identifier.
            - name: pool_name
              description: Pool name.
          metrics:
            - name: ceph.pool_space_utilization
              description: Ceph Pool Space Utilization
              unit: percent
              chart_type: area
              dimensions: [{name: utilization}]
            - name: ceph.pool_space_usage
              description: Ceph Pool Space Usage
              unit: bytes
              chart_type: stacked
              dimensions: [{name: avail}, {name: used}]
            - name: ceph.pool_objects_count
              description: Ceph Pool Objects
              unit: objects
              chart_type: line
              dimensions: [{name: objects}]
            - name: ceph.pool_io
              description: Ceph Pool I/O Rate
              unit: bytes/s
              chart_type: area
              dimensions: [{name: read}, {name: written}]
            - name: ceph.pool_iops
              description: Ceph Pool Operation Rate
              unit: ops/s
              chart_type: line
              dimensions: [{name: read}, {name: write}]
    functions:
      description: |
        Bounded on-demand tables for Ceph control-plane troubleshooting. They run on the physical Agent hosting the job,
        work without Netdata Cloud, and query Ceph only while requested. Public method names are namespaced by the
        framework, for example `ceph:health`; the IDs below are the collector method IDs.
      list:
        - id: health
          name: Ceph Health
          description: |
            Returns exact Ceph health-check codes, severity, mute state, affected counts, summaries, and bounded detail.
            Use it for MON quorum symptoms, slow operations, scrub/damage errors, PG warnings, and other current RCA data.
          parameters: []
          returns:
            description: >-
              At most 500 rows, ordered by severity and code. Each detailed health message becomes a row; a check with no
              detail becomes one summary row. The `truncated` field identifies a bounded subset.
            columns:
              - {name: id, type: string, unit: "", visibility: hidden, description: Unique row identifier.}
              - {name: code, type: string, unit: "", description: Ceph health-check code.}
              - {name: severity, type: string, unit: "", description: "Ceph HEALTH_OK, HEALTH_WARN, or HEALTH_ERR severity."}
              - {name: muted, type: boolean, unit: "", description: Whether Ceph muted the health check.}
              - {name: summary, type: string, unit: "", description: Health-check summary.}
              - {name: count, type: integer, unit: items, description: Affected item count.}
              - {name: detail, type: string, unit: "", description: Bounded detailed health-check message.}
              - {name: detail_truncated, type: boolean, unit: "", visibility: hidden, description: Summary or detail text was truncated.}
              - {name: truncated, type: boolean, unit: "", visibility: hidden, description: Result exceeded its row limit.}
          performance: >-
            Dashboard builds every permission-dependent `/api/health/minimal` section per invocation; it cannot return
            only health checks, and iSCSI read scope can trigger synchronous gateway pings. The minimal route carries the
            same detailed checks as the full route without its larger payload. The collector retains 500 most-severe rows
            plus one look-ahead row from the decoded checks and truncates long summary/detail cells. Use a narrow Dashboard
            role to avoid unrelated sections when appropriate.
          security: Health detail can expose daemon, host, pool, and client identifiers. Restrict Function access to operators.
          availability: Requires Dashboard read permission for health-related scopes.
          require_cloud: false
        - id: osds
          name: Ceph OSDs
          description: Returns complete bounded OSD state, topology, capacity, current rates, and latency for RCA.
          parameters:
            - id: limit
              name: Maximum rows
              description: Return the complete OSD inventory only when it fits within this limit.
              type: select
              required: true
              default: "500"
              options:
                - {id: "100", name: 100 rows}
                - {id: "500", name: 500 rows, default: true}
                - {id: "1000", name: "1,000 rows"}
                - {id: "2500", name: "2,500 rows"}
                - {id: "5000", name: "5,000 rows"}
          returns:
            description: >-
              One row per OSD, ordered by numeric OSD ID. If the complete inventory exceeds the selected limit or the
              internal ceiling, the Function returns an error and no rows.
            columns:
              - {name: uuid, type: string, unit: "", visibility: hidden, description: OSD UUID.}
              - {name: id, type: integer, unit: "", description: Numeric OSD ID.}
              - {name: name, type: string, unit: "", description: OSD name.}
              - {name: host, type: string, unit: "", description: OSD host.}
              - {name: device_class, type: string, unit: "", description: CRUSH device class.}
              - {name: up, type: boolean, unit: "", description: Whether the OSD is up.}
              - {name: in, type: boolean, unit: "", description: Whether the OSD is in.}
              - {name: operational_status, type: string, unit: "", description: Orchestrator operational status.}
              - {name: total_bytes, type: integer, unit: bytes, visibility: hidden, description: Total OSD capacity.}
              - {name: used_bytes, type: integer, unit: bytes, description: Used OSD capacity.}
              - {name: available_bytes, type: integer, unit: bytes, description: Available OSD capacity.}
              - {name: utilization, type: float, unit: percent, description: OSD utilization.}
              - {name: read_bytes_per_sec, type: float, unit: bytes/s, visibility: hidden, description: Current read rate.}
              - {name: write_bytes_per_sec, type: float, unit: bytes/s, visibility: hidden, description: Current write rate.}
              - {name: read_ops_per_sec, type: float, unit: ops/s, visibility: hidden, description: Current read operation rate.}
              - {name: write_ops_per_sec, type: float, unit: ops/s, visibility: hidden, description: Current write operation rate.}
              - {name: commit_latency_ms, type: float, unit: milliseconds, visibility: hidden, description: Commit latency.}
              - {name: apply_latency_ms, type: float, unit: milliseconds, visibility: hidden, description: Apply latency.}
          performance: >-
            Makes one target-sized Dashboard v1.1 request, validates `X-Total-Count`, and returns rows only when that
            response proves the complete inventory fits within the selected limit and internal response budgets. The
            Function has a five-second internal deadline.
