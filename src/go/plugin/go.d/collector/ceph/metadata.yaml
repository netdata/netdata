          availability: >-
            Requires Dashboard read permission for the OSD scope and the v1.1 OSD API available in Reef 18 and newer.
            Pacific 16 and Quincy 17 periodic OSD metrics use a legacy compatibility path; this Function does not.
          require_cloud: false
        - id: pools
