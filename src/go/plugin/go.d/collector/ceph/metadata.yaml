plugin_name: go.d.plugin
modules:
  - meta:
      plugin_name: go.d.plugin
      module_name: ceph
      monitored_instance:
        name: Ceph
        link: "https://ceph.io/"
        categories:
          - data-collection.storage
        icon_filename: "ceph.svg"
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: "Ceph Dashboard API availability, control-plane RCA, storage policy, daemon inventory, and opt-in RGW data."
      keywords:
        - ceph
        - storage
        - osd
        - pool
        - rgw
        - s3
        - prometheus
    overview:
      data_collection:
        metrics_description: |
          Monitor Ceph Dashboard API availability and optionally collect legacy cluster, OSD, and pool metrics.
          Use the on-demand Functions for detailed health checks, OSD and daemon inventory, pool policy, and explicitly
          selected RGW quota or multisite diagnostics.

          This collector is complementary to Ceph's Prometheus producers. The default configuration leaves every
          overlapping or potentially expensive legacy metric feature disabled. Use the MGR Prometheus module for
          continuous cluster telemetry and `ceph-exporter` on every Ceph node for daemon/admin-socket telemetry.
        method_description: |
          The collector uses the authenticated Ceph Dashboard REST API. It does not read daemon admin sockets and does
          not scrape Prometheus.

          The default periodic request is `GET /api/health/get_cluster_fsid`, used to verify Dashboard API,
          authentication, and active-MGR reachability. A JWT obtained through Dashboard's JSON login is cached and
          renewed after an authorization failure; an externally managed bearer-token file is also supported.

          If a standby MGR redirects to the active MGR, the collector discovers the active origin without credentials,
          validates the destination against `allowed_redirect_origins`, reconstructs the original API path, and then
          authenticates. The configured origin is trusted implicitly; cross-origin redirects require an explicit exact
          origin. It rejects redirect loops, URL credentials, unsupported schemes, and HTTPS-to-HTTP downgrade.

          Optional periodic features issue only the requests their enabled charts need:

          - `/api/health/minimal` for selected cluster features. Enabling one child still incurs the whole endpoint.
          - Paginated `/api/osd` for selected, bounded per-OSD charts.
          - `/api/pool?stats=true` for selected, bounded per-pool charts.

          Functions query the Dashboard only when opened. Result rows and long health/sync text are bounded. RGW quota
          collection never enumerates all users, buckets, or accounts; it performs point lookups only for configured
          identities.

          Coverage ownership is deliberately split:

          - MGR Prometheus owns continuous cluster telemetry such as PG states, OSD up/in, MON quorum, and capacity.
          - Per-node `ceph-exporter` owns continuous daemon/admin-socket telemetry.
          - The native Health Function supplies exact current health-check detail for slow operations, scrub/damage
            errors, quorum symptoms, and other RCA; the other Functions supply bounded policy and inventory gaps.
          - Native RGW Functions supply explicit quota/usage point lookups and multisite topology/sync diagnostics, not
            S3 request telemetry. Per-bucket/user/client request rates, GET/PUT/DELETE/LIST latency, endpoint HTTP 4xx/5xx,
            and client-attributed throughput require RGW structured access logs or another request-level source.

          Release contracts are tested against Ceph Reef 18.2.8, Squid 19.2.5, and Tentacle 20.2.2. RGW sync detail is
          unavailable through the public Dashboard API on Reef and is reported as unsupported rather than fabricated.
      supported_platforms:
        include: [Linux]
        exclude: []
      multi_instance: true
      additional_permissions:
        description: |
          No host capabilities are required. The Dashboard account needs read access to the Ceph scopes queried by the
          enabled metric features and Functions. The built-in Ceph Dashboard `read-only` role grants read access to all
          Dashboard scopes. Prefer a dedicated account and the narrowest custom role that covers the selected features.
      default_behavior:
        auto_detection:
          description: |
            Listener discovery can find Ceph Dashboard endpoints on port 8443, including container listeners, but it
            cannot discover credentials. A discovered job remains unavailable until Dashboard credentials are supplied.
        limits:
          description: |
            The default job performs one lightweight Dashboard identity probe every 10 seconds. All legacy metric
            features are disabled. Health, OSD, pool, and daemon Functions are enabled with 500-row limits; RGW
            Functions are disabled and limited to 100 rows when enabled. Per-OSD and per-pool charts are capped at 100
            selected entities each. OSD overflow aggregates additive capacity and rates plus arithmetic-mean latency,
            but omits binary per-OSD status. Pool overflow aggregates only object count; non-additive pool capacity and
            cumulative pool I/O are omitted. Selectors and caps bound Netdata chart/storage cardinality, not the
            complete Dashboard response or supported cluster size.
        performance_impact:
          description: |
            On all three supported releases, standalone `ceph-exporter` refreshes daemon/admin-socket metrics every 5
            seconds by default. The MGR Prometheus module refreshes its enabled cache every 15 seconds by default.
            Scrapes read these caches and do not schedule refresh work, so match scraper intervals to the configured
            producer periods to avoid duplicate or skipped cached samples. If the MGR Prometheus `cache` option is
            disabled, its metrics are instead collected in the scrape request path.

            Dashboard endpoints execute inside the active MGR. `/api/health/minimal` aggregates several subsystems;
            iSCSI status may synchronously contact gateways; OSD and pool detail grows with cluster size. These features
            are therefore opt-in and request-gated. RGW multisite topology and sync endpoints invoke `radosgw-admin`
            subprocesses on the active MGR; the Function is therefore opt-in, on-demand, and bounded.

            Disabling `collect.dashboard_api_status` also disables its per-cycle identity probe. The collector obtains
            the cluster identity once for chart labels and Functions, then reuses it for that job.
    setup:
      prerequisites:
        list:
          - title: Enable and secure the Ceph Dashboard module
            description: |
              Enable Ceph Dashboard on the MGRs, configure TLS, and make the active/standby Dashboard addresses
              reachable from the Netdata node that will run this once-per-cluster job.
          - title: Create a read-only Dashboard account
            description: |
              Create a dedicated Ceph Dashboard user. Assign the built-in `read-only` role or a custom role with read
              permissions for only the scopes needed by the enabled features. Store its password in a protected Netdata
              configuration file or provide an externally managed bearer token through `bearer_token_file`.
          - title: Place collectors according to the Ceph topology
            description: |
              Run a Netdata Child on each Ceph host when host-local system and `ceph-exporter` telemetry is wanted. Run
              one native Dashboard job and one MGR Prometheus scrape per Ceph cluster. Stream children to on-prem
              Parents for consolidated retention while preserving node, site, cluster, and job labels. Children and
              Parents have independent retention; collection continues locally during a Parent outage and history is
              replicated after reconnect.

              Netdata Cloud Rooms are access and presentation views; they do not move the physical collection job or
              its Function execution. For two sites, one Space can contain a Room per site plus a consolidated Room;
              one node can belong to multiple Rooms but only one Space. A single job placement does not automatically
              fail over if its Netdata node fails, so use a stable endpoint and design active/passive collection when
              that availability is required.

              Raw metric samples remain on Agents/Parents, but Cloud stores infrastructure metadata and alert
              configuration, and user-driven metric queries and Function results transit Cloud. For strict
              zero-offshore or LGPD contractual requirements, use on-prem storage and local access; confirm any Cloud
              region/residency commitment contractually rather than inferring it from Rooms or Spaces.
      configuration:
        file:
          name: go.d/ceph.conf
        options:
          description: |
            Options apply per job. The collector uses Dashboard JSON/JWT authentication, not HTTP Basic authentication.
            `timeout: 0` inside a Function inherits the job HTTP timeout.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              description: >-
                Periodic metric interval in seconds; it does not change standalone ceph-exporter's 5-second default
                refresh or the MGR Prometheus module's 15-second default cache refresh.
              default_value: 10
              required: false
              group: Collection
            - name: autodetection_retry
              description: Retry interval in seconds for a failed auto-detected job; zero disables retries.
              default_value: 0
              required: false
              group: Collection
            - name: function_only
              description: Run only on-demand Functions; every `collect.*` option must then be disabled.
              default_value: false
              required: false
              group: Collection
            - name: collect.dashboard_api_status
              description: Chart Dashboard API, authentication, and active-MGR reachability.
              default_value: true
              required: false
              group: Periodic metrics
            - name: collect.health_status
              description: Collect the high-level Ceph health status from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.hosts
              description: Collect the Dashboard host count from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.monitors
              description: Collect the monitor count from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.osds_summary
              description: Collect cluster OSD count and up/down/in/out totals from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.managers
              description: Collect active and standby MGR counts from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.object_gateways
              description: Collect the RGW daemon count from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.iscsi_gateways
              description: Collect iSCSI gateway status; Ceph may synchronously contact gateways.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.capacity
              description: Collect raw cluster capacity from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.objects
              description: Collect logical object count and the Dashboard-native object-copy health distribution.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.pools_summary
              description: Collect the cluster pool count from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.pgs
              description: Collect PG totals, per-OSD ratio, and compatibility status categories.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.client_io
              description: Collect cluster client throughput and operations from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.recovery
              description: Collect cluster recovery throughput from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.scrub_status
              description: Collect the cluster scrub scheduler status from `/api/health/minimal`.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.osds
              description: Collect paginated per-OSD status, capacity, rates, and latency.
              default_value: false
              required: false
              group: Periodic metrics
            - name: collect.pools
              description: Collect per-pool capacity, object, I/O, and IOPS metrics.
              default_value: false
              required: false
              group: Periodic metrics
            - name: osd_selector
              description: Simple-pattern selector matched against `osd.<id>` or OSD UUID before the cap.
              default_value: "*"
              required: false
              group: Cardinality
            - name: max_osds
              description: >-
                Maximum selected OSDs with individual charts. Overflow aggregates capacity and rates plus mean latency
                as a stable `other` entity; binary per-OSD status is omitted. This is not a supported-cluster-size cap.
              default_value: 100
              required: false
              group: Cardinality
            - name: pool_selector
              description: Simple-pattern selector matched against pool names before the cap.
              default_value: "*"
              required: false
              group: Cardinality
            - name: max_pools
              description: >-
                Maximum selected pools with individual charts. Overflow object counts are aggregated as `other`;
                non-additive capacity and cumulative I/O are omitted.
              default_value: 100
              required: false
              group: Cardinality
            - name: functions.health.disabled
              description: Disable the detailed health/RCA Function.
              default_value: false
              required: false
              group: Functions
            - name: functions.health.timeout
              description: Health Function timeout in seconds; zero inherits the job timeout.
              default_value: 0
              required: false
              group: Functions
            - name: functions.health.limit
              description: Maximum health rows.
              default_value: 500
              required: false
              group: Functions
            - name: functions.osds.disabled
              description: Disable the OSD inventory Function.
              default_value: false
              required: false
              group: Functions
            - name: functions.osds.timeout
              description: OSD Function timeout in seconds; zero inherits the job timeout.
              default_value: 0
              required: false
              group: Functions
            - name: functions.osds.limit
              description: Maximum OSD rows.
              default_value: 500
              required: false
              group: Functions
            - name: functions.pools.disabled
              description: Disable the pool policy Function.
              default_value: false
              required: false
              group: Functions
            - name: functions.pools.timeout
              description: Pool Function timeout in seconds; zero inherits the job timeout.
              default_value: 0
              required: false
              group: Functions
            - name: functions.pools.limit
              description: Maximum pool rows.
              default_value: 500
              required: false
              group: Functions
            - name: functions.daemons.disabled
              description: Disable the orchestrator-backed daemon inventory Function.
              default_value: false
              required: false
              group: Functions
            - name: functions.daemons.timeout
              description: Daemon Function timeout in seconds; zero inherits the job timeout.
              default_value: 0
              required: false
              group: Functions
            - name: functions.daemons.limit
              description: Maximum daemon rows.
              default_value: 500
              required: false
              group: Functions
            - name: functions.rgw_multisite.disabled
              description: Disable opt-in RGW topology and best-effort sync diagnostics.
              default_value: true
              required: false
              group: RGW Functions
            - name: functions.rgw_multisite.timeout
              description: RGW multisite Function timeout in seconds; zero inherits the job timeout.
              default_value: 0
              required: false
              group: RGW Functions
            - name: functions.rgw_multisite.limit
              description: Maximum RGW multisite rows.
              default_value: 100
              required: false
              group: RGW Functions
            - name: functions.rgw_quotas.disabled
              description: Disable explicit RGW user, bucket, and account quota lookups.
              default_value: true
              required: false
              group: RGW Functions
            - name: functions.rgw_quotas.timeout
              description: RGW quota Function timeout in seconds; zero inherits the job timeout.
              default_value: 0
              required: false
              group: RGW Functions
            - name: functions.rgw_quotas.limit
              description: Maximum total configured quota identities and returned rows.
              default_value: 100
              required: false
              group: RGW Functions
            - name: functions.rgw_quotas.users
              description: Explicit RGW user IDs to query; the collector never lists all users.
              default_value: "[]"
              required: false
              group: RGW Functions
            - name: functions.rgw_quotas.buckets
              description: Explicit RGW bucket IDs to query; the collector never lists all buckets.
              default_value: "[]"
              required: false
              group: RGW Functions
            - name: functions.rgw_quotas.accounts
              description: Explicit RGW account IDs to query; accounts require Tentacle.
              default_value: "[]"
              required: false
              group: RGW Functions
            - name: url
              description: Base URL of a Ceph Dashboard API endpoint.
              default_value: https://127.0.0.1:8443
              required: true
              group: Target
            - name: timeout
              description: HTTP request timeout in seconds; must be at least 0.5 so every Dashboard call is bounded.
              default_value: 15
              required: false
              group: Target
            - name: username
              description: Username for Ceph Dashboard JSON login; required with `password` unless a bearer-token file is used.
              default_value: ""
              required: false
              group: Authentication
            - name: password
              description: Password for Ceph Dashboard JSON login; required with `username` unless a bearer-token file is used.
              default_value: ""
              required: false
              group: Authentication
            - name: bearer_token_file
              description: Externally managed bearer-token file; takes priority over username/password.
              default_value: ""
              required: false
              group: Authentication
            - name: not_follow_redirects
              description: Reject redirects instead of performing secure active-MGR discovery.
              default_value: false
              required: false
              group: Request
            - name: allowed_redirect_origins
              description: Exact trusted active-MGR origins; the configured URL origin is always trusted.
              detailed_description: |
                Cross-origin redirects are rejected unless the destination is listed as `scheme://host:port`. After a
                credentialless discovery request, only a trusted origin may receive Dashboard login credentials or a
                bearer token. List every possible MGR Dashboard origin and validate TLS with a cluster CA.
              default_value: "[]"
              required: false
              group: Request
            - name: headers
              description: Additional HTTP headers; Authorization, Cookie, and Host are rejected.
              default_value: ""
              required: false
              group: Request
            - name: force_http2
              description: Force HTTP/2, including h2c over plain TCP.
              default_value: false
              required: false
              group: Request
            - name: tls_skip_verify
              description: Skip server certificate and hostname verification; insecure.
              default_value: true
              required: false
              group: TLS
            - name: tls_ca
              description: Absolute path to a CA bundle used to validate the Dashboard certificate.
              default_value: ""
              required: false
              group: TLS
            - name: tls_cert
              description: Absolute path to a client certificate for mTLS.
              default_value: ""
              required: false
              group: TLS
            - name: tls_key
              description: Absolute path to the client private key for mTLS.
              default_value: ""
              required: false
              group: TLS
            - name: proxy_url
              description: HTTP proxy URL; empty uses standard proxy environment variables.
              default_value: ""
              required: false
              group: Proxy
            - name: proxy_username
              description: Proxy authentication username.
              default_value: ""
              required: false
              group: Proxy
            - name: proxy_password
              description: Proxy authentication password.
              default_value: ""
              required: false
              group: Proxy
            - name: vnode
              description: Associate charts with a Virtual Node; Functions stay on the physical Agent job.
              default_value: ""
              required: false
              group: Virtual Node
        examples:
          folding:
            title: Config examples
            enabled: true
          list:
            - name: Complementary once-per-cluster job
              description: Default periodic Dashboard status plus bounded non-RGW Functions.
              config: |
                jobs:
                  - name: ceph-site-a
                    url: https://ceph-mgr.example:8443
                    username: netdata
                    password: change-me
            - name: Function-only control-plane job
              description: No periodic Dashboard charts; query RCA and inventory on demand.
              config: |
                jobs:
                  - name: ceph-control-plane
                    url: https://ceph-mgr.example:8443
                    username: netdata
                    password: change-me
                    function_only: true
                    collect:
                      dashboard_api_status: false
            - name: Opt-in bounded native metrics
              description: Enable selected legacy native charts when the Prometheus equivalents are not collected.
              config: |
                jobs:
                  - name: ceph-native-detail
                    url: https://ceph-mgr.example:8443
                    username: netdata
                    password: change-me
                    collect:
                      dashboard_api_status: true
                      health_status: true
                      capacity: true
                      pgs: true
                      osds: true
                    osd_selector: "osd.* !osd.0"
                    max_osds: 50
            - name: Explicit RGW quota targets
              description: Query only named RGW identities; no tenant-wide enumeration occurs.
              config: |
                jobs:
                  - name: ceph-rgw
                    url: https://ceph-mgr.example:8443
                    username: netdata
                    password: change-me
                    functions:
                      rgw_quotas:
                        disabled: false
                        limit: 20
                        users: [tenant-a$user-a]
                        buckets: [tenant-a/bucket-a]
                        accounts: [account-a]
    troubleshooting:
      problems:
        list:
          - name: Legacy Ceph charts disappeared after upgrade
            description: |
              This is the intentional migration to complementary defaults. Jobs created by earlier collector versions
              had no `collect:` section and polled every legacy endpoint. They now keep only
              `collect.dashboard_api_status: true`; every overlapping or potentially expensive legacy feature defaults
              to false. Explicitly enable only the native features that are not already owned by the MGR Prometheus
              module or per-node `ceph-exporter` jobs.
          - name: Dashboard job follows a redirect but returns HTML
            description: |
              Do not put a generic reverse-proxy login page in front of the job. Configure `url` to a Ceph Dashboard
              endpoint. Leave `not_follow_redirects: false`, list every possible active MGR under
              `allowed_redirect_origins`, and configure CA verification. The collector reconstructs the API request but
              rejects untrusted origins, HTTPS downgrade, URL credentials, and redirect loops.
          - name: Optional charts or Functions are missing
            description: |
              Confirm that the corresponding `collect.*` feature or Function is enabled and that the Dashboard user has
              read permission for its scope. Permission-filtered sections are treated as unavailable; they are not
              emitted as healthy-looking zero values. The daemon Function also requires a configured Ceph orchestrator.
          - name: RGW data is incomplete
            description: |
              Quota usage is the cached/asynchronous value returned by Dashboard and may lag RGW activity. Configure
              explicit identities. Account lookups require Tentacle. Public RGW sync detail is unavailable on Reef.
              Request-level status codes, methods/endpoints, latency, and client attribution require RGW structured
              access logs; the Dashboard Admin API does not provide a truthful substitute.
          - name: Long retention or capacity planning is required
            description: |
              Retention is a Netdata storage/streaming policy, not a Ceph collector setting. Follow the
              [disk and retention sizing guide](/docs/netdata-agent/sizing-netdata-agents/disk-requirements-and-retention.md)
              and size dbengine tiers on the on-prem Parents for the required audit window. Stream the per-node and
              once-per-cluster jobs there. The default tier time caps are 14 days, 3 months, and 2 years with a 1 GiB
              quota per tier; actual retention is the earlier of the configured size or time limit, and all streamed
              children share each Parent tier quota. Re-size these tiers from measured Ceph cardinality before relying
              on them for an ISO 20000-1 trail.

              The collector reports current capacity; it does not emit a pool-fill forecast. Use retained history and
              the presentation/query layer for projections, and validate the model against planned growth and rebalance.
          - name: Existing Prometheus, Grafana, or Zabbix monitoring must remain
            description: |
              Coexist rather than replace by default. Keep Ceph Prometheus exporters and existing Grafana/Zabbix
              workflows while adding Netdata's high-resolution collection, streaming, Functions, and alerts. Prometheus
              can scrape Netdata, including child data hosted by a Parent, or Netdata can remote-write through a
              supported connector. Exported names are Netdata context-based and sanitized, so existing Grafana boards
              that expect original Ceph `ceph_*` series are not automatically compatible. On-demand Function tables are
              not Prometheus time series. Assign one paging owner per condition to avoid duplicate Netdata,
              Alertmanager, and Zabbix notifications.
          - name: A Ceph-specific Agent footprint estimate is required
            description: |
              The [Agent sizing guide](/docs/netdata-agent/sizing-netdata-agents/README.md) reports roughly 100-200 MiB
              and 1-5% of one core for an empty Agent, and about 250-350 MiB and 5-20% of one core in typical production
              use. These are not Ceph-specific guarantees. Measure the intended Child/Parent topology, enabled charts,
              streaming, and retention in a representative pilot before setting a capacity or SLA commitment.
          - name: More preconfigured Ceph alerts are expected
            description: |
              This integration ships alerts only for Dashboard API unavailability and the opt-in native capacity chart.
              Health Function rows are on-demand tables and do not create alerts. Keep Ceph mixin/Alertmanager rules for
              PG states, OSD down/out, MON quorum, slow operations, scrub errors, and RGW conditions unless equivalent
              Netdata alerts are explicitly implemented and tested. Slack, webhook, and PagerDuty are notification
              transports, not Ceph threshold definitions.
    alerts:
      - name: ceph_dashboard_api_unavailable
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/ceph.conf
        metric: ceph.dashboard_api_status
        info: 'Ceph Dashboard API for cluster ${label:fsid} is unavailable'
      - name: ceph_cluster_physical_capacity_utilization
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/ceph.conf
        metric: ceph.cluster_physical_capacity_utilization
        info: 'Ceph cluster ${label:fsid} disk space utilization'
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: |
        `ceph.dashboard_api_status` is enabled by default. Every other context is emitted only when its owning
        `collect.*` feature is enabled. Prefer Ceph Prometheus producers for overlapping continuous telemetry.
      availability: []
      scopes:
        - name: cluster
          description: These metrics refer to the entire Ceph cluster.
          labels:
            - name: fsid
              description: Unique Ceph cluster identifier.
          metrics:
            - name: ceph.dashboard_api_status
              description: Ceph Dashboard API Status
              unit: status
              chart_type: line
              dimensions: [{name: reachable}, {name: unreachable}]
            - name: ceph.cluster_status
              description: Ceph Cluster Status
              unit: status
              chart_type: line
              dimensions: [{name: ok}, {name: err}, {name: warn}]
            - name: ceph.cluster_hosts_count
              description: Ceph Cluster Hosts
              unit: hosts
              chart_type: line
              dimensions: [{name: hosts}]
            - name: ceph.cluster_monitors_count
              description: Ceph Cluster Monitors
              unit: monitors
              chart_type: line
              dimensions: [{name: monitors}]
            - name: ceph.cluster_osds_count
              description: Ceph Cluster OSDs
              unit: osds
              chart_type: line
              dimensions: [{name: osds}]
            - name: ceph.cluster_osds_by_status_count
              description: Ceph Cluster OSDs by Status
              unit: osds
              chart_type: line
              dimensions: [{name: up}, {name: down}, {name: in}, {name: out}]
            - name: ceph.cluster_managers_count
              description: Ceph Cluster Managers
              unit: managers
              chart_type: line
              dimensions: [{name: active}, {name: standby}]
            - name: ceph.cluster_object_gateways_count
              description: Ceph Cluster Object Gateways
              unit: gateways
              chart_type: line
              dimensions: [{name: object}]
            - name: ceph.cluster_iscsi_gateways_count
              description: Ceph Cluster iSCSI Gateways
              unit: gateways
              chart_type: line
              dimensions: [{name: iscsi}]
            - name: ceph.cluster_iscsi_gateways_by_status_count
              description: Ceph Cluster iSCSI Gateways by Status
              unit: gateways
              chart_type: line
              dimensions: [{name: up}, {name: down}]
            - name: ceph.cluster_physical_capacity_utilization
              description: Ceph Cluster Physical Capacity Utilization
              unit: percent
              chart_type: area
              dimensions: [{name: utilization}]
            - name: ceph.cluster_physical_capacity_usage
              description: Ceph Cluster Physical Capacity Usage
              unit: bytes
              chart_type: stacked
              dimensions: [{name: avail}, {name: used}]
            - name: ceph.cluster_objects_count
              description: Ceph Cluster Logical Objects
              unit: objects
              chart_type: line
              dimensions: [{name: objects}]
            - name: ceph.cluster_objects_by_status_distribution
              description: Ceph Cluster Object Health Ratios
              unit: percent
              chart_type: stacked
              dimensions: [{name: healthy}, {name: misplaced}, {name: degraded}, {name: unfound}]
            - name: ceph.cluster_pools_count
              description: Ceph Cluster Pools
              unit: pools
              chart_type: line
              dimensions: [{name: pools}]
            - name: ceph.cluster_pgs_count
              description: Ceph Cluster Placement Groups
              unit: pgs
              chart_type: line
              dimensions: [{name: pgs}]
            - name: ceph.cluster_pgs_by_status_count
              description: Ceph Cluster Placement Groups by Compatibility Category
              unit: pgs
              chart_type: stacked
              dimensions: [{name: clean}, {name: working}, {name: warning}, {name: unknown}]
            - name: ceph.cluster_pgs_per_osd_count
              description: Ceph Cluster Placement Groups per OSD
              unit: pgs
              chart_type: line
              dimensions: [{name: per_osd}]
            - name: ceph.cluster_client_io
              description: Ceph Cluster Client I/O
              unit: bytes/s
              chart_type: area
              dimensions: [{name: read}, {name: written}]
            - name: ceph.cluster_client_iops
              description: Ceph Cluster Client Operations
              unit: ops/s
              chart_type: line
              dimensions: [{name: read}, {name: write}]
            - name: ceph.cluster_recovery_throughput
              description: Ceph Cluster Recovery Throughput
              unit: bytes/s
              chart_type: line
              dimensions: [{name: recovery}]
            - name: ceph.cluster_scrub_status
              description: Ceph Cluster Scrubbing Status
              unit: status
              chart_type: line
              dimensions: [{name: disabled}, {name: active}, {name: inactive}]
        - name: osd
          description: >-
            These optional metrics refer to a selected OSD or the aggregate overflow entity. The overflow entity has
            capacity, I/O, IOPS, and arithmetic-mean latency charts, but no binary OSD status chart.
          labels:
            - name: fsid
              description: Unique Ceph cluster identifier.
            - name: osd_uuid
              description: OSD UUID or the stable aggregate overflow name (normally `other`).
            - name: osd_name
              description: OSD name.
            - name: device_class
              description: OSD CRUSH device class.
          metrics:
            - name: ceph.osd_status
              description: Ceph OSD Status
              unit: status
              chart_type: line
              dimensions: [{name: up}, {name: down}, {name: in}, {name: out}]
            - name: ceph.osd_space_usage
              description: Ceph OSD Space Usage
              unit: bytes
              chart_type: stacked
              dimensions: [{name: avail}, {name: used}]
            - name: ceph.osd_io
              description: Ceph OSD I/O Rate
              unit: bytes/s
              chart_type: area
              dimensions: [{name: read}, {name: written}]
            - name: ceph.osd_iops
              description: Ceph OSD Operation Rate
              unit: ops/s
              chart_type: line
              dimensions: [{name: read}, {name: write}]
            - name: ceph.osd_latency
              description: Ceph OSD Latency
              unit: milliseconds
              chart_type: line
              dimensions: [{name: commit}, {name: apply}]
        - name: pool
          description: These optional metrics refer to a selected pool or the aggregate overflow entity.
          labels:
            - name: fsid
              description: Unique Ceph cluster identifier.
            - name: pool_name
              description: Pool name, or the stable aggregate overflow name on the object-count context.
          metrics:
            - name: ceph.pool_space_utilization
              description: Ceph Pool Space Utilization
              unit: percent
              chart_type: area
              dimensions: [{name: utilization}]
            - name: ceph.pool_space_usage
              description: Ceph Pool Space Usage
              unit: bytes
              chart_type: stacked
              dimensions: [{name: avail}, {name: used}]
            - name: ceph.pool_objects_count
              description: Ceph Pool Objects
              unit: objects
              chart_type: line
              dimensions: [{name: objects}]
            - name: ceph.pool_io
              description: Ceph Pool I/O Rate
              unit: bytes/s
              chart_type: area
              dimensions: [{name: read}, {name: written}]
            - name: ceph.pool_iops
              description: Ceph Pool Operation Rate
              unit: ops/s
              chart_type: line
              dimensions: [{name: read}, {name: write}]
    functions:
      description: |
        Bounded on-demand tables for Ceph control-plane troubleshooting. They run on the physical Agent hosting the job,
        work without Netdata Cloud, and query Ceph only while requested. Public method names are namespaced by the
        framework, for example `ceph:health`; the IDs below are the collector method IDs.
      list:
        - id: health
          name: Ceph Health
          description: |
            Returns exact Ceph health-check codes, severity, mute state, affected counts, summaries, and bounded detail.
            Use it for MON quorum symptoms, slow operations, scrub/damage errors, PG warnings, and other current RCA data.
          parameters: []
          returns:
            description: >-
              One row per detailed health message, or one summary row when a check has no detail, ordered by severity
              and code.
            columns:
              - {name: id, type: string, unit: "", visibility: hidden, description: Unique row identifier.}
              - {name: code, type: string, unit: "", description: Ceph health-check code.}
              - {name: severity, type: string, unit: "", description: "Ceph HEALTH_OK, HEALTH_WARN, or HEALTH_ERR severity."}
              - {name: muted, type: boolean, unit: "", description: Whether Ceph muted the health check.}
              - {name: summary, type: string, unit: "", description: Health-check summary.}
              - {name: count, type: integer, unit: items, description: Affected item count.}
              - {name: detail, type: string, unit: "", description: Bounded detailed health-check message.}
              - {name: detail_truncated, type: boolean, unit: "", visibility: hidden, description: Summary or detail text was truncated.}
              - {name: truncated, type: boolean, unit: "", visibility: hidden, description: Result exceeded its row limit.}
          performance: >-
            Dashboard builds every permission-dependent `/api/health/minimal` section per invocation; it cannot return
            only health checks, and iSCSI read scope can trigger synchronous gateway pings. The minimal route carries the
            same detailed checks as the full route without its larger payload. The collector retains only the configured
            row limit plus one look-ahead row and truncates long summary/detail cells. Use a narrow Dashboard role to
            avoid unrelated sections when appropriate.
          security: Health detail can expose daemon, host, pool, and client identifiers. Restrict Function access to operators.
          availability: Requires the Function to be enabled and Dashboard read permission for health-related scopes.
          require_cloud: false
        - id: osds
          name: Ceph OSDs
          description: Returns bounded, paginated OSD state, topology, capacity, current rates, and latency for RCA.
          parameters: []
          returns:
            description: One row per OSD up to the configured limit, ordered by numeric OSD ID.
            columns:
              - {name: uuid, type: string, unit: "", visibility: hidden, description: OSD UUID.}
              - {name: id, type: integer, unit: "", description: Numeric OSD ID.}
              - {name: name, type: string, unit: "", description: OSD name.}
              - {name: host, type: string, unit: "", description: OSD host.}
              - {name: device_class, type: string, unit: "", description: CRUSH device class.}
              - {name: up, type: boolean, unit: "", description: Whether the OSD is up.}
              - {name: in, type: boolean, unit: "", description: Whether the OSD is in.}
              - {name: operational_status, type: string, unit: "", description: Orchestrator operational status.}
              - {name: total_bytes, type: integer, unit: bytes, visibility: hidden, description: Total OSD capacity.}
              - {name: used_bytes, type: integer, unit: bytes, description: Used OSD capacity.}
              - {name: available_bytes, type: integer, unit: bytes, description: Available OSD capacity.}
              - {name: utilization, type: float, unit: percent, description: OSD utilization.}
              - {name: read_bytes_per_sec, type: float, unit: bytes/s, visibility: hidden, description: Current read rate.}
              - {name: write_bytes_per_sec, type: float, unit: bytes/s, visibility: hidden, description: Current write rate.}
              - {name: read_ops_per_sec, type: float, unit: ops/s, visibility: hidden, description: Current read operation rate.}
              - {name: write_ops_per_sec, type: float, unit: ops/s, visibility: hidden, description: Current write operation rate.}
              - {name: commit_latency_ms, type: float, unit: milliseconds, visibility: hidden, description: Commit latency.}
              - {name: apply_latency_ms, type: float, unit: milliseconds, visibility: hidden, description: Apply latency.}
              - {name: truncated, type: boolean, unit: "", visibility: hidden, description: Result exceeded its row limit.}
          performance: Paginates `/api/osd` only until the configured row bound can be determined.
          security: Exposes OSD UUIDs, host names, device classes, and storage usage. Restrict access to operators.
          availability: Requires the Function to be enabled and Dashboard read permission for the OSD scope.
          require_cloud: false
        - id: pools
          name: Ceph Pools
          description: Returns pool replication/EC policy, PG settings, CRUSH placement, applications, flags, and quotas.
          parameters: []
          returns:
            description: One row per pool up to the configured limit, ordered by pool name.
            columns:
              - {name: name, type: string, unit: "", description: Pool name.}
              - {name: type, type: string, unit: "", description: Replicated or erasure-coded pool type.}
              - {name: size, type: integer, unit: copies, description: Replica or EC shard count; null when unavailable.}
              - {name: min_size, type: integer, unit: copies, description: Minimum available copies; null when unavailable.}
              - {name: pg_num, type: integer, unit: PGs, description: Placement-group count; null when unavailable.}
              - {name: pgp_num, type: integer, unit: PGs, visibility: hidden, description: Placement-group count used for placement; null when unavailable.}
              - {name: pg_autoscale_mode, type: string, unit: "", description: PG autoscaler mode.}
              - {name: crush_rule, type: string, unit: "", description: CRUSH rule.}
              - {name: crush_root, type: string, unit: "", description: CRUSH root.}
              - {name: failure_domain, type: string, unit: "", description: CRUSH failure domain.}
              - {name: device_class, type: string, unit: "", description: CRUSH device class.}
              - {name: applications, type: string, unit: "", description: Enabled pool applications.}
              - {name: erasure_profile, type: string, unit: "", visibility: hidden, description: Erasure-code profile.}
              - {name: quota_max_bytes, type: integer, unit: bytes, visibility: hidden, description: Pool byte quota; null when unavailable.}
              - {name: quota_max_objects, type: integer, unit: objects, visibility: hidden, description: Pool object quota; null when unavailable.}
              - {name: flags, type: string, unit: "", visibility: hidden, description: Pool flags.}
              - {name: truncated, type: boolean, unit: "", visibility: hidden, description: Result exceeded its row limit.}
          performance: >-
            Dashboard returns the full pool and CRUSH-rule lists per invocation. The collector validates and sorts
            those lists for deterministic selection, then bounds detailed row construction and output to the configured
            limit plus one look-ahead row. It does not request pool statistics or histories.
          security: Pool names, applications, placement policy, and quotas may reveal tenant or workload organization.
          availability: Requires the Function to be enabled and Dashboard read permission for pool and OSD/CRUSH data.
          require_cloud: false
        - id: daemons
          name: Ceph Daemons
          description: Returns orchestrator-reported daemon type, placement, status, version, and image inventory.
          parameters: []
          returns:
            description: One row per orchestrator daemon up to the configured limit.
            columns:
              - {name: id, type: string, unit: "", visibility: hidden, description: Unique daemon row identifier.}
              - {name: type, type: string, unit: "", description: Daemon type.}
              - {name: name, type: string, unit: "", description: Daemon name.}
              - {name: host, type: string, unit: "", description: Daemon host.}
              - {name: status, type: string, unit: "", description: Daemon status.}
              - {name: active, type: boolean, unit: "", description: Whether the daemon is active; null when Dashboard does not report it.}
              - {name: version, type: string, unit: "", description: Ceph version.}
              - {name: image, type: string, unit: "", visibility: hidden, description: Container image.}
              - {name: last_refresh, type: string, unit: "", visibility: hidden, description: Inventory refresh timestamp.}
              - {name: placement, type: string, unit: "", visibility: hidden, description: Orchestrator placement.}
              - {name: truncated, type: boolean, unit: "", visibility: hidden, description: Result exceeded its row limit.}
          performance: >-
            Dashboard may return the full orchestrator daemon list per invocation. The collector validates and sorts
            that list for deterministic selection, then bounds row construction and output to the configured limit plus
            one look-ahead row.
          security: Exposes host names, daemon placement, versions, and container images.
          prerequisites:
            list:
              - title: Configure a Ceph orchestrator
                description: The Dashboard daemon endpoint requires an active orchestrator with daemon-list support.
          availability: Requires the Function to be enabled, an active Ceph orchestrator, and Dashboard hosts-scope read permission.
          require_cloud: false
        - id: rgw-multisite
          name: Ceph RGW Multisite
          description: |
            Opt-in realm, zonegroup, and zone inventory plus bounded best-effort daemon sync diagnostics. Sync diagnostics
            are capability-detected; the public API is unavailable on Reef and `radosgw-admin` failures remain local rows.
          parameters: []
          returns:
            description: Bounded RGW topology and sync rows ordered realm, zonegroup, zone, sync, then by name.
            columns:
              - {name: id, type: string, unit: "", visibility: hidden, description: Unique row identifier.}
              - {name: kind, type: string, unit: "", description: "Realm, zonegroup, zone, or sync row."}
              - {name: name, type: string, unit: "", description: RGW object or daemon name.}
              - {name: default, type: boolean, unit: "", description: Whether Ceph identifies the object as default; null when not applicable or unavailable.}
              - {name: realm, type: string, unit: "", description: Realm name.}
              - {name: zonegroup, type: string, unit: "", description: Zonegroup name.}
              - {name: master, type: boolean, unit: "", description: Zonegroup master flag or zone-to-master-zone relationship; null when not applicable or unavailable.}
              - {name: endpoints, type: string, unit: "", visibility: hidden, description: Configured endpoints.}
              - {name: sync_status, type: string, unit: "", description: Best-effort sync status.}
              - {name: sync_detail, type: string, unit: "", visibility: hidden, description: Bounded best-effort sync detail.}
              - {name: sync_detail_truncated, type: boolean, unit: "", visibility: hidden, description: Sync text was truncated.}
              - {name: release_scope, type: string, unit: "", visibility: hidden, description: Release/API capability note.}
              - {name: truncated, type: boolean, unit: "", visibility: hidden, description: Result exceeded its row limit.}
          performance: >-
            Each realm, zonegroup, and zone list/detail lookup invokes `radosgw-admin` on the active MGR. The Function
            reads the full name lists and then performs bounded point-detail lookups. Sync diagnostics invoke another
            `radosgw-admin` command and are capped at ten daemons selected deterministically. A daemon-inventory failure
            is returned as one safe sync-status row.
          security: Exposes multisite names and endpoints. Enable only when these identifiers may be viewed by operators.
          prerequisites:
            list:
              - title: Enable the RGW multisite Function
                description: >-
                  Set `functions.rgw_multisite.disabled: false`, grant Dashboard RGW read permission, and configure RGW
                  multisite when topology rows are expected.
          availability: Disabled by default. Requires Dashboard RGW read permission; public sync detail requires Squid or Tentacle.
          require_cloud: false
        - id: rgw-quotas
          name: Ceph RGW Quotas
          description: |
            Opt-in point lookups for explicitly configured RGW users, buckets, and accounts. Returns only whitelisted
            identity, owner, cached usage, object count, quota, and freshness fields; access/secret keys are never emitted.
          parameters: []
          returns:
            description: One row per configured RGW identity up to the configured limit.
            columns:
              - {name: key, type: string, unit: "", visibility: hidden, description: Kind-qualified unique row identifier.}
              - {name: id, type: string, unit: "", description: Configured RGW identity.}
              - {name: kind, type: string, unit: "", description: "User, bucket, or account."}
              - {name: status, type: string, unit: "", description: Point-lookup status.}
              - {name: tenant, type: string, unit: "", description: RGW tenant.}
              - {name: account, type: string, unit: "", description: RGW account.}
              - {name: owner, type: string, unit: "", description: Bucket or account owner.}
              - {name: used_bytes, type: integer, unit: bytes, description: Cached quota usage; null when unavailable.}
              - {name: objects, type: integer, unit: objects, description: Cached object count; null when unavailable.}
              - {name: quota_enabled, type: boolean, unit: "", description: Whether the quota is enabled; null when unavailable.}
              - {name: quota_max_bytes, type: integer, unit: bytes, description: Quota byte limit; null when unavailable.}
              - {name: quota_max_objects, type: integer, unit: objects, description: Quota object limit; null when unavailable.}
              - {name: utilization, type: float, unit: percent, description: Usage against an enabled byte quota; null when unavailable.}
              - {name: stats_freshness, type: string, unit: "", visibility: hidden, description: Dashboard cache freshness semantics.}
              - {name: truncated, type: boolean, unit: "", visibility: hidden, description: Result exceeded its row limit.}
          performance: |
            Performs only configured point lookups; it never lists all users, buckets, or accounts. A Dashboard bucket
            detail lookup also gathers versioning, encryption, policy, ACL, locking, and release-dependent settings, so
            each configured bucket is more expensive than a quota-only read. Keep the target list and limit small.
          security: RGW tenant, user, bucket, account, owner, and quota values may be customer data. Restrict configuration and access.
          prerequisites:
            list:
              - title: Enable the RGW quota Function and select identities
                description: >-
                  Set `functions.rgw_quotas.disabled: false` and configure at least one explicit `users`, `buckets`, or
                  `accounts` entry. The combined deduplicated target count must not exceed the Function limit.
          availability: Disabled by default and requires explicit targets plus Dashboard RGW read permission; accounts require Tentacle.
          require_cloud: false
