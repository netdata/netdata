plugin_name: go.d.plugin
modules:
  - meta:
      id: collector-go.d.plugin-intelgpu
      plugin_name: go.d.plugin
      module_name: intelgpu
      monitored_instance:
        name: Intel GPU
        link: https://www.intel.com/
        icon_filename: microchip.svg
        categories:
          - data-collection.hardware-and-sensors
      keywords:
        - intel
        - gpu
        - hardware
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: ""
    overview:
      data_collection:
        metrics_description: |
          This collector gathers performance metrics for Intel integrated GPUs.
        method_description: |
          The collector runs the [`intel_gpu_top`](https://manpages.debian.org/testing/intel-gpu-tools/intel_gpu_top.1.en.html) CLI tool through `ndsudo`, a Netdata helper that runs a fixed set of privileged commands, so `intel_gpu_top` needs no CAP_PERFMON capability grant.
          Each job keeps `intel_gpu_top` running as root, sampling the GPU every 0.9 to 2.5 seconds depending on `update_every`, and charts its latest sample.
      supported_platforms:
        include: []
        exclude: []
      multi_instance: true
      additional_permissions:
        description: ""
      default_behavior:
        auto_detection:
          description: ""
        limits:
          description: |
            - If `intel_gpu_top` exits or stops printing samples, the charts show a gap after two sampling intervals instead of repeating the last values, and the collector restarts it.
            - Netdata runs unprivileged and cannot stop an `intel_gpu_top` that hangs without printing anything. The gap then lasts until that process ends (see Troubleshooting).
        performance_impact:
          description: ""
    setup:
      prerequisites:
        list:
          - title: Install intel-gpu-tools
            description: Install `intel-gpu-tools` using your distribution's package manager.
      configuration:
        file:
          name: go.d/intelgpu.conf
        options:
          description: |
            The following options can be defined globally: update_every.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              description: Data collection frequency.
              default_value: 1
              required: false
            - name: device
              description: 'Select a specific GPU using [supported filter](https://manpages.debian.org/testing/intel-gpu-tools/intel_gpu_top.1.en.html#DESCRIPTION).'
              default_value: ""
              required: false
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Custom update_every
              description: Allows you to override the default data collection interval.
              config: |
                jobs:
                  - name: intelgpu
                    update_every: 5  # Collect Intel iGPU metrics every 5 seconds
    troubleshooting:
      errors:
        list:
          - error: "intel_gpu_top exited: exit status 4"
            cause: "`ndsudo` did not find `intel_gpu_top` in its fixed search path (`/bin`, `/sbin`, `/usr/bin`, `/usr/sbin`, `/usr/local/bin`, `/usr/local/sbin`): `intel-gpu-tools` is not installed, or is installed elsewhere."
            fix: Install `intel-gpu-tools` with your distribution's package manager, as described in Prerequisites.
          - error: "intel_gpu_top exited: exit status 1"
            cause: "`intel_gpu_top` itself failed: the host has no Intel GPU it supports (it does not support Xe GPUs), the `device` filter matched no GPU, or the kernel does not provide the GPU's performance counters."
            fix: |
              Run `sudo intel_gpu_top -L` to list the GPUs and compare them with `device`, then run `sudo intel_gpu_top -J -s 1000` (add `-d` and the `device` value if set) and read its error message.
          - error: "intel_gpu_top exited: exit status 2"
            cause: "The `device` value contains characters that `ndsudo` rejects. It accepts letters, digits, spaces, and `_ - / . , : =`."
            fix: Correct the `device` value. Filters such as `pci:vendor=8086,card=0` or `drm:/dev/dri/card0` are accepted.
          - error: "intel_gpu_top exited: exit status 7"
            cause: "`ndsudo` could not switch to root: its setuid permission was lost, or the Netdata service runs with `NoNewPrivileges` enabled."
            fix: Reinstall Netdata to restore the permissions of `ndsudo`, and do not enable `NoNewPrivileges` for the Netdata service.
          - error: "start intel_gpu_top: `error`"
            cause: Netdata could not start its privileged command helper, `ndsudo`.
            fix: Read the error text. If `ndsudo` is missing or cannot be executed, repair or reinstall Netdata.
          - error: "intel_gpu_top source unavailable: `error`"
            cause: The running `intel_gpu_top` exited or stopped printing samples. Netdata keeps restarting it, at most 30 seconds apart.
            fix: |
              Compare the error text with the entries above. `intel_gpu_top stopped producing records` means it kept running without printing complete samples; run `sudo intel_gpu_top -J -s 1000` to see its output.
          - error: "intel_gpu_top has not exited `duration` after termination; no replacement starts until it does"
            cause: "`intel_gpu_top` hangs without printing anything. It runs as root, so Netdata cannot stop it, and the collector starts no new `intel_gpu_top` while it runs. The charts show a gap until then."
            fix: |
              Stop the hung process as root; the collector then starts a new one. Find it with `pgrep -a intel_gpu_top` (the collector's runs with `-J -s`) and run `sudo kill` with its process ID.
          - error: no fresh intel_gpu_top sample
            cause: Netdata has not received a complete `intel_gpu_top` sample within the last two sampling intervals, usually because `intel_gpu_top` is starting, has stopped, or is being restarted.
            fix: If the error persists, look for `intel_gpu_top source unavailable` or `has not exited` messages in the collector log (see Diagnostics).
    alerts: []
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: ""
      availability: []
      scopes:
        - name: global
          description: These metrics refer to the Intel GPU.
          labels: []
          metrics:
            - name: intelgpu.frequency
              description: Intel GPU frequency
              unit: MHz
              chart_type: line
              dimensions:
                - name: frequency
            - name: intelgpu.power
              description: Intel GPU power
              unit: Watts
              chart_type: line
              dimensions:
                - name: gpu
                - name: package
        - name: engine
          description: These metrics refer to the GPU hardware engine.
          labels:
            - name: engine_class
              description: Engine class (Render/3D, Blitter, VideoEnhance, Video, Compute).
            - name: engine_instance
              description: Engine instance (e.g. Render/3D/0, Video/0, Video/1).
          metrics:
            - name: intelgpu.engine_busy_perc
              description: Intel GPU engine busy time percentage
              unit: percentage
              chart_type: line
              dimensions:
                - name: busy
