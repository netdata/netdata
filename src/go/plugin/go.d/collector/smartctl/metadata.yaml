plugin_name: go.d.plugin
modules:
  - meta:
      id: collector-go.d.plugin-smartctl
      plugin_name: go.d.plugin
      module_name: smartctl
      monitored_instance:
        name: S.M.A.R.T.
        link: "https://linux.die.net/man/8/smartd"
        icon_filename: "smart.png"
        categories:
          - data-collection.storage
      keywords:
        - smart
        - S.M.A.R.T.
        - SCSI devices
        - ATA devices
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: ""
    overview:
      data_collection:
        metrics_description: |
          This collector monitors the health status of storage devices by analyzing S.M.A.R.T. (Self-Monitoring, Analysis, and Reporting Technology) counters.
          It relies on the `smartctl` CLI tool from smartmontools. On Unix-like systems, it uses `ndsudo`, a Netdata helper designed to run privileged commands securely without configuring `sudo`. On Windows, the collector executes `smartctl` directly.

          Executed commands:
          -  `smartctl --json --scan`
          -  `smartctl --json --scan-open`
          -  `smartctl --json --xall --device {deviceType} --nocheck {powerMode} {deviceName}`
        method_description: ""
      supported_platforms:
        include: [Linux, BSD, Windows, macOS]
        exclude: []
      multi_instance: false
      additional_permissions:
        description: ""
      default_behavior:
        auto_detection:
          description: ""
        limits:
          description: ""
        performance_impact:
          description: ""
    setup:
      prerequisites:
        list:
          - title: Install smartmontools (v7.0+)
            description: |
              Install `smartmontools` version 7.0 or later using your operating system's package manager. Version 7.0 introduced the `--json` output mode, which is required for this collector to function properly.

              On macOS, Netdata runs `smartctl` through the setuid `ndsudo` helper. The `smartctl` binary must be found in `ndsudo`'s search PATH (`/bin`, `/sbin`, `/usr/bin`, `/usr/sbin`, `/usr/local/bin`, `/usr/local/sbin`, `/opt/homebrew/bin`, `/opt/homebrew/sbin`); install it via a package manager that places it in one of those directories. Apple internal NVMe/Apple Fabric storage may still not expose detailed SMART data through smartmontools even when the tool is installed.
          - title: For Netdata running in a Docker container
            description: |
              **Provide access to storage devices**.

              Netdata requires the `SYS_RAWIO` capability and access to the storage devices to run the `smartctl` collector inside a Docker container. Here's how you can achieve this:

              - `docker run`

                ```bash
                docker run --cap-add SYS_RAWIO --device /dev/sda:/dev/sda ...
                ```

              - `docker-compose.yml`

                ```yaml
                services:
                  netdata:
                    cap_add:
                      - SYS_PTRACE
                      - SYS_ADMIN
                      - SYS_RAWIO # smartctl
                    devices:
                      - "/dev/sda:/dev/sda"
                ```

              > **Multiple Devices**: These examples only show mapping of one device (/dev/sda). You'll need to add additional `--device` options (in docker run) or entries in the `devices` list (in docker-compose.yml) for each storage device you want Netdata's smartctl collector to monitor.

              > **NVMe Devices**: Do not map NVMe devices using this method. Netdata uses a [dedicated collector](https://github.com/netdata/netdata/tree/master/src/go/plugin/go.d/collector/nvme#readme) to monitor NVMe devices on Linux/BSD. On macOS, `macos.plugin` provides native NVMe health metrics when IOKit exposes readable SMART-capable NVMe services.
      configuration:
        file:
          name: go.d/smartctl.conf
        options:
          description: |
            The following options can be defined globally: update_every.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              description: Netdata chart update interval (seconds). Collector may use cached data if this is less than **poll_devices_every**.
              default_value: 10
              required: false
              group: Base
            - name: timeout
              description: "`smartctl` binary execution timeout (seconds)."
              default_value: 5
              required: false
              group: Base
            - name: scan_every
              description: Device discovery interval using `smartctl --scan` (seconds). Set 0 to scan only once at startup.
              default_value: 900
              required: false
              group: Base
            - name: poll_devices_every
              description: Device polling interval (seconds). Data is cached for this interval.
              default_value: 300
              required: false
              group: Base
            - name: no_check_power_mode
              description: "Skip data collection when device is in low-power mode (avoids unnecessary spin-up)."
              default_value: standby
              required: false
              group: Base
              detailed_description: |
                Valid arguments:

                | Mode    | Description                                                                                                                                                                            |
                |---------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
                | never   | Check the device always.                                                                                                                                                               |
                | sleep   | Skip check if device is in SLEEP mode.                                                                                                                                                 |
                | standby | Skip check if device is in SLEEP or STANDBY mode (prevents spin-up).                                                                                                                   |
                | idle    | Skip check if device is in SLEEP, STANDBY, or IDLE mode (not recommended since disks may still be spinning).                                                                           |
            - name: concurrent_scans
              description: "Number of devices to poll concurrently. Set 0 for sequential polling (default)."
              default_value: 0
              required: false
              group: Base

            - name: device_selector
              description: "Pattern to match the 'info name' of devices as reported by `smartctl --scan --json`."
              default_value: "*"
              required: false
              group: Devices
            - name: extra_devices
              description: "Manually specify devices not auto-detected by `smartctl --scan`. Each entry must include both a name and a type."
              default_value: "[]"
              required: false
              group: Devices
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Custom devices poll interval
              description: Allows you to override the default devices poll interval (data collection).
              config: |
                jobs:
                  - name: smartctl
                    poll_devices_every: 60  # Collect S.M.A.R.T statistics every 60 seconds
            - name: Concurrent polling for multiple devices
              description: |
                This example enables concurrent device polling when monitoring many devices.
              config: |
                jobs:
                  - name: smartctl
                    concurrent_scans: 4  # Poll up to 4 devices concurrently
            - name: Extra devices
              description: |
                This example demonstrates using `extra_devices` to manually add a storage device (`/dev/sdc`) not automatically detected by `smartctl --scan`.
              config: |
                jobs:
                  - name: smartctl
                    extra_devices:
                      - name: /dev/sdc
                        type: jmb39x-q,3
    troubleshooting:
      problems:
        list: []
    alerts: []
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: ""
      availability: []
      scopes:
        - name: controller
          description: These metrics refer to the Storage Device.
          labels:
            - name: device_name
              description: Device name
            - name: device_type
              description: Device type
            - name: model_name
              description: Model name
            - name: serial_number
              description: Serial number
          metrics:
            - name: smartctl.device_smart_status
              description: Device smart status
              unit: status
              chart_type: line
              dimensions:
                - name: passed
                - name: failed
            - name: smartctl.device_ata_smart_error_log_count
              description: Device ATA smart error log count
              unit: logs
              chart_type: line
              dimensions:
                - name: error_log
            - name: smartctl.device_power_on_time
              description: Device power on time
              unit: seconds
              chart_type: line
              dimensions:
                - name: power_on_time
            - name: smartctl.device_temperature
              description: Device temperature
              unit: Celsius
              chart_type: line
              dimensions:
                - name: temperature
            - name: smartctl.device_power_cycles_count
              description: Device power cycles
              unit: cycles
              chart_type: line
              dimensions:
                - name: power
            - name: smartctl.device_read_errors_rate
              description: Device read errors
              unit: errors/s
              chart_type: line
              dimensions:
                - name: corrected
                - name: uncorrected
            - name: smartctl.device_write_errors_rate
              description: Device write errors
              unit: errors/s
              chart_type: line
              dimensions:
                - name: corrected
                - name: uncorrected
            - name: smartctl.device_verify_errors_rate
              description: Device verify errors
              unit: errors/s
              chart_type: line
              dimensions:
                - name: corrected
                - name: uncorrected
            - name: smartctl.device_smart_attr_{attribute_name}
              description: Device smart attribute {attribute_name}
              unit: '{attribute_unit}'
              chart_type: line
              dimensions:
                - name: '{attribute_name}'
            - name: smartctl.device_smart_attr_{attribute_name}_normalized
              description: Device smart attribute {attribute_name} normalized
              unit: value
              chart_type: line
              dimensions:
                - name: '{attribute_name}'
