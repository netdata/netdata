# SPDX-License-Identifier: GPL-3.0-or-later

version: v1
profile: haproxy
match: haproxy_*
app: haproxy
namespace: haproxy
documentation:
  title: HAProxy Prometheus
  summary: Curated process, frontend, listener, backend, server, and stick-table metrics from the HAProxy Prometheus exporter.
composition:
  supports: {}
entities:
  process:
    grain: HAProxy worker process
    identity:
      required: []
      optional: []
  frontend:
    grain: HAProxy frontend
    identity:
      required:
      - proxy
      optional: []
  listener:
    grain: HAProxy listener
    identity:
      required:
      - proxy
      - listener
      optional: []
  backend:
    grain: HAProxy backend
    identity:
      required:
      - proxy
      optional: []
  server:
    grain: HAProxy server
    identity:
      required:
      - proxy
      - server
      optional: []
  resolver:
    grain: HAProxy nameserver
    identity:
      required:
      - resolver
      - nameserver
      optional: []
  sticktable:
    grain: HAProxy stick table
    identity:
      required:
      - name
      - type
      optional: []
label_policies: {}
reduction_policies: {}
normalizations: {}
exclusions:
  process_start_epoch:
    source:
      signal: process_start_time_seconds
      components:
      - value
    reason: not_chartable
    lost_question: How long has the HAProxy worker process been running?
    required_operation: age_from_unix_epoch
    evidence:
    - process_lifecycle
    - process_unit
    outcome: retain_writable_unrendered
  process_node_metadata:
    source:
      signal: process_node
      components:
      - value
    reason: metadata_only
    evidence:
    - process_lifecycle
    - process_unit
    - process_labels
    outcome: retain_writable_unrendered
  process_description_metadata:
    source:
      signal: process_description
      components:
      - value
    reason: metadata_only
    evidence:
    - process_lifecycle
    - process_unit
    - process_labels
    outcome: retain_writable_unrendered
  deprecated_backend_aggregate_status:
    source:
      signal: backend_agg_server_check_status
      components:
      - value
    reason: equivalent_duplicate
    covering_view: backend_agg_server_status
    evidence:
    - aggregate_status_replacement
    outcome: retain_writable_unrendered
limitations: {}
