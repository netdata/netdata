label_policies: {}
reduction_policies: {}
normalizations:
  generated_registration_epochs:
    kind: generated_component_exclusion
    source:
      namespace_prefix: litellm_
      terminal_suffix: _created
      component: scalar
    outcome: drop_before_writer
    evidence:
    - created_registration
    - component_lifecycle
    - source_units
  requested_model_label:
    kind: label_rename
    source_label: model_group
    target_label: requested_model
    retain_source: false
  deployment_model_label:
    kind: label_rename
    source_label: litellm_model_name
    target_label: model
    retain_source: false
  proxy_status_class:
    kind: category
    applies_to:
      signal: proxy_total_requests_metric_total
      components:
      - value
    source_label: status_code
    target_label: status_class
    ranges:
    - min: 100
      max: 199
      value: 1xx
    - min: 200
      max: 299
      value: 2xx
    - min: 300
      max: 399
      value: 3xx
    - min: 400
      max: 499
      value: 4xx
    - min: 500
      max: 599
      value: 5xx
    missing:
      set: unclassified
    malformed:
      set: unclassified
    unknown:
      set: unclassified
    output:
      meaning: Bounded HTTP status class.
      evidence:
      - source_labels
    evidence:
    - normalization_contract
  proxy_failure_status_class:
