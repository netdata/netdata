label_policies: {}
reduction_policies: {}
normalizations:
  reserved_instance_label:
    kind: label_rename
    source_label: instance
    target_label: ceph_instance
    retain_source: false
  dpdk_port_identity:
    kind: embedded_identity_extract
    registry_grammar: dpdk_port
    target_label: dpdk_port
    retain:
      family: canonical_branch
      captured_identity: true
    output:
      meaning: Ceph DPDK network port identity.
      endpoint_cardinality:
        kind: bounded_configuration
      stability: stable
      evidence:
        - label_dpdk_port
    evidence:
      - normalization_dpdk_port_identity
  dpdk_queue_identity:
    kind: embedded_identity_extract
    registry_grammar: dpdk_queue
    target_label: dpdk_queue
    retain:
      family: canonical_branch
      captured_identity: true
    output:
      meaning: Ceph DPDK worker queue identity.
      endpoint_cardinality:
        kind: bounded_configuration
      stability: stable
      evidence:
        - label_dpdk_queue
    evidence:
      - normalization_dpdk_queue_identity
  finisher_identity:
    kind: embedded_identity_extract
    registry_grammar: finisher
    target_label: finisher_key
    retain:
      family: canonical_branch
      captured_identity: true
    output:
      meaning: Ceph asynchronous finisher identity.
      endpoint_cardinality:
        kind: bounded_configuration
      stability: restart_stable
      evidence:
        - label_finisher_key
    evidence:
      - normalization_finisher_identity
  kernel_device_identity:
    kind: embedded_identity_extract
    registry_grammar: kernel_device
    target_label: kernel_device_key
    retain:
      family: canonical_branch
      captured_identity: true
    output:
      meaning: Ceph kernel block-device identity.
      endpoint_cardinality:
        kind: bounded_configuration
      stability: stable
      evidence:
        - label_kernel_device_key
