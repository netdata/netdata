          - value
      slow_alloc_lat:
        signal: bluefs_slow_alloc_lat_sum
        components:
          - value
      wal_alloc_lat:
        signal: bluefs_wal_alloc_lat_sum
        components:
          - value
    labels:
      dimensions: {}
      promote: []
      omit: {}
