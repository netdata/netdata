normalizations:
  http_requests_total_method_class:
    kind: category
    applies_to:
      signal: http_requests_total
      components:
        - value
    source_label: method
    target_label: method_class
    missing:
      set: other
    malformed:
      set: other
    unknown:
      set: other
    output:
      meaning: Bounded HTTP method category.
      evidence:
        - http_labels
    evidence:
      - http_categories
    exact:
      GET: GET
      HEAD: HEAD
      POST: POST
      PUT: PUT
      DELETE: DELETE
      CONNECT: CONNECT
      OPTIONS: OPTIONS
      TRACE: TRACE
      PATCH: PATCH
  http_responses_total_method_class:
    kind: category
    applies_to:
      signal: http_responses_total
      components:
        - value
    source_label: method
    target_label: method_class
    missing:
      set: other
    malformed:
      set: other
    unknown:
      set: other
    output:
      meaning: Bounded HTTP method category.
      evidence:
        - http_labels
    evidence:
      - http_categories
    exact:
      GET: GET
      HEAD: HEAD
      POST: POST
      PUT: PUT
      DELETE: DELETE
      CONNECT: CONNECT
      OPTIONS: OPTIONS
      TRACE: TRACE
      PATCH: PATCH
  http_responses_total_status_class:
    kind: category
    applies_to:
      signal: http_responses_total
      components:
        - value
    source_label: status_code
    target_label: status_class
    missing:
      set: unclassified
    malformed:
      set: unclassified
    unknown:
      set: unclassified
    output:
      meaning: Bounded HTTP status_code category.
      evidence:
        - http_labels
    evidence:
      - http_categories
    ranges:
      - min: 100
        max: 199
        value: 1xx
      - min: 200
        max: 299
        value: 2xx
      - min: 300
        max: 399
        value: 3xx
      - min: 400
        max: 499
        value: 4xx
      - min: 500
        max: 599
        value: 5xx
  http_requests_active_method_class:
    kind: category
    applies_to:
      signal: http_requests_active
      components:
        - value
    source_label: method
    target_label: method_class
    missing:
      set: other
    malformed:
      set: other
    unknown:
      set: other
    output:
      meaning: Bounded HTTP method category.
      evidence:
        - http_labels
    evidence:
      - http_categories
    exact:
      GET: GET
      HEAD: HEAD
      POST: POST
      PUT: PUT
      DELETE: DELETE
      CONNECT: CONNECT
      OPTIONS: OPTIONS
      TRACE: TRACE
      PATCH: PATCH
