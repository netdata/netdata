limitations: {}
views:
  request_lifecycle.corrupted_requests:
    family: Request Lifecycle
    question: At what rate does corrupted requests change?
    entity: model_engine_ray
    inputs:
      corrupted:
        signal: corrupted_requests_total
        components:
        - value
    labels:
      dimensions: {}
      promote:
      - Component
      - SessionName
      - Version
      omit: {}
  request_lifecycle.time_to_first_token:
    family: Request Lifecycle
    question: How is time to first token distributed?
    entity: model_engine_ray
    inputs:
      time_to_first_token:
        signal: time_to_first_token_seconds
        components:
        - bucket
    labels:
      dimensions: {}
      promote:
      - Component
      - SessionName
      - Version
      omit: {}
  request_lifecycle.end_to_end_latency:
    family: Request Lifecycle
    question: How is end-to-end request latency distributed?
    entity: model_engine_ray
    inputs:
      end_to_end_latency:
        signal: e2e_request_latency_seconds
        components:
        - bucket
    labels:
      dimensions: {}
      promote:
      - Component
      - SessionName
      - Version
      omit: {}
  request_lifecycle.first_token_requests:
    family: Request Lifecycle
    question: At what rate does requests reaching first token change?
    entity: model_engine_ray
    inputs:
      requests:
        signal: time_to_first_token_seconds
        components:
        - count
    labels:
      dimensions: {}
      promote:
      - Component
      - SessionName
      - Version
      omit: {}
  request_lifecycle.completed_pre_response_time:
