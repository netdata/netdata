# SPDX-License-Identifier: GPL-3.0-or-later

version: v1
profile: vllm
match: vllm:* ray_vllm_*
app: vllm
namespace: vllm
documentation:
  title: vLLM
  summary: Curated inference, scheduling, latency, token, cache, connector, engine, HTTP, and runtime metrics from vLLM and Ray.
composition:
  supports:
    fastapi:
      when: native_transport
      activation: Included when the endpoint exposes vLLM's native HTTP transport metrics; Ray-only metrics do not activate it.
    process_runtime:
      when: native_transport
      activation: Included when the endpoint exposes vLLM's native process metrics; Ray-only metrics do not activate it.
    python_gc:
      when: native_transport
      activation: Included when the endpoint exposes vLLM's native Python garbage-collection metrics; Ray-only metrics do not activate it.
entities:
  model_engine_ray:
    grain: model_name and engine
    identity:
      required:
      - model_name
      - engine
      optional:
      - ReplicaId
      - WorkerId
    high_cardinality_acceptance:
      operator_value: Preserving this finest useful source entity lets operators diagnose it directly and aggregate broader
        service views in Netdata.
  finished_request_ray:
    grain: model_name and engine and finished_reason
    identity:
      required:
      - model_name
      - engine
      - finished_reason
      optional:
      - ReplicaId
      - WorkerId
    high_cardinality_acceptance:
      operator_value: Preserving this finest useful source entity lets operators diagnose it directly and aggregate broader
        service views in Netdata.
  connector_operation_status_ray:
    grain: model_name and engine and operation and status
    identity:
      required:
      - model_name
      - engine
      - operation
      - status
      optional:
      - ReplicaId
      - WorkerId
    high_cardinality_acceptance:
      operator_value: Preserving this finest useful source entity lets operators diagnose it directly and aggregate broader
        service views in Netdata.
  service:
    grain: collector job service
    identity:
      required: []
      optional: []
  parser_request:
    grain: model_name and request_type and mode and outcome
    identity:
      required:
      - model_name
      - request_type
      - mode
      - outcome
      optional: []
    high_cardinality_acceptance:
      operator_value: Preserving this finest useful source entity lets operators diagnose it directly and aggregate broader
        service views in Netdata.
label_policies: {}
reduction_policies: {}
normalizations:
  ray_transport_namespace:
    kind: namespace_alias
    registry_group: ray_canonical
    source_prefix: ray_vllm_
    target_prefix: 'vllm:'
    evidence:
    - ray_namespace_relationship
  generated_registration_epochs:
    kind: generated_component_exclusion
    source:
      namespace_prefix: 'vllm:'
      terminal_suffix: _created
      component: scalar
    outcome: drop_before_writer
    evidence:
    - created_registration
    - component_lifecycle
    - source_units
