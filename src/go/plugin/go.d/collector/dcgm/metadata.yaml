plugin_name: go.d.plugin
modules:
  - meta:
      id: collector-go.d.plugin-dcgm
      plugin_name: go.d.plugin
      module_name: dcgm
      monitored_instance:
        name: Nvidia Data Center GPU Manager (DCGM)
        link: https://github.com/NVIDIA/dcgm-exporter
        icon_filename: nvidia.svg
        categories:
          - data-collection.hardware-and-sensors
      keywords:
        - nvidia
        - gpu
        - dcgm
        - dcgm-exporter
      related_resources:
        integrations:
          list:
            - plugin_name: go.d.plugin
              module_name: nvidia_smi
      info_provided_to_referring_integrations:
        description: ""
    overview:
      data_collection:
        metrics_description: |
          This collector gathers NVIDIA GPU telemetry from a `dcgm-exporter` endpoint.
          Known fields use source-defined units and chart groups. Other numeric fields remain available as raw measurements.
        method_description: |
          It collects metrics by periodically scraping the exporter Prometheus endpoint over HTTP.
      supported_platforms:
        include: []
        exclude: []
      multi_instance: true
      additional_permissions:
        description: ""
      default_behavior:
        auto_detection:
          description: This integration requires a configured dcgm-exporter endpoint.
        limits:
          description: |
            The collector applies global and per-metric time series limits to prevent excessive cardinality.
            Some exporter versions round floating-point bit error ratios to six decimal places. Enable the packed
            `*_BER_RAW` (or legacy `COUNT_*_BER`) field when available to preserve small ratios; float-only values retain the exporter's precision limit.
        performance_impact:
          description: The impact depends on dcgm-exporter field selection and resulting series cardinality.
    setup:
      prerequisites:
        list:
          - title: Run dcgm-exporter
            description: Install DCGM and run `dcgm-exporter` so that a Prometheus endpoint is available (default `:9400/metrics`).
          - title: Configure exporter field list
            description: |
              The default exporter profile exposes a small subset of fields.
              Use the Netdata recommended profile:
              [`dcgm-exporter-netdata.csv`](https://github.com/netdata/netdata/blob/master/src/go/plugin/go.d/collector/dcgm/dcgm-exporter-netdata.csv)
              (raw download: `https://raw.githubusercontent.com/netdata/netdata/master/src/go/plugin/go.d/collector/dcgm/dcgm-exporter-netdata.csv`).

              The Netdata profile enables 123 fields by default and lists optional fields from its source dataset as commented entries.
              To customize beyond the baseline, uncomment the field you need and comment one currently enabled field.

              Runtime validation artifact:
              `src/go/plugin/go.d/collector/dcgm/runtime-validation-driver-590.48.01-dcgm-exporter-4.4.1-4.5.2.md`
              and
              `src/go/plugin/go.d/collector/dcgm/runtime-validation-driver-590.48.01-dcgm-exporter-4.4.1-4.5.2.json`

              Validation is primarily version-scoped (NVIDIA driver + DCGM/DCGM-exporter versions), so treat it as a strong baseline rather than universal compatibility.

              Example:
              `dcgm-exporter -f /path/to/dcgm-exporter-netdata.csv`
          - title: Keep collection intervals aligned
            description: |
              Set Netdata `update_every` to the same value as dcgm-exporter collection interval (default 30 seconds).
              Example exporter interval: `dcgm-exporter -c 30000` and Netdata `update_every: 30`.
          - title: Enable profiling capabilities (optional)
            description: Profiling fields may require additional privileges/capabilities in your runtime environment.
      configuration:
        file:
          name: go.d/dcgm.conf
        options:
          description: |
            The following options can be defined globally: update_every, autodetection_retry.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              description: Data collection interval (seconds). Keep this aligned with dcgm-exporter collection interval.
              default_value: 30
              required: false
              group: Collection
            - name: autodetection_retry
              description: Autodetection retry interval (seconds). Set 0 to disable.
              default_value: 0
              required: false
              group: Collection
            - name: url
              description: DCGM exporter metrics endpoint URL.
              default_value: http://127.0.0.1:9400/metrics
              required: true
              group: Target
            - name: timeout
              description: HTTP request timeout (seconds).
              default_value: 10
              required: false
              group: Target
            - name: max_time_series
              description: Global time series limit. If exceeded, collection is skipped for this cycle.
              default_value: 2000
              required: false
              group: Limits
            - name: max_time_series_per_metric
              description: Per-metric time series limit. Metrics above this limit are skipped.
              default_value: 200
              required: false
              group: Limits
            - name: username
              description: Username for Basic HTTP authentication.
              default_value: ""
              required: false
              group: HTTP Auth
            - name: password
              description: Password for Basic HTTP authentication.
              default_value: ""
              required: false
              group: HTTP Auth
            - name: bearer_token_file
              description: Path to a file containing a bearer token.
              default_value: ""
              required: false
              group: HTTP Auth
            - name: tls_skip_verify
              description: Skip TLS certificate and hostname verification (insecure).
              default_value: no
              required: false
              group: TLS
            - name: tls_ca
              description: Path to CA bundle used to validate the server certificate.
              default_value: ""
              required: false
              group: TLS
            - name: tls_cert
              description: Path to client TLS certificate (for mTLS).
              default_value: ""
              required: false
              group: TLS
            - name: tls_key
              description: Path to client TLS private key (for mTLS).
              default_value: ""
              required: false
              group: TLS
            - name: proxy_url
              description: HTTP proxy URL.
              default_value: ""
              required: false
              group: Proxy
            - name: proxy_username
              description: Username for proxy authentication.
              default_value: ""
              required: false
              group: Proxy
            - name: proxy_password
              description: Password for proxy authentication.
              default_value: ""
              required: false
              group: Proxy
            - name: headers
              description: Additional HTTP headers to include in the request.
              default_value: ""
              required: false
              group: Request
            - name: method
              description: HTTP method.
              default_value: GET
              required: false
              group: Request
            - name: body
              description: HTTP request body.
              default_value: ""
              required: false
              group: Request
            - name: not_follow_redirects
              description: Do not follow HTTP redirects.
              default_value: no
              required: false
              group: Request
            - name: force_http2
              description: Force HTTP/2 (including h2c over TCP).
              default_value: no
              required: false
              group: Request
            - name: vnode
              description: Associate this job with a Virtual Node.
              default_value: ""
              required: false
              group: Virtual Node
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Local exporter
              description: Collect metrics from a local dcgm-exporter endpoint.
              config: |
                jobs:
                  - name: local
                    url: http://127.0.0.1:9400/metrics
                    update_every: 30
            - name: TLS endpoint
              description: Collect metrics over HTTPS with custom CA certificate.
              config: |
                jobs:
                  - name: secure
                    url: https://dcgm-exporter.example.com:9400/metrics
                    update_every: 30
                    tls_ca: /etc/netdata/certs/dcgm-ca.crt
            - name: Increased cardinality limits
              description: Increase limits when collecting large field sets and multiple entities.
              config: |
                jobs:
                  - name: dcgm_large
                    url: http://127.0.0.1:9400/metrics
                    update_every: 30
                    max_time_series: 10000
                    max_time_series_per_metric: 2000
    troubleshooting:
      problems:
        list: []
    alerts:
      - name: dcgm_gpu_xid_errors
        metric: dcgm.gpu.reliability.xid
        info: NVIDIA driver reported a GPU XID error (metric ${label:chart_context}).
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dcgm.conf
      - name: dcgm_gpu_row_remap_failure
        metric: dcgm.gpu.reliability.row_remap_status
        info: Row remapping has failed, indicating a persistent memory reliability problem.
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dcgm.conf
      - name: dcgm_gpu_uncorrectable_remapped_rows
        metric: dcgm.gpu.reliability.row_remap_events
        info: New uncorrectable row remap events were detected in the last 5 minutes.
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dcgm.conf
      - name: dcgm_gpu_power_violation
        metric: dcgm.gpu.throttle.duration
        info: The GPU was power-throttled during the last 5 minutes.
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dcgm.conf
      - name: dcgm_gpu_thermal_violation
        metric: dcgm.gpu.throttle.duration
        info: The GPU was thermally throttled during the last 5 minutes.
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dcgm.conf
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: |
        Charts appear only for fields supplied by the exporter; availability depends on hardware, driver and exporter versions.
        Missing, unsupported and invalid samples leave gaps. Labels identifying health watches, event reasons and peers
        distinguish dimensions; event window lengths distinguish chart instances.

        See [metric semantics and chart migration](https://github.com/netdata/netdata/blob/master/src/go/plugin/go.d/collector/dcgm/METRICS.md)
        for interpretation, source selection and changes to existing charts.
      availability: []
      dynamic_context_prefixes:
        - prefix: dcgm.
          reason: Raw numeric fields and exporter-discovered entity combinations create additional contexts under this namespace.
      scopes:
        - name: host
          description: The GPU inventory reported by one exporter host.
          labels: []
          metrics:
            - name: dcgm.host.inventory.gpu_count
              description: Host GPU Count
              unit: GPUs
              chart_type: line
              dimensions:
                - name: gpus
        - name: gpu
          description: A physical GPU identified by the exporter device and UUID labels.
          labels:
            - name: gpu
              description: GPU device index.
            - name: uuid
              description: GPU UUID.
          metrics:
            - name: dcgm.gpu.compute.utilization
              description: GPU and Memory Busy Time
              unit: percentage
              chart_type: line
              dimensions:
                - name: gpu
                - name: memory_copy
            - name: dcgm.gpu.compute.engine_activity
              description: GPU Graphics and Compute Engine Activity
              unit: percentage
              chart_type: line
              dimensions:
                - name: activity
            - name: dcgm.gpu.compute.sm.utilization
              description: GPU Streaming Multiprocessor Utilization
              unit: percentage
              chart_type: line
              dimensions:
                - name: activity
                - name: occupancy
            - name: dcgm.gpu.compute.resource_activity
              description: GPU Tensor and Memory Interface Activity
              unit: percentage
              chart_type: line
              dimensions:
                - name: dram
                - name: tensor
            - name: dcgm.gpu.compute.pipe.activity
              description: GPU Arithmetic Pipeline Activity
              unit: percentage
              chart_type: line
              dimensions:
                - name: fp16
                - name: fp32
                - name: fp64
                - name: integer
            - name: dcgm.gpu.compute.tensor.activity
