          - id: redfish_aggregate_population
            title: Redfish Aggregate Population
            context: aggregate.population
            units: components
            algorithm: absolute
            type: stacked
            priority: 1000
            lifecycle:
              expire_after_cycles: 5
            dimensions:
              - selector: aggregate_population_total
                name: total
              - selector: aggregate_population_readable
                name: readable
              - selector: aggregate_population_unreadable
                name: unreadable
              - selector: aggregate_population_unknown
                name: unknown
              - selector: aggregate_population_histogram_eligible
                name: histogram_eligible
              - selector: aggregate_population_histogram_ineligible
                name: histogram_ineligible
