            type: stacked
            dimensions:
              - selector: processor_conditions_ok
                name: ok
              - selector: processor_conditions_warning
                name: warning
              - selector: processor_conditions_critical
                name: critical
              - selector: processor_conditions_unknown
                name: unknown
          - title: Processor Error Rate
            context: error_rate
            units: errors/s
            dimensions:
              - selector: processor_error_rate_correctable_core
                name: correctable_core
              - selector: processor_error_rate_correctable_other
                name: correctable_other
              - selector: processor_error_rate_uncorrectable_core
                name: uncorrectable_core
              - selector: processor_error_rate_uncorrectable_other
                name: uncorrectable_other
          - title: Processor Frequency Ratio
            context: frequency_ratio
            units: ratio
            dimensions:
