          - title: System Memory Summary Health
            context: memory_summary_health
            units: state
            type: stacked
            dimensions:
              - selector: system_memory_summary_health_status
          - title: System Memory Summary Health Rollup
            context: memory_summary_health_rollup
            units: state
            type: stacked
            dimensions:
              - selector: system_memory_summary_health_rollup_status
          - title: System Memory Summary State
            context: memory_summary_state
            units: state
            type: stacked
            dimensions:
              - selector: system_memory_summary_state
          - title: System Memory Utilization
            context: memory_utilization
            units: percentage
            dimensions:
              - selector: system_memory_utilization
                name: capacity
          - title: System Power State
            context: power_state
            units: state
            type: stacked
            dimensions:
              - selector: system_power_state
          - title: System Processor Bandwidth
            context: processor_bandwidth
            units: percentage
            dimensions:
              - selector: system_processor_bandwidth
                name: bandwidth
          - title: System Processor Summary Health
            context: processor_summary_health
            units: state
            type: stacked
            dimensions:
              - selector: system_processor_summary_health_status
          - title: System Processor Summary Health Rollup
            context: processor_summary_health_rollup
            units: state
            type: stacked
            dimensions:
              - selector: system_processor_summary_health_rollup_status
          - title: System Processor Summary State
            context: processor_summary_state
            units: state
            type: stacked
            dimensions:
              - selector: system_processor_summary_state
          - title: System Processor Utilization
            context: processor_utilization
            units: percentage
            dimensions:
              - selector: system_processor_utilization_kernel
                name: kernel
              - selector: system_processor_utilization_user
                name: user
          - title: System State
            context: state
            units: state
            type: stacked
            dimensions:
              - selector: system_state
  - family: Compute
    context_namespace: redfish
