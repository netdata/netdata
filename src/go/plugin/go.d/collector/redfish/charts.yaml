          - processor_error_rate_correctable_other
          - processor_error_rate_uncorrectable_core
          - processor_error_rate_uncorrectable_other
          - processor_frequency_ratio
          - processor_health_rollup_status
          - processor_health_status
          - processor_pcie_error_rate_bad_dllp
          - processor_pcie_error_rate_bad_tlp
          - processor_pcie_error_rate_correctable
          - processor_pcie_error_rate_fatal
