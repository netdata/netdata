version: v1
groups:
  - family: Overview
    context_namespace: redfish
    chart_defaults:
      priority: 70000
      instances:
        by_labels:
          - endpoint_key
          - resource_key
    groups:
      - family: Chassis
        context_namespace: chassis
        metrics:
          - chassis_acquisition_state
          - chassis_conditions_critical
          - chassis_conditions_ok
          - chassis_conditions_unknown
          - chassis_conditions_warning
          - chassis_health_rollup_status
          - chassis_health_status
          - chassis_intrusion_state
          - chassis_power_state
          - chassis_state
        charts:
          - title: Chassis Acquisition State
            context: acquisition_state
            units: state
            type: stacked
            dimensions:
              - selector: chassis_acquisition_state
          - title: Chassis Conditions
            context: conditions
            units: conditions
            type: stacked
            dimensions:
              - selector: chassis_conditions_ok
                name: ok
              - selector: chassis_conditions_warning
                name: warning
              - selector: chassis_conditions_critical
                name: critical
              - selector: chassis_conditions_unknown
                name: unknown
          - title: Chassis Health
            context: health
            units: state
            type: stacked
            dimensions:
              - selector: chassis_health_status
          - title: Chassis Health Rollup
            context: health_rollup
            units: state
            type: stacked
            dimensions:
              - selector: chassis_health_rollup_status
          - title: Chassis Intrusion State
            context: intrusion_state
            units: state
            type: stacked
            dimensions:
              - selector: chassis_intrusion_state
          - title: Chassis Power State
            context: power_state
            units: state
            type: stacked
            dimensions:
              - selector: chassis_power_state
          - title: Chassis State
            context: state
            units: state
            type: stacked
            dimensions:
              - selector: chassis_state
      - family: Redundancy
        context_namespace: redundancy
        metrics:
          - redundancy_acquisition_state
          - redundancy_conditions_critical
          - redundancy_conditions_ok
          - redundancy_conditions_unknown
          - redundancy_conditions_warning
          - redundancy_enabled_state
          - redundancy_health_rollup_status
          - redundancy_health_status
          - redundancy_members_active
          - redundancy_members_total
          - redundancy_mode
          - redundancy_state
        charts:
          - title: Redundancy Acquisition State
            context: acquisition_state
            units: state
            type: stacked
            dimensions:
              - selector: redundancy_acquisition_state
          - title: Redundancy Conditions
            context: conditions
            units: conditions
            type: stacked
            dimensions:
              - selector: redundancy_conditions_ok
                name: ok
              - selector: redundancy_conditions_warning
                name: warning
              - selector: redundancy_conditions_critical
                name: critical
              - selector: redundancy_conditions_unknown
                name: unknown
          - title: Redundancy Enabled
            context: enabled
            units: state
            type: stacked
            dimensions:
              - selector: redundancy_enabled_state
          - title: Redundancy Health
            context: health
            units: state
            type: stacked
            dimensions:
              - selector: redundancy_health_status
          - title: Redundancy Health Rollup
            context: health_rollup
            units: state
            type: stacked
            dimensions:
              - selector: redundancy_health_rollup_status
          - title: Redundancy Members
            context: members
            units: members
            dimensions:
              - selector: redundancy_members_active
                name: active
              - selector: redundancy_members_total
                name: total
          - title: Redundancy Mode
            context: mode
            units: state
            type: stacked
            dimensions:
              - selector: redundancy_mode
          - title: Redundancy State
            context: state
            units: state
            type: stacked
            dimensions:
              - selector: redundancy_state
      - family: Service
        context_namespace: service
        metrics:
          - service_acquisition_state
        charts:
          - title: Redfish Service Acquisition State
            context: acquisition_state
            units: state
            type: stacked
            dimensions:
              - selector: service_acquisition_state
      - family: Systems
        context_namespace: system
        metrics:
          - system_acquisition_state
          - system_conditions_critical
          - system_conditions_ok
          - system_conditions_unknown
          - system_conditions_warning
          - system_health_rollup_status
          - system_health_status
          - system_memory_bandwidth
          - system_memory_summary_health_rollup_status
          - system_memory_summary_health_status
          - system_memory_summary_state
          - system_memory_utilization
          - system_power_state
          - system_processor_bandwidth
          - system_processor_summary_health_rollup_status
          - system_processor_summary_health_status
          - system_processor_summary_state
          - system_processor_utilization_kernel
          - system_processor_utilization_user
          - system_state
        charts:
          - title: System Acquisition State
            context: acquisition_state
            units: state
            type: stacked
            dimensions:
              - selector: system_acquisition_state
          - title: System Conditions
            context: conditions
            units: conditions
            type: stacked
            dimensions:
              - selector: system_conditions_ok
                name: ok
              - selector: system_conditions_warning
                name: warning
              - selector: system_conditions_critical
                name: critical
              - selector: system_conditions_unknown
                name: unknown
          - title: System Health
            context: health
            units: state
            type: stacked
            dimensions:
              - selector: system_health_status
          - title: System Health Rollup
            context: health_rollup
            units: state
            type: stacked
            dimensions:
              - selector: system_health_rollup_status
          - title: System Memory Bandwidth
            context: memory_bandwidth
            units: percentage
            dimensions:
