              - selector: processor_pcie_error_rate_bad_tlp
                name: bad_tlp
              - selector: processor_pcie_error_rate_correctable
                name: correctable
              - selector: processor_pcie_error_rate_fatal
                name: fatal
              - selector: processor_pcie_error_rate_flow_control_timeout
                name: flow_control_timeout
              - selector: processor_pcie_error_rate_l0_to_recovery
