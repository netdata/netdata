        - name: reading
          description: One physical sensor reading or source-provided measurement excerpt.
          labels:
            - name: endpoint_key
              description: Stable canonical endpoint key.
            - name: resource_key
              description: Stable identity of the resource supplying the reading.
            - name: resource_kind
              description: Kind of the resource supplying the reading.
            - name: resource_name
              description: Resource supplying the reading.
            - name: slot
              description: Slot, device locator, or socket of the supplying resource, when reported.
            - name: location
              description: Service label of the supplying resource's physical location, when reported.
            - name: manufacturer
              description: Manufacturer of the supplying resource, when reported.
            - name: model
              description: Model of the supplying resource, when reported.
            - name: reading_key
              description: Stable reading identity within the endpoint.
            - name: reading_type
              description: Reading type, such as temperature or voltage.
            - name: physical_context
              description: Redfish physical context of the sensor, when reported.
            - name: physical_subcontext
              description: Redfish physical sub-context of the sensor, when reported.
            - name: reading_basis
              description: Zero, delta, or headroom measurement basis.
            - name: reading_role
              description: Current, average, minimum, or peak reading.
