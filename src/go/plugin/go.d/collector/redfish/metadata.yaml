    functions:
      description: |
        Inspect one configured endpoint's latest sensor readings, hardware health, and BMC-retained events, selected with
        the Instance parameter. Sensors and Hardware show the latest completed collection and do not query the BMC when
        you open them, so a row can be up to one `update_every` (60 seconds by default) plus that collection's duration
        old; the Observed column is the start time of that collection and is the same for every row. Logs queries the
        BMC on demand.
      list:
        - id: sensors
          name: Redfish Sensors
          description: |
            Inspect current sensor readings beside the health the BMC reports and an independently derived threshold
            health, so a crossed limit can be told apart from a fault the BMC has declared. The table holds one row per
            sensor with its current reading; the average, peak, and threshold values a sensor also publishes are not
            rows here (they appear on the charts), and power derived from energy is labeled as such. Derived health
            reads OK when none of that sensor's own upper and lower limits is active (the BMC may still report other
            faults), Not applicable when the sensor publishes no limits, and Unavailable when the published limits
            cannot be used, the reading itself is unavailable, or too few readings have arrived to decide.
          parameters:
            - id: __job
              name: Instance
              description: Select the configured Redfish endpoint job.
              type: select
              required: false
              default: First available job
              options: []
          returns:
            description: |
              One row per supported primary reading from the current collection. Missing or invalid values are blank; missing health is Not reported.
            columns:
              - name: "Key"
                type: string
                unit: ""
                visibility: hidden
                description: "Stable row identity."
              - name: "Sort"
                type: string
                unit: ""
                visibility: hidden
                description: "Attention, name and identity ordering."
              - name: "Sensor"
                type: string
                unit: ""
                description: "Sensor or component reading."
              - name: "Type"
                type: string
                unit: ""
                description: "Measured quantity."
              - name: "Reading"
                type: float
                unit: ""
                description: "Current value; blank when unavailable."
              - name: "Units"
                type: string
                unit: ""
                description: "Reading units."
              - name: "Health"
                type: string
                unit: ""
                description: "BMC-reported health of this reading; not inherited component health."
              - name: "Derived health (thresholds)"
                type: string
                unit: ""
                description: "Locally evaluated threshold status; OK does not imply overall hardware health."
              - name: "Data availability"
                type: string
                unit: ""
                description: "Whether this reading has a usable value."
              - name: "Observed"
                type: timestamp
                unit: ""
                description: "Collection observation time; not the BMC's internal sampling time."
              - name: "Resource"
                type: string
                unit: ""
                visibility: hidden
                description: "Resource supplying this reading."
              - name: "Resource URI"
                type: string
                unit: ""
                visibility: hidden
                description: "Source resource address."
              - name: "Source property"
                type: string
                unit: ""
                visibility: hidden
                description: "Source reading property."
              - name: "Location"
                type: string
                unit: ""
                visibility: hidden
                description: "BMC-reported physical context."
              - name: "Source"
                type: string
                unit: ""
                visibility: hidden
                description: "Whether this value was reported or calculated."
              - name: "rowOptions"
                type: none
                unit: ""
                visibility: hidden
                description: "Row presentation."
          performance: |
            Reads data already collected by the job; no additional BMC requests. Response size grows with the number of rows.
          security: |
            Exposes device identity, health and source resource addresses to authorized operators. Does not expose credentials or session tokens.
          availability: |
            Available after collection produces usable data. Returns HTTP 503 before the first collection and after a total failure. Partial collections retain current rows and mark gaps.
          require_cloud: false
        - id: hardware
          name: Redfish Hardware
          description: |
            Find components needing attention and inspect their identity, configuration and reported condition. Optional columns show CPU counts, memory and storage capacity, firmware release dates and assembly revisions. Component health, aggregate health and collection availability are kept distinct.
          parameters:
            - id: __job
              name: Instance
              description: Select the configured Redfish endpoint job.
              type: select
              required: false
              default: First available job
              options: []
          returns:
            description: |
              One row per monitored component or logical resource, including known resources that could not be read. Identity, configuration and version details are optional columns populated when reported by the BMC. Capacity belongs to the individual resource; physical drives and logical volumes must not be added together. Release date describes the firmware or software release, not its installation. Missing or unusable details are blank.
            columns:
              - name: "Key"
                type: string
                unit: ""
                visibility: hidden
                description: "Stable row identity."
              - name: "Sort"
                type: string
                unit: ""
                visibility: hidden
                description: "Attention, name and identity ordering."
              - name: "Component"
                type: string
                unit: ""
                description: "Component or logical resource name."
              - name: "Type"
                type: string
                unit: ""
                description: "Resource kind."
              - name: "Health"
                type: string
                unit: ""
                description: "BMC-reported health of this component."
              - name: "State"
                type: string
                unit: ""
                description: "BMC-reported operational state."
              - name: "Location"
                type: string
                unit: ""
                description: "BMC-reported location or slot."
              - name: "Reported issue"
                type: string
                unit: ""
                description: "BMC conditions, rollup warnings or predicted failure."
              - name: "Data availability"
                type: string
                unit: ""
                description: "Whether this component was read in this collection."
              - name: "Observed"
                type: timestamp
                unit: ""
                description: "Collection observation time; not the BMC's internal sampling time."
              - name: "Manufacturer"
                type: string
                unit: ""
                visibility: hidden
                description: "Component manufacturer."
              - name: "Model"
                type: string
                unit: ""
                visibility: hidden
                description: "Component model."
              - name: "Serial number"
                type: string
                unit: ""
                visibility: hidden
                description: "Component serial number."
              - name: "Part number"
                type: string
                unit: ""
                visibility: hidden
                description: "Component part number."
              - name: "Asset tag"
                type: string
                unit: ""
                visibility: hidden
                description: "Component asset tag."
              - name: "Firmware"
                type: string
                unit: ""
                visibility: hidden
                description: "Firmware, software or BIOS version."
              - name: "Power state"
                type: string
                unit: ""
                visibility: hidden
                description: "BMC-reported power state."
              - name: "Health rollup"
                type: string
                unit: ""
                visibility: hidden
                description: "BMC-reported aggregate health, separate from component health."
              - name: "Failure predicted"
                type: boolean
                unit: ""
                visibility: hidden
                description: "BMC predicts component failure."
              - name: "Resource URI"
                type: string
                unit: ""
                visibility: hidden
                description: "Source resource address."
              - name: "Processor cores"
                type: integer
                unit: "cores"
                visibility: hidden
                description: "Total cores in this processor."
              - name: "Enabled cores"
                type: integer
                unit: "cores"
                visibility: hidden
                description: "Enabled cores in this processor."
              - name: "Supported threads"
                type: integer
                unit: "threads"
                visibility: hidden
                description: "Execution threads supported by this processor."
              - name: "Capacity"
                type: integer
                unit: "bytes"
                visibility: hidden
                description: "Capacity of this memory device, physical drive or logical volume. Memory capacity is converted from MiB to bytes."
              - name: "Memory type"
                type: string
                unit: ""
                visibility: hidden
                description: "Memory device technology, such as DDR4 or DDR5."
              - name: "Media type"
                type: string
                unit: ""
                visibility: hidden
                description: "Drive media type, such as SSD or HDD."
              - name: "Drive protocol"
                type: string
                unit: ""
                visibility: hidden
                description: "Protocol used by this drive, such as SAS, SATA or NVMe."
              - name: "RAID type"
                type: string
                unit: ""
                visibility: hidden
                description: "RAID configuration of this logical volume."
              - name: "Release date"
                type: timestamp
                unit: ""
                visibility: hidden
                description: "Firmware or software release/production date; not installation time."
              - name: "Hardware version"
                type: string
                unit: ""
                visibility: hidden
                description: "Vendor-reported hardware version of this assembly."
              - name: "Engineering revision"
                type: string
                unit: ""
                visibility: hidden
                description: "Engineering change level or revision of this assembly."
              - name: "rowOptions"
                type: none
                unit: ""
                visibility: hidden
                description: "Row presentation."
          performance: |
            Reads data already collected by the job; no additional BMC requests. Response size grows with the number of rows.
          security: |
            Exposes device identity, health and source resource addresses to authorized operators. Does not expose credentials or session tokens.
          availability: |
            Available after collection produces usable data. Returns HTTP 503 before the first collection and after a total failure. Partial collections retain current rows and mark gaps.
          require_cloud: false
        - id: logs
          name: Redfish Logs
          description: |
            Browse events currently retained by one BMC log service in the Logs view. Select the endpoint job and a service linked from its Systems, Managers or Chassis. Refresh reads the log again; BMC rotation or clearing can remove events. This viewer does not store an archive.
          parameters:
            - id: __job
              name: Instance
              description: Select the configured Redfish endpoint job.
              type: select
              required: false
              default: First available job
              options: []
            - id: service
              name: Log service
              description: Select a linked service advertised by this endpoint.
              type: select
              required: true
              default: First advertised service in the UI
              options: []
            - id: severity
              name: Severity
              description: Filter by BMC severity. Unknown includes missing and unrecognized values.
              type: select
              required: false
              default: all
              options:
                - {id: all, name: All severities, default: true}
                - {id: Critical, name: Critical}
                - {id: Warning, name: Warning}
                - {id: OK, name: OK}
                - {id: Unknown, name: Unknown}
            - id: after
              name: After
              description: Inclusive lower time boundary in integer Unix seconds. A negative value is relative to before, or to now when before is omitted.
              type: integer
              required: false
              default: No lower boundary
              options: []
            - id: before
              name: Before
              description: Inclusive upper time boundary in integer Unix seconds. Zero or a negative value is relative to now.
              type: integer
              required: false
              default: No upper boundary
              options: []
            - id: query
              name: Search
              description: 'Case-sensitive Netdata simple patterns against the combined message, IDs, resource addresses, entry type and reported severity. Use `*failure*` for a substring. Space-separated patterns are checked in order; the first match decides, `!` excludes, and no match excludes the row. Use `!*noise* *` to exclude noise and keep everything else.'
              type: string
              required: false
              default: No text filter
              options: []
          returns:
            description: |
              One row per matching retained entry. Time uses EventTimestamp, then valid Created. Both originals and the time basis remain available in details. Undated entries remain visible as Unavailable after dated rows, with a notice that the time range cannot filter them. Refresh replaces all rows. Failed pages or members fail the request instead of returning a partial log as complete.
            columns:
              - name: "Order"
                type: integer
                unit: ""
                visibility: hidden
                description: "Newest first, then undated entries; row position within this query."
              - name: "Time"
                type: timestamp
                unit: ""
                description: "EventTimestamp with valid Created fallback; Unavailable when neither can be used."
              - name: "Severity"
                type: string
                unit: ""
                description: "OK, Warning, Critical or Unknown."
              - name: "Message"
                type: string
                unit: ""
                description: "BMC event message."
              - name: "Entry ID"
                type: string
                unit: ""
                description: "Identifier assigned by this log service."
              - name: "Entry type"
                type: string
                unit: ""
                visibility: hidden
                description: "BMC event format."
              - name: "Log service"
                type: string
                unit: ""
                visibility: hidden
                description: "Selected source resource."
              - name: "Entry URI"
                type: string
                unit: ""
                visibility: hidden
                description: "Source entry resource."
              - name: "Message ID"
                type: string
                unit: ""
                visibility: hidden
                description: "BMC message registry identifier."
              - name: "EventTimestamp"
                type: string
                unit: ""
                visibility: hidden
                description: "Original event time, including invalid source values."
              - name: "Created"
                type: string
                unit: ""
                visibility: hidden
                description: "Original entry creation time, including invalid source values."
              - name: "Time basis"
                type: string
                unit: ""
                visibility: hidden
                description: "EventTimestamp, Created or Unavailable."
              - name: "Reported severity"
                type: string
                unit: ""
                visibility: hidden
                description: "Original severity, including unrecognized source values."
              - name: "rowOptions"
                type: none
                unit: ""
                visibility: hidden
                description: "Row presentation."
          performance: |
            Each query discovers linked services and reads every page and entry of the selected log before filtering. There is no event cap; cost grows with BMC retention and pagination. Reads share the job's `max_concurrent_requests` budget with metrics. The default UI refresh is 60 seconds. Slow full scans can fail at the Function deadline; narrow time or text filters do not reduce BMC reads.
          security: |
            Uses the job's existing credentials, TLS and proxy settings. Reading logs requires BMC permissions for the linked services and entries. Queries are read-only apart from creating and deleting their authentication sessions. Event messages may contain sensitive operational information; credentials and session tokens are not returned.
          availability: |
            Available for running jobs without waiting for a successful metric poll. An empty service selector means no supported linked services were advertised. Missing Entries support and inaccessible services return an error; an empty readable log returns an empty table. The view has no histogram, live tail or historical archive, and a multi-page read is not an atomic snapshot.
          require_cloud: false
