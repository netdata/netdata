plugin_name: go.d.plugin
modules:
- meta:
    id: collector-go.d.plugin-meraki
    plugin_name: go.d.plugin
    module_name: meraki
    monitored_instance:
      name: Cisco Meraki
      link: https://meraki.cisco.com/
      icon_filename: network-wired.svg
      categories:
      - network-performance-monitoring.device-metrics
    keywords:
    - meraki
    - cisco
    - network
    - availability
    related_resources:
      integrations:
        list: []
    info_provided_to_referring_integrations:
      description: ''
  overview:
    data_collection:
      metrics_description: Monitor Cisco Meraki device availability and assigned-device inventory. Each assigned
        device appears as a separate Netdata node, with organization and network labels for fleet filtering.
      method_description: The collector makes read-only HTTPS requests to the Meraki Dashboard API, using an API
        key or a bearer-token file. It reads visible organizations, organization networks, assigned devices and
        device availability every five minutes by default.
    supported_platforms:
      include: []
      exclude: []
    multi_instance: true
    additional_permissions:
      description: A Meraki Dashboard identity with read access to the selected organization and its networks is
        required. Enable Dashboard API access for the organization.
    default_behavior:
      auto_detection:
        description: Organizations and credentials are not auto-detected. Configure one job per organization; assigned
          devices are discovered within that organization.
      limits:
        description: 'Meraki refreshes availability every five minutes and supplies no observation timestamp. Faster
          polling does not create finer source sampling. Missing, unknown or inconsistent availability leaves a
          gap; inventory membership does not imply that a device is online.


          The organization budget is 10 API requests per second, shared with other applications; the source-IP budget
          is 100 requests per second. The collector paces its requests and honors Retry-After. Other applications
          or jobs can still exhaust the shared budget. See [Meraki API rate limits](https://developer.cisco.com/meraki/api-v1/rate-limit/).'
      performance_impact:
        description: Each collection makes at least four API requests, with more requests for paginated organizations,
          networks, devices and availability. It creates one virtual node per assigned device. Increase update_every
          to reduce API usage; increase timeout if a large fleet cannot finish within the collection budget.
  setup:
    prerequisites:
      list:
      - title: Enable Meraki Dashboard API access
        description: Enable API access under Organization > Settings in Dashboard and create an API key for an identity
          with read access to the organization. See the [Meraki API instructions](https://documentation.meraki.com/Platform_Management/Dashboard_Administration/Operate_and_Maintain/How-Tos/How_to_Use_the_Cisco_Meraki_Dashboard_API).
    configuration:
      file:
        name: go.d/meraki.conf
      options:
        description: 'Configure one organization per job. The following options can be defined globally: update_every,
          autodetection_retry.'
        folding:
          title: Config options
          enabled: true
        list:
        - name: url
          description: URL of the Meraki Dashboard API endpoint.
          default_value: https://api.meraki.com/api/v1
          required: false
          group: Target
        - name: organization_id
          description: Meraki organization ID to monitor.
          default_value: ''
          required: true
          group: Target
        - name: api_key
          description: Meraki API key. Set either this or bearer_token_file.
          default_value: ''
          required: false
          group: Authentication
        - name: bearer_token_file
          description: Path to a file containing the Meraki bearer token, reread for each request. Set either this
            or api_key.
          default_value: ''
          required: false
          group: Authentication
        - name: update_every
          description: Data collection interval, in seconds.
          default_value: 300
          required: false
          group: Collection
        - name: autodetection_retry
          description: How often to retry the initial connection when the job fails to start, in seconds. Zero disables
            retries.
          default_value: 0
          required: false
          group: Collection
        - name: timeout
          description: Complete collection or connection-check timeout, in seconds, including all pages and request
            pacing.
          default_value: 60
          required: false
          group: Collection
        - name: vnode
          description: Associates the organization summary with a [Virtual Node](https://learn.netdata.cloud/docs/netdata-agent/configuration/organize-systems-metrics-and-alerts#virtual-nodes).
            Device nodes are created separately.
          default_value: ''
          required: false
          group: Collection
        - name: proxy_url
          description: HTTP proxy URL. Empty value uses environment proxy variables.
          default_value: ''
          required: false
          group: Transport
          detailed_description: If the proxy URL contains credentials, use a secret reference such as `${env:MERAKI_PROXY_URL}`
            instead of entering the authenticated URL directly into the form.
        - name: tls_ca
          description: Path to a CA certificate file used to verify the server certificate.
          default_value: ''
          required: false
          group: Transport
        - name: tls_cert
          description: Path to a client certificate file. Requires tls_key.
          default_value: ''
          required: false
          group: Transport
        - name: tls_key
          description: Path to the client certificate key file. Requires tls_cert.
          default_value: ''
          required: false
          group: Transport
        - name: tls_skip_verify
          description: Skip verification of the server certificate and hostname.
          default_value: false
          required: false
          group: Transport
      examples:
        folding:
          title: Config
          enabled: true
        list:
        - name: Basic organization monitoring
          description: Read the API key from an environment variable.
          config: "jobs:\n  - name: meraki\n    organization_id: \"123456\"\n    api_key: ${env:MERAKI_API_KEY}"
        - name: Rotating mounted token
          description: Read a mounted token file for each request. The file must be readable by the Netdata service
            user.
          config: "jobs:\n  - name: meraki\n    organization_id: \"123456\"\n    bearer_token_file: /run/secrets/meraki_token"
        - name: Regional API endpoint
          description: Use the API endpoint for the organization’s region.
          config: "jobs:\n  - name: meraki-canada\n    url: https://api.meraki.ca/api/v1\n    organization_id: \"\
            123456\"\n    api_key: ${env:MERAKI_API_KEY}"
  metrics:
    description: Organization counts appear on the collector node, or the configured job virtual node. Device charts
      appear on generated device nodes. Device inventory membership is 1 while a device is assigned; missing availability
      is omitted rather than reported as offline.
    scopes:
    - name: organization
      description: One configured Meraki organization.
      labels:
      - name: organization_id
        description: Meraki organization ID.
      - name: organization_name
        description: Meraki organization name.
      metrics:
      - name: meraki.organization_assigned_devices
        description: Meraki Assigned Devices
        unit: devices
        chart_type: line
        dimensions:
        - name: assigned
    - name: device
      description: One assigned Meraki device on its own virtual node.
      labels:
      - name: organization_id
        description: Meraki organization ID.
      - name: organization_name
        description: Meraki organization name.
      - name: serial
        description: Meraki device serial number.
      - name: device_name
        description: Device display name, when present.
      - name: model
        description: Device model, when present.
      - name: product_type
        description: Meraki product type, when present.
      - name: network_id
        description: Assigned network ID, when present.
      - name: network_name
        description: Assigned network name, when present.
      metrics:
      - name: meraki.device_assigned
        description: Meraki Device Inventory Membership
        unit: devices
        chart_type: line
        dimensions:
        - name: assigned
      - name: meraki.device_availability
        description: Meraki Device Availability
        unit: status
        chart_type: stacked
        dimensions:
        - name: alerting
        - name: dormant
        - name: offline
        - name: online
    folding:
      title: Metrics
      enabled: false
    availability: []
  troubleshooting:
    errors:
      list:
      - error: configured organization_id is not visible to the Meraki credential
        cause: The configured organization ID is incorrect, or the API identity cannot see that organization.
        fix: Copy `organization_id` from Dashboard and grant the API identity read access to that organization.
      - error: '`operation`: HTTP status 403'
        cause: The API identity lacks access to the organization-scoped operation, or Dashboard IP restrictions
          deny the Agent’s source address.
        fix: Grant read access to the organization and its networks, then check the organization’s API source-IP
          restrictions. A successful organization listing alone does not prove scoped access.
      - error: context deadline exceeded
        cause: A collection or initial check exceeded timeout. Slow network access, request pacing or a large paginated
          fleet can exhaust this budget.
        fix: Check connectivity to the regional Dashboard API. If requests succeed but the fleet cannot finish in
          time, increase `timeout`.
      - error: Meraki requires exactly one API key or bearer token file
        cause: Both authentication fields are empty or both contain values.
        fix: Set either `api_key` or `bearer_token_file` and clear the other field.
      - error: Meraki API Retry-After delay has not elapsed
        cause: Meraki has rate-limited this running collector and its requested wait has not elapsed.
        fix: Allow the requested wait to elapse. If throttling recurs, increase `update_every` and review API usage
          by other jobs and applications.
      - error: Device inventory appears but availability is missing
        cause: Meraki has not supplied a known status consistent with the assigned inventory. Availability can lag
          an assignment or network move by a provider refresh interval.
        fix: Check the device’s assignment and status in Dashboard and allow the next availability refresh. Run
          the collector in debug mode to see the number of omitted status observations.
