plugin_name: go.d.plugin
modules:
  - meta:
      id: collector-go.d.plugin-smbios_memory
      plugin_name: go.d.plugin
      module_name: smbios_memory
      monitored_instance:
        name: SMBIOS Memory
        link: https://www.dmtf.org/standards/smbios
        icon_filename: microchip.svg
        categories:
          - data-collection.hardware-and-sensors
      keywords: [smbios memory, smbios, dmi, dimm, ram, firmware, memory inventory]
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: ""
    overview:
      data_collection:
        metrics_description: |
          Monitor physical memory inventory and detect missing or smaller memory devices relative to an accepted baseline.
          The Memory Inventory live table exposes slot locations, capacities, device identifiers, rank counts, and rated and configured speeds for local inspection or retrieval through the Functions API.
        method_description: |
          Reads `/sys/firmware/dmi/tables/smbios_entry_point` and `/sys/firmware/dmi/tables/DMI` every 60 seconds by default, respecting `NETDATA_HOST_PREFIX`.
          These are boot-time firmware tables: a recent read does not establish current usable memory, operating frequency, or hardware health.
          Only physical devices in system-memory arrays contribute to inventory totals. No external command or EDAC support is required.
      supported_platforms:
        include: [Linux]
        exclude: []
      multi_instance: false
      additional_permissions:
        description: |
          Linux normally restricts these raw firmware files to root. `go.d.plugin` needs read access, normally supplied by its existing `CAP_DAC_READ_SEARCH` installation capability.
          The Agent's configured library directory must be writable for baseline persistence. The collector does not change firmware, kernel settings, or device permissions.
      default_behavior:
        auto_detection:
          description: |
            The stock configuration starts one canonical `smbios_memory` job when a supported table is readable.
            A host with an existing state file continues monitoring when its firmware table becomes unavailable, so an unresolved loss remains visible.
            The first complete inventory with unique nonempty slot locators and known capacities becomes the baseline after it is saved successfully. It is the first observed configuration, not an independently verified healthy one.
            Capacity increases and added devices are accepted automatically only when every previously accepted populated slot still has at least its accepted capacity.
        limits:
          description: |
            Firmware may omit or misreport hardware. Blank or repeated slot locators, unknown capacities or array use, malformed records, and inconsistent array counts prevent reliable comparison.
            Slot locators must remain stable across boots; firmware renaming is not matched automatically. Replacing a device with one of equal or larger capacity in the same slot does not count as memory loss.
            Inventory does not assign EDAC errors to physical devices: the evidence needed to join platform-specific EDAC ranks and SMBIOS slots is not available.
        performance_impact:
          description: |
            Reads two local firmware files per collection. Baseline and loss-state changes write one private state file; unchanged observations do not rewrite it.
    setup:
      single_job: true
      prerequisites:
        list:
          - title: Stop collection before manual debugging
            description: |
              If running a separate debug process, first disable this collector through Dynamic Configuration and wait for it to stop, or stop the Netdata service.
              The debug process can update the same baseline file, so only one process may own this inventory at a time. Re-enable the collector or restart Netdata after the debug process exits.
          - title: Verify firmware and state access
            description: |
              Verify that the host exposes both raw DMI files and that the installed `go.d.plugin` has its standard read capability or equivalent access.
              For containers, make the host's firmware tables visible beneath `NETDATA_HOST_PREFIX` and retain access to them. The Agent must also have its normal registry identity and writable library directory.
              Confirm that Memory Inventory becomes available and the comparison status is `comparable`.
      configuration:
        file:
          name: go.d/smbios_memory.conf
          description: |
            Keep the single job name `smbios_memory`. This collector has no remote target or virtual-node configuration.
        options:
          description: |
            The collection interval applies to the host's single memory inventory. Keep the canonical job name `smbios_memory`.
            To edit a detected instance in the UI, open its existing entry under Collectors → Jobs; there is no add-job action.
          folding:
            title: Options
            enabled: false
          list:
            - name: update_every
              description: Interval in seconds between reads of the boot-time firmware inventory. Reading more frequently does not refresh
                the firmware's hardware information.
              default_value: 60
              required: false
        examples:
          folding:
            title: Config
            enabled: false
          list:
            - name: Read inventory every two minutes
              description: Reduce read frequency while retaining the same baseline.
              config: |
                jobs:
                  - name: smbios_memory
                    update_every: 120
    troubleshooting:
      errors:
        list:
          - error: Intentionally accepting a smaller memory configuration
            cause: A planned removal or reduction remains a loss relative to the previously accepted baseline.
            fix: |
              Stop the collector before resetting its state. For a systemd installation using the default library directory, stop Netdata, move the whole state file to a new backup name, then start Netdata:

              ```bash
              sudo systemctl stop netdata
              sudo mv -i /var/lib/netdata/smbios-memory.json /var/lib/netdata/smbios-memory.json.backup
              sudo systemctl start netdata
              ```

              Use the Agent's configured library directory instead of `/var/lib/netdata` if it differs. Static installations commonly use `/opt/netdata/var/lib/netdata`.
              Alternatively, disable the canonical collector through Dynamic Configuration, wait for it to stop, move the file, then re-enable it. Do not run a separate manual collector against the same state directory while the Agent is running.
              Verify a `comparable` status after the next valid inventory is saved. If reading or saving fails, no replacement baseline is accepted.
              This reset intentionally discards both the old baseline and its retained loss state; alert acknowledgment or silencing does not do so. Keep the backup if the old evidence is needed.
          - error: 'read SMBIOS entry point: permission denied'
            cause: The collector cannot read the host's root-restricted firmware table.
            fix: Restore the installed plugin's standard capabilities and verify any container mount and capability settings. A host without
              SMBIOS tables cannot use this collector.
          - error: Slot locators are missing or duplicated
            cause: Firmware does not provide unique slot locators, so devices cannot be compared reliably across observations.
            fix: Inspect the inventory and the vendor's firmware information. Device details remain available, but this version cannot
              establish a reliable per-slot baseline for that table.
          - error: 'physical array device count disagrees with table'
            cause: The firmware table is incomplete or inconsistent.
            fix: Check the firmware table with the hardware vendor's tools and check for firmware corrections. A missing record in an
              inconsistent table is not proof of a lost memory device.
          - error: memory baseline has unsupported version, owner or content
            cause: The state file belongs to another Agent, is damaged, or uses an unsupported format.
            fix: Restore the matching state file from backup. If deliberately starting a new baseline, follow the stopped-collector reset
              procedure above; do not edit the state file in place. After restoring a file or repairing its read access, restart the collector; initial state-load errors remain until restart.
          - error: 'create baseline temporary file: `error`'
            cause: The Agent library directory is unavailable or not writable, or its filesystem is full.
            fix: Restore directory access and free space. Check the comparison status after collection retries. New loss observations cannot
              survive a restart until they have been saved successfully.
          - error: Agent registry identity is unavailable; baseline persistence disabled
            cause: The collector cannot read the Agent's normal registry identity.
            fix: Restore the Agent registry directory and its permissions, then restart the collector. Inventory is still readable, but no
              baseline is accepted without an Agent identity.
    alerts:
      - name: smbios_memory_confirmed_loss
        metric: smbios_memory.confirmed_loss_status
        info: Physical memory is missing or smaller than the accepted firmware inventory baseline
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/smbios_memory.conf
      - name: smbios_memory_comparison_unavailable
        metric: smbios_memory.comparison_status
        info: The current firmware inventory cannot be compared with a durable memory baseline
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/smbios_memory.conf
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: |
        All charts belong to the local host. Unavailable measurements leave gaps rather than zeroes.
        The confirmed-loss status retains a previously observed loss through source failures and restarts; it does not claim a fresh hardware measurement. Missing-device and capacity-deficit quantities appear only after a successful comparable observation.
      availability: []
      scopes:
        - name: global
          description: The host's physical system-memory inventory and accepted baseline comparison.
          labels: []
          metrics:
            - name: smbios_memory.installed_capacity
              description: Firmware-Reported Installed Memory
              unit: bytes
              chart_type: line
              dimensions:
                - name: installed
            - name: smbios_memory.slots
              description: Firmware-Reported Memory Slots
              unit: slots
              chart_type: stacked
              dimensions:
                - name: populated
                - name: empty
            - name: smbios_memory.inventory_status
              description: Memory Inventory Availability
              unit: state
              chart_type: stacked
              dimensions:
                - name: available
                - name: unavailable
            - name: smbios_memory.comparison_status
              description: Memory Baseline Comparison Status
              unit: state
              chart_type: stacked
              dimensions:
                - name: comparable
                - name: unavailable
                - name: uncomparable
                - name: unbaselined
                - name: state_error
            - name: smbios_memory.confirmed_loss_status
              description: Confirmed Memory Loss
              unit: state
              chart_type: stacked
              dimensions:
                - name: present
                - name: absent
                - name: unknown
            - name: smbios_memory.missing_devices
              description: Missing Memory Devices Relative to Baseline
              unit: devices
              chart_type: line
              dimensions:
                - name: missing
            - name: smbios_memory.capacity_deficit
              description: Memory Capacity Deficit Relative to Baseline Slots
              unit: bytes
              chart_type: line
              dimensions:
                - name: deficit
    functions:
      description: Inspect the latest completed inventory read through Live Data or the Functions API. Opening the table performs no
        firmware read and does not change the baseline.
      list:
        - id: inventory
          name: Memory Inventory
          description: Inspect populated and empty physical system-memory slots alongside their accepted capacities and comparison status.
          parameters: []
          returns:
            description: One row per current physical system-memory device, plus accepted populated slots absent from the current table.
              Baseline-only rows identify their metadata as historical; unknown readings are null.
            columns:
              - name: Key
                type: string
                unit: ''
                visibility: hidden
                description: Identity within this snapshot; not a persistent hardware identity.
              - name: Slot
                type: string
                unit: ''
                description: Firmware device locator.
              - name: Bank
                type: string
                unit: ''
                visibility: hidden
                description: Firmware bank locator.
              - name: Population
                type: string
                unit: ''
                description: Populated, empty, or unknown.
              - name: Capacity
                type: integer
                unit: bytes
                description: Current firmware-reported physical capacity.
              - name: Accepted capacity
                type: integer
                unit: bytes
                description: Capacity in the accepted baseline.
              - name: Comparison
                type: string
                unit: ''
                description: Slot comparison or reason comparison is unavailable.
              - name: Data availability
                type: string
                unit: ''
                description: Current firmware data or baseline-only evidence.
              - name: Memory type
                type: string
                unit: ''
                description: Firmware memory technology.
              - name: Form factor
                type: string
                unit: ''
                visibility: hidden
                description: Firmware form factor.
              - name: Manufacturer
                type: string
                unit: ''
                visibility: hidden
                description: Current or baseline-only device manufacturer.
              - name: Part number
                type: string
                unit: ''
                visibility: hidden
                description: Current or baseline-only device part.
              - name: Serial number
                type: string
                unit: ''
                visibility: hidden
                description: Current or baseline-only device serial.
              - name: Ranks
                type: integer
                unit: ranks
                visibility: hidden
                description: Number of device ranks.
              - name: Rated speed
                type: integer
                unit: MT/s
                description: Maximum capable firmware transfer rate.
              - name: Configured speed
                type: integer
                unit: MT/s
                description: Configured boot-time transfer rate.
              - name: ECC association
                type: string
                unit: ''
                visibility: hidden
                description: 'Unavailable: no verified physical EDAC join.'
              - name: Read attempt
                type: timestamp
                unit: ''
                visibility: hidden
                description: Last attempt to read the boot-time firmware table.
              - name: Inventory status
                type: string
                unit: ''
                visibility: hidden
                description: Availability of the current firmware table.
              - name: Loss recorded
                type: timestamp
                unit: ''
                visibility: hidden
                description: When the retained loss evidence last changed; null when no loss is retained.
          performance: Reads the completed collection snapshot; response size grows with the number of memory slots.
          security: Read-only. Exposes firmware identifiers, including device serials, to authorized Function callers. The local baseline
            file is private to its owner.
          availability: Published while the canonical collector is running. Before the first collection it returns HTTP 503; source failures
            retain baseline rows with unavailable status.
          require_cloud: false
