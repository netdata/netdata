taxonomy_version: 1
plugin_name: go.d.plugin
module_name: s3check
placements:
  - id: s3check
    section_id: synthetic-checks
    title: S3 Compatible Object Storage
    icon: synthetics
    families: true
    properties: {important: true, grouping: true}
    items:
      - type: group
        id: status
        title: Status
        items:
          - s3check.runtime_status
          - s3check.probe_status
          - s3check.payload_mismatch
      - type: group
        id: objectives
        title: Replication Objectives
        items:
          - s3check.write_visibility_lag
          - s3check.write_visibility_objective
          - s3check.delete_visibility_lag
          - s3check.delete_visibility_objective
      - type: group
        id: ownership
        title: Ownership Cleanup
        items:
          - s3check.cleanup_pending_objects
          - s3check.mutation_backpressure
      - type: group
        id: operations
        title: S3 Operations
        items:
          - s3check.operation_status
          - s3check.operation_duration
          - s3check.operation_calls
