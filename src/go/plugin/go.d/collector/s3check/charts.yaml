version: v1
context_namespace: s3check
groups:
  - family: Status
    chart_defaults:
      priority: 1100
    metrics:
      - runtime_status
      - probe_status
      - payload_mismatch
    charts:
      - id: runtime_status
        title: S3 check runtime status
        context: runtime_status
        units: status
        type: line
        instances:
          by_labels: [mode]
        label_promotion: [source, destination, reason]
        dimensions:
          - selector: 'runtime_status{runtime_status="success"}'
            name: success
          - selector: 'runtime_status{runtime_status="failed"}'
            name: failed
      - id: probe_status
        title: S3 check probe status
        context: probe_status
        units: status
        type: line
        instances:
          by_labels: [mode]
        label_promotion: [source, destination, reason]
        dimensions:
          - selector: 'probe_status{probe_status="success"}'
            name: success
          - selector: 'probe_status{probe_status="waiting"}'
            name: waiting
          - selector: 'probe_status{probe_status="failed"}'
            name: failed
      - id: payload_mismatch
        title: S3 payload verification mismatch
        context: payload_mismatch
        units: status
        type: line
        instances:
          by_labels: [mode]
        label_promotion: [source, destination, reason]
        dimensions:
          - selector: payload_mismatch
            name: mismatch

  - family: Replication objectives
    chart_defaults:
      priority: 1110
    metrics:
      - write_visibility_lag_seconds
      - write_visibility_objective_breached
      - delete_visibility_lag_seconds
      - delete_visibility_objective_breached
    charts:
      - id: write_visibility_lag
        title: S3 write visibility lag
        context: write_visibility_lag
        units: seconds
        type: line
        instances:
          by_labels: [mode]
        label_promotion: [source, destination, reason]
        dimensions:
          - selector: write_visibility_lag_seconds
            name: lag
            options:
              float: true
      - id: write_visibility_objective
        title: S3 write visibility objective status
        context: write_visibility_objective
        units: status
        type: line
        instances:
          by_labels: [mode]
        label_promotion: [source, destination, reason]
        dimensions:
          - selector: write_visibility_objective_breached
            name: breached
      - id: delete_visibility_lag
        title: S3 delete visibility lag
        context: delete_visibility_lag
        units: seconds
        type: line
        instances:
          by_labels: [mode]
        label_promotion: [source, destination, reason]
        dimensions:
          - selector: delete_visibility_lag_seconds
            name: lag
            options:
              float: true
      - id: delete_visibility_objective
        title: S3 delete visibility objective status
        context: delete_visibility_objective
        units: status
        type: line
        instances:
          by_labels: [mode]
        label_promotion: [source, destination, reason]
        dimensions:
          - selector: delete_visibility_objective_breached
            name: breached

  - family: Ownership
    chart_defaults:
      priority: 1120
    metrics:
      - cleanup_pending_objects
      - mutation_backpressure
    charts:
      - id: cleanup_pending_objects
        title: S3 owned objects pending cleanup
        context: cleanup_pending_objects
        units: objects
        type: line
        instances:
          by_labels: [mode]
        label_promotion: [source, destination]
        dimensions:
          - selector: cleanup_pending_objects
            name: pending
      - id: mutation_backpressure
        title: S3 mutation backpressure status
        context: mutation_backpressure
        units: status
        type: line
        instances:
          by_labels: [mode]
        label_promotion: [source, destination]
        dimensions:
          - selector: mutation_backpressure
            name: active

  - family: Operations
    chart_defaults:
      priority: 1130
    metrics:
      - operation_status
      - operation_duration_seconds
      - operation_calls_total
      - operation_failures_total
    charts:
      - id: operation_status
        title: S3 logical operation status
        context: operation_status
        units: status
        type: line
        instances:
          by_labels: [mode, endpoint, operation]
        label_promotion: [source, destination, reason]
        dimensions:
          - selector: 'operation_status{operation_status="success"}'
            name: success
          - selector: 'operation_status{operation_status="failed"}'
            name: failed
      - id: operation_duration
        title: S3 logical operation duration
        context: operation_duration
        units: seconds
        type: line
        instances:
          by_labels: [mode, endpoint, operation]
        label_promotion: [source, destination, reason]
        dimensions:
          - selector: operation_duration_seconds
            name: duration
            options:
              float: true
      - id: operation_calls
        title: S3 logical calls
        context: operation_calls
        units: calls/s
        type: line
        instances:
          by_labels: [mode, endpoint, operation]
        label_promotion: [source, destination]
        dimensions:
          - selector: operation_calls_total
            name: calls
          - selector: operation_failures_total
            name: failures
