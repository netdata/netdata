plugin_name: go.d.plugin
modules:
  - meta:
      plugin_name: go.d.plugin
      module_name: s3check
      monitored_instance:
        name: S3 Compatible Object Storage
        link: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
        categories:
          - data-collection.synthetic-testing
        icon_filename: synthetics.svg
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: >-
          Runs active S3 lifecycle, Ceph RGW multisite, or AWS S3 replication checks from the Agent's client vantage.
      keywords:
        - s3
        - object storage
        - ceph
        - rgw
        - replication
        - synthetic
    overview:
      data_collection:
        metrics_description: |
          Monitor authenticated S3 checks, replication visibility objectives, payload correctness, cleanup backlog, and
          mutation backpressure.

          Work that was not performed is left as a metric gap. Request counters represent logical S3 calls; SDK retry
          attempts are intentionally not presented as separately observed network requests.
        method_description: |
          `lifecycle` creates one owner-scoped object, verifies exact payload and list visibility, deletes it, and proves
          current-object read absence. It requires an unversioned bucket.

          `ceph_multisite` writes at one Ceph RGW site, verifies the exact full key at a configured destination, deletes at
          the source, and measures when the destination current object becomes unreadable. Both buckets must be unversioned.

          `aws_replication` requires versioning on both buckets and an enabled applicable replication rule targeting the
          configured destination with delete-marker replication. It tracks the source and destination object versions and
          delete markers independently, then deletes only those exact versions during cleanup.

          Every mode persists owner-scoped recovery state before mutation. One bounded active probe and cleanup queue are
          advanced per job. At capacity, cleanup and observation continue while new mutations are suspended. Jobs never
          scan, lock, or delete another Agent/job owner's namespace.
      supported_platforms:
        include: []
        exclude: []
      multi_instance: true
      additional_permissions:
        description: |
          All modes require permission to read bucket versioning plus object read, list, write, and delete permissions in
          the owner prefix. Ceph and AWS destinations need read, list, and exact cleanup delete permissions but no direct
          write permission. AWS replication additionally needs permission to read the source replication configuration and
          list/delete exact object versions and delete markers in both buckets.
      default_behavior:
        auto_detection:
          description: |
            There is no automatic discovery. Configure the mode, source region and bucket, authentication, and a
            destination for replication modes.
        limits:
          description: |
            The collector advances at most one active probe plus a fixed cleanup batch per collection. Ownership state,
            cleanup queue capacity, AWS version-list pages/items, and shutdown cleanup time are fixed internal bounds rather
            than public tuning options. Replication polling occurs once per collection interval until its configured timeout.
        performance_impact:
          description: |
            The collector actively creates and deletes small objects. Use a reserved prefix, restricted credentials, and an
            interval appropriate for the replication policy. Each collection also rechecks the bucket/provider prerequisites
            before cleanup or mutation.
    setup:
      prerequisites:
        list:
          - title: Reserve an object prefix
            description: |
              Reserve the configured prefix for this collector. The collector adds an Agent/job owner namespace below it
              and only cleans exact objects recorded in that namespace.
          - title: Select the mode and bucket versioning contract
            description: |
              Use unversioned buckets for `lifecycle` and `ceph_multisite`. Use versioned buckets for `aws_replication` and
              enable delete-marker replication on the applicable source rule.
          - title: Create restricted credentials
            description: |
              Use the AWS SDK default chain or static credentials, optionally with an independently configured assume-role
              step for each endpoint. Prefer go.d secret references over plaintext static credentials.
          - title: Choose the client vantage
            description: |
              Run each directional job on the Agent whose network path represents the client-visible behavior to measure.
      configuration:
        file:
          name: go.d/s3check.conf
        options:
          description: |
            Durations use readable values such as `10s`, `5m`, or `30m`. Destination and objective fields apply only to
            `ceph_multisite` and `aws_replication`.
          folding:
            title: Config options
            enabled: true
          list:
            - name: mode
              description: Select `lifecycle`, `ceph_multisite`, or `aws_replication`.
              default_value: lifecycle
              required: false
              group: Probe
            - name: prefix
              description: Reserved object-key prefix ending with a slash.
              default_value: netdata-s3check/
              required: false
              group: Probe
            - name: update_every
              description: Probe polling interval in seconds.
              default_value: 120
              required: false
              group: Probe
            - name: autodetection_retry
              description: Seconds between retries after the initial provider check fails; zero disables retries.
              default_value: 0
              required: false
              group: Probe
            - name: source
              description: Source S3 connection and authentication.
              default_value: ""
              required: true
              group: Source
            - name: source.name
              description: Presentation-only source label.
              default_value: source
              required: false
              group: Source / Labels
            - name: source.endpoint
              description: Optional HTTP(S) S3 endpoint; empty uses the AWS SDK regional endpoint.
              default_value: ""
              required: false
              group: Source / Connection
            - name: source.region
              description: Source signing region.
              default_value: ""
              required: true
              group: Source / Connection
            - name: source.bucket
              description: Source probe bucket.
              default_value: ""
              required: true
              group: Source / Connection
            - name: source.path_style
              description: Put the source bucket in the request path; common for Ceph RGW.
              default_value: true
              required: false
              group: Source / Connection
            - name: source.credentials
              description: Source base-credential configuration.
              default_value: ""
              required: false
              group: Source / Authentication
            - name: source.credentials.type
              description: Use `default` for the AWS SDK chain or `static` for explicit credentials.
              default_value: default
              required: false
              group: Source / Authentication
            - name: source.credentials.type_static
              description: Static source credential fields, used only when type is `static`.
              default_value: ""
              required: false
              group: Source / Authentication
            - name: source.credentials.type_static.access_key_id
              description: Source access key ID; use a go.d secret reference.
              default_value: ""
              required: false
              group: Source / Authentication
            - name: source.credentials.type_static.secret_access_key
              description: Source secret access key; use a go.d secret reference.
              default_value: ""
              required: false
              group: Source / Authentication
            - name: source.credentials.type_static.session_token
              description: Optional source session token.
              default_value: ""
              required: false
              group: Source / Authentication
            - name: source.assume_role
              description: Optional role assumed from the source base credentials.
              default_value: ""
              required: false
              group: Source / Authentication
            - name: source.assume_role.role_arn
              description: Source role ARN.
              default_value: ""
              required: false
              group: Source / Authentication
            - name: source.assume_role.external_id
              description: Optional source role external ID.
              default_value: ""
              required: false
              group: Source / Authentication
            - name: source.timeout
              description: Timeout for one logical source S3 call.
              default_value: 10s
              required: false
              group: Source / HTTP
            - name: source.proxy_url
              description: Optional source HTTP proxy URL.
              default_value: ""
              required: false
              group: Source / HTTP
            - name: source.tls_skip_verify
              description: Skip source TLS verification. This is insecure.
              default_value: false
              required: false
              group: Source / TLS
            - name: source.tls_ca
              description: Absolute path to the source CA bundle.
              default_value: ""
              required: false
              group: Source / TLS
            - name: source.tls_cert
              description: Absolute path to the source client certificate.
              default_value: ""
              required: false
              group: Source / TLS
            - name: source.tls_key
              description: Absolute path to the source client key.
              default_value: ""
              required: false
              group: Source / TLS
            - name: destination
              description: Destination S3 connection and authentication; required in replication modes.
              default_value: ""
              required: false
              group: Destination
            - name: destination.name
              description: Presentation-only destination label.
              default_value: destination
              required: false
              group: Destination / Labels
            - name: destination.endpoint
              description: Optional HTTP(S) destination endpoint; empty uses the AWS SDK regional endpoint.
              default_value: ""
              required: false
              group: Destination / Connection
            - name: destination.region
              description: Destination signing region.
              default_value: ""
              required: false
              group: Destination / Connection
            - name: destination.bucket
              description: Destination probe bucket.
              default_value: ""
              required: false
              group: Destination / Connection
            - name: destination.path_style
              description: Put the destination bucket in the request path; common for Ceph RGW.
              default_value: true
              required: false
              group: Destination / Connection
            - name: destination.credentials
              description: Destination base-credential configuration.
              default_value: ""
              required: false
              group: Destination / Authentication
            - name: destination.credentials.type
              description: Use `default` for the AWS SDK chain or `static` for explicit credentials.
              default_value: default
              required: false
              group: Destination / Authentication
            - name: destination.credentials.type_static
              description: Static destination credential fields, used only when type is `static`.
              default_value: ""
              required: false
              group: Destination / Authentication
            - name: destination.credentials.type_static.access_key_id
              description: Destination access key ID; use a go.d secret reference.
              default_value: ""
              required: false
              group: Destination / Authentication
            - name: destination.credentials.type_static.secret_access_key
              description: Destination secret access key; use a go.d secret reference.
              default_value: ""
              required: false
              group: Destination / Authentication
            - name: destination.credentials.type_static.session_token
              description: Optional destination session token.
              default_value: ""
              required: false
              group: Destination / Authentication
            - name: destination.assume_role
              description: Optional role assumed from the destination base credentials.
              default_value: ""
              required: false
              group: Destination / Authentication
            - name: destination.assume_role.role_arn
              description: Destination role ARN.
              default_value: ""
              required: false
              group: Destination / Authentication
            - name: destination.assume_role.external_id
              description: Optional destination role external ID.
              default_value: ""
              required: false
              group: Destination / Authentication
            - name: destination.timeout
              description: Timeout for one logical destination S3 call.
              default_value: 10s
              required: false
              group: Destination / HTTP
            - name: destination.proxy_url
              description: Optional destination HTTP proxy URL.
              default_value: ""
              required: false
              group: Destination / HTTP
            - name: destination.tls_skip_verify
              description: Skip destination TLS verification. This is insecure.
              default_value: false
              required: false
              group: Destination / TLS
            - name: destination.tls_ca
              description: Absolute path to the destination CA bundle.
              default_value: ""
              required: false
              group: Destination / TLS
            - name: destination.tls_cert
              description: Absolute path to the destination client certificate.
              default_value: ""
              required: false
              group: Destination / TLS
            - name: destination.tls_key
              description: Absolute path to the destination client key.
              default_value: ""
              required: false
              group: Destination / TLS
            - name: write_objective
              description: Source PUT to verified destination visibility objective.
              default_value: 15m
              required: false
              group: Objectives
            - name: write_timeout
              description: Maximum source PUT to destination visibility wait.
              default_value: 30m
              required: false
              group: Objectives
            - name: delete_objective
              description: Source delete to destination current-object invisibility objective.
              default_value: 5m
              required: false
              group: Objectives
            - name: delete_timeout
              description: Maximum source delete to destination current-object invisibility wait.
              default_value: 15m
              required: false
              group: Objectives
            - name: vnode
              description: Associates all charts with a configured Virtual Node.
              default_value: ""
              required: false
              group: Virtual node
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Lifecycle with static credentials
              description: Use a dedicated unversioned bucket and reserved prefix.
              config: |
                jobs:
                  - name: s3_lifecycle
                    mode: lifecycle
                    source:
                      endpoint: https://s3.example.net
                      region: us-east-1
                      bucket: netdata-s3check
                      credentials:
                        type: static
                        type_static:
                          access_key_id: ${env:NETDATA_S3CHECK_ACCESS_KEY_ID}
                          secret_access_key: ${env:NETDATA_S3CHECK_SECRET_ACCESS_KEY}
                      path_style: yes
            - name: Ceph RGW multisite direction
              description: Use one job per source-to-destination direction; both buckets must be unversioned.
              config: |
                jobs:
                  - name: ceph_site_a_to_site_b
                    mode: ceph_multisite
                    source:
                      name: site-a
                      endpoint: https://rgw-site-a.example.net
                      region: us-east-1
                      bucket: netdata-s3check
                      credentials:
                        type: default
                    destination:
                      name: site-b
                      endpoint: https://rgw-site-b.example.net
                      region: us-east-1
                      bucket: netdata-s3check
                      credentials:
                        type: default
                    write_objective: 15m
                    write_timeout: 30m
                    delete_objective: 5m
                    delete_timeout: 15m
            - name: AWS replication with independent roles
              description: Both buckets must be versioned and the applicable source rule must replicate delete markers.
              config: |
                jobs:
                  - name: aws_replication
                    mode: aws_replication
                    source:
                      name: us-east-1
                      region: us-east-1
                      bucket: source-bucket
                      credentials:
                        type: default
                      assume_role:
                        role_arn: arn:aws:iam::[ACCOUNT]:role/netdata-source
                    destination:
                      name: us-west-2
                      region: us-west-2
                      bucket: destination-bucket
                      credentials:
                        type: default
                      assume_role:
                        role_arn: arn:aws:iam::[ACCOUNT]:role/netdata-destination
    troubleshooting:
      problems:
        list:
          - name: Provider safety check fails
            description: |
              Verify endpoint reachability, credentials, bucket permissions, and the mode's versioning contract. AWS mode
              also requires one applicable destination rule with delete-marker replication and no additional applicable
              destination outside this job's ownership.
          - name: Cleanup remains pending or backpressure is active
            description: |
              Restore the same job name, mode, endpoint, buckets, prefix, and credentials that created the unresolved
              objects. The collector never evicts unresolved ownership or adopts another identity's state.
          - name: Replication waits indefinitely
            description: |
              Waiting stops at the configured write/delete timeout. Check the replication policy, full-key mapping, and
              destination credentials. Ceph and AWS preserve the exact source key; destination prefix rewriting is unsupported.
    alerts:
      - name: s3check_runtime_failed
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.runtime_status
        info: The collector could not validate provider safety or persist ownership state. Inspect the collector log for the raw provider or local-state error.
      - name: s3check_probe_failed
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.probe_status
        info: The active or last terminal probe failed with a bounded reason. Raw provider errors are available only in the collector log.
      - name: s3check_payload_mismatch
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.payload_mismatch
        info: The destination returned different bytes for the exact key written by the source probe.
      - name: s3check_write_visibility_objective
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.write_visibility_objective
        info: The exact source key has not become readable with the expected payload at ${label:destination} within write_objective.
      - name: s3check_delete_visibility_objective
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.delete_visibility_objective
        info: The destination current object remains readable after the source delete for longer than delete_objective.
      - name: s3check_mutation_backpressure
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.mutation_backpressure
        info: The bounded ownership queue is full. Cleanup and observation continue, but no new probe object is created until a slot is released.
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: |
        All contexts use bounded mode, endpoint, operation, reason, and presentation labels. Unperformed work is a gap.
      availability: []
      scopes:
        - name: job status
          description: Runtime and probe outcomes for one configured job.
          labels:
            - name: mode
              description: Configured probe mode.
            - name: source
              description: Source presentation name.
            - name: destination
              description: Destination presentation name, empty for lifecycle mode.
            - name: reason
              description: Bounded outcome reason; raw provider errors are logs only.
          metrics:
            - name: s3check.runtime_status
              description: S3 Check Runtime Status
              unit: status
              chart_type: line
              dimensions:
                - name: success
                - name: failed
            - name: s3check.probe_status
              description: S3 Check Probe Status
              unit: status
              chart_type: line
              dimensions:
                - name: success
                - name: waiting
                - name: failed
            - name: s3check.payload_mismatch
              description: S3 Replicated Payload Mismatch
              unit: status
              chart_type: line
              dimensions:
                - name: mismatch
        - name: replication objectives
          description: Client-visible source-to-destination propagation observations.
          labels:
            - name: mode
              description: Configured replication mode.
            - name: source
              description: Source presentation name.
            - name: destination
              description: Destination presentation name.
            - name: reason
              description: Bounded probe outcome reason.
          metrics:
            - name: s3check.write_visibility_lag
              description: S3 Write Visibility Lag
              unit: seconds
              chart_type: line
              dimensions:
                - name: lag
            - name: s3check.write_visibility_objective
              description: S3 Write Visibility Objective Status
              unit: status
              chart_type: line
              dimensions:
                - name: breached
            - name: s3check.delete_visibility_lag
              description: S3 Delete Visibility Lag
              unit: seconds
              chart_type: line
              dimensions:
                - name: lag
            - name: s3check.delete_visibility_objective
              description: S3 Delete Visibility Objective Status
              unit: status
              chart_type: line
              dimensions:
                - name: breached
        - name: ownership
          description: Bounded exact-object cleanup state.
          labels:
            - name: mode
              description: Configured probe mode.
            - name: source
              description: Source presentation name.
            - name: destination
              description: Destination presentation name.
          metrics:
            - name: s3check.cleanup_pending_objects
              description: S3 Owned Objects Pending Cleanup
              unit: objects
              chart_type: line
              dimensions:
                - name: pending
            - name: s3check.mutation_backpressure
              description: S3 Mutation Backpressure Status
              unit: status
              chart_type: line
              dimensions:
                - name: active
        - name: operation
          description: One bounded logical S3 operation class and endpoint.
          labels:
            - name: mode
              description: Configured probe mode.
            - name: endpoint
              description: Source or destination.
            - name: operation
              description: Bounded logical operation name.
            - name: reason
              description: Bounded operation outcome reason.
          metrics:
            - name: s3check.operation_status
              description: S3 Logical Operation Status
              unit: status
              chart_type: line
              dimensions:
                - name: success
                - name: failed
            - name: s3check.operation_duration
              description: S3 Logical Operation Duration
              unit: seconds
              chart_type: line
              dimensions:
                - name: duration
            - name: s3check.operation_calls
              description: S3 Logical Calls
              unit: calls/s
              chart_type: line
              dimensions:
                - name: calls
                - name: failures
