plugin_name: go.d.plugin
modules:
  - meta:
      plugin_name: go.d.plugin
      module_name: s3check
      monitored_instance:
        name: S3 Compatible Object Storage
        link: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
        categories:
          - data-collection.synthetic-testing
        icon_filename: synthetics.svg
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: >-
          Runs active S3 lifecycle, Ceph RGW multisite, or AWS S3 replication checks from the Agent's client vantage.
      keywords:
        - s3
        - object storage
        - ceph
        - rgw
        - replication
        - synthetic
    overview:
      data_collection:
        metrics_description: |
          Monitor authenticated S3 checks, replication visibility objectives, payload correctness, cleanup backlog, and
          mutation backpressure.

          Work that was not performed is left as a metric gap. Request counters represent logical S3 calls; SDK retry
          attempts are intentionally not presented as separately observed network requests.
        method_description: |
          `lifecycle` creates one owner-scoped object, verifies exact payload and list visibility, deletes it, and proves
          current-object read absence. It requires an unversioned bucket.

          `ceph_multisite` writes at one Ceph RGW site, verifies the exact full key at a configured destination, deletes at
          the source, and measures when the destination current object becomes unreadable. Both buckets must be unversioned.

          `aws_replication` requires versioning on both buckets and an enabled applicable replication rule targeting the
          configured destination with delete-marker replication. It tracks the source and destination object versions and
          delete markers independently, then deletes only those exact versions during cleanup.

          Every mode persists owner-scoped recovery state before mutation. One bounded active probe and cleanup queue are
          advanced per job. At capacity, cleanup and observation continue while new mutations are suspended. Jobs never
          scan, lock, or delete another Agent/job owner's namespace.
      supported_platforms:
        include: []
        exclude: []
      multi_instance: true
      additional_permissions:
        description: |
          All modes require permission to read bucket versioning plus object read, list, write, and delete permissions in
          the owner prefix. Ceph and AWS destinations need read, list, and exact cleanup delete permissions but no direct
          write permission. AWS replication additionally needs permission to read the source replication configuration and
          list/delete exact object versions and delete markers in both buckets.
      default_behavior:
        auto_detection:
          description: |
            There is no automatic discovery. Configure the mode, source region and bucket, authentication, and a
            destination for replication modes.
        limits:
          description: |
            The collector advances at most one active probe plus a fixed cleanup batch per collection. Ownership state,
            cleanup queue capacity, AWS version-list pages/items, and shutdown cleanup time are fixed internal bounds rather
            than public tuning options. Replication polling occurs once per collection interval until its configured timeout.
        performance_impact:
          description: |
            The collector actively creates and deletes small objects. Use a reserved prefix, restricted credentials, and an
            interval appropriate for the replication policy. Each collection also rechecks the bucket/provider prerequisites
            before cleanup or mutation.
    setup:
      prerequisites:
        list:
          - title: Reserve an object prefix
            description: |
              Reserve the configured prefix for this collector. The collector adds an Agent/job owner namespace below it
              and only cleans exact objects recorded in that namespace.
          - title: Select the mode and bucket versioning contract
            description: |
              Use unversioned buckets for `lifecycle` and `ceph_multisite`. Use versioned buckets for `aws_replication` and
              enable delete-marker replication on the applicable source rule.
          - title: Create restricted credentials
            description: |
              Use the AWS SDK default chain or static credentials, optionally with an independently configured assume-role
              step for each endpoint. Prefer go.d secret references over plaintext static credentials.
          - title: Choose the client vantage
            description: |
              Run each directional job on the Agent whose network path represents the client-visible behavior to measure.
      configuration:
        file:
          name: go.d/s3check.conf
        options:
          description: |
            Select `mode`, then configure only its matching `mode_*` object. Durations use readable values such as `10s`,
            `5m`, or `30m`.
          folding:
            title: Config options
            enabled: true
          list:
