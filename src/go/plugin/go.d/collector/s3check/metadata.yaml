              description: "Source S3 connection and authentication. Required when this mode is selected."
              default_value: ""
              required: false
              group: "Mode / Lifecycle connection"
            - name: "mode_lifecycle.source.name"
              description: "Presentation-only source label."
              default_value: "source"
              required: false
              group: "Mode / Lifecycle connection"
            - name: "mode_lifecycle.source.endpoint"
