plugin_name: go.d.plugin
modules:
  - meta:
      plugin_name: go.d.plugin
      module_name: s3check
      monitored_instance:
        name: S3 Compatible Object Storage
        link: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
        categories:
          - data-collection.synthetic-testing
        icon_filename: synthetics.svg
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: >-
                Runs authenticated S3 lifecycle probes and optional directional multisite replication checks against
                explicitly configured S3-compatible endpoints.
      keywords:
        - s3
        - object storage
        - ceph
        - rgw
        - synthetic
    overview:
      data_collection:
        metrics_description: |
          Verify authenticated S3 operations and optional directional multisite replication.

          Each single-site job measures stage state, duration, latency objective, attempts, retries, and failures. Each
          multisite job adds directional replication lag, RPO state, delete-propagation lag, and bounded request
          accounting. Both probes are intentionally active and clean up the objects they create.
        method_description: |
          The collector uses the AWS SigV4 S3 client with explicit static credentials, endpoint, region, and addressing
          configuration. It requires a dedicated unversioned bucket and prefix, checks bucket versioning before the job
          starts and again before destructive operations, and never deletes versions or foreign-owned keys. Exact object
          ownership is persisted before a write or reconciliation delete so restart and configuration changes cannot
          abandon cleanup.

          Compatibility is contract-based rather than vendor-specific. The service must support SigV4 static credentials,
          GetBucketVersioning, PutObject, GetObject, HeadObject, ListObjectsV2, and DeleteObject. An ordinary object
          deletion must also remove the object completely without leaving hidden versions. Ceph RGW multisite is the
          reference deployment model for directional replication checks. AWS S3 satisfies the single-site contract when it
          is configured with virtual-host addressing and a bucket where versioning has never been enabled. AWS-native
          cross-region or same-region replication is not a multisite source because AWS requires versioning on both
          buckets. Other S3-compatible services can be used when they satisfy the same API and unversioned-bucket contract.

          Every single-site cycle generates a unique small payload and key, uploads it, reads and verifies its SHA-256
          digest, confirms LIST visibility, deletes it, and verifies that it disappeared.

          In multisite mode, one job represents exactly one source-to-destination direction. Netdata persists sanitized
          pending-object state before the source write, polls destination visibility across bounded collection cycles,
          verifies the SHA-256 digest, deletes the source, measures destination disappearance, and cleans both sites.
          Daemon sync counters are not used as proof of client-visible correctness.

          After an interrupted write path the collector retries deletion; after a process restart it removes at most two
          keys owned by this Agent and job per endpoint per cycle before creating a new object. Probe namespaces are derived
          from the Agent machine GUID and job identity, so separate Agents, jobs, and reverse directions can probe the
          same route without deleting one another's active objects. Raw S3 errors are classified
          into bounded reasons. Credentials, signed headers, request IDs, endpoint details, and probe payloads are not
          exposed as chart labels or stored in pending state.
      supported_platforms:
        include: []
        exclude: []
      multi_instance: true
      additional_permissions:
        description: |
          No host capabilities are required. The source identity needs GetBucketVersioning, PutObject, GetObject, ListBucket,
          and DeleteObject on its bucket. A multisite destination identity needs GetBucketVersioning, GetObject,
          ListBucket, and DeleteObject on its bucket; it is not granted PutObject because the probe never writes to the
          destination.
      default_behavior:
        auto_detection:
          description: |
            There is no auto-detection. A job starts only after an endpoint, region, bucket, and credentials are
            configured.
        limits:
          description: |
            A successful single-site probe from a clean namespace makes nine S3 API calls: prefix LIST, pre-write bucket proof,
            PUT, GET, LIST, pre-delete bucket proof, DELETE, HEAD, and bucket proof after DELETE. On the next collection, Netdata
            performs one owner-prefix LIST to clear the probe quarantine and then starts the next nine-call probe, for ten calls in
            that steady-state cycle. A still-present object is retried on a later cycle. Reconciling two stale keys also makes nine
            calls. A multisite cycle makes at most eleven calls while it advances one persisted lifecycle. Each call uses the
            configured timeout and bounded retry count, and the worst-case per-cycle deadline must fit inside update_every.

            The probe payload is 4 KiB. Prefix reconciliation lists this job's owner namespace before every new write
            and deletes at most two exact keys from the persisted ownership journal per endpoint per cycle. Visibility and delete objectives must
            be at least one collection interval. Multisite polling spans collection cycles
            until the configured visibility or delete deadline; it does not continuously retry inside one cycle.
            After multisite cleanup deletes the exact source and destination keys, Netdata waits for the larger configured
            replication or delete deadline, lists both owner namespaces, waits one more collection interval, and repeats the lists in
            reverse endpoint order before releasing the ownership journal. This bounded confirmation window follows the configured
            replication policy and uses only owner-scoped requests.
        performance_impact:
          description: |
            Each single-site cycle performs one small object write, read, list request, delete, and metadata check. Each
            multisite cycle follows the persisted lifecycle through as many immediately successful write, visibility,
            delete, and cleanup steps as its bounded operation budget allows. Use dedicated
            buckets, explicit directions, and intervals appropriate for the endpoints and replication policy.
    setup:
      prerequisites:
        list:
          - title: Create a dedicated unversioned bucket and prefix
            description: |
              Create a bucket used only by Netdata. Bucket versioning and Object Lock must be disabled; both Enabled and
              Suspended versioning states are rejected. Keep the configured prefix reserved for this collector.
          - title: Verify S3 compatibility and addressing
            description: |
              Single-site checks require the documented API operations and a never-versioned dedicated bucket. AWS S3 uses
              virtual-host addressing, so set path_style to no. Multisite checks also require replication that copies the
              probe payload to the configured destination prefix without versioning either bucket. Ceph RGW multisite is
              the reference deployment model for this contract.
          - title: Create restricted S3 credentials
            description: |
              Create credentials for one dedicated probe identity. The identity needs S3 read and write access to the
              selected bucket and permission to read its versioning status. Prefer Netdata secret references instead of
              storing credentials directly in configuration files.
          - title: Choose the client vantage
            description: |
              Run the job on the Netdata Agent whose network path represents the client view you need to test. For Ceph,
              run jobs at each site or RGW vantage whose client-visible S3 correctness matters.
      configuration:
        file:
          name: go.d/s3check.conf
        options:
          description: |
            Every job requires an endpoint, region, bucket, access key ID, and secret access key. The default retry and
            timeout budget is chosen to fit the default 120-second interval.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              description: Probe interval in seconds.
              default_value: 120
              required: false
              group: Base
            - name: autodetection_retry
              description: >-
                Recheck interval in seconds after a failed initial configured-job check; zero disables retries.
              default_value: 0
              required: false
              group: Base
            - name: mode
              description: >-
                Run a single-endpoint lifecycle probe, or run one explicit source-to-destination multisite replication
                probe.
              default_value: single
              required: false
              group: Base
            - name: source_site
              description: Bounded source-site label used by multisite charts and alerts.
              default_value: ""
              required: false
              group: Base / Multisite
            - name: destination
              description: >-
                Explicit destination object; required in multisite mode and rejected in single-site mode. No other site is
                probed automatically.
              default_value: ""
              required: false
              group: Base / Multisite
            - name: destination.site
              description: Bounded destination-site label used by multisite charts and alerts.
              default_value: ""
              required: false
              group: Base / Multisite
            - name: destination.endpoint
              description: Absolute HTTP(S) destination S3 endpoint without a path, query, or credentials.
              default_value: ""
              required: false
              group: Base / Multisite
            - name: destination.region
              description: S3 signing region for the destination endpoint.
              default_value: ""
              required: false
              group: Base / Multisite
            - name: destination.bucket
              description: Dedicated unversioned destination bucket.
              default_value: ""
              required: false
              group: Base / Multisite
            - name: destination.prefix
              description: Dedicated destination key prefix, ending with a slash.
              default_value: netdata-s3check/
              required: false
              group: Base / Multisite
            - name: destination.path_style
              description: Use destination path-style bucket addressing, common for Ceph RGW; set it to no for virtual-host addressing.
              default_value: true
              required: false
              group: Base / Multisite
            - name: rpo_threshold_ms
              description: Source-write to destination-visibility objective for the silent RPO alert.
              default_value: 900000
              required: false
              group: Base / Multisite
            - name: replication_timeout_ms
              description: Bounded source-write to destination-visibility polling deadline.
              default_value: 1800000
              required: false
              group: Base / Multisite
            - name: delete_threshold_ms
              description: Source-delete to destination-disappearance objective for the silent policy alert.
              default_value: 300000
              required: false
              group: Base / Multisite
            - name: delete_timeout_ms
              description: Bounded source-delete to destination-disappearance polling deadline.
              default_value: 900000
              required: false
              group: Base / Multisite
            - name: verify_delete
              description: >-
                Wait for destination disappearance after deleting the source; disabling this still removes the destination
                probe object but does not measure delete propagation.
              default_value: true
              required: false
              group: Base / Multisite
            - name: endpoint
              description: Absolute HTTP(S) S3 base endpoint without a path, query, or credentials.
              default_value: ""
              required: true
              group: Base
            - name: region
              description: S3 signing region, for example us-east-1.
              default_value: ""
              required: true
              group: Base
            - name: bucket
              description: Dedicated unversioned S3 bucket used by the probe.
              default_value: ""
              required: true
              group: Base
            - name: prefix
              description: Dedicated key prefix, ending with a slash.
              default_value: netdata-s3check/
              required: false
              group: Base
            - name: path_style
              description: Use path-style bucket addressing, common for Ceph RGW and many S3-compatible services; set it to no for AWS S3.
              default_value: true
              required: false
              group: Base
            - name: max_retries
              description: Additional attempts allowed per S3 operation, from zero through two.
              default_value: 1
              required: false
              group: Base
            - name: latency_threshold_ms
              description: >-
                Successful stage duration in milliseconds that raises the silent latency alert; zero disables it.
              default_value: 0
              required: false
              group: Base
            - name: vnode
              description: Associates the job with a configured Virtual Node.
              default_value: ""
              required: false
              group: Base
            - name: access_key_id
              description: S3 access key ID. Use a Netdata secret reference in configuration files.
              default_value: ""
              required: true
              group: Auth
            - name: secret_access_key
              description: S3 secret access key. Use a Netdata secret reference in configuration files.
              default_value: ""
              required: true
              group: Auth
            - name: session_token
              description: Optional static S3 session token.
              default_value: ""
              required: false
              group: Auth
            - name: destination.access_key_id
              description: Destination S3 access key ID. Use a Netdata secret reference.
              default_value: ""
              required: false
              group: Base / Auth
            - name: destination.secret_access_key
              description: Destination S3 secret access key. Use a Netdata secret reference.
              default_value: ""
              required: false
              group: Base / Auth
            - name: destination.session_token
              description: Optional destination static S3 session token.
              default_value: ""
              required: false
              group: Base / Auth
            - name: timeout
              description: Timeout in seconds for one HTTP attempt.
              default_value: 2
              required: false
              group: HTTP
            - name: not_follow_redirects
              description: Reject redirects so signed requests cannot be resent to an unconfigured origin.
              default_value: true
              required: false
              group: HTTP
            - name: proxy_url
              description: HTTP proxy URL; empty uses standard proxy environment variables. If the URL contains credentials, use a Netdata secret reference.
              default_value: ""
              required: false
              group: HTTP
            - name: tls_skip_verify
              description: Skip TLS certificate and hostname verification. This is insecure.
              default_value: false
              required: false
              group: TLS
            - name: tls_ca
              description: Absolute path to a CA bundle.
              default_value: ""
              required: false
              group: TLS
            - name: tls_cert
              description: Absolute path to a client certificate.
              default_value: ""
              required: false
              group: TLS
            - name: tls_key
              description: Absolute path to a client private key.
              default_value: ""
              required: false
              group: TLS
            - name: destination.timeout
              description: Timeout in seconds for one destination HTTP attempt.
              default_value: 2
              required: false
              group: Base / HTTP
            - name: destination.not_follow_redirects
              description: Reject destination redirects so signed requests cannot be resent to an unconfigured origin.
              default_value: true
              required: false
              group: Base / HTTP
            - name: destination.proxy_url
              description: HTTP proxy URL for the destination; empty uses standard proxy environment variables. If the URL contains credentials, use a Netdata secret reference.
              default_value: ""
              required: false
              group: Base / HTTP
            - name: destination.tls_skip_verify
              description: Skip destination TLS certificate and hostname verification. This is insecure.
              default_value: false
              required: false
              group: Base / TLS
            - name: destination.tls_ca
              description: Absolute path to a destination CA bundle.
              default_value: ""
              required: false
              group: Base / TLS
            - name: destination.tls_cert
              description: Absolute path to a destination client certificate.
              default_value: ""
              required: false
              group: Base / TLS
            - name: destination.tls_key
              description: Absolute path to a destination client private key.
              default_value: ""
              required: false
              group: Base / TLS
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Ceph RGW authenticated S3 check
              description: |
                Run one job from each client vantage whose authenticated S3 behavior matters. Replace the bucket,
                endpoint, and secret references with values for a dedicated unversioned probe bucket.
              config: |
                jobs:
                  - name: ceph_rgw_site_a
                    endpoint: https://rgw.example.net
                    region: us-east-1
                    bucket: netdata-s3check
                    prefix: netdata-s3check/
                    access_key_id: ${env:NETDATA_S3CHECK_ACCESS_KEY_ID}
                    secret_access_key: ${env:NETDATA_S3CHECK_SECRET_ACCESS_KEY}
                    path_style: yes
                    update_every: 120
                    timeout: 2
                    max_retries: 1
                    latency_threshold_ms: 0
            - name: AWS S3 lifecycle check
              description: |
                Replace the Region endpoint, bucket, and secret references. Use a dedicated bucket where versioning has
                never been enabled, and use virtual-host addressing by setting path_style to no.
              config: |
                jobs:
                  - name: aws_s3
                    endpoint: https://s3.us-east-1.amazonaws.com
                    region: us-east-1
                    bucket: netdata-s3check
                    prefix: netdata-s3check/
                    access_key_id: ${env:NETDATA_S3CHECK_AWS_ACCESS_KEY_ID}
                    secret_access_key: ${env:NETDATA_S3CHECK_AWS_SECRET_ACCESS_KEY}
                    path_style: no
                    update_every: 120
                    timeout: 2
                    max_retries: 1
                    latency_threshold_ms: 0
            - name: Ceph RGW directional multisite replication check
              description: |
                Configure one explicit job for each replication direction that needs client-visible verification. Both
                buckets must be dedicated and unversioned; the reverse direction is a separate job. The destination prefix
                identifies where the replicated probe key is expected; if it differs, the replication policy must map the
                source route namespace to it.
              config: |
                jobs:
                  - name: ceph_rgw_site_a_to_site_b
                    mode: multisite
                    source_site: site-a
                    destination:
                      site: site-b
                      endpoint: https://rgw-site-b.example.net
                      region: us-east-1
                      bucket: netdata-s3check-site-b
                      prefix: netdata-s3check/
                      access_key_id: ${env:NETDATA_S3CHECK_SITE_B_ACCESS_KEY_ID}
                      secret_access_key: ${env:NETDATA_S3CHECK_SITE_B_SECRET_ACCESS_KEY}
                      path_style: yes
                    endpoint: https://rgw-site-a.example.net
                    region: us-east-1
                    bucket: netdata-s3check-site-a
                    prefix: netdata-s3check/
                    access_key_id: ${env:NETDATA_S3CHECK_SITE_A_ACCESS_KEY_ID}
                    secret_access_key: ${env:NETDATA_S3CHECK_SITE_A_SECRET_ACCESS_KEY}
                    path_style: yes
                    rpo_threshold_ms: 900000
                    replication_timeout_ms: 1800000
                    delete_threshold_ms: 300000
                    delete_timeout_ms: 900000
                    verify_delete: yes
    troubleshooting:
      problems:
        list:
          - name: S3 check does not start
            description: |
              Verify that the endpoint is absolute, the region and bucket are set, credentials resolve, and the account
              can call GetBucketVersioning. In multisite mode both source and destination must pass this check. Netdata
              rejects buckets whose versioning status is Enabled or Suspended.
          - name: Cleanup remains pending
            description: |
              The collector found stale probe keys. It reconciles the prefix before every new write, deletes at most
              two collector-owned keys per cycle, and creates no new object until that prefix is clean. Confirm that
              no other writer uses the prefix. A persisted ownership journal is rejected after its mode, source, destination,
              endpoint, bucket, or prefix changes; restore the matching configuration so the pending object can be cleaned
              safely.
          - name: AWS multisite replication is rejected
            description: |
              The multisite probe requires both buckets to remain never-versioned so an ordinary object deletion proves
              complete cleanup. AWS-native replication requires versioning on both buckets and therefore does not satisfy
              this contract. Use the AWS single-site lifecycle check, or select an S3-compatible replication implementation
              that meets the documented unversioned-bucket contract.
    alerts:
      - name: s3check_stage_failed
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.stage_status
        info: >-
          The authenticated S3 lifecycle probe reported stage ${label:stage} with bounded failure
          reason ${label:reason}. Raw provider errors are intentionally not exposed.
      - name: s3check_stage_latency
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.stage_latency_status
        info: >-
          Successful stage ${label:stage} took at least the configured latency_threshold_ms. Tune the objective to
          the client vantage and workload.
      - name: s3check_multisite_phase_failed
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.multisite_phase_failure
        info: >-
          The active S3 probe cannot write, verify, delete, reconcile, or clean up its configured ownership namespace.
          Inspect the phase status chart for the bounded phase and reason.
      - name: s3check_multisite_payload_mismatch
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.multisite_payload_mismatch
        info: >-
          The destination site returned a different SHA-256 payload than the source probe wrote. The probe removes both objects
          and keeps the incident open until a later verified payload clears it.
      - name: s3check_multisite_replication_rpo_breach
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.multisite_rpo_status
        info: >-
          The current directional probe from ${label:source_site} to ${label:destination_site} has not become
          client-visible within rpo_threshold_ms. Tune the objective to the replication policy.
      - name: s3check_multisite_delete_propagation_breach
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/s3check.conf
        metric: s3check.multisite_delete_status
        info: >-
          The destination copy from ${label:source_site} to ${label:destination_site} remains visible after the source
          delete for longer than delete_threshold_ms. Tune the objective to the replication policy.
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: |
        Every stage is emitted on every cycle, including skipped stages.
      availability: []
      scopes:
        - name: stage
          description: One lifecycle stage of one configured S3 job.
          labels:
            - name: stage
              description: "Lifecycle stage: setup, put, get, list, delete, or cleanup."
            - name: reason
              description: Bounded result classification; raw provider errors are never exposed.
          metrics:
            - name: s3check.stage_status
              description: S3 Probe Stage Status
              unit: status
              chart_type: line
              dimensions:
                - name: ok
                - name: failed
                - name: skipped
            - name: s3check.stage_duration
              description: S3 Probe Stage Duration
              unit: milliseconds
              chart_type: line
              dimensions:
                - name: duration
            - name: s3check.stage_latency_status
              description: S3 Probe Stage Latency Objective Status
              unit: status
              chart_type: line
              dimensions:
                - name: exceeded
        - name: stage requests
          description: Cumulative request accounting for one lifecycle stage of one configured S3 job.
          labels:
            - name: stage
              description: "Lifecycle stage: setup, put, get, list, delete, or cleanup."
          metrics:
            - name: s3check.stage_requests
              description: S3 Probe Stage Requests
              unit: requests
              chart_type: line
              dimensions:
                - name: operations
                - name: attempts
                - name: retries
                - name: failures
        - name: multisite route
          description: One explicit source-to-destination replication direction.
          labels:
            - name: source_site
              description: Bounded operator label for the source site.
            - name: destination_site
              description: Bounded operator label for the destination site.
          metrics:
            - name: s3check.multisite_phase_failure
              description: S3 Multisite Phase Failure Status
              unit: status
              chart_type: line
              dimensions:
                - name: failed
            - name: s3check.multisite_payload_mismatch
              description: S3 Multisite Payload Mismatch Status
              unit: status
              chart_type: line
              dimensions:
                - name: mismatch
            - name: s3check.multisite_replication_lag
              description: S3 Multisite Replication Lag
              unit: milliseconds
              chart_type: line
              dimensions:
                - name: lag
            - name: s3check.multisite_rpo_status
              description: S3 Multisite Replication RPO Status
              unit: status
              chart_type: line
              dimensions:
                - name: breached
            - name: s3check.multisite_delete_lag
              description: S3 Multisite Delete Propagation Lag
              unit: milliseconds
              chart_type: line
              dimensions:
                - name: lag
            - name: s3check.multisite_delete_status
              description: S3 Multisite Delete Propagation Status
              unit: status
              chart_type: line
              dimensions:
                - name: breached
        - name: multisite phase
          description: One lifecycle phase of one directional S3 multisite job.
          labels:
            - name: source_site
              description: Bounded operator label for the source site.
            - name: destination_site
              description: Bounded operator label for the destination site.
            - name: phase
              description: "Directional phase: setup, source_put, replication_wait, source_delete, delete_wait, or cleanup."
            - name: reason
              description: Bounded result classification; raw provider errors are never exposed.
          metrics:
            - name: s3check.multisite_status
              description: S3 Multisite Probe Phase Status
              unit: status
              chart_type: line
              dimensions:
                - name: ok
                - name: waiting
                - name: failed
                - name: skipped
            - name: s3check.multisite_phase_duration
              description: S3 Multisite Probe Phase Duration
              unit: milliseconds
              chart_type: line
              dimensions:
                - name: duration
        - name: multisite phase requests
          description: Cumulative request accounting for one directional S3 multisite phase.
          labels:
            - name: source_site
              description: Bounded operator label for the source site.
            - name: destination_site
              description: Bounded operator label for the destination site.
            - name: phase
              description: "Directional phase: setup, source_put, replication_wait, source_delete, delete_wait, or cleanup."
          metrics:
            - name: s3check.multisite_phase_requests
              description: S3 Multisite Probe Phase Requests
              unit: requests
              chart_type: line
              dimensions:
                - name: operations
                - name: attempts
                - name: retries
                - name: failures
