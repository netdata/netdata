plugin_name: go.d.plugin
modules:
  - meta:
      id: collector-go.d.plugin-k8s_kubelet
      plugin_name: go.d.plugin
      module_name: k8s_kubelet
      monitored_instance:
        name: Kubelet
        description: "Monitor Kubernetes Kubelet containers, pods, runtime operations, storage, and request metrics."
        link: https://kubernetes.io/docs/concepts/overview/components/#kubelet
        icon_filename: kubernetes.svg
        categories:
          - data-collection.containers-and-vms
      keywords:
        - kubelet
        - kubernetes
        - k8s
      related_resources:
        integrations:
          list:
            - plugin_name: apps.plugin
              module_name: apps
            - plugin_name: go.d.plugin
              module_name: k8s_state
            - plugin_name: go.d.plugin
              module_name: k8s_apiserver
            - plugin_name: go.d.plugin
              module_name: k8s_kubeproxy
            - plugin_name: cgroups.plugin
              module_name: /sys/fs/cgroup
              monitored_instance_name: "Kubernetes Containers"
            - plugin_name: go.d.plugin
              module_name: coredns
      info_provided_to_referring_integrations:
        description: ""
    overview:
      data_collection:
        metrics_description: |
          This collector monitors Kubelet instances.
        method_description: ""
      supported_platforms:
        include: []
        exclude: []
      multi_instance: true
      additional_permissions:
        description: ""
      default_behavior:
        auto_detection:
          description: ""
        limits:
          description: ""
        performance_impact:
          description: ""
    setup:
      prerequisites:
        list: []
      configuration:
        file:
          name: go.d/k8s_kubelet.conf
        options:
          description: |
            The following options can be defined globally: update_every, autodetection_retry.
          folding:
            title: Config options
            enabled: true
          list:
            - name: update_every
              description: Data collection interval (seconds).
              default_value: 1
              required: false
              group: Collection
            - name: autodetection_retry
              description: Autodetection retry interval (seconds). Set 0 to disable.
              default_value: 0
              required: false
              group: Collection

            - name: url
              description: Target endpoint URL.
              default_value: http://127.0.0.1:10255/metrics
              required: true
              group: Target
            - name: timeout
              description: HTTP request timeout (seconds).
              default_value: 1
              required: false
              group: Target

            - name: username
              description: Username for Basic HTTP authentication.
              default_value: ""
              required: false
              group: HTTP Auth
            - name: password
              description: Password for Basic HTTP authentication.
              default_value: ""
              required: false
              group: HTTP Auth
            - name: bearer_token_file
              description: "Path to a file containing a bearer token (used for `Authorization: Bearer`)."
              default_value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              required: false
              group: HTTP Auth

            - name: tls_skip_verify
              description: Skip TLS certificate and hostname verification (insecure).
              default_value: no
              required: false
              group: TLS
            - name: tls_ca
              description: Path to CA bundle used to validate the server certificate.
              default_value: ""
              required: false
              group: TLS
            - name: tls_cert
              description: Path to client TLS certificate (for mTLS).
              default_value: ""
              required: false
              group: TLS
            - name: tls_key
              description: Path to client TLS private key (for mTLS).
              default_value: ""
              required: false
              group: TLS

            - name: proxy_url
              description: HTTP proxy URL.
              default_value: ""
              required: false
              group: Proxy
            - name: proxy_username
              description: Username for proxy Basic HTTP authentication.
              default_value: ""
              required: false
              group: Proxy
            - name: proxy_password
              description: Password for proxy Basic HTTP authentication.
              default_value: ""
              required: false
              group: Proxy

            - name: method
              description: HTTP method to use.
              default_value: "GET"
              required: false
              group: Request
            - name: body
              description: Request body (e.g., for POST/PUT).
              default_value: ""
              required: false
              group: Request
            - name: headers
              description: "Additional HTTP headers (one per line as key: value)."
              default_value: ""
              required: false
              group: Request
            - name: not_follow_redirects
              description: Do not follow HTTP redirects.
              default_value: no
              required: false
              group: Request
            - name: force_http2
              description: Force HTTP/2 (including h2c over TCP).
              default_value: no
              required: false
              group: Request

            - name: vnode
              description: Associates this data collection job with a [Virtual Node](https://learn.netdata.cloud/docs/netdata-agent/configuration/organize-systems-metrics-and-alerts#virtual-nodes).
              default_value: ""
              required: false
              group: Virtual Node
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Basic
              folding:
                enabled: false
              description: A basic example configuration.
              config: |
                jobs:
                  - name: local
                    url: http://127.0.0.1:10255/metrics
            - name: HTTPS with self-signed certificate
              description: |
                Do not validate server certificate chain and hostname.
              config: |
                jobs:
                  - name: local
                    url: http://127.0.0.1:10250/metrics
                    tls_skip_verify: yes
    troubleshooting:
      problems:
        list: []
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: ""
      availability: []
      scopes:
        - name: global
          description: These metrics refer to the entire monitored application.
          labels: []
          metrics:
            - name: k8s_kubelet.apiserver_audit_requests_rejected
              description: API Server Audit Requests
              unit: requests/s
              chart_type: line
              dimensions:
                - name: rejected
            - name: k8s_kubelet.apiserver_storage_data_key_generation_failures
              description: API Server Failed Data Encryption Key(DEK) Generation Operations
              unit: events/s
              chart_type: line
              dimensions:
                - name: failures
            - name: k8s_kubelet.apiserver_storage_data_key_generation_latencies
              description: API Server Latencies Of Data Encryption Key(DEK) Generation Operations
              unit: observes/s
              chart_type: stacked
              dimensions:
                - name: "5 µs"
                - name: "10 µs"
                - name: "20 µs"
                - name: "40 µs"
                - name: "80 µs"
                - name: "160 µs"
                - name: "320 µs"
                - name: "640 µs"
                - name: "1280 µs"
                - name: "2560 µs"
                - name: "5120 µs"
                - name: "10240 µs"
                - name: "20480 µs"
                - name: "40960 µs"
                - name: +Inf
            - name: k8s_kubelet.apiserver_storage_data_key_generation_latencies_percent
              description: API Server Latencies Of Data Encryption Key(DEK) Generation Operations Percentage
              unit: "%"
              chart_type: stacked
              dimensions:
                - name: "5 µs"
                - name: "10 µs"
                - name: "20 µs"
                - name: "40 µs"
                - name: "80 µs"
                - name: "160 µs"
                - name: "320 µs"
                - name: "640 µs"
                - name: "1280 µs"
                - name: "2560 µs"
                - name: "5120 µs"
                - name: "10240 µs"
                - name: "20480 µs"
                - name: "40960 µs"
                - name: +Inf
            - name: k8s_kubelet.apiserver_storage_envelope_transformation_cache_misses
              description: API Server Storage Envelope Transformation Cache Misses
              unit: events/s
              chart_type: line
              dimensions:
                - name: cache misses
            - name: k8s_kubelet.kubelet_containers_running
              description: Number Of Containers Currently Running
              unit: running containers
              chart_type: line
              dimensions:
                - name: total
            - name: k8s_kubelet.kubelet_pods_running
              description: Number Of Pods Currently Running
              unit: running pods
              chart_type: line
              dimensions:
                - name: total
            - name: k8s_kubelet.kubelet_pods_log_filesystem_used_bytes
              description: Bytes Used By The Pod Logs On The Filesystem
              unit: B
              chart_type: stacked
              dimensions:
                - name: a dimension per namespace and pod
            - name: k8s_kubelet.kubelet_runtime_operations
              description: Runtime Operations By Type
              unit: operations/s
              chart_type: stacked
              dimensions:
                - name: a dimension per operation type
            - name: k8s_kubelet.kubelet_runtime_operations_errors
              description: Runtime Operations Errors By Type
              unit: errors/s
              chart_type: stacked
              dimensions:
                - name: a dimension per operation type
            - name: k8s_kubelet.kubelet_docker_operations
              description: Docker Operations By Type
              unit: operations/s
              chart_type: stacked
              dimensions:
                - name: a dimension per operation type
            - name: k8s_kubelet.kubelet_docker_operations_errors
              description: Docker Operations Errors By Type
              unit: errors/s
              chart_type: stacked
              dimensions:
                - name: a dimension per operation type
            - name: k8s_kubelet.kubelet_node_config_error
              description: Node Configuration-Related Error
              unit: bool
              chart_type: line
              dimensions:
                - name: experiencing_error
            - name: k8s_kubelet.kubelet_pleg_relist_interval_microseconds
              description: PLEG Relisting Interval Summary
              unit: microseconds
              chart_type: stacked
              dimensions:
                - name: "0.5"
                - name: "0.9"
                - name: "0.99"
            - name: k8s_kubelet.kubelet_pleg_relist_latency_microseconds
              description: PLEG Relisting Latency Summary
              unit: microseconds
              chart_type: stacked
              dimensions:
                - name: "0.5"
                - name: "0.9"
                - name: "0.99"
            - name: k8s_kubelet.kubelet_token_requests
              description: Token() Requests To The Alternate Token Source
              unit: token requests/s
              chart_type: line
              dimensions:
                - name: total
                - name: failed
            - name: k8s_kubelet.rest_client_requests_by_code
              description: HTTP Requests By Status Code
              unit: requests/s
              chart_type: stacked
              dimensions:
                - name: a dimension per HTTP status code
            - name: k8s_kubelet.rest_client_requests_by_method
              description: HTTP Requests By Status Method
              unit: requests/s
              chart_type: stacked
              dimensions:
                - name: a dimension per HTTP method
        - name: volume manager
          description: These metrics refer to the Volume Manager.
          labels: []
          metrics:
            - name: k8s_kubelet.volume_manager_total_volumes
              description: Volume Manager State Of The World
              unit: state
              chart_type: line
              dimensions:
                - name: actual
                - name: desired
        - name: persistent volume claim
          description: |
            These metrics refer to a PersistentVolumeClaim mounted on this node, one instance per PVC.

            - A chart is created only while the kubelet reports real data for it. The kubelet reports 0 for values a volume does not provide, so volumes without filesystem statistics (for example block volumes) have no PVC charts, and volumes without inode accounting (for example SMB shares) have no inode chart.
            - `reserved` is the space or inodes the filesystem holds back (capacity minus used minus available, usually root-reserved blocks). It is never negative: if a storage driver reports more used and available space than capacity, `reserved` is 0.
            - Space utilization is used / (used + available), like `df`.
            - A ReadWriteMany PVC mounted on several nodes is reported by each of them. Aggregate PVC charts across nodes with `max`, not `sum`.
            - Volumes backed by a host directory (for example the `local-path` provisioner) report the usage of the whole host filesystem, so all of them show the same values on a node.
          labels:
            - name: k8s_namespace
              description: Namespace of the PersistentVolumeClaim.
            - name: k8s_pvc_name
              description: PersistentVolumeClaim name.
          metrics:
            - name: k8s_kubelet.pvc_space_usage
              description: PVC Space Usage
              unit: B
              chart_type: stacked
              dimensions:
                - name: available
                - name: used
                - name: reserved
            - name: k8s_kubelet.pvc_space_utilization
              description: PVC Space Utilization
              unit: "%"
              chart_type: line
              dimensions:
                - name: utilization
            - name: k8s_kubelet.pvc_inodes_usage
              description: PVC Inodes Usage
              unit: inodes
              chart_type: stacked
              dimensions:
                - name: available
                - name: used
                - name: reserved
