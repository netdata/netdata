# Development metadata fixture. Keep outside metadata.yaml catalog discovery until release.
plugin_name: scripts.d.plugin
modules:
  - meta:
      id: collector-scripts.d.plugin-native
      plugin_name: scripts.d.plugin
      module_name: native
      monitored_instance:
        name: Native Scripts
        link: https://github.com/netdata/netdata/blob/master/src/go/plugin/scripts.d/NATIVE.md
        categories:
          - data-collection.synthetic-testing
        icon_filename: bolt.svg
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: ""
      keywords: [scripts, custom, bash, python, checks, json]
    overview:
      multi_instance: true
      data_collection:
        metrics_description: |
          Monitor custom services with labeled metrics and named health checks from scripts in any language.
          Packages can provide chart templates, and warning or critical checks have built-in alerts.

          This collector is a preview. Its package and response formats may change.
        method_description: |
          Each job runs an executable per collection or keeps one persistent process, as selected by its package definition or direct command job.
          Both modes read complete JSON snapshots; persistent requests and replies carry matching IDs.
          A file-backed manifest supplies metadata without execution. An explicitly registered self-contained executable supplies capabilities, templates and a configuration form through a bounded describe operation at plugin startup. Job creation, configuration tests and updates reuse that description.
          Registered packages expose their own dynamic configuration forms and can provide interactive Functions, with or without periodic collection. Validated configuration and Function inputs reach scripts through stdin.
          Warning and critical service observations are successful collections; command or protocol failures discard the entire response.
      supported_platforms:
        include: []
        exclude: []
      additional_permissions:
        description: |
          Commands run unprivileged through nd-run. On Unix, the executable and all ancestor directories must be
          root-owned and not writable by group or others. Administrators must also protect package files and scripts
          passed as interpreter arguments. On Windows, use appropriate ACLs; Unix path checks do not apply.
      default_behavior:
        auto_detection:
          description: No commands are discovered automatically. Administrators register package manifests explicitly or select a manifest or direct command per job. Registering a package does not create a job.
        limits:
          description: Each JSON response, Function request and configuration envelope is limited to 64 MiB, including whitespace. Startup descriptions have a separate 64 MiB limit. These are encoded-byte cutoffs, not memory budgets. A persistent script handles collection and Function calls sequentially.
        performance_impact:
          description: One-shot mode starts a process per collection or Function call; persistent mode retains one process per job. CPU, memory and target load depend on the script, collection interval and Function requests.
    setup:
      prerequisites:
        list:
          - title: Install a native script package
            description: |
              Install an executable in an administrator-controlled directory. A manifest is optional for direct command jobs.
              Follow the [native script package guide](https://github.com/netdata/netdata/blob/master/src/go/plugin/scripts.d/NATIVE.md)
              for the protocol, optional chart template and Bash helper.
      configuration:
        file:
          name: scripts.d/native.conf
        options:
          description: Configure one job for each package instance. update_every and autodetection_retry may also be defined globally.
          folding:
            title: Config options
            enabled: true
          list:
            - name: manifest
              description: Absolute path to the installed native script package manifest. Set either manifest or command.
              default_value: ""
              required: false
            - name: command
              description: Executable and fixed arguments for a script without a manifest. The executable must be an absolute path. Set either manifest or command.
              default_value: ""
              required: false
            - name: mode
              description: Auto uses the manifest's mode or runs a direct command once per collection. Choose oneshot or persistent only for a direct command.
              default_value: auto
              required: false
            - name: snapshot_format
              description: Auto uses the manifest's snapshot format or JSON for a direct command. Choose json or lines only for a direct command.
              default_value: auto
              required: false
            - name: config
              description: Values for the package configuration schema. Leave empty to use package defaults.
              default_value: ""
              required: false
            - name: update_every
              description: Data collection interval in seconds.
              default_value: 10
              required: false
            - name: autodetection_retry
              description: Retry interval in seconds for failed startup checks. Zero disables retries.
              default_value: 0
              required: false
            - name: timeout
              description: Timeout in seconds for startup and collection, including queue waiting. Admitted persistent collections get a full exchange timeout. Canceled Functions allow up to this timeout to drain their reply; callers still use their own deadline.
              default_value: 5
              required: false
        examples:
          folding:
            title: Config
            enabled: true
          list:
            - name: Installed package
              description: Run an installed package every 10 seconds.
              config: |
                jobs:
                  - name: queue
                    manifest: /usr/local/lib/netdata/custom/queue/manifest.yaml
                    update_every: 10
                    timeout: 5
    troubleshooting:
      problems:
        list:
          - name: Script runs manually but collection fails
            description: |
              Verify the executable's ownership and permissions, its operation argument, and its sanitized execution
              environment. Stdout must contain only protocol JSON. Persistent scripts must flush a ready handshake and
              one correlated reply per request. Nonzero exits, timeout, malformed output
              and oversized responses fail the complete attempt. The collector does not log script stderr.
    alerts:
      - name: native_script_check
        link: https://github.com/netdata/netdata/blob/master/src/go/plugin/scripts.d/development/native_script.conf
        metric: native_script.check_state
        info: Service health reported by a native script (0 = OK, 1 = warning, 2 = critical)
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: |
        Metric charts and their labels come from each response's metric families and optional package chart template.
        Check charts use the response's check titles and identity labels. They share the context
        native_script.check_state, units state, and dimensions ok, warning, critical and unknown.

        Unknown observations leave health undefined. A check omitted from a successful response disappears;
        it does not recover. An explicit ok observation signals recovery. Execution failures publish no check
        samples and use the existing collection-failure alert, whose stock notification route is silent.
      availability: []
      scopes: []
