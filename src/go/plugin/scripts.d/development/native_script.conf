# Development-only health fixture; not installed.
# Native script service checks own these states. Execution failures are covered
# separately by plugin_data_collection_status. Unknown must not signal recovery.
template: native_script_check
      on: native_script.check_state
   class: Errors
    type: Applications
component: Service
    calc: $unknown ? nan : ($warning + 2 * $critical)
   every: 10s
    warn: ($this == nan OR $this == inf) ? (nan) : ($this == 1)
    crit: ($this == nan OR $this == inf) ? (nan) : ($this == 2)
      to: sysadmin
    info: Service health reported by a native script (0 = OK, 1 = warning, 2 = critical)
