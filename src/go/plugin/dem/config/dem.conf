# DEM plugin and process-wide history policy.
enabled: yes

# Maximum simultaneous browser attempts in this dem.plugin process.
# Monitoring, rehearsals and runtime qualification share this allowance.
# Runtime contract probes run separately and coalesce while in flight.
# Size for CPU/RAM and Lighthouse measurement fidelity; this is not a memory cap.
# Changes apply after restarting the plugin.
browser:
  concurrency: 1

# History policy changes apply at the next hourly retention sweep.
# One shared budget across RUM, synthetic runs and retained machine identities.
# Whole files expire by latest saved time; size pressure can remove younger data.
# File bytes include preallocation; max_bytes must be at least 8388608 (8 MiB).
# This is not an exact event TTL, complete history window or physical disk cap.
# dem-history-status reports effective policy, current inventory and maintenance errors.
history:
  days: 30
  max_bytes: 1073741824

# Browser runtime for journeys and Lighthouse. RUM works without a browser runtime.
# DEM Docker images include the runtime. Recreating the container with a newer image updates it.
# Use netdata-dem-runtime (DEB/RPM) or kickstart.sh --install-dem-runtime (static/source)
# for other installations. For Chromium host policy, see packaging/installer/DEM-RUNTIME.md.
# Enabling monitors never downloads or installs executables.
# Release builds default to their exact companion URL; release_url can override it.
# Online trust comes from the canonical package public keyring.
# Set offline_keyring only for offline import or preload.
# Enrolled runtime updates accompany Agent updates; there is no independent download timer.
# --manual-updates requires explicit matching inputs or download consent for each update.
# The installation/deployment owner coordinates activation and matching-pair recovery.
# A managed runtime remains installed until explicit uninstall.
# The allowance includes generations and preparation reservations; process and
# execution and pair-recovery protection may prevent new installations. Pressure can
# shorten grace only for unprotected generations.
runtime:
  # Defaults to native on DEB/RPM, preloaded in DEM Docker images and managed elsewhere.
  # mode: managed
  cache_path: ''          # defaults to NETDATA_LIB_DIR/dem/runtime
  max_bytes: 4294967296
  previous_retention_days: 7
  # Defaults to this Agent release and architecture. Empty disables default online release discovery.
  # release_url: ''
  offline_keyring: ''    # absolute OpenPGP public-keyring path; required only for offline import/preload
  # Protected preloads are sealed bundles at their final absolute root.
  # DEM Docker images default to /opt/netdata-dem-runtime. Explicit options take precedence.
  # Stop every consumer before replacing or removing a preload, then restart to activate.
  # mode: preloaded
  # preload_path: /opt/netdata-dem-runtime

# Optional screenshot, trace and report sets share this retained-capture allowance.
# Prefer each monitor's newest eligible set; age and size limits still apply.
# Workspace, unclassified files and pending deletions are separate: total disk
# use can exceed max_bytes. This does not guarantee complete incident history.
# synthetics-artifacts reports policy, storage observations and cleanup errors.
# Valid retention edits apply at the next hourly sweep.
artifacts:
  days: 7
  max_bytes: 2147483648
