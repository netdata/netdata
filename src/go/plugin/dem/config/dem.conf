# DEM plugin and process-wide history policy.
enabled: yes
# History policy changes apply at the next hourly retention sweep.
# Whole archived journal files expire by saved-time age/committed journal bytes.
# The active file is protected; max_bytes is not a hard disk ceiling.
history:
  days: 30
  max_bytes: 1073741824

# Prepared browser runtime. Required only for journey/Lighthouse jobs.
# Install pinned packages using the delivered package-lock.json; the plugin
# never installs dependencies or downloads Chromium. Restart after path changes.
runtime:
  node_path: /usr/bin/node
  dependencies_path: ''
  browser_path: ''

# Optional screenshot/report files share this whole-plugin budget. Files are
# retained for up to seven days subject to byte limits; active/unverified work
# is protected. Valid retention edits apply at the next hourly sweep.
artifacts:
  days: 7
  max_bytes: 2147483648
