# DEM plugin and process-wide history policy.
enabled: yes
# History policy changes apply at the next hourly retention sweep.
# One shared budget across RUM, synthetic runs and retained machine identities.
# Whole files expire by latest saved time; size pressure can remove younger data.
# File bytes include preallocation; max_bytes must be at least 8388608 (8 MiB).
# This is not an exact event TTL, complete history window or physical disk cap.
# dem-history-status reports effective policy, current inventory and maintenance errors.
history:
  days: 30
  max_bytes: 1073741824

# Browser runtime for journey/Lighthouse; RUM does not need it.
# Explicitly install a signed release with dem.plugin runtime install, then restart.
# Enabling monitors never downloads or installs executables.
# Configure the approved release URL and publisher public key for managed delivery.
# Explicit install enables daily update preparation; --manual-updates disables it.
# Updates become active only after restart, including security fixes.
# The selected release remains installed until explicit uninstall.
# The allowance includes generations and preparation reservations; process and
# execution protection may prevent new installations. Pressure can shorten grace.
runtime:
  # Defaults to native for DEB/RPM builds, managed for other installations.
  # mode: managed
  cache_path: ''          # defaults to NETDATA_LIB_DIR/dem/runtime
  max_bytes: 4294967296
  previous_retention_days: 7
  release_url: ''        # confirmed signed latest URL for this architecture
  verification_keys: []   # absolute paths to publisher-approved PKIX Ed25519 public PEMs
  # Protected preloads are sealed bundles at their final absolute root.
  # Stop every consumer before replacing/removing them; restart to activate.
  # mode: preloaded
  # preload_path: /opt/netdata-dem-runtime

# Optional screenshot/report sets share this retained-capture allowance.
# Prefer each monitor's newest eligible set; age and size limits still apply.
# Workspace, unclassified files and pending deletions are separate: total disk
# use can exceed max_bytes. This does not guarantee complete incident history.
# synthetics-artifacts reports policy, storage observations and cleanup errors.
# Valid retention edits apply at the next hourly sweep.
artifacts:
  days: 7
  max_bytes: 2147483648
