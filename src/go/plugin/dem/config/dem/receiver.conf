# One canonical receiver. Native configuration updates this fixed job.
jobs:
  - name: receiver
    listen: 127.0.0.1:19938
    # Set public_url to the HTTPS base exposed by your reverse proxy for copyable snippets.
    # Route the whole /rum/ namespace, including assets and collect, through that base.
    # public_url: https://rum.example.org
    # Trust only the proxy addresses that actually connect to this listener.
    # trusted_proxies: [127.0.0.1/32, '::1/128']
    # tls_cert: /etc/netdata/ssl/rum.crt
    # tls_key: /etc/netdata/ssl/rum.key
    # Empty geoip_db tries Agent cache, then stock topology-ip-intel/topology-ip-geo.mmdb.
    # An explicit path uses only that file. Provision a supported geographic MMDB separately.
    # Missing geography does not stop collection. Sources are checked at startup and every 60s.
    # Replace databases by atomic rename; never overwrite or truncate the active file.
    # geoip_db: /etc/netdata/geoip/geography.mmdb
    max_body_bytes: 262144
    rate_limit:
      per_ip_per_min: 120
      per_site_per_sec: 500
