# Define referenced vnodes through dem:vnode or YAML files in the Netdata vnodes/ directory.
# Browser workflows use a prepared Linux runtime from dem.conf.
# Optional vnode references a configured Virtual Node; omit it to use the local Agent.
# Configure exactly one of inline script or an absolute script_path.
# No journey runs until a job is configured.
# check_every starts browser checks; update_every refreshes latest-result charts.
# When upgrading, move the old browser interval from update_every to check_every.
# jobs:
#   - name: checkout
#     vnode: storefront
#     check_every: 900
#     update_every: 10
#     # Includes up to 5 seconds for graceful timeout reporting; cleanup follows execution.
#     timeout: 120
#     screenshot_on_failure: true
#     # Optional raw trace ZIPs can include credentials; requires screenshots.
#     trace_on_failure: false
#     # Optional counts and primitive samples; can retain sensitive text and add console-dispatch cost.
#     browser_error_summary: false
#     script: |
#       import {test, expect} from '@playwright/test';
#       test('checkout page loads', async ({page}) => {
#         await page.goto('https://shop.example.org/checkout');
#         await expect(page.getByRole('heading', {name: 'Checkout'})).toBeVisible();
#       });
