# Define referenced vnodes through dem:vnode or YAML files in the Netdata vnodes/ directory.
# Browser workflows use a prepared Linux runtime from dem.conf.
# Optional vnode references a configured Virtual Node; omit it to use the local Agent.
# Configure exactly one of inline script or an absolute script_path.
# No journey runs until a job is configured.
# check_every starts browser checks; update_every refreshes latest-result charts.
# When upgrading, move the old browser interval from update_every to check_every.
