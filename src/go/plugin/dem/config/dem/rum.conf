# Add one native job per web property. No site is enabled by default.
# Install <script async src="https://rum.example.org/rum/shop.js"></script>
# on the monitored website after configuring an explicit receiver or site public_url.
# A site public_url may override that base; neither listener nor request headers supply it.
#
#jobs:
#  - name: shop
#    display_name: Shop
#    allowed_origins: [https://shop.example.org]
#    update_every: 10
#    window: 5m
#    page_groups: 20
#    countries: 20
#    capture:
#      # 'off' (quote in YAML) skips lookup; country is default; city adds approximate live markers.
#      # Coordinates are never retained in history or exported.
#      geolocation: country
#      # Optional interaction heuristics, not proof of intent or causality.
#      frustration_signals: false
#    # Browser collection: omitted/null means 1; zero disables collection.
#    measure_sample_rate: 1
#    investigate:
#      # Baseline detail for native history and enabled event logs/traces.
#      # Omitted/null means 1; zero with default overrides means problems only.
#      sample_rate: 1
#      # Use [] with sample_rate: 0 for measurements/live views without detail.
#      always_keep: [errors, poor_vitals]
#    # Overrides keep available recent native context plus current/future detail
#    # while tracked. Earlier logs/spans are not exported retrospectively.
#    bots: exclude
#    # Optional searchable events; native history needs no OTLP receiver.
#    event_logs:
#      enabled: false
#      include_console_logs: false
#      destination:
#        endpoint: http://127.0.0.1:4317
#        # auth_token: '${env:EVENT_LOGS_TOKEN}'
#        # HTTPS only: tls_ca, tls_cert and tls_key (certificate/key together).
#    # Browser spans are independent of event logs. Instrument the backend and
#    # send both sides to the same tracing system for distributed traces.
#    tracing:
#      enabled: false
#      propagate_to: []
#      destination:
#        endpoint: http://127.0.0.1:4317
#        # auth_token: '${env:TRACE_EXPORT_TOKEN}'
#        # HTTPS only: tls_ca, tls_cert and tls_key (certificate/key together).
#    # URL-path normalization is not general anonymization or consent handling.
#    redact_paths:
#      - pattern: '/accounts/[^/]+'
#        replace: '/accounts/:id'
#
# Destinations use OTLP/gRPC, with an explicit http://host:port (plaintext) or
# https://host:port (TLS). Each signal has its own destination; none is inherited.
# Configure the receiver separately. Saved inactive settings remain in the job;
# native secret references must still resolve even while a signal is disabled.
