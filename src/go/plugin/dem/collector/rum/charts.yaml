context_namespace: rum
groups:
    - charts:
        - context: lcp
          dimensions:
            - name: p50
              selector: lcp_p50
            - name: p75
              selector: lcp_p75
            - name: p95
              selector: lcp_p95
          title: Largest Contentful Paint
          units: milliseconds
        - context: lcp_rating
          dimensions:
            - name: good
              selector: lcp_good
            - name: needs_improvement
              selector: lcp_needs_improvement
            - name: poor
              selector: lcp_poor
          title: Largest Contentful Paint ratings
          type: stacked
          units: samples
        - context: fcp
          dimensions:
            - name: p50
              selector: fcp_p50
            - name: p75
              selector: fcp_p75
            - name: p95
              selector: fcp_p95
          title: First Contentful Paint
          units: milliseconds
        - context: fcp_rating
          dimensions:
            - name: good
              selector: fcp_good
            - name: needs_improvement
              selector: fcp_needs_improvement
            - name: poor
              selector: fcp_poor
          title: First Contentful Paint ratings
          type: stacked
          units: samples
        - context: ttfb
          dimensions:
            - name: p50
              selector: ttfb_p50
            - name: p75
              selector: ttfb_p75
            - name: p95
              selector: ttfb_p95
          title: Time to First Byte
          units: milliseconds
        - context: ttfb_rating
          dimensions:
            - name: good
              selector: ttfb_good
            - name: needs_improvement
              selector: ttfb_needs_improvement
            - name: poor
              selector: ttfb_poor
          title: Time to First Byte ratings
          type: stacked
          units: samples
        - context: inp
          dimensions:
            - name: p50
              selector: inp_p50
            - name: p75
              selector: inp_p75
            - name: p95
              selector: inp_p95
          title: Interaction to Next Paint
          units: milliseconds
        - context: inp_rating
          dimensions:
            - name: good
              selector: inp_good
            - name: needs_improvement
              selector: inp_needs_improvement
            - name: poor
              selector: inp_poor
          title: Interaction to Next Paint ratings
          type: stacked
          units: samples
        - context: cls
          dimensions:
            - name: p50
              selector: cls_p50
            - name: p75
              selector: cls_p75
            - name: p95
              selector: cls_p95
          title: Cumulative Layout Shift
          units: score
        - context: cls_rating
          dimensions:
            - name: good
              selector: cls_good
            - name: needs_improvement
              selector: cls_needs_improvement
            - name: poor
              selector: cls_poor
          title: Cumulative Layout Shift ratings
          type: stacked
          units: samples
      family: Web Vitals
      metrics:
        - lcp_p50
        - lcp_p75
        - lcp_p95
        - lcp_good
        - lcp_needs_improvement
        - lcp_poor
        - fcp_p50
        - fcp_p75
        - fcp_p95
        - fcp_good
        - fcp_needs_improvement
        - fcp_poor
        - ttfb_p50
        - ttfb_p75
        - ttfb_p95
        - ttfb_good
        - ttfb_needs_improvement
        - ttfb_poor
        - inp_p50
        - inp_p75
        - inp_p95
        - inp_good
        - inp_needs_improvement
        - inp_poor
        - cls_p50
        - cls_p75
        - cls_p95
        - cls_good
        - cls_needs_improvement
        - cls_poor
    - charts:
        - context: load
          dimensions:
            - name: p50
              selector: load_p50
            - name: p75
              selector: load_p75
            - name: p95
              selector: load_p95
          title: Page load time
          units: milliseconds
        - context: dcl
          dimensions:
            - name: p50
              selector: dcl_p50
            - name: p75
              selector: dcl_p75
            - name: p95
              selector: dcl_p95
          title: DOMContentLoaded time
          units: milliseconds
        - context: api
          dimensions:
            - name: p50
              selector: api_p50
            - name: p75
              selector: api_p75
            - name: p95
              selector: api_p95
          title: First-party API request duration
          units: milliseconds
      family: Navigation
      metrics:
        - load_p50
        - load_p75
        - load_p95
        - dcl_p50
        - dcl_p75
        - dcl_p95
        - api_p50
        - api_p75
        - api_p95
    - charts:
        - context: pageviews
          dimensions:
            - name: views
              selector: pageviews
          title: Page views
          units: views/s
        - context: js_errors
          dimensions:
            - name: errors
              selector: js_errors
          title: JavaScript errors
          units: errors/s
        - context: sessions
          dimensions:
            - name: active
              selector: active_sessions
          title: Active sessions
          units: sessions
        - context: window_totals
          dimensions:
            - name: pageviews
              selector: window_pageviews
            - name: js_errors
              selector: window_js_errors
          title: Page views and JavaScript errors in the window
          units: events
        - context: frustration
          dimensions:
            - name: rage_clicks
              selector: rage_clicks
            - name: dead_clicks
              selector: dead_clicks
            - name: error_clicks
              selector: error_clicks
          title: Frustration signals
          type: stacked
          units: signals/s
      family: Traffic
      metrics:
        - pageviews
        - js_errors
        - active_sessions
        - window_pageviews
        - window_js_errors
        - rage_clicks
        - dead_clicks
        - error_clicks
    - charts:
        - context: resources
          dimensions:
            - name: first_party
              selector: resources_first_party
            - name: third_party
              selector: resources_third_party
          title: Resource requests
          type: stacked
          units: requests/s
        - context: resource_host_p75
          dimensions:
            - name: p75
              selector: resource_host_p75
          instances:
            by_labels:
                - host
          title: Resource duration by host
          units: milliseconds
        - context: resource_host_count
          dimensions:
            - name: count
              selector: resource_host_count
          instances:
            by_labels:
                - host
          title: Resource requests by host
          units: requests/s
      family: Resources
      metrics:
        - resources_first_party
        - resources_third_party
        - resource_host_p75
        - resource_host_count
    - charts:
