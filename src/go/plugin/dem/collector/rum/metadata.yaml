                - name: inp
                - name: cls
        - name: website application view
          description: One application view (route) of a website, among the busiest in the window.
          labels:
            - name: display_name
              description: The site's `display_name`, when it differs from the site key.
            - name: view
              description: Application view name.
            - name: bucket
              description: '`value` for a value charted on its own, `other` for the combined rest.'
          metrics:
            - name: rum.view_activity
              description: Explicit application views and error reports in the window
              unit: events
              chart_type: line
              dimensions:
                - name: views
                - name: errors
    functions:
      description: |
        These Functions show each site's setup and status, its recent activity, and the saved session history. They serve
        every site on the Agent and are available while it has an active site or saved RUM history, so history stays readable
        after a site is removed.

        Viewing them requires a signed-in member of the node's Netdata Cloud Space with permission to view sensitive data, on a
        paid plan or an active trial. Reports are received and history is kept on every plan.

        To narrow the results to one virtual node, pass `vnode` with its configured name, or `vnode_guid` with its GUID for a
        virtual node that was renamed or removed. Pass `site` for one site.

        The plugin-wide `dem-history-status` Function covers the history that RUM and synthetic monitoring share. It is
        available whenever the plugin runs, needs the same access and takes no parameters. It shows the retention in
        effect (`history` in `dem.conf`), how much disk the history files use, and the latest cleanup, write or
        configuration reload error.
      list:
        - id: rum-sites
          function_name: rum-sites
          name: RUM Sites
          description: The setup and status of each site - the script tag to install, the allowed origins, the sampling and
            capture settings, and recent traffic, including the last accepted report and the last refused origin. Start here
            when a site shows no data.
          parameters:
            - &id001
              id: vnode
              name: Virtual node name (`vnode`)
              description: Only sites of the configured virtual node with this name. An empty or unknown name is an error.
                Do not combine with `vnode_guid`.
              type: string
              required: false
              default: ''
              options: []
            - &id002
              id: vnode_guid
              name: Virtual node GUID (`vnode_guid`)
              description: Only data recorded under the virtual node with this GUID. Do not combine with `vnode`.
              type: string
              required: false
              default: ''
              options: []
            - &id003
              id: site
              name: Site (`site`)
              description: Only this site, by its site key.
              type: string
              required: false
              default: ''
              options: &id006 []
          returns:
            description: |
              One row per active site. The response also shows whether the receiver is serving, its public URL and the state
              of its location database (`collector.geoip`). In that object, `selection` is `auto` (empty `geoip_db`) or
              `explicit`, `state` is `loaded`, `unavailable` or `using_previous`, `source` is `cache`, `stock` or
              `explicit`, `database_type` is the database's declared type, and `reason` explains a missing database
              without paths (the Agent log has the details). `lookup_errors` counts failed lookups, not unmatched addresses, and
              `loaded` does not mean the database is current or complete. Its times (`build_at`, `loaded_at`,
              `last_checked_at`) are Unix microseconds.
            columns:
              - name: site
                type: string
                unit: ''
                description: Site key.
              - name: name
                type: string
                unit: ''
                description: Display name, or the site key.
              - name: generation
                type: string
                unit: ''
                description: Identifier of the running site job. It changes when the job restarts.
              - name: collection_enabled
                type: boolean
                unit: ''
                description: Whether `measure_sample_rate` is above 0, whatever the receiver's state.
              - name: script_url
                type: string
                unit: ''
                description: URL of the site's script. Null until the receiver or the site has a `public_url`.
              - name: snippet
                type: string
                unit: ''
                description: Script tag to add to the website. Null until the receiver or the site has a `public_url`.
              - name: allowed_origins
                type: string
                unit: ''
                description: Origins the site accepts reports from.
              - name: beacons_per_min
                type: integer
                unit: ''
                description: Reports accepted in the last minute.
              - name: last_beacon_at
                type: timestamp
                unit: ''
                description: When the last report was accepted. Null when none since the job started.
              - name: last_beacon_age_s
                type: integer
                unit: ''
                description: Seconds since the last accepted report.
              - name: observed_sessions
                type: integer
                unit: ''
                description: Browser sessions seen in the window, not people or concurrent visitors. Null while collection
                  is off or the receiver is not serving.
              - name: pageviews_window
                type: integer
                unit: ''
                description: Page views in the window.
              - name: js_errors_window
                type: integer
                unit: ''
                description: JavaScript errors in the window.
              - name: rejected_per_min
                type: integer
                unit: ''
                description: Reports refused in the last minute for origin, rate or size.
              - name: measured
                type: string
                unit: ''
                description: Current collection rate, from `measure_sample_rate`.
              - name: investigated
                type: string
                unit: ''
                description: Current share of sessions saved with details, from `investigate`.
              - name: investigated_sessions
                type: integer
                unit: ''
                description: Sessions currently tracked for saving.
              - name: bots_per_min
                type: integer
                unit: ''
                description: Reports from automated browsers dropped in the last minute.
              - name: last_rejected_origin
                type: string
                unit: ''
                description: Last origin whose reports were refused. Check it before adding it to `allowed_origins`.
              - name: last_rejected_at
                type: timestamp
                unit: ''
                description: When that origin was refused.
              - name: last_rejected_age_s
                type: integer
                unit: ''
                description: Seconds since that origin was refused.
              - name: capture_geolocation
                type: string
                unit: ''
                description: Current `capture.geolocation` setting.
              - name: capture_frustration_signals
                type: boolean
                unit: ''
                description: Current `capture.frustration_signals` setting.
              - name: application_views_window
                type: integer
                unit: ''
                description: Application views in the window.
              - name: vnode_guid
                type: string
                unit: ''
                description: GUID of the virtual node the data was recorded under. Empty when it had none.
          performance: Reads the sites' current state in memory. Contacts no website.
          security: Shows site settings, origins and traffic counts.
          availability: While the Agent has an active site or saved RUM history.
          require_cloud: true
          prerequisites:
            list: []
        - id: rum-pages
          function_name: rum-pages
          name: RUM Pages
          description: Every page of each site seen in the window, with its traffic, Web Vital p75 values and the page elements
            most often involved in poor LCP, INP and CLS. It lists all pages, not only the busiest ones that get breakdown
            charts.
          parameters:
            - *id001
            - *id002
            - *id003
          returns:
            description: One row per site and page. A vital without observations is null.
            columns:
              - name: site
                type: string
                unit: ''
                description: Site key.
              - name: page
                type: string
                unit: ''
                description: Page path, with IDs replaced.
              - name: pageviews_window
                type: integer
                unit: ''
                description: Page views in the window.
              - name: sessions
                type: integer
                unit: ''
                description: Browser sessions that viewed the page in the window.
              - name: lcp_p75_ms
                type: integer
                unit: ''
                description: Largest Contentful Paint, p75, in milliseconds.
              - name: inp_p75_ms
                type: integer
                unit: ''
                description: Interaction to Next Paint, p75, in milliseconds.
              - name: cls_p75
                type: float
                unit: ''
                description: Cumulative Layout Shift, p75.
              - name: errors_window
                type: integer
                unit: ''
                description: JavaScript errors in the window.
              - name: lcp_element
                type: string
                unit: ''
                description: Page element most often involved in poor LCP, or in any LCP when none was poor.
              - name: inp_element
                type: string
                unit: ''
                description: Page element most often involved in poor INP, or in any INP when none was poor.
              - name: cls_element
                type: string
                unit: ''
                description: Page element most often involved in poor CLS, or in any CLS when none was poor.
              - name: frustration_window
                type: integer
                unit: ''
                description: Frustration signals in the window. Null when they are not collected.
              - name: row_id
                type: string
                unit: ''
                description: Stable row identifier.
                visibility: hidden
              - name: lcp_samples
                type: integer
                unit: ''
                description: LCP observations behind the p75.
              - name: inp_samples
                type: integer
                unit: ''
                description: INP observations behind the p75.
              - name: cls_samples
                type: integer
                unit: ''
                description: CLS observations behind the p75.
              - name: vnode_guid
                type: string
                unit: ''
                description: GUID of the virtual node the data was recorded under. Empty when it had none.
          performance: Reads the sites' current measurements in memory. Contacts no website.
          security: Shows page paths and page element selectors.
          availability: While the Agent has an active site or saved RUM history.
          require_cloud: true
          prerequisites:
            list: []
        - id: rum-live
          function_name: rum-live
          name: RUM Live
          description: The most recent events of each site as they arrive - page views, application views, Web Vital reports
            and errors, with page, browser, device and location. Pass the `next` value of a response as `cursor` to get only
            newer events.
          parameters:
            - *id001
            - &param_vnode_guid_or_unassigned
              id: vnode_guid
              name: Virtual node GUID (`vnode_guid`)
              description: Only events recorded under this virtual node GUID. Use `unassigned` for events recorded without
                a virtual node. Omit both virtual node selectors for all events. Use either `vnode_guid` or `vnode` per request.
              type: string
              required: false
              default: ''
              options: []
            - *id003
            - id: cursor
              name: Cursor (`cursor`)
              description: The `next` value of the previous response, unchanged. Empty starts at the oldest event still
                held. The cursor keeps a position for each site. Changing the virtual node selection starts over. A site
                whose job restarted or was replaced starts a new stream from that job's first events.
              type: string
              required: false
              default: ''
              options: []
          returns:
            description: One row per event, up to 2000 per request. Each site keeps its last 5,000 events in memory. A Web
              Vital can be reported more than once for the same page view; later reports update it.
            columns:
              - name: seq
                type: string
                unit: ''
                description: Event ID.
              - name: ts
                type: timestamp
                unit: ''
                description: When the receiver got the event.
              - name: site
                type: string
                unit: ''
                description: Site key.
              - name: country
                type: string
                unit: ''
                description: Visitor's country.
              - name: city
                type: string
                unit: ''
                description: 'Visitor''s approximate city, with `capture.geolocation: city`.'
              - name: lat
                type: float
                unit: ''
                description: 'Approximate latitude, with `capture.geolocation: city`.'
              - name: lon
                type: float
                unit: ''
                description: 'Approximate longitude, with `capture.geolocation: city`.'
              - name: page
                type: string
                unit: ''
                description: Page path, with IDs replaced.
              - name: browser
                type: string
                unit: ''
                description: Browser name.
              - name: device
                type: string
                unit: ''
                description: Device type.
              - name: pageview
                type: integer
                unit: ''
                description: 1 for a page view.
              - name: lcp_ms
                type: float
                unit: ''
                description: Largest Contentful Paint, in milliseconds.
              - name: inp_ms
                type: float
                unit: ''
                description: Interaction to Next Paint, in milliseconds.
              - name: fcp_ms
                type: float
                unit: ''
                description: First Contentful Paint, in milliseconds.
              - name: ttfb_ms
                type: float
                unit: ''
                description: Time to First Byte, in milliseconds.
              - name: cls
                type: float
                unit: ''
                description: Cumulative Layout Shift.
              - name: errors
                type: integer
                unit: ''
                description: JavaScript errors.
              - name: kind
                type: string
                unit: ''
                description: Event type, such as a page view, application view, Web Vital or error.
              - name: experience_id
                type: string
                unit: ''
                description: Page view the event belongs to.
              - name: view
                type: string
                unit: ''
                description: Application view at the time of the event.
              - name: view_id
                type: string
                unit: ''
                description: Application view occurrence the event belongs to.
              - name: vital
                type: string
                unit: ''
                description: Web Vital that a vital event reports.
              - name: metric_id
                type: string
                unit: ''
                description: Identifier of the reported Web Vital measurement.
              - name: revision
                type: integer
                unit: ''
                description: Report number of that measurement; a higher number replaces a lower one.
              - name: vnode_guid
                type: string
                unit: ''
                description: GUID of the virtual node the data was recorded under. Empty when it had none.
          performance: Reads recent events from memory, up to 2000 per request. Contacts no website.
          security: Shows page paths, browsers, devices, locations and error messages of visitors.
          availability: While the Agent has an active site or saved RUM history.
          require_cloud: true
          prerequisites:
            list: []
        - id: rum-sessions
          function_name: rum-sessions
          name: RUM Sessions
          description: The saved sessions with activity in a time range (the last 15 minutes by default), with their pages,
            errors, browser, device, country and application version. Find a user's sessions with `user_id`, then open a session's
            timeline.
          parameters:
            - *id001
            - *id002
            - *id003
            - id: user_id
              name: User ID (`user_id`)
              description: Only sessions in which the application set this user ID during the time range. The match is exact,
                on the ID as stored after DEM shortens or masks it, so a displayed `[REDACTED]` value cannot be used to look
                a user up.
              type: string
              required: false
              default: ''
              options: []
            - &id004
              id: after
              name: Received after (`after`)
              description: Start of the time range, in Unix seconds, or seconds before now when negative (`-3600` for the
                last hour).
              type: integer
              required: false
              default: 15 minutes before `before`
              options: []
            - &id005
              id: before
              name: Received before (`before`)
              description: End of the time range, in Unix seconds, or seconds before now when negative.
              type: integer
              required: false
              default: now
              options: []
          returns:
            description: One row per session, most recently active first, up to 2000; the response sets `truncated` when more
              match. Counts and times cover the session's activity inside the time range, not its whole life.
            columns:
              - name: site
                type: string
                unit: ''
                description: Site key.
              - name: session_id
                type: string
                unit: ''
                description: Session ID.
              - name: started_age_s
                type: integer
                unit: ''
                description: Seconds since the session's first activity in the range.
              - name: duration_s
                type: integer
                unit: ''
                description: Seconds between the session's first and last activity in the range.
              - name: pageviews
                type: integer
                unit: ''
                description: Page views.
              - name: errors
                type: integer
                unit: ''
                description: JavaScript errors.
              - name: browser
                type: string
                unit: ''
                description: Browser name.
              - name: device
                type: string
                unit: ''
                description: Device type.
              - name: country
                type: string
                unit: ''
                description: Visitor's country.
              - name: version
                type: string
                unit: ''
                description: Application version.
              - name: entry_page
                type: string
                unit: ''
                description: First page in the range.
              - name: last_page
                type: string
                unit: ''
                description: Last page in the range.
              - name: user_ids
                type: array
                unit: ''
                description: User IDs the application set.
              - name: frustrations
                type: integer
                unit: ''
                description: Frustration signals.
              - name: row_id
                type: string
                unit: ''
                description: Stable row identifier.
                visibility: hidden
              - name: application_views
                type: integer
                unit: ''
                description: Application views.
              - name: last_observed_us
                type: timestamp
                unit: ''
                description: When the session was last active in the range.
              - name: vnode_guid
                type: string
                unit: ''
                description: GUID of the virtual node the data was recorded under. Empty when it had none.
          performance: Reads the saved history from disk; wider time ranges and busier sites take longer. Contacts no website.
          security: Shows user IDs, page paths, browsers, devices and countries of visitors.
          availability: While the Agent has an active site or saved RUM history.
          require_cloud: true
          prerequisites:
            list: []
        - id: rum-errors
          function_name: rum-errors
          name: RUM Errors
          description: JavaScript errors of saved sessions in a time range (the last 15 minutes by default), grouped by fingerprint,
            with counts and a sample stack. Select a `fingerprint` to see how many sessions it affected, its top page and
            the browsers it occurs in.
          parameters:
            - *id001
            - *id002
            - *id003
            - id: fingerprint
              name: Fingerprint (`fingerprint`)
              description: Error group to analyze in detail. Empty lists all groups.
              type: string
              required: false
              default: ''
              options: []
            - *id004
            - *id005
          returns:
            description: One row per site and error group. The affected sessions, top page and browsers are filled in only
              for the selected `fingerprint`.
            columns:
              - name: site
                type: string
                unit: ''
                description: Site key.
              - name: fingerprint
                type: string
                unit: ''
                description: Error group identifier.
              - name: type
                type: string
                unit: ''
                description: Error type.
              - name: message
                type: string
                unit: ''
                description: Error message.
              - name: count_window
                type: integer
                unit: ''
                description: Occurrences in the time range.
              - name: sessions_affected
                type: integer
                unit: ''
                description: Sessions with the error, for the selected fingerprint.
              - name: first_seen_age_s
                type: integer
                unit: ''
                description: Seconds since the first occurrence in the range.
              - name: last_seen_age_s
                type: integer
                unit: ''
                description: Seconds since the last occurrence in the range.
              - name: top_page
                type: string
                unit: ''
                description: Page where the error occurs most, for the selected fingerprint.
              - name: browsers
                type: string
                unit: ''
                description: Browsers the error occurs in, for the selected fingerprint.
              - name: sample_stack
                type: string
                unit: ''
                description: Stack trace of one occurrence.
              - name: row_id
                type: string
                unit: ''
                description: Stable row identifier.
                visibility: hidden
              - name: vnode_guid
                type: string
                unit: ''
                description: GUID of the virtual node the data was recorded under. Empty when it had none.
          performance: Reads the saved history from disk; wider time ranges and busier sites take longer. Contacts no website.
          security: Shows error messages, stack traces and page paths, which can contain sensitive text.
          availability: While the Agent has an active site or saved RUM history.
          require_cloud: true
          prerequisites:
            list: []
        - id: rum-session-events
          function_name: rum-session-events
          name: RUM Session Events
          description: The timeline of one session - its page views, application views, errors and other events in order,
            including events not yet saved, with the trace ID of traced requests.
          parameters:
            - *id001
            - *param_vnode_guid_or_unassigned
            - id: site
              name: Site (`site`)
              description: The session's site key. Needed when the same session ID exists on several sites.
              type: string
              required: false
              default: ''
              options: *id006
            - id: session_id
              name: Session (`session_id`)
              description: Session ID, from `rum-sessions`.
              type: string
              required: true
              default: ''
              options: []
          returns:
            description: One row per event, oldest first, for the whole saved session regardless of time range. An unknown
              session returns an error.
            columns:
              - name: ts
                type: timestamp
                unit: ''
                description: When the receiver got the event.
              - name: type
                type: string
                unit: ''
                description: Event type.
              - name: page
                type: string
                unit: ''
                description: Page path, with IDs replaced.
              - name: text
                type: string
                unit: ''
                description: Event details, such as the error message.
              - name: trace_id
                type: string
                unit: ''
                description: Trace ID of a traced request.
              - name: user_id
                type: string
                unit: ''
                description: User ID the application had set at the time.
              - name: experience_id
                type: string
                unit: ''
                description: Page view the event belongs to.
              - name: view
                type: string
                unit: ''
                description: Application view at the time of the event.
              - name: view_id
                type: string
                unit: ''
                description: Application view occurrence the event belongs to.
              - name: metric_id
                type: string
                unit: ''
                description: Identifier of the reported Web Vital measurement.
              - name: revision
                type: integer
                unit: ''
                description: Report number of that measurement.
              - name: vnode_guid
                type: string
                unit: ''
                description: GUID of the virtual node the data was recorded under. Empty when it had none.
          performance: Reads one session from disk and memory. Contacts no website.
          security: Shows user IDs, page paths and error messages of one visitor's session.
          availability: While the Agent has an active site or saved RUM history.
          require_cloud: true
          prerequisites:
            list: []
