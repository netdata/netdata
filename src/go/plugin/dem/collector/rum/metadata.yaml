                    type: string
                    unit: ''
                    description: Site.
                  - name: fingerprint
                    type: string
                    unit: ''
                    description: Fingerprint.
                  - name: type
                    type: string
                    unit: ''
                    description: Type.
                  - name: message
                    type: string
                    unit: ''
                    description: Message.
                  - name: count_window
                    type: integer
                    unit: ''
                    description: Count (window).
                  - name: sessions_affected
                    type: integer
                    unit: ''
                    description: Sessions Affected (selected fingerprint).
                  - name: first_seen_age_s
                    type: integer
                    unit: ''
                    description: First Seen (s ago).
                  - name: last_seen_age_s
                    type: integer
                    unit: ''
                    description: Last Seen (s ago).
                  - name: top_page
                    type: string
                    unit: ''
                    description: Top Page (selected fingerprint).
                  - name: browsers
                    type: string
                    unit: ''
                    description: Browsers (selected fingerprint).
                  - name: sample_stack
                    type: string
                    unit: ''
                    description: Sample Stack.
                  - name: row_id
                    type: string
                    unit: ''
                    description: Stable row identity scoped to the site; the visible values remain available for
                        filtering.
                    visibility: hidden
            performance: Reads local retained history; work grows with the selected range and retained records.
            security: Results can include page paths, browser metadata, user identifiers, error messages and stack
                traces. Restrict access to authorized operators.
            availability: Available while dem.plugin is running. History results require retained investigation data.
            require_cloud: false
            prerequisites:
                list: []
          - id: rum-session-events
            function_name: rum-session-events
            name: RUM Session Events
            description: Read the retained event timeline for a session to follow navigation, errors and traced
                requests.
            parameters:
              - id: site
                name: site
                description: Filter by native site job name. Leave empty to include all sites.
                type: string
                required: false
                default: ''
                options: []
              - id: session_id
                name: session_id
                description: Session identifier returned by rum-sessions. Specify site when the same session identifier
                    exists on multiple sites.
                type: string
                required: true
                default: ''
                options: []
            returns:
                description: One retained or pending session event, with original observation time in Unix microseconds
                    and an optional trace identifier. The available session timeline is returned without range
                    filtering. Unknown sessions return an error.
                columns:
                  - name: ts
                    type: timestamp
                    unit: ''
                    description: Time.
                  - name: type
                    type: string
                    unit: ''
                    description: Event.
                  - name: page
                    type: string
                    unit: ''
                    description: Page.
                  - name: text
                    type: string
                    unit: ''
                    description: Details.
                  - name: trace_id
                    type: string
                    unit: ''
                    description: Trace.
                  - name: user_id
                    type: string
                    unit: ''
                    description: User ID at Event.
                  - name: experience_id
                    type: string
                    unit: ''
                    description: Document activation identity, independent of session and application view.
                  - name: view
                    type: string
                    unit: ''
                    description: Application view when this report was created.
                  - name: view_id
                    type: string
                    unit: ''
                    description: Application-view occurrence identity.
                  - name: metric_id
                    type: string
                    unit: ''
                    description: Browser SDK metric identity.
                  - name: revision
                    type: integer
                    unit: ''
                    description: Increasing report revision within this metric or event identity.
            performance: Reads local retained history; work grows with the selected range and retained records.
            security: Results can include page paths, browser metadata, user identifiers, error messages and stack
                traces. Restrict access to authorized operators.
            availability: Available while dem.plugin is running. History results require retained investigation data.
            require_cloud: false
            prerequisites:
                list: []
    meta:
        id: collector-dem.plugin-rum
        info_provided_to_referring_integrations:
            description: ""
        keywords:
          - rum
          - browser
          - web-vitals
          - dem
        module_name: rum
        monitored_instance:
            categories:
              - data-collection.applications
            icon_filename: netdata.png
            link: https://www.netdata.cloud/
            name: Real User Monitoring
        plugin_name: dem.plugin
        related_resources:
            integrations:
                list: []
    metrics:
        availability: []
        description: |
            All charts remain on this Agent. Native job identity scopes site charts; display_name is optional metadata.
            The window uses receiver arrival time. Each Web Vital contributes its latest report per document experience;
            percentiles cannot be averaged across times or groups. Population charts show retained observations and ratings.
            No observations means no percentile. Capacity loss makes affected percentiles and counts unavailable; lost_reports
            is retained loss evidence, not a denominator or an exact count of missing observations in the window.

            Document views count initial activations and back-forward cache restores. Application views count explicit route
            occurrences separately. Observed sessions are distinct browser session identities seen in the window, not concurrent
            users. JavaScript errors are events; errors divided by document views is not a failure percentage. Breakdowns use
            current-window top groups plus a pooled other bucket; page Functions expose all retained document-entry groups.

            The event-log (rum.otlp) and browser-span (rum.spans) charts and their loss alerts exist only while their respective
            feature is enabled. sent counts records accepted by the receiver; errors counts records whose attempted delivery
            failed or was rejected; dropped counts local queue or shutdown loss. Acceptance does not guarantee queryability
            or durable storage. A timeout can have an unknown delivery outcome. Disablement and sampling do not count as loss.
        folding:
            enabled: false
            title: Metrics
        scopes:
          - name: site
            description: One configured site.
            labels:
              - name: display_name
                description: Optional human-readable site name, present when display_name differs from the native site
                    job name.
            metrics:
              - name: rum.lcp
                description: Largest Contentful Paint among recent observed document experiences
                unit: milliseconds
                chart_type: line
                dimensions:
                  - name: p50
                  - name: p75
                  - name: p95
              - name: rum.lcp_population
                description: Largest Contentful Paint observed population
                unit: observations
                chart_type: line
                dimensions:
                  - name: observed
                  - name: good
                  - name: needs_improvement
                  - name: poor
                  - name: lost_reports
              - name: rum.fcp
                description: First Contentful Paint among recent observed document experiences
                unit: milliseconds
                chart_type: line
                dimensions:
                  - name: p50
                  - name: p75
                  - name: p95
              - name: rum.fcp_population
                description: First Contentful Paint observed population
                unit: observations
                chart_type: line
                dimensions:
                  - name: observed
                  - name: good
                  - name: needs_improvement
                  - name: poor
                  - name: lost_reports
              - name: rum.ttfb
                description: Time to First Byte among recent observed document experiences
                unit: milliseconds
                chart_type: line
                dimensions:
                  - name: p50
                  - name: p75
                  - name: p95
              - name: rum.ttfb_population
                description: Time to First Byte observed population
                unit: observations
                chart_type: line
                dimensions:
                  - name: observed
                  - name: good
                  - name: needs_improvement
                  - name: poor
                  - name: lost_reports
              - name: rum.inp
                description: Interaction to Next Paint among recent observed document experiences
                unit: milliseconds
                chart_type: line
                dimensions:
                  - name: p50
                  - name: p75
                  - name: p95
              - name: rum.inp_population
                description: Interaction to Next Paint observed population
                unit: observations
                chart_type: line
                dimensions:
                  - name: observed
                  - name: good
                  - name: needs_improvement
                  - name: poor
                  - name: lost_reports
              - name: rum.cls
                description: Cumulative Layout Shift among recent observed document experiences
                unit: score
                chart_type: line
                dimensions:
                  - name: p50
                  - name: p75
                  - name: p95
              - name: rum.cls_population
                description: Cumulative Layout Shift observed population
                unit: observations
                chart_type: line
                dimensions:
                  - name: observed
                  - name: good
                  - name: needs_improvement
                  - name: poor
                  - name: lost_reports
              - name: rum.load
                description: Document load time
                unit: milliseconds
                chart_type: line
                dimensions:
                  - name: p50
                  - name: p75
                  - name: p95
              - name: rum.dom_content_loaded_handler
                description: DOMContentLoaded handler duration
                unit: milliseconds
                chart_type: line
                dimensions:
                  - name: p50
                  - name: p75
                  - name: p95
              - name: rum.same_site_fetch
                description: Same-site fetch and XHR duration
                unit: milliseconds
                chart_type: line
                dimensions:
                  - name: p50
                  - name: p75
                  - name: p95
              - name: rum.load_population
                description: Document load time observation population
                unit: observations
                chart_type: line
                dimensions:
                  - name: observed
                  - name: lost_reports
              - name: rum.dom_content_loaded_handler_population
                description: DOMContentLoaded handler duration observation population
                unit: observations
                chart_type: line
                dimensions:
                  - name: observed
                  - name: lost_reports
              - name: rum.same_site_fetch_population
                description: Same-site fetch and XHR duration observation population
                unit: observations
                chart_type: line
                dimensions:
                  - name: observed
                  - name: lost_reports
              - name: rum.document_views
                description: Document views
                unit: views/s
                chart_type: line
                dimensions:
                  - name: views
              - name: rum.js_errors
                description: JavaScript errors
                unit: errors/s
                chart_type: line
                dimensions:
                  - name: errors
              - name: rum.observed_sessions
                description: Sessions observed in the window
                unit: sessions
                chart_type: line
                dimensions:
                  - name: observed
              - name: rum.window_totals
                description: Document views, application views and JavaScript errors in the window
                unit: events
                chart_type: line
                dimensions:
                  - name: document_views
                  - name: application_views
                  - name: js_errors
              - name: rum.frustration
                description: Frustration heuristics
                unit: signals/s
                chart_type: stacked
                dimensions:
                  - name: rage_clicks
                  - name: dead_clicks
                  - name: error_clicks
