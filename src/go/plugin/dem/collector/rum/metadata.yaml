      overview:
        additional_permissions:
            description: The Netdata service needs write access to its DEM state directory. Configured TLS and GeoIP files must be readable by the Netdata service account.
        data_collection:
            method_description: The Faro browser SDK sends measurements to the configured RUM receiver. Netdata aggregates accepted observations over a sliding window, retains sampled investigation history locally, and optionally exports event logs and browser traces through OTLP/gRPC. Native charts, session timelines and errors need no OTLP receiver. Country-only geolocation is the default; approximate city markers require explicit opt-in and remain live-only. Frustration heuristics are disabled by default and do not establish intent or causality. Application-provided user IDs remain original application-controlled identifiers, not anonymous values. URL/path and targeted text normalization are limited transformations, not general anonymization or consent handling. Event logs add searchable custom-event attributes and optional console messages; tracing adds sampled browser request spans. Both are disabled by default and have independent destinations.
            metrics_description: Monitor browser Web Vitals, page traffic, JavaScript errors and resource timing, with optional interaction heuristics.
        default_behavior:
            auto_detection:
                description: Sites are explicitly configured; websites are not discovered automatically.
            limits:
                description: Breakdown charts show bounded top groups. History uses one plugin-wide journal file-age and committed-byte retention target in dem.conf, including disabled sites. Whole archives expire; the active file is protected, so the size target is not a hard disk ceiling. Export/history queues count records dropped under backpressure. Export is best effort and receiver acceptance does not guarantee durable storage. Detail sampling applies to native history and enabled event logs and traces. Problem overrides retain available recent native context with its original attribution, then current and future detail while the session remains tracked. Earlier logs and spans are not exported retrospectively; complete sessions or traces are not guaranteed.
            performance_impact:
                description: Resource usage depends on accepted browser traffic and the configured measurement window. Optional OTLP export and investigation history add network and local disk work.
        multi_instance: true
        supported_platforms:
            exclude: []
            include:
                - Linux
                - macOS
      setup:
        configuration:
            examples:
                folding:
                    enabled: true
                    title: Examples
                list:
                    - config: |
                        jobs:
                          - name: shop
                            allowed_origins: [https://shop.example.org]
                      description: Native charts, session timelines and errors, with country-only location and frustration heuristics disabled. No OTLP receiver is required.
                      name: Website
                    - config: |
                        jobs:
                          - name: shop
                            allowed_origins: [https://shop.example.org]
                            investigate:
                              sample_rate: 0
                      description: Keep measurements and live views for all received traffic, with detail selected only for errors or poor vitals by the default problem overrides.
                      name: Problems-only detail
                    - config: |
                        jobs:
                          - name: shop
                            allowed_origins: [https://shop.example.org]
                            investigate:
                              sample_rate: 0
                              always_keep: []
                      description: Keep measurements and live views without retained native detail or event-log and trace exports, even when those exports are enabled.
                      name: Measurements and live views only
                    - config: |
                        jobs:
                          - name: shop
                            allowed_origins: [https://shop.example.org]
                            event_logs:
                              enabled: true
                              include_console_logs: true
                      description: Search sampled events and optional console messages with a local OTLP/gRPC receiver at http://127.0.0.1:4317. Enable that receiver separately.
                      name: Searchable event logs
                    - config: |
                        jobs:
                          - name: shop
                            allowed_origins: [https://shop.example.org]
                            tracing:
                              enabled: true
                              propagate_to: [https://api.example.org]
                              destination:
                                endpoint: https://traces.example.org:4317
                                auth_token: ${env:TRACE_EXPORT_TOKEN}
                      description: Send browser spans to your backend tracing receiver without enabling event logs. Provide the secret and configure backend instrumentation, context propagation, CORS and compatible sampling separately.
                      name: Browser tracing
            file:
                name: dem/rum.conf
            options:
                description: Options apply independently to each site job. Native job name is the beacon and history identity; display_name is human metadata. Event logs and browser tracing each have a complete destination with no inheritance. Saved inactive settings are retained without endpoint or TLS validation, but all native secret references must resolve for the job to start.
                folding:
                    enabled: true
                    title: Configuration options
                list:
                    - default_value: ""
                      description: Stable site identifier used in beacon URLs and history. Renaming creates a new history identity.
                      group: Site
                      name: name
                      required: true
                    - default_value: ""
                      description: Human-readable site name. Leave empty to use the site key.
                      group: Site
                      name: display_name
                      required: false
                    - default_value: ""
                      description: Web origins allowed to send telemetry, such as https://example.org. A leading *. allows subdomains only.
                      group: Site
                      name: allowed_origins
                      required: true
                    - default_value: ""
                      description: Externally reachable collector base URL for this site. Leave empty to use the receiver public URL.
                      group: Site
                      name: public_url
                      required: false
                    - default_value: 10
                      description: Data collection interval, in seconds.
                      group: Collection
                      name: update_every
                      required: false
                    - default_value: 5m
                      description: Sliding window for browser measurements. Accepts durations between 1m and 30m.
                      group: Collection
                      name: window
                      required: false
                    - default_value: 20
                      description: Maximum individual page groups shown in breakdown charts. Remaining groups are combined as other.
                      group: Collection
                      name: page_groups
                      required: false
                    - default_value: 20
                      description: Maximum individual countries shown in breakdown charts. Remaining countries are combined as other.
                      group: Collection
                      name: countries
                      required: false
                    - default_value: exclude
                      description: Exclude crawlers and browser automation by default, or include them as bot traffic.
                      group: Collection
                      name: bots
                      required: false
                    - default_value: ""
                      description: "Choose optional location and interaction evidence independently of sampling. Defaults retain country comparisons and disable frustration heuristics."
                      group: Capture
                      name: capture
                      required: false
                    - default_value: country
                      description: "IP-derived location detail: off disables lookup, country retains country comparisons, and city adds approximate live map markers. Omitted or null means country; coordinates are never retained in history or exported."
                      group: Capture
                      name: capture.geolocation
                      required: false
                    - default_value: "no"
                      description: "Enable rage, dead and error click heuristics and their browser instrumentation. Disabled by default; these signals do not establish user intent or causality."
                      group: Capture
                      name: capture.frustration_signals
                      required: false
                    - default_value: 1
                      description: Share of browser sessions collected, from 0 to 1. Omitted or null means all; zero disables collection. Browser measurement charts are absent while collection is disabled; receiver diagnostics remain available.
                      group: Sampling
                      name: measure_sample_rate
                      required: false
                    - default_value: ""
                      description: Select native investigation history and enabled event-log and trace exports from received sessions. Leave empty to select all received sessions.
                      group: Sampling
                      name: investigate
                      required: false
                    - default_value: 1
                      description: Baseline share of received sessions selected for detail, from 0 to 1. Omitted or null means all; zero selects only the problem overrides below.
                      group: Sampling
                      name: investigate.sample_rate
                      required: false
                    - default_value: '["errors","poor_vitals"]'
                      description: Conditions that select detail beyond the baseline sample. Omitted or null keeps errors and poor vitals; an empty list disables overrides.
                      group: Sampling
                      name: investigate.always_keep
                      required: false
                    - default_value: ""
                      description: "Export sampled browser events for search, including custom-event attributes. Native RUM history works independently."
                      group: Event logs
                      name: event_logs
                      required: false
                    - default_value: "no"
                      description: "Send event logs to the configured destination. Disabled by default; native charts, sessions and errors remain available."
                      group: Event logs
                      name: event_logs.enabled
                      required: false
                    - default_value: "no"
                      description: "Capture console info, warn and error messages for investigated sessions. Effective only when event logs are enabled."
                      group: Event logs
                      name: event_logs.include_console_logs
                      required: false
                    - default_value: ""
                      description: "Receiver for this signal only. Leave unset to use the local OTLP/gRPC receiver."
                      group: Event logs
                      name: event_logs.destination
                      required: false
                    - default_value: "http://127.0.0.1:4317"
                      description: "OTLP/gRPC receiver URL with an explicit port. Use http for plaintext or https for TLS; paths, credentials, query strings and fragments are not allowed."
                      group: Event logs
                      name: event_logs.destination.endpoint
                      required: false
                    - default_value: ""
                      description: "Bearer token accepted by the receiver. Use a native secret reference; leave empty for no authentication."
                      group: Event logs
                      name: event_logs.destination.auth_token
                      required: false
                    - default_value: ""
                      description: "CA certificate file for verifying an HTTPS receiver. Leave empty to use system roots."
                      group: Event logs
                      name: event_logs.destination.tls_ca
                      required: false
                    - default_value: ""
                      description: "Client certificate file for an HTTPS receiver. Set together with TLS key; leave both empty to omit client authentication."
                      group: Event logs
                      name: event_logs.destination.tls_cert
                      required: false
                    - default_value: ""
                      description: "Client private key file for an HTTPS receiver. Set together with TLS client certificate."
                      group: Event logs
                      name: event_logs.destination.tls_key
                      required: false
                    - default_value: ""
                      description: "Capture browser request spans and propagate trace context. Backend spans require separately instrumented services."
                      group: Browser tracing
                      name: tracing
                      required: false
                    - default_value: "no"
                      description: "Capture and export browser spans independently of event logs. Disabled by default."
                      group: Browser tracing
                      name: tracing.enabled
                      required: false
                    - default_value: ""
                      description: "Additional literal API origins receiving trace headers. Same-origin requests receive them automatically; cross-origin APIs must allow the trace headers in CORS."
                      group: Browser tracing
                      name: tracing.propagate_to
                      required: false
                    - default_value: ""
                      description: "Receiver for this signal only. Leave unset to use the local OTLP/gRPC receiver."
                      group: Browser tracing
                      name: tracing.destination
                      required: false
                    - default_value: "http://127.0.0.1:4317"
                      description: "OTLP/gRPC receiver URL with an explicit port. Use http for plaintext or https for TLS; paths, credentials, query strings and fragments are not allowed."
                      group: Browser tracing
                      name: tracing.destination.endpoint
                      required: false
                    - default_value: ""
                      description: "Bearer token accepted by the receiver. Use a native secret reference; leave empty for no authentication."
                      group: Browser tracing
                      name: tracing.destination.auth_token
                      required: false
                    - default_value: ""
                      description: "CA certificate file for verifying an HTTPS receiver. Leave empty to use system roots."
                      group: Browser tracing
                      name: tracing.destination.tls_ca
                      required: false
                    - default_value: ""
                      description: "Client certificate file for an HTTPS receiver. Set together with TLS key; leave both empty to omit client authentication."
                      group: Browser tracing
                      name: tracing.destination.tls_cert
                      required: false
                    - default_value: ""
                      description: "Client private key file for an HTTPS receiver. Set together with TLS client certificate."
                      group: Browser tracing
                      name: tracing.destination.tls_key
                      required: false
                    - default_value: ""
                      description: Apply site-specific URL-path replacements before built-in normalization. These rules do not anonymize user IDs or provide general data-loss prevention.
                      group: Normalization
                      name: redact_paths
                      required: false
                    - default_value: ""
                      description: Go regular expression matching private path identifiers. Empty patterns are ignored.
                      group: Normalization
                      name: redact_paths[].pattern
                      required: false
                    - default_value: ""
                      description: Replacement text for matching path segments. Leave empty to remove them.
                      group: Normalization
                      name: redact_paths[].replace
                      required: false
        prerequisites:
            list:
                - description: DEM is experimental and opt-in. Build Netdata with `-DENABLE_PLUGIN_DEM=ON`, or use `--enable-plugin-dem` with the source installer. Install the resulting DEM plugin package.
                  title: Install the DEM plugin
                - description: Configure the canonical receiver in `dem/receiver.conf`, then add one job per website in `dem/rum.conf`. The native configuration UI exposes the receiver as a single object and sites as independently managed jobs.
                  title: Configure the receiver and site
                - description: Add `<script async src="https://rum.example.org/rum/shop.js"></script>` to the website, replacing the public receiver URL and site key. Allow this collector and the pinned Faro SDK CDN in the website Content Security Policy.
                  title: Install the browser snippet
                - description: Event logs and tracing are optional and disabled by default. Enable an OTLP/gRPC receiver separately. In the receiving Netdata node's Logs tab, select `otel-logs` and the `netdata-rum` service. Filter the time range, `resource.attributes.rum.site` and `attributes.session.id`; inspect `attributes.event.attr.<key>` for custom-event attributes and `attributes.console.level` with the message body for console messages. Netdata log access requires Cloud sign-in. Console errors are logs; uncaught exceptions and unhandled rejections remain native RUM errors. Event data is sampled and independently retained by the destination.
                  title: Optional searchable event logs
                - description: To follow a request into backend services, instrument those services, accept browser trace context, allow trace headers in cross-origin CORS, coordinate sampling and send both sides to the same tracing system. Browser spans alone show browser requests, not a complete backend trace. For an external receiver, look up a copied trace ID in that system. Netdata receiver selection and direct UI navigation are part of the later frontend integration.
                  title: Optional browser tracing
                - description: Stock health templates provide Web Vital and no-beacon alerts independently for each site. Customize thresholds or disable alerts through normal Netdata health configuration; use the `_collect_plugin=dem` and `_collect_job` chart labels for site-specific policies.
                  title: Customize alerts
        single_job: false
      troubleshooting:
        problems:
            list:
                - description: Check receiver availability, the installed snippet URL and the site allowed origins. Open the rum-sites Function for reachability and rejected-origin diagnostics. Missing vital samples produce gaps, including when the receiver is unavailable.
                  name: No browser measurements
                - description: Check that the required signal is enabled and its receiver accepts OTLP/gRPC at the configured explicit http or https URL and port. Verify Bearer authentication, TLS trust and paired client certificate/key files. The event and span charts distinguish receiver-accepted records, failed or rejected delivery, and local queue/shutdown loss. A timeout may have an unknown delivery outcome; zero traffic proves neither failure nor success. Receiver failures do not stop native history.
                  name: Missing exported events or spans
plugin_name: dem.plugin
