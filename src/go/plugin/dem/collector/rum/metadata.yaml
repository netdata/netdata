modules:
  - alerts:
      - name: rum_lcp_experience_quality
        metric: rum.lcp_population
        info: Largest Contentful Paint exceeds its good threshold for more than 25% of recent observed document
            experiences; critical when more than 25% exceed its poor threshold. Requires at least 30 observations and a
            complete local population.
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dem.conf
      - name: rum_inp_experience_quality
        metric: rum.inp_population
        info: Interaction to Next Paint exceeds its good threshold for more than 25% of recent observed document
            experiences; critical when more than 25% exceed its poor threshold. Requires at least 30 observations and a
            complete local population.
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dem.conf
      - name: rum_cls_experience_quality
        metric: rum.cls_population
        info: Cumulative Layout Shift exceeds its good threshold for more than 25% of recent observed document
            experiences; critical when more than 25% exceed its poor threshold. Requires at least 30 observations and a
            complete local population.
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dem.conf
      - name: rum_events_dropped
        metric: rum.otlp
        info: RUM event log delivery failed or records were locally dropped in the last 5 minutes
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dem.conf
      - name: rum_spans_dropped
        metric: rum.spans
        info: RUM browser span delivery failed or spans were locally dropped in the last 5 minutes
        link: https://github.com/netdata/netdata/blob/master/src/health/health.d/dem.conf
    functions:
        description: Use these process-wide Functions through the Netdata Agent or Cloud to inspect RUM setup, live
            activity and retained investigation history. Invoke their public rum-* names; filter by site where
            supported.
        list:
          - id: rum-sites
            function_name: rum-sites
            name: RUM Sites
            description: Inspect site setup, sampling, receiver availability and recent activity to diagnose missing
                browser data.
            parameters: []
            returns:
                description: One admitted site job. The response also includes collector public URL and ingress
                    availability.
                columns:
                  - name: site
                    type: string
                    unit: ''
                    description: Site.
                  - name: name
                    type: string
                    unit: ''
                    description: Name.
                  - name: status
                    type: string
                    unit: ''
                    description: Status.
                  - name: beacon_url
                    type: string
                    unit: ''
                    description: Beacon URL.
                  - name: snippet
                    type: string
                    unit: ''
                    description: Snippet.
                  - name: allowed_origins
                    type: string
                    unit: ''
                    description: Allowed Origins.
                  - name: beacons_per_min
                    type: integer
                    unit: ''
                    description: Beacons / min.
                  - name: last_beacon_age_s
                    type: integer
                    unit: ''
                    description: Last Beacon (s ago).
                  - name: observed_sessions
                    type: integer
                    unit: ''
                    description: Distinct browser session identities observed within the measurement window; not
                        concurrent users.
                  - name: pageviews_window
                    type: integer
                    unit: ''
                    description: Explicit document activations in the window.
                  - name: js_errors_window
                    type: integer
                    unit: ''
                    description: JS Errors (window).
                  - name: rejected_per_min
                    type: integer
                    unit: ''
                    description: Rejected / min.
                  - name: reachable
                    type: string
                    unit: ''
                    description: Reachable.
                  - name: reach_detail
                    type: string
                    unit: ''
                    description: Reachability Detail.
                  - name: measured
                    type: string
                    unit: ''
                    description: Measured.
                  - name: investigated
                    type: string
                    unit: ''
                    description: Investigated.
                  - name: investigated_sessions
                    type: integer
                    unit: ''
                    description: Sessions currently tracked for investigation; separate from observed measurement-window
                        sessions.
                  - name: bots_per_min
                    type: integer
                    unit: ''
                    description: Bots Filtered / min.
                  - name: snippet_check
                    type: string
                    unit: ''
                    description: Snippet On Site.
                  - name: snippet_detail
                    type: string
                    unit: ''
                    description: Snippet Detail.
                  - name: last_rejected_origin
                    type: string
                    unit: ''
                    description: Last Rejected Origin.
                  - name: last_rejected_age_s
                    type: integer
                    unit: ''
                    description: Last Rejection (s ago).
                  - name: capture_geolocation
                    type: string
                    unit: ''
                    description: Current Geolocation Capture.
                  - name: capture_frustration_signals
                    type: boolean
                    unit: ''
                    description: Current Frustration Capture.
                  - name: application_views_window
                    type: integer
                    unit: ''
                    description: Explicit application-view occurrences in the window.
                  - name: window_lost
                    type: integer
                    unit: ''
                    description: Retained capacity-loss evidence; affected measurements are unavailable.
                  - name: sessions_lost
                    type: integer
                    unit: ''
                    description: Retained capacity-loss evidence; affected measurements are unavailable.
            performance: Reads bounded local activity snapshots without contacting the monitored website.
            security: Results can include page paths, browser metadata, user identifiers, error messages and stack
                traces. Restrict access to authorized operators.
            availability: Available while dem.plugin is running; activity comes from admitted site jobs.
            require_cloud: false
            prerequisites:
                list: []
          - id: rum-pages
            function_name: rum-pages
            name: RUM Pages
            description: Compare document-entry pages using recent observed traffic, Web Vital populations and
                attributed elements.
            parameters:
              - id: site
                name: site
                description: Filter by native site job name. Leave empty to include all sites.
                type: string
                required: false
                default: ''
                options: []
            returns:
                description: All retained document-entry groups, independent of chart top groups. Null values indicate
                    absent or incomplete measurements; loss fields identify retained capacity-loss evidence.
                columns:
                  - name: site
                    type: string
                    unit: ''
                    description: Site.
                  - name: page
                    type: string
                    unit: ''
                    description: Page.
                  - name: pageviews_window
                    type: integer
                    unit: ''
                    description: Explicit document activations in the window.
                  - name: sessions
                    type: integer
                    unit: ''
                    description: Distinct browser session identities observed within the window.
                  - name: lcp_p75_ms
                    type: integer
                    unit: ''
                    description: LCP p75 (ms).
                  - name: inp_p75_ms
                    type: integer
                    unit: ''
                    description: INP p75 (ms).
                  - name: cls_p75
                    type: float
                    unit: ''
                    description: CLS p75.
                  - name: errors_window
                    type: integer
                    unit: ''
                    description: JS Errors (window).
                  - name: lcp_element
                    type: string
                    unit: ''
                    description: LCP Element.
                  - name: inp_element
                    type: string
                    unit: ''
                    description: INP Element.
                  - name: cls_element
                    type: string
                    unit: ''
                    description: CLS Element.
                  - name: frustration_window
                    type: integer
                    unit: ''
                    description: Frustration Signals (window).
                  - name: row_id
                    type: string
                    unit: ''
                    description: Stable row identity scoped to the site; the visible values remain available for
                        filtering.
                    visibility: hidden
                  - name: lcp_samples
                    type: integer
                    unit: ''
                    description: Retained observations for LCP.
                  - name: inp_samples
                    type: integer
                    unit: ''
                    description: Retained observations for INP.
                  - name: cls_samples
                    type: integer
                    unit: ''
                    description: Retained observations for CLS.
                  - name: lcp_lost
                    type: integer
                    unit: ''
                    description: Retained capacity-loss evidence; affected measurements are unavailable.
                  - name: inp_lost
                    type: integer
                    unit: ''
                    description: Retained capacity-loss evidence; affected measurements are unavailable.
                  - name: cls_lost
                    type: integer
                    unit: ''
                    description: Retained capacity-loss evidence; affected measurements are unavailable.
                  - name: window_lost
                    type: integer
                    unit: ''
                    description: Retained capacity-loss evidence; affected measurements are unavailable.
                  - name: sessions_lost
                    type: integer
                    unit: ''
                    description: Retained capacity-loss evidence; affected measurements are unavailable.
            performance: Reads bounded local activity snapshots without contacting the monitored website.
            security: Results can include page paths, browser metadata, user identifiers, error messages and stack
                traces. Restrict access to authorized operators.
            availability: Available while dem.plugin is running; activity comes from admitted site jobs.
            require_cloud: false
            prerequisites:
                list: []
          - id: rum-live
            function_name: rum-live
            name: RUM Live
            description: Read recent browser events for live activity views, optionally continuing from a previous
                response.
            parameters:
              - id: site
                name: site
                description: Filter by native site job name. Leave empty to include all sites.
                type: string
                required: false
                default: ''
                options: []
              - id: after
                name: after
                description: Opaque next cursor from the previous rum-live response. Pass it unchanged; leave empty for
                    recent events.
                type: string
                required: false
                default: ''
                options: []
            returns:
                description: Recent observation rows. Vital revisions update the same document metric; rows are not
                    independent document views.
                columns:
                  - name: seq
                    type: string
                    unit: ''
                    description: Event.
                  - name: ts
                    type: timestamp
                    unit: ''
                    description: Time.
                  - name: site
                    type: string
                    unit: ''
                    description: Site.
                  - name: country
                    type: string
                    unit: ''
                    description: Country.
                  - name: city
                    type: string
                    unit: ''
                    description: City.
                  - name: lat
                    type: float
                    unit: ''
                    description: Latitude.
                  - name: lon
                    type: float
                    unit: ''
                    description: Longitude.
                  - name: page
                    type: string
                    unit: ''
                    description: Page.
                  - name: browser
                    type: string
                    unit: ''
                    description: Browser.
                  - name: device
                    type: string
                    unit: ''
                    description: Device.
                  - name: pageview
                    type: integer
                    unit: ''
                    description: Explicit document activation.
                  - name: lcp_ms
                    type: float
                    unit: ''
                    description: LCP (ms).
                  - name: inp_ms
                    type: float
                    unit: ''
                    description: INP (ms).
                  - name: fcp_ms
                    type: float
                    unit: ''
                    description: FCP (ms).
                  - name: ttfb_ms
                    type: float
                    unit: ''
                    description: TTFB (ms).
                  - name: cls
                    type: float
                    unit: ''
                    description: CLS.
                  - name: errors
                    type: integer
                    unit: ''
                    description: JS Errors.
                  - name: kind
                    type: string
                    unit: ''
                    description: Observation kind; one vital row represents one metric report.
                  - name: experience_id
                    type: string
                    unit: ''
                    description: Document activation identity, independent of session and application view.
                  - name: view
                    type: string
                    unit: ''
                    description: Application view when this report was created.
                  - name: view_id
                    type: string
                    unit: ''
                    description: Application-view occurrence identity.
                  - name: vital
                    type: string
                    unit: ''
                    description: Web Vital reported by this row.
                  - name: metric_id
                    type: string
                    unit: ''
                    description: Browser SDK metric identity.
                  - name: revision
                    type: integer
                    unit: ''
                    description: Increasing report revision within this metric or event identity.
            performance: Reads bounded local activity snapshots without contacting the monitored website.
            security: Results can include page paths, browser metadata, user identifiers, error messages and stack
                traces. Restrict access to authorized operators.
            availability: Available while dem.plugin is running; activity comes from admitted site jobs.
            require_cloud: false
            prerequisites:
                list: []
          - id: rum-sessions
            function_name: rum-sessions
            name: RUM Sessions
            description: Investigate retained sampled sessions that overlap a time range, including pages, errors and
                optional interaction heuristics.
            parameters:
              - id: site
                name: site
                description: Filter by native site job name. Leave empty to include all sites.
                type: string
                required: false
                default: ''
                options: []
              - id: user_id
                name: user_id
                description: Exact application user ID observed in retained events in the selected range. Leave empty to
                    include all sessions.
                type: string
                required: false
                default: ''
                options: []
              - id: after
                name: after
                description: Start of the saved-time range as Unix seconds or a negative offset from now.
                type: integer
                required: false
                default: 15 minutes before before
                options: []
              - id: before
                name: before
                description: End of the saved-time range as Unix seconds or a negative offset from now.
                type: integer
                required: false
                default: now
                options: []
            returns:
                description: One session with retained activity saved in the selected range. Counts and activity span
                    cover retained events, not lifetime totals. Results can include disabled sites until their history
                    expires.
                columns:
                  - name: site
                    type: string
                    unit: ''
                    description: Site.
                  - name: session_id
                    type: string
                    unit: ''
                    description: Session.
                  - name: started_age_s
                    type: integer
                    unit: ''
                    description: First Retained Event (s ago).
                  - name: duration_s
                    type: integer
                    unit: ''
                    description: Retained Activity Span (s).
                  - name: pageviews
                    type: integer
                    unit: ''
                    description: Retained document activations.
                  - name: errors
                    type: integer
                    unit: ''
                    description: JS Errors.
                  - name: browser
                    type: string
                    unit: ''
                    description: Browser.
                  - name: device
                    type: string
                    unit: ''
                    description: Device.
                  - name: country
                    type: string
                    unit: ''
                    description: Country.
                  - name: version
                    type: string
                    unit: ''
                    description: Version.
                  - name: entry_page
                    type: string
                    unit: ''
                    description: Entry Page.
                  - name: last_page
                    type: string
                    unit: ''
                    description: Last Page.
                  - name: user_ids
                    type: array
                    unit: ''
                    description: Observed User IDs.
                  - name: frustrations
                    type: integer
                    unit: ''
                    description: Retained Frustration Signals.
                  - name: row_id
                    type: string
                    unit: ''
                    description: Stable row identity scoped to the site; the visible values remain available for
                        filtering.
                    visibility: hidden
                  - name: application_views
                    type: integer
                    unit: ''
                    description: Retained application-view occurrences.
            performance: Reads local retained history; work grows with the selected range and retained records.
            security: Results can include page paths, browser metadata, user identifiers, error messages and stack
                traces. Restrict access to authorized operators.
            availability: Available while dem.plugin is running. History results require retained investigation data.
            require_cloud: false
            prerequisites:
                list: []
          - id: rum-errors
            function_name: rum-errors
            name: RUM Errors
            description: Group errors saved in the selected range by fingerprint; select a fingerprint to investigate
                affected sessions, pages and browsers.
            parameters:
              - id: site
                name: site
                description: Filter by native site job name. Leave empty to include all sites.
                type: string
                required: false
                default: ''
                options: []
              - id: fingerprint
                name: fingerprint
                description: Select an error fingerprint to compute affected-session, top-page and browser statistics.
                    Leave empty for the count overview.
                type: string
                required: false
                default: ''
                options: []
              - id: after
                name: after
                description: Start of the saved-time range as Unix seconds or a negative offset from now.
                type: integer
                required: false
                default: 15 minutes before before
                options: []
              - id: before
                name: before
                description: End of the saved-time range as Unix seconds or a negative offset from now.
                type: integer
                required: false
                default: now
                options: []
            returns:
                description: One error fingerprint per site with events saved in the selected range. Affected-session,
                    page and browser statistics are null until a fingerprint is selected; first and last seen use
                    original event time. Results can include disabled sites until their history expires.
                columns:
