      overview:
        additional_permissions:
            description: The Netdata service needs write access to its DEM state directory. Configured TLS and GeoIP files must be readable by the Netdata service account.
        data_collection:
            method_description: The Faro browser SDK sends measurements to the configured RUM receiver. Netdata aggregates accepted observations over a sliding window, retains sampled investigation history locally, and optionally exports browser logs and traces through OTLP gRPC.
            metrics_description: Monitor browser Web Vitals, page traffic, JavaScript errors, resource timing and user frustration.
        default_behavior:
            auto_detection:
                description: Sites are explicitly configured; websites are not discovered automatically.
            limits:
                description: Breakdown charts show bounded top groups. History uses one plugin-wide journal file-age and committed-byte retention target in dem.conf, including disabled sites. Whole archives expire; the active file is protected, so the size target is not a hard disk ceiling. Export/history queues count records dropped under backpressure.
            performance_impact:
                description: Resource usage depends on accepted browser traffic and the configured measurement window. Optional OTLP export and investigation history add network and local disk work.
        multi_instance: true
        supported_platforms:
            exclude: []
            include:
                - Linux
                - macOS
      setup:
        configuration:
            examples:
                folding:
                    enabled: true
                    title: Examples
                list:
                    - config: |
                        jobs:
                          - name: shop
                            allowed_origins: [https://shop.example.org]
                      description: Minimal native configuration.
                      name: Website
            file:
                name: dem/rum.conf
            options:
                description: Options apply independently to each site job. Native job name is the beacon and history identity; display_name is human metadata.
                folding:
                    enabled: true
                    title: Configuration options
                list:
                    - default_value: ""
                      description: Stable site identifier used in beacon URLs and history. Renaming creates a new history identity.
                      group: Site
                      name: name
                      required: true
                    - default_value: ""
                      description: Human-readable site name. Leave empty to use the site key.
                      group: Site
                      name: display_name
                      required: false
                    - default_value: ""
                      description: Web origins allowed to send telemetry, such as https://example.org. A leading *. allows subdomains only.
                      group: Site
                      name: allowed_origins
                      required: true
                    - default_value: ""
                      description: Externally reachable collector base URL for this site. Leave empty to use the receiver public URL.
                      group: Site
                      name: public_url
                      required: false
                    - default_value: 10
                      description: Data collection interval, in seconds.
                      group: Collection
                      name: update_every
                      required: false
                    - default_value: 5m
                      description: Sliding window for browser measurements. Accepts durations between 1m and 30m.
                      group: Collection
                      name: window
                      required: false
                    - default_value: 20
                      description: Maximum individual page groups shown in breakdown charts. Remaining groups are combined as other.
                      group: Collection
                      name: page_groups
                      required: false
                    - default_value: 20
                      description: Maximum individual countries shown in breakdown charts. Remaining countries are combined as other.
                      group: Collection
                      name: countries
                      required: false
                    - default_value: "no"
                      description: Export browser console logs through OTLP for investigated sessions.
                      group: Collection
                      name: collect_console_logs
                      required: false
                    - default_value: exclude
                      description: Exclude crawlers and browser automation by default, or include them as bot traffic.
                      group: Collection
                      name: bots
                      required: false
                    - default_value: 1
                      description: Share of browser sessions measured, from 0 to 1. Zero preserves the default of measuring all sessions.
                      group: Sampling
                      name: measure_sample_rate
                      required: false
                    - default_value: ""
                      description: Choose which measured sessions retain full history. Leave empty to retain all sessions.
                      group: Sampling
                      name: investigate
                      required: false
                    - default_value: ""
                      description: Share of measured sessions kept in full, from 0 to 1. Zero means all sessions.
                      group: Sampling
                      name: investigate.sample_rate
                      required: false
                    - default_value: ""
                      description: Conditions that retain a session regardless of sampling. Leave unset to keep errors and poor vitals; an empty list keeps neither.
                      group: Sampling
                      name: investigate.always_keep
                      required: false
                    - default_value: ""
                      description: Follow browser requests into backend services. Leave empty to disable tracing.
                      group: Tracing
                      name: tracing
                      required: false
                    - default_value: ""
                      description: Capture browser request spans and propagate trace headers.
                      group: Tracing
                      name: tracing.enabled
                      required: false
                    - default_value: ""
                      description: Additional API origins receiving trace headers. Same-origin requests receive them automatically.
                      group: Tracing
                      name: tracing.propagate_to
                      required: false
                    - default_value: ""
                      description: OTLP gRPC host:port or https://host:port. Leave empty to use this site OTLP endpoint.
                      group: Tracing
                      name: tracing.export_to
                      required: false
                    - default_value: ""
                      description: Export browser logs and spans to an OTLP gRPC receiver.
                      group: Tracing
                      name: otlp
                      required: false
                    - default_value: auto
                      description: Auto exports to an available receiver; yes enables export, and no disables log export. Export failures do not stop ingestion.
                      group: Tracing
                      name: otlp.enabled
                      required: false
                    - default_value: 127.0.0.1:4317
                      description: OTLP gRPC host and port for logs and default browser span export.
                      group: Tracing
                      name: otlp.endpoint
                      required: false
                    - default_value: ""
                      description: Bearer token sent to the OTLP receiver. Leave empty for no authentication.
                      group: Tracing
                      name: otlp.auth_token
                      required: false
                    - default_value: ""
                      description: Client certificate file. Leave empty with TLS key to omit client authentication.
                      group: Tracing
                      name: otlp.tls_cert
                      required: false
                    - default_value: ""
                      description: Client private key file. Set together with TLS certificate.
                      group: Tracing
                      name: otlp.tls_key
                      required: false
                    - default_value: ""
                      description: CA certificate file for verifying the OTLP receiver. Leave empty to use system roots when TLS is enabled.
                      group: Tracing
                      name: otlp.tls_ca
                      required: false
                    - default_value: ""
                      description: Replace private identifiers in URL paths before aggregation and export. Rules run before built-in path redaction.
                      group: Privacy
                      name: redact_paths
                      required: false
                    - default_value: ""
                      description: Go regular expression matching private path identifiers. Empty patterns are ignored.
                      group: Privacy
                      name: redact_paths[].pattern
                      required: false
                    - default_value: ""
                      description: Replacement text for matching path segments. Leave empty to remove them.
                      group: Privacy
                      name: redact_paths[].replace
                      required: false
        prerequisites:
            list:
                - description: DEM is experimental and opt-in. Build Netdata with `-DENABLE_PLUGIN_DEM=ON`, or use `--enable-plugin-dem` with the source installer. Install the resulting DEM plugin package.
                  title: Install the DEM plugin
                - description: Configure the canonical receiver in `dem/receiver.conf`, then add one job per website in `dem/rum.conf`. The native configuration UI exposes the receiver as a single object and sites as independently managed jobs.
                  title: Configure the receiver and site
                - description: Add `<script async src="https://rum.example.org/rum/shop.js"></script>` to the website, replacing the public receiver URL and site key. Allow this collector and the pinned Faro SDK CDN in the website Content Security Policy.
                  title: Install the browser snippet
                - description: Stock health templates provide Web Vital and no-beacon alerts independently for each site. Customize thresholds or disable alerts through normal Netdata health configuration; use the `_collect_plugin=dem` and `_collect_job` chart labels for site-specific policies.
                  title: Customize alerts
        single_job: false
      troubleshooting:
        problems:
            list:
                - description: Check receiver availability, the installed snippet URL and the site allowed origins. Open the rum-sites Function for reachability and rejected-origin diagnostics. Missing vital samples produce gaps, including when the receiver is unavailable.
                  name: No browser measurements
plugin_name: dem.plugin
