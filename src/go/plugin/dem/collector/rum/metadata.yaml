        prerequisites:
            list:
              - description: DEM is experimental and opt-in. Build Netdata with `-DENABLE_PLUGIN_DEM=ON`, or use
                    `--enable-plugin-dem` with the source installer. Install the resulting DEM plugin package.
                title: Install the DEM plugin
              - description: Configure the canonical receiver in `dem/receiver.conf`, then add one job per website in
                    `dem/rum.conf`. The native configuration UI exposes the receiver as a single object and sites as
                    independently managed jobs.
                title: Configure the receiver and site
              - description: Add `<script async src="https://rum.example.org/rum/shop.js"></script>` to the website,
                    replacing the public receiver URL and site key. Allow this collector and the pinned Faro SDK CDN in
                    the website Content Security Policy.
                title: Install the browser snippet
              - description: Event logs and tracing are optional and disabled by default. Enable an OTLP/gRPC receiver
                    separately. In the receiving Netdata node's Logs tab, select `otel-logs` and the `netdata-rum`
                    service. Filter the time range, `resource.attributes.rum.site` and `attributes.session.id`; inspect
                    `attributes.event.attr.<key>` for custom-event attributes and `attributes.console.level` with the
                    message body for console messages. Netdata log access requires Cloud sign-in. Console errors are
                    logs; uncaught exceptions and unhandled rejections remain native RUM errors. Event data is sampled
                    and independently retained by the destination.
                title: Optional searchable event logs
              - description: To follow a request into backend services, instrument those services, accept browser trace
                    context, allow trace headers in cross-origin CORS, coordinate sampling and send both sides to the
                    same tracing system. Browser spans alone show browser requests, not a complete backend trace. For an
                    external receiver, look up a copied trace ID in that system. Netdata receiver selection and direct
                    UI navigation are part of the later frontend integration.
                title: Optional browser tracing
              - description: Stock health templates evaluate complete LCP, INP and CLS populations with at least 30 observations. Quiet traffic alone has no stock alert.
                    Customize thresholds or disable alerts through normal Netdata health configuration; use the
                    `_collect_plugin=dem` and `_collect_job` chart labels for site-specific policies.
                title: Customize alerts
        single_job: false
    troubleshooting:
        problems:
            list:
              - description: Check receiver availability, the installed snippet URL and the site allowed origins. Open
                    the rum-sites Function for reachability and rejected-origin diagnostics. Missing vital samples
                    produce gaps, including when the receiver is unavailable.
                name: No browser measurements
              - description: Check that the required signal is enabled and its receiver accepts OTLP/gRPC at the
                    configured explicit http or https URL and port. Verify Bearer authentication, TLS trust and paired
                    client certificate/key files. The event and span charts distinguish receiver-accepted records,
                    failed or rejected delivery, and local queue/shutdown loss. A timeout may have an unknown delivery
                    outcome; zero traffic proves neither failure nor success. Receiver failures do not stop native
                    history.
                name: Missing exported events or spans
plugin_name: dem.plugin
