version: v1
context_namespace: dem_synthetic
groups:
  - family: Execution
    metrics: [execution_state, duration, observation_age, attempts_success, attempts_failed, attempts_timeout, attempts_inconclusive, attempts_error, attempts_cancelled, attempts_unknown]
    charts:
      - context: execution_state
        lifecycle:
          expire_after_cycles: 0
        title: Latest synthetic observation state
        units: state
        type: stacked
        dimensions:
          - selector: execution_state
      - context: duration
        lifecycle:
          expire_after_cycles: 0
        title: Latest synthetic attempt duration
        units: milliseconds
        dimensions:
          - selector: duration
            name: duration
      - context: observation_age
        lifecycle:
          expire_after_cycles: 0
        title: Age of latest synthetic observation
        units: seconds
        dimensions:
          - selector: observation_age
            name: age
      - context: attempts
        lifecycle:
          expire_after_cycles: 0
        title: Completed synthetic attempts
        units: attempts/s
        type: stacked
        dimensions:
          - selector: attempts_success
            name: success
          - selector: attempts_failed
            name: failed
          - selector: attempts_timeout
            name: timeout
          - selector: attempts_inconclusive
            name: inconclusive
          - selector: attempts_error
            name: error
          - selector: attempts_cancelled
            name: cancelled
          - selector: attempts_unknown
            name: unknown
  - family: Scheduling
    metrics: [scheduled, admitted, coalesced, active, pending, queue_age, scheduling_delay]
    charts:
      - context: occurrences
        lifecycle:
          expire_after_cycles: 0
        title: Synthetic scheduled occurrences
        units: occurrences/s
        dimensions:
          - selector: scheduled
            name: scheduled
          - selector: admitted
            name: admitted
          - selector: coalesced
            name: coalesced
      - context: scheduler_state
        lifecycle:
          expire_after_cycles: 0
        title: Synthetic active and pending attempts
        units: attempts
        dimensions:
          - selector: active
            name: active
          - selector: pending
            name: pending
      - context: queue_age
        lifecycle:
          expire_after_cycles: 0
        title: Oldest synthetic admission wait
        units: seconds
        dimensions:
          - selector: queue_age
            name: age
      - context: scheduling_delay
        lifecycle:
          expire_after_cycles: 0
        title: Latest synthetic admission delay from selected due time
        units: seconds
        dimensions:
          - selector: scheduling_delay
            name: delay
  - family: Tests
    context_namespace: journey
    metrics: [tests_declared, tests_passed, tests_failed, tests_timed_out, tests_skipped, tests_expected_failure, tests_not_run]
    charts:
      - context: declared_tests
        lifecycle:
          expire_after_cycles: 0
        title: Latest declared journey tests
        units: tests
        dimensions:
          - selector: tests_declared
            name: declared
      - context: test_outcomes
        lifecycle:
          expire_after_cycles: 0
        title: Latest journey test outcomes
        units: tests
        type: stacked
        dimensions:
          - selector: tests_passed
            name: passed
          - selector: tests_failed
            name: failed
          - selector: tests_timed_out
            name: timed_out
          - selector: tests_skipped
            name: skipped
          - selector: tests_expected_failure
            name: expected_failure
          - selector: tests_not_run
            name: not_run
