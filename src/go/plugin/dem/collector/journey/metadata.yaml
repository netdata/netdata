plugin_name: dem.plugin
modules:
  - meta:
      id: collector-dem.plugin-journey
      plugin_name: dem.plugin
      module_name: journey
      monitored_instance:
        name: Browser Journey
        link: https://www.netdata.cloud/
        icon_filename: netdata.png
        categories:
          - data-collection.synthetic-testing
      keywords:
        - dem
        - synthetic
        - browser
        - journey
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: ''
    overview:
      data_collection:
        metrics_description: Monitor whether browser workflow checks execute and pass with real Playwright
          Test. Inspect test outcomes, attempt durations and retained failure details. Optionally collect bounded browser
          error counts and primitive samples, including passing tests.
        method_description: Runs the configured Playwright Test entry with sandboxed Chromium at the native
          check_every interval, using one worker without retries. Workflows can perform the actions their scripts request
          on the target website. Configuration Test executes the submitted draft, including resolved secrets,
          without saving monitoring results or captures. Test actions on the target website are real and are not rolled back.
      supported_platforms:
        include:
          - Linux
        exclude: []
      multi_instance: true
      additional_permissions:
        description: '| Permission | Needed when |

          |:--|:--|

          | Execute the prepared Node runtime and sandboxed Chromium | Every browser attempt |

          | Write to the DEM state directory | Retaining history and optional captures |

          | Read the entry file and its imports | Using script_path |

          '
      default_behavior:
        auto_detection:
          description: Jobs require explicit configuration; no websites or scripts are discovered automatically.
        limits:
          description: Empty suites, skipped tests and expected failures cannot establish successful coverage.
            A failed check takes precedence over incomplete coverage. Waiting and running attempts retain the
            prior result for diagnosis; that observation becomes stale after two check intervals and does
            not imply recovery. Failure screenshots, traces and browser error summaries are disabled unless requested.
            Browser summaries cover only fixture contexts; missing evidence does not mean zero browser errors. Configuration Test returns
            pass/fail within the caller's request deadline; long drafts may time out. Test does not enable tracing or publish captures;
            scripts can still direct their own recording.
        performance_impact:
          description: Each attempt starts a fresh browser and consumes CPU, memory and target website requests.
            Increasing check_every reduces browser frequency; update_every only refreshes charts. Jobs share the process browser.concurrency allowance (default 1), so concurrent
            due jobs and configuration tests can wait. A running Test can delay monitoring. Optional monitoring captures consume local disk space. Trace recording adds CPU, memory and temporary disk use even on passing runs; ZIPs above 5 MiB are omitted and timeout capture is best effort.
            Enabling browser_error_summary can add substantial CPU and memory cost on console-heavy pages, even without
            console errors; sample limits do not bound browser event-dispatch cost.
    setup:
      prerequisites:
        list:
          - title: Prepare the browser sandbox policy
            description: |
              On Ubuntu hosts with restricted user namespaces, including Ubuntu 24.04, run kickstart with
              `--install-dem-runtime` for a static or source installation. The native runtime package supplies its own policy.
              For local, rootful Docker on Linux, use the documented Netdata container configuration, including
              `apparmor=unconfined` on AppArmor hosts. Run kickstart with `--install-dem-runtime --docker-container NAME`
              on the daemon host, then run `docker restart NAME` after the first installation succeeds.
              Rootless, nested and remote Docker require separate administrator setup.
              Follow the [browser runtime host setup guide](https://github.com/netdata/netdata/blob/master/packaging/installer/DEM-RUNTIME.md)
              for commands, offline setup and removal. Keep Chromium's sandbox enabled and qualify the actual service deployment.
          - title: Set up the browser runtime
            description: |
              Browser monitoring requires an explicitly installed runtime on Linux amd64 or arm64, running as the
              unprivileged Netdata service account with Chromium sandboxing enabled. Native installations use the optional
              `netdata-dem-runtime` package on live systemd hosts; package hooks may restart the Agent. Other installation
              methods use managed bundles or protected preloads. Production publication still requires release and platform qualification.

              For offline managed installation, set `runtime.offline_keyring` in `dem.conf` to the path of an
              administrator-provisioned public OpenPGP keyring. Obtain a signed release descriptor and matching archive,
              then run as the service account:

              ```sh
              dem.plugin runtime install --release /absolute/path/release.json --archive /absolute/path/runtime.tar.zst
              dem.plugin runtime status
              ```

              Restart DEM to activate the installation. Explicit install enables automatic update preparation; add
              --manual-updates for manual control. Enabling a monitor never downloads a runtime.
              Use `dem.plugin runtime qualify` under the service's execution policy to check both journeys and Lighthouse.
              See the [runtime setup guide](https://github.com/netdata/netdata/blob/master/src/go/plugin/dem/README.md#runtime-setup-and-retirement)
              for updates, explicit downloads, installation paths and protected preloads.
      configuration:
        file:
          name: dem/journey.conf
        options:
          description: Options apply independently to each native job.
          folding:
            enabled: true
            title: Configuration options
          list:
            - name: name
              description: Native job name used to identify this monitor and its history. Renaming creates
                a separate monitor.
              default_value: ''
              required: true
              group: Journey
            - name: script
              description: Inline Playwright Test JavaScript or TypeScript source. Leave empty when using Script
                path.
              default_value: ''
              required: false
              group: Journey
            - name: script_path
              description: Absolute path to a readable Playwright Test JavaScript or TypeScript entry file.
                Leave empty when using Script.
              default_value: ''
              required: false
              group: Journey
            - name: secrets[].name
              description: Unique environment variable name starting with DEM_SECRET_, followed by letters,
                digits or underscores.
              default_value: ''
              required: false
              group: Secrets
            - name: secrets[].value
              description: Credential value or a native secret reference, such as ${env:WORKFLOW_PASSWORD}.
              default_value: ''
              required: false
              group: Secrets
            - name: screenshot_on_failure
              description: Save a screenshot when a workflow check fails. Screenshots can contain sensitive
                page content; timeout capture is best effort.
              default_value: false
              required: false
              group: Diagnosis
            - name: trace_on_failure
              description: Save a Playwright trace ZIP when a workflow check fails; requires failure screenshots and is disabled by default. ZIPs can contain raw passwords, cookies and request/response bodies without redaction.
              default_value: false
              required: false
              group: Diagnosis
              detailed_description: |
                Requires `screenshot_on_failure: true`. DEM configures traces with DOM snapshots, network data and a visual
                timeline, with source files and attachments off. Scripts can override this with `test.use({ trace: 'on' })`,
                invoke tracing APIs or supply their own trace attachments. Credentials and source fragments can remain
                even without overrides. Download the ZIP through `synthetics-artifact` and open it locally with the
                Playwright Trace Viewer.

                Downgrading to an Agent without trace support makes capture sets containing traces unreadable,
                including their screenshots. These sets are excluded from retention cleanup until re-upgrade.
            - name: browser_error_summary
              description: Collect bounded browser error counts and primitive samples from journey fixture contexts, including passing tests. Disabled by default; enabling can add substantial CPU and memory cost on console-heavy pages and retain sensitive text.
              default_value: false
              required: false
              group: Diagnosis
            - name: check_every
              description: Browser check interval, in seconds. Checks start independently from chart refreshes; overloaded jobs keep only the newest pending check.
              default_value: 900
              required: false
              group: Collection
            - name: update_every
              description: Chart refresh interval, in seconds; publishes the latest completed observation without starting a browser check. When upgrading an existing job, move its old browser interval to `check_every`.
              default_value: 10
              required: false
              group: Collection
            - name: timeout
              description: Browser attempt budget, in seconds, excluding time waiting for a browser slot. Journeys reserve up to 5 seconds (20% for budgets below 25 seconds) inside this budget for timeout reporting. Verified cleanup and persistence follow execution.
              default_value: 120
              required: false
              group: Collection
            - name: vnode
              description: Associates this job with a [Virtual Node](https://learn.netdata.cloud/docs/netdata-agent/configuration/organize-systems-metrics-and-alerts#virtual-nodes).
              detailed_description: Define a static vnode through `dem:vnode` or a YAML file in the Netdata configuration directory’s `vnodes/` directory. Enter its reference name, not its GUID. Leave empty to keep charts on the collecting Agent.
                Retained runs and captures keep the GUID resolved when the attempt entered the execution queue, even if the vnode changes before execution starts. Changing the vnode clears the latest observation without relabeling retained evidence; records without a GUID remain unassigned.
              default_value: ''
              required: false
              group: Virtual Node
        examples:
          folding:
            enabled: true
            title: Examples
          list:
            - name: Monitor a home page
              description: Create one native browser monitor after preparing the runtime and defining the `example-site` vnode.
              config: "jobs:\n  - name: home\n    vnode: example-site\n    script: |\n      import { test, expect } from '@playwright/test';\n\
                \      test('home page', async ({ page }) => {\n        await page.goto('https://example.org/');\n\
                \        await expect(page).toHaveTitle(/Example Domain/);\n      });\n"
    troubleshooting:
      problems:
        list:
          - name: No conclusive observations
            description: Inspect native job status for unavailable dependencies and plugin logs for runtime preparation errors,
              waiting attempts or execution inability. Open the latest retained run for errors and actual failure
              phases. Missing measurements are gaps; stale, inconclusive and cancelled observations are not
              recovery.
    metrics:
      description: Charts repeat the latest completed observation until a new check finishes. Observation age and
        stale state retain its actual freshness; measurements older than two check intervals are omitted.
        Attempt and occurrence counters count each event once and reset when the native job restarts.
        These job diagnostics continue across vnode changes; the latest observation, age and last success/failure
        reset until a check for the new association completes.
        Coalesced occurrences never ran and do not represent website failures. Queue age tracks the oldest
        admission wait; scheduling delay describes the selected occurrence at the latest admission.
        The first check is eligible immediately, followed by a spread first interval of one to two check_every periods
        and then a fixed cadence. Each native job has its own chart identity. Attempt duration excludes admission waiting.
      availability: []
      folding:
        enabled: false
        title: Metrics
      scopes:
        - name: job
          description: One configured native browser monitor.
          labels: []
          metrics:
            - name: dem_synthetic.execution_state
              description: Latest synthetic observation state
              unit: state
              chart_type: stacked
              dimensions:
                - name: unknown
                - name: success
                - name: failed
                - name: timeout
                - name: inconclusive
                - name: error
                - name: cancelled
                - name: stale
            - name: dem_synthetic.duration
              description: Latest synthetic attempt duration
              unit: milliseconds
              chart_type: line
              dimensions:
                - name: duration
            - name: dem_synthetic.observation_age
              description: Age of latest synthetic observation
              unit: seconds
              chart_type: line
              dimensions:
                - name: age
            - name: dem_synthetic.attempts
              description: Completed synthetic attempts
              unit: attempts/s
              chart_type: stacked
              dimensions:
                - name: success
                - name: failed
                - name: timeout
                - name: inconclusive
                - name: error
                - name: cancelled
                - name: unknown
            - name: dem_synthetic.occurrences
              description: Synthetic scheduled occurrences
              unit: occurrences/s
              chart_type: line
              dimensions:
                - name: scheduled
                - name: admitted
                - name: coalesced
            - name: dem_synthetic.scheduler_state
              description: Synthetic active and pending attempts
              unit: attempts
              chart_type: line
              dimensions:
                - name: active
                - name: pending
            - name: dem_synthetic.queue_age
              description: Oldest synthetic admission wait
              unit: seconds
              chart_type: line
              dimensions:
                - name: age
            - name: dem_synthetic.scheduling_delay
              description: Latest synthetic admission delay from selected due time
              unit: seconds
              chart_type: line
              dimensions:
                - name: delay
            - name: dem_synthetic.journey.declared_tests
              description: Latest declared journey tests
              unit: tests
              chart_type: line
              dimensions:
                - name: declared
            - name: dem_synthetic.journey.test_outcomes
              description: Latest journey test outcomes
              unit: tests
              chart_type: stacked
              dimensions:
                - name: passed
                - name: failed
                - name: timed_out
                - name: skipped
                - name: expected_failure
                - name: not_run
    functions:
      description: Use these process-wide Functions through the Agent or Cloud for both journey and Lighthouse
        jobs. Invoke their public synthetics-* names on the collecting Agent and select the exact configured vnode name
        with vnode:storefront, not its display hostname. Names use current configuration even with disabled or no jobs;
        renamed or removed names stop resolving, and reused names select their current GUID. Use vnode_guid for retained
        history by canonical GUID after removal. Omit both selectors for all vnodes and unassigned data. Filters retain
        Agent-level access and do not provide per-site authorization; no active browser is required.
        Viewing them requires a signed-in member of the node's Netdata Cloud Space with permission to view sensitive
        data, on a paid plan or an active trial; journeys and audits run and their history is stored on every plan.
      list:
        - id: synthetics-checks
          function_name: synthetics-checks
          name: Synthetic monitors
          description: Invoke `synthetics-checks`. Active native monitors and their latest observation. Disabled
            and failed-startup configuration remains in native job status. Freshness belongs to the last observation,
            independently of a waiting or running attempt.
          parameters:
            - id: vnode
              name: Virtual node name (`vnode`)
              description: Filter by exact configured vnode name, as used by the job's vnode option. Empty or unknown
                names are rejected. Omit this parameter when not selecting by name.
                Supply either vnode or vnode_guid, never both, even with empty values.
              type: string
              required: false
              default: Not supplied
              options: []
            - id: vnode_guid
              name: Virtual node GUID (`vnode_guid`)
              description: Filter by canonical vnode GUID. No configured name is required. Do not also supply
                vnode. Leave empty or omit both selectors to include every vnode and unassigned jobs.
              type: string
              required: false
              default: ''
              options: []
            - id: job_id
              name: Monitor (`job_id`)
              description: Native module and job name, such as journey:checkout. Leave empty to include all
                monitors when listing.
              type: string
              required: false
              default: ''
              options: []
            - id: kind
              name: Kind (`kind`)
              description: Filter by journey or lighthouse. Leave empty to include both kinds.
              type: string
              required: false
              default: ''
              options: []
            - id: limit
              name: Maximum rows (`limit`)
              description: Maximum returned rows, from 1 to 2000. Defaults to 2000; truncated indicates additional
                matching rows.
              type: string
              required: false
              default: '2000'
              options: []
          returns:
            description: At most limit active jobs, with independent current-attempt state and last-observation
              freshness, execution cadence, occurrence counts and queue/admission delays. Counters reset on native
              activation and continue across vnode changes; latest observations and last success/failure reset on
              reassignment. Coalesced occurrences never ran. Disabled and failed-startup jobs are visible through
              native configuration status.
            columns:
              - name: job_id
                type: string
                unit: ''
                description: Monitor.
              - name: kind
                type: string
                unit: ''
                description: Kind.
              - name: name
                type: string
                unit: ''
                description: Name.
              - name: target
                type: string
                unit: ''
                description: Target.
              - name: state
                type: string
                unit: ''
                description: Current state.
              - name: fresh
                type: boolean
                unit: ''
                description: Last observation fresh.
              - name: run_id
                type: string
                unit: ''
                description: Last run.
              - name: outcome
                type: string
                unit: ''
                description: Last outcome.
              - name: completed_us
                type: timestamp
                unit: ''
                description: Last completion. Unix microseconds; null when unavailable.
              - name: duration_ms
                type: float
                unit: ms
                description: Attempt duration.
              - name: last_success_us
                type: timestamp
                unit: ''
                description: Last success in the current vnode association. Unix microseconds; null when unavailable.
              - name: last_failure_us
                type: timestamp
                unit: ''
                description: Last failure in the current vnode association. Unix microseconds; null when unavailable.
              - name: error
                type: string
                unit: ''
                description: Last error.
              - name: history_error
                type: string
                unit: ''
                description: History error.
              - name: vnode_guid
                type: string
                unit: ''
                description: Recorded canonical vnode GUID. Empty means unassigned.
              - name: check_every
                type: integer
                unit: 's'
                description: Check interval.
              - name: scheduled
                type: integer
                unit: ''
                description: Scheduled occurrences.
              - name: admitted
                type: integer
                unit: ''
                description: Admitted attempts.
              - name: coalesced
                type: integer
                unit: ''
                description: Coalesced occurrences.
              - name: pending
                type: boolean
                unit: ''
                description: Pending occurrence.
              - name: queue_age
                type: float
                unit: 's'
                description: Oldest admission wait.
              - name: scheduling_delay
                type: float
                unit: 's'
                description: Latest admission delay.
          performance: Reads local active snapshots and retained evidence without starting a browser or acquiring
            browser admission. Artifact fetch reads at most 5 MiB.
          security: Requires member-equivalent access for observations and retained text; artifact bytes require
            administrator-equivalent access. Captures and reports may contain sensitive URLs, page content
            and user input; they are not universally redacted.
          availability: Available while dem.plugin is running, independently of active journey or Lighthouse
            jobs. Individual retained evidence may be absent or expired.
          require_cloud: true
          prerequisites:
            list: []
        - id: synthetics-runs
          function_name: synthetics-runs
          name: Synthetic runs
          description: Invoke `synthetics-runs`. Retained attempts selected by start time, with their latest retained
            outcome even when completion is outside the range. after and before include their entire Unix
            second or accept negative offsets from now; omitted bounds cover retained history through now.
            Results are capped at 2000 and disclose truncation.
          parameters:
            - id: vnode
              name: Virtual node name (`vnode`)
              description: Filter by exact configured vnode name, as used by the job's vnode option. Empty or unknown
                names are rejected. Omit this parameter when not selecting by name.
                Supply either vnode or vnode_guid, never both, even with empty values.
              type: string
              required: false
              default: Not supplied
              options: []
            - id: vnode_guid
              name: Virtual node GUID (`vnode_guid`)
              description: Filter by canonical vnode GUID. No configured name is required. Do not also supply
                vnode. Leave empty or omit both selectors to include every vnode and unassigned jobs.
              type: string
              required: false
              default: ''
              options: []
            - id: job_id
              name: Monitor (`job_id`)
              description: Native module and job name, such as journey:checkout. Leave empty to include all
                monitors when listing.
              type: string
              required: false
              default: ''
              options: []
            - id: kind
              name: Kind (`kind`)
              description: Filter by journey or lighthouse. Leave empty to include both kinds.
              type: string
              required: false
              default: ''
              options: []
            - id: outcome
              name: Outcome (`outcome`)
              description: Filter by unknown, success, failed, timeout, inconclusive, error or cancelled. Leave
                empty for all outcomes.
              type: string
              required: false
              default: ''
              options: []
            - id: after
              name: Started after (`after`)
              description: Inclusive run start-time lower bound in Unix seconds or a negative offset from
                now. Leave empty for all retained history.
              type: string
              required: false
              default: ''
              options: []
            - id: before
              name: Started before (`before`)
              description: Inclusive run start-time upper bound in Unix seconds or a negative offset from
                now. Leave empty for the current time.
              type: string
              required: false
              default: ''
              options: []
            - id: limit
              name: Maximum rows (`limit`)
              description: Maximum returned rows, from 1 to 2000. Defaults to 2000; truncated indicates additional
                matching rows.
              type: string
              required: false
              default: '2000'
              options: []
          returns:
            description: At most limit retained attempts selected by start time, with explicit truncated and
              effective time bounds. Zero or missing execution timestamps and missing durations are null rather
              than fabricated measurements.
            columns:
              - name: run_id
                type: string
                unit: ''
                description: Run.
              - name: job_id
                type: string
                unit: ''
                description: Monitor.
              - name: kind
                type: string
                unit: ''
                description: Kind.
              - name: name
                type: string
                unit: ''
                description: Name.
              - name: target
                type: string
                unit: ''
                description: Target.
              - name: started_us
                type: timestamp
                unit: ''
                description: Started. Unix microseconds; null when unavailable.
              - name: completed_us
                type: timestamp
                unit: ''
                description: Completed. Unix microseconds; null when unavailable.
              - name: outcome
                type: string
                unit: ''
                description: Outcome.
              - name: duration_ms
                type: float
                unit: ms
                description: Attempt duration.
              - name: capture_state
                type: string
                unit: ''
                description: Capture state.
              - name: error
                type: string
                unit: ''
                description: Error.
              - name: history_error
                type: string
                unit: ''
                description: History error.
              - name: vnode_guid
                type: string
                unit: ''
                description: Recorded canonical vnode GUID. Empty means unassigned.
              - name: scheduled_us
                type: timestamp
                unit: ''
                description: Selected due time.
              - name: queued_us
                type: timestamp
                unit: ''
                description: Original admission queue time.
              - name: termination_reason
                type: string
                unit: ''
                description: Reason execution stopped, separate from the first reported error.
              - name: failure_evidence_status
                type: string
                unit: ''
                description: Journey evidence reporting status (not_recorded, unavailable, unsupported, partial, complete or invalid); detail truncation is reported separately.
              - name: first_failure
                type: string
                unit: ''
                description: First unexpected journey test failure, with retained step path, source location and error excerpt when available.
              - name: last_observed_step
                type: string
                unit: ''
                description: Last retained running step observation; this does not imply the browser is still executing it.
              - name: stop_context
                type: string
                unit: ''
                description: Pending activity observed before cleanup in the first timed-out or interrupted test; this does not identify the cause of the stop.
                  Source locations identify the displayed step or the test declaration when no step is known, not the timeout location.
              - name: browser_summary_status
                type: string
                unit: ''
                description: Optional journey browser summary reporting status (not_recorded, unavailable, unsupported, partial, complete or invalid); completion does not imply complete browser coverage.
              - name: browser_errors
                type: string
                unit: ''
                description: Observed browser error counts by category, with sampling limitations when reported; missing evidence is not zero errors.
          performance: Reads local active snapshots and retained evidence without starting a browser or acquiring
            browser admission. Artifact fetch reads at most 5 MiB.
          security: Requires member-equivalent access for observations and retained text; artifact bytes require
            administrator-equivalent access. Captures and reports may contain sensitive URLs, page content
            and user input; they are not universally redacted.
          availability: Available while dem.plugin is running, independently of active journey or Lighthouse
            jobs. Individual retained evidence may be absent or expired.
          require_cloud: true
          prerequisites:
            list: []
        - id: synthetics-run
          function_name: synthetics-run
          name: Synthetic run detail
          description: Invoke `synthetics-run`. One retained or latest active attempt, independent of picker bounds,
            with original test phases, errors, counts, nullable lab measurements and bounded reporter events. Missing completion means
            no verified terminal observation.
          parameters:
            - id: job_id
              name: Monitor (`job_id`)
              description: Exact native module and job name that owns the requested run, such as journey:checkout.
              type: string
              required: true
              default: ''
              options: []
            - id: run_id
              name: Run (`run_id`)
              description: Exact run identifier returned by synthetic inventory or run history.
              type: string
              required: true
              default: ''
              options: []
          returns:
            description: One row per retained reporter event, preserving actual and expected status and failure
              phase. The run object also contains test counts, termination_reason, nullable lab metrics, capture state, artifact
              metadata and history errors. Journey browser_summary adds typed fixture-context coverage, observed counts,
              bounded primitive samples and explicit omissions when enabled; missing evidence is not zero errors.
              Journey failure_evidence adds test and step observations, the first unexpected failure,
              reporting completeness and separate truncation flags; absent evidence is not a report of zero failures.
              dropped_events discloses omitted generic event detail. The run.vnode_guid field
              contains the canonical vnode GUID recorded for the attempt; an empty value means unassigned.
              The run.captures field contains available publication decisions. For journeys, it can also contain
              test associations, screenshot attachment counts, trace support, reporting status and detail truncation. An absent
              field means reporting was not recorded, not zero captures.
            columns:
              - name: at_ms
                type: timestamp
                unit: ''
                description: Event time. Unix milliseconds.
              - name: kind
                type: string
                unit: ''
                description: Event.
              - name: test_id
                type: string
                unit: ''
                description: Test.
              - name: title
                type: string
                unit: ''
                description: Title.
              - name: phase
                type: string
                unit: ''
                description: Phase.
              - name: status
                type: string
                unit: ''
                description: Actual status.
              - name: expected_status
                type: string
                unit: ''
                description: Expected status.
              - name: duration_ms
                type: float
                unit: ms
                description: Duration.
              - name: message
                type: string
                unit: ''
                description: Message.
          performance: Reads local active snapshots and retained evidence without starting a browser or acquiring
            browser admission. Artifact fetch reads at most 5 MiB.
          security: Requires member-equivalent access for observations and retained text; artifact bytes require
            administrator-equivalent access. Captures and reports may contain sensitive URLs, page content
            and user input; they are not universally redacted.
          availability: Available while dem.plugin is running, independently of active journey or Lighthouse
            jobs. Individual retained evidence may be absent or expired.
          require_cloud: true
          prerequisites:
            list: []
        - id: synthetics-artifacts
          function_name: synthetics-artifacts
          name: Retained synthetic captures
          description: Invoke `synthetics-artifacts` to find retained screenshot, trace and report sets, newest publication
            first, even after run history expires or a monitor is disabled or deleted. Each set contains one run's
            captures. The shared default allowance is seven days and 2 GiB, preferring each monitor's newest
            eligible capture. Age and size pressure can still remove it; this is not complete incident history
            or a hard disk cap. A later Lighthouse report may displace that monitor's earlier poor-score report.
            Journey recovery without a screenshot leaves its previous failure capture eligible. Disabled or
            deleted monitors keep the same preference; renamed monitors form separate groups.
          parameters:
            - id: vnode
              name: Virtual node name (`vnode`)
              description: Filter by exact configured vnode name, as used by the job's vnode option. Empty or unknown
                names are rejected. Omit this parameter when not selecting by name.
                Supply either vnode or vnode_guid, never both, even with empty values.
              type: string
              required: false
              default: Not supplied
              options: []
            - id: vnode_guid
              name: Virtual node GUID (`vnode_guid`)
              description: Filter by canonical vnode GUID. No configured name is required. Do not also supply
                vnode. Leave empty or omit both selectors to include every vnode and unassigned jobs.
              type: string
              required: false
              default: ''
              options: []
            - id: job_id
              name: Monitor (`job_id`)
              description: Exact native module and job name to filter captures, such as journey:checkout. Leave
                empty for all monitors. Storage totals remain global.
              type: string
              required: false
              default: ''
              options: []
            - id: before
              name: Previous page cursor (`before`)
              description: The next cursor returned by the previous page. Leave empty for the newest captures.
              type: string
              required: false
              default: ''
              options: []
            - id: limit
              name: Maximum rows (`limit`)
              description: Maximum returned sets, from 1 to 2000. Use next as before to continue when truncated
                is true. Captures may expire between pages.
              type: string
              required: false
              default: '2000'
              options: []
          returns:
            description: One row per retained capture set. The storage object reports global effective policy,
              observation time, retained capture bytes, workspace bytes, unclassified bytes, pending-deletion
              bytes, known set and monitor counts, cleanup status and policy reload errors. Unreadable sizes
              are unknown with an error. Sizes are logical file lengths; workspace, unclassified files and
              pending deletions are outside the retained-capture allowance. Metadata does not verify file integrity.
            columns:
              - name: run_id
                type: string
                unit: ''
                description: Run.
              - name: job_id
                type: string
                unit: ''
                description: Monitor.
              - name: published_us
                type: timestamp
                unit: ''
                description: Publication time in Unix microseconds.
              - name: bytes
                type: integer
                unit: bytes
                description: Capture set size, including its manifest.
              - name: artifact_count
                type: integer
                unit: ''
                description: Number of captures in the set.
              - name: vnode_guid
                type: string
                unit: ''
                description: Recorded canonical vnode GUID. Empty means unassigned.
          performance: Reads local capture metadata and file sizes without reading capture contents or starting a browser.
          security: Requires member-equivalent access. Exposes monitor identities and capture metadata, not capture contents.
          availability: Available while dem.plugin is running, independently of active journey or Lighthouse jobs
            and retained run history. Captures can expire under age or size limits.
          require_cloud: true
          prerequisites:
            list: []
        - id: synthetics-artifact
          function_name: synthetics-artifact
          name: Synthetic capture detail
          description: Invoke `synthetics-artifact`. Retained capture metadata for one run, independently of run
            history retention; file bytes are verified when fetched. Supplying artifact_id requests base64-encoded bytes and requires administrator-equivalent
            permissions. Screenshots, raw trace ZIPs and HTML reports may contain sensitive content. Missing retained files
            are expired or unavailable; fetches are limited to 5 MiB. The test column identifies the associated test,
            not a page or failing step. Missing-capture observations and publication decisions are in `synthetics-run`
            while history remains.
          parameters:
            - id: job_id
              name: Monitor (`job_id`)
              description: Exact native module and job name that owns the requested run, such as journey:checkout.
              type: string
              required: true
              default: ''
              options: []
            - id: run_id
              name: Run (`run_id`)
              description: Exact run identifier returned by the retained capture list, synthetic inventory or run history.
              type: string
              required: true
              default: ''
              options: []
            - id: artifact_id
              name: Artifact (`artifact_id`)
              description: Exact recorded artifact identifier to fetch its bytes. Leave empty to list capture
                metadata.
              type: string
              required: false
              default: ''
              options: []
          returns:
            description: Retained capture metadata remains available after run history expires. Fetch verifies content
              and returns encoding=base64 and data_base64 without rendering HTML. A missing recorded capture
              returns expired_or_unavailable, which does not prove why the file is absent. The top-level vnode_guid field
              contains the recorded canonical vnode GUID; an empty value means unassigned.
            columns:
              - name: artifact_id
                type: string
                unit: ''
                description: Artifact.
              - name: kind
                type: string
                unit: ''
                description: Kind.
              - name: mime
                type: string
                unit: ''
                description: Content type.
              - name: bytes
                type: integer
                unit: bytes
                description: Size.
              - name: sha256
                type: string
                unit: ''
                description: SHA-256.
              - name: availability
                type: string
                unit: ''
                description: Availability.
              - name: test
                type: string
                unit: ''
                description: Associated screenshot or trace test title, redacted and possibly clipped, or Test not recorded; empty for Lighthouse reports.
              - name: label
                type: string
                unit: ''
                description: Screenshot, Trace or Lighthouse report.
          performance: Reads local active snapshots and retained evidence without starting a browser or acquiring
            browser admission. Artifact fetch reads at most 5 MiB.
          security: Requires member-equivalent access for observations and retained text; artifact bytes require
            administrator-equivalent access. Captures and reports may contain sensitive URLs, page content
            and user input; they are not universally redacted.
          availability: Available while dem.plugin is running, independently of active journey or Lighthouse
            jobs. Individual retained evidence may be absent or expired.
          require_cloud: true
          prerequisites:
            list: []
