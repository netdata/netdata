version: v1
# The native Windows Agent's contexts, dimensions and units, so the standard dashboard sections and the stock Windows
# alerts apply to the host's node, and the go.d ping collector's contexts for the host's ping, so the stock ping alerts
# apply too. TCP and UDP counters the native agent does not chart use the Linux Agent's contexts for the same counters.
# The clock offset compares the host with the poller, which no other producer measures, so its context is WMI's own.
# The contexts have different roots, so the template has no spec-level namespace.
groups:
  - family: cpu
    context_namespace: system
    metrics:
      - cpu_total_irq_percent
      - cpu_total_user_percent
      - cpu_total_system_percent
      - cpu_total_dpc_percent
      - cpu_total_idle_percent
    charts:
      - context: cpu
        title: Total CPU Utilization
        units: percentage
        type: stacked
        dimensions:
          - selector: cpu_total_irq_percent
            name: irq
          - selector: cpu_total_user_percent
            name: user
          - selector: cpu_total_system_percent
            name: system
          - selector: cpu_total_dpc_percent
            name: dpc
          - selector: cpu_total_idle_percent
            name: idle
            options:
              hidden: true
  - family: utilization
    context_namespace: cpu
    metrics:
      - cpu_core_irq_percent
      - cpu_core_user_percent
      - cpu_core_system_percent
      - cpu_core_dpc_percent
      - cpu_core_idle_percent
    charts:
      - context: cpu
        title: Core Utilization
        units: percentage
        type: stacked
        instances:
          by_labels: [cpu]
        dimensions:
          - selector: cpu_core_irq_percent
            name: irq
          - selector: cpu_core_user_percent
            name: user
          - selector: cpu_core_system_percent
            name: system
          - selector: cpu_core_dpc_percent
            name: dpc
          - selector: cpu_core_idle_percent
            name: idle
            options:
              hidden: true
  - family: ram
    context_namespace: system
    metrics: [memory_free_bytes, memory_used_bytes]
    charts:
      - context: ram
        title: System RAM
        units: MiB
        type: stacked
        dimensions:
          - selector: memory_free_bytes
            name: free
            options:
              divisor: 1048576
          - selector: memory_used_bytes
            name: used
            options:
              divisor: 1048576
  - family: overview
    context_namespace: mem
    metrics: [memory_available_bytes]
    charts:
      - context: available
        title: Available RAM for applications
        units: MiB
        type: area
        dimensions:
          - selector: memory_available_bytes
            name: avail
            options:
              divisor: 1048576
  - family: swap
    context_namespace: mem
    metrics:
      - memory_swap_free_bytes
      - memory_swap_used_bytes
      - memory_page_reads
      - memory_page_writes
      - memory_pages_input
      - memory_pages_output
    charts:
      - context: swap
        title: System Swap
        units: MiB
        type: stacked
        dimensions:
          - selector: memory_swap_free_bytes
            name: free
            options:
              divisor: 1048576
          - selector: memory_swap_used_bytes
            name: used
            options:
              divisor: 1048576
      - context: swap_iops
        title: Swap Operations
        units: operations/s
        type: stacked
        dimensions:
          - selector: memory_page_reads
            name: read
          # The native chart negates writes with its divisor.
          - selector: memory_page_writes
            name: write
            options:
              divisor: -1
      - context: swapio
        title: Swap I/O
        units: KiB/s
        type: area
        # The counters count 4 KiB pages.
        dimensions:
          - selector: memory_pages_input
            name: in
            options:
              multiplier: 4096
              divisor: 1024
          - selector: memory_pages_output
            name: out
            options:
              multiplier: -4096
              divisor: 1024
  - family: mem
    context_namespace: mem
    metrics:
      - memory_committed_bytes
      - memory_commit_limit_bytes
      - memory_system_cache_bytes
      - memory_system_cache_peak_bytes
      - memory_system_cache_resident_bytes
      - memory_free_and_zero_page_list_bytes
      - memory_modified_page_list_bytes
      - memory_standby_cache_core_bytes
      - memory_standby_cache_normal_priority_bytes
      - memory_standby_cache_reserve_bytes
      - memory_pool_paged_bytes
      - memory_pool_nonpaged_bytes
      - memory_pool_paged_resident_bytes
      - memory_pool_paged_allocations
      - memory_pool_nonpaged_allocations
      - memory_free_system_page_table_entries
      - memory_system_code_resident_bytes
      - memory_system_code_total_bytes
      - memory_system_driver_resident_bytes
      - memory_system_driver_total_bytes
    charts:
      - context: committed
        title: Committed Memory
        units: bytes
        dimensions:
          - selector: memory_committed_bytes
            name: committed
          - selector: memory_commit_limit_bytes
            name: limit
      - context: system_cache
        title: System Cache Memory
        units: bytes
        dimensions:
          - selector: memory_system_cache_bytes
            name: cache
          - selector: memory_system_cache_peak_bytes
            name: peak
          - selector: memory_system_cache_resident_bytes
            name: resident
      - context: page_lists
        title: Memory Page Lists
        units: bytes
        type: stacked
        dimensions:
          - selector: memory_free_and_zero_page_list_bytes
            name: free
          - selector: memory_modified_page_list_bytes
            name: modified
          - selector: memory_standby_cache_core_bytes
            name: standby_core
          - selector: memory_standby_cache_normal_priority_bytes
            name: standby_normal
          - selector: memory_standby_cache_reserve_bytes
            name: standby_reserve
      - context: system_pool_size
        title: System Memory Pool
        units: bytes
        type: stacked
        dimensions:
          - selector: memory_pool_paged_bytes
            name: paged
          - selector: memory_pool_nonpaged_bytes
            name: non-paged
      - context: system_pool_paged
        title: Paged System Memory Pool
        units: bytes
        dimensions:
          - selector: memory_pool_paged_resident_bytes
            name: resident
      # The counters are the current numbers of outstanding allocations; the
      # native chart charts their rate of change.
      - context: system_pool_allocs
        title: System Pool Allocations
        units: allocations/s
        algorithm: incremental
        dimensions:
          - selector: memory_pool_paged_allocations
            name: paged
          - selector: memory_pool_nonpaged_allocations
            name: non-paged
      - context: system_page_table_entries
        title: Unused page table entries.
        units: pages
        dimensions:
          - selector: memory_free_system_page_table_entries
            name: free
      - context: system_code
        title: System Code Memory
        units: bytes
        dimensions:
          - selector: memory_system_code_resident_bytes
            name: resident
          - selector: memory_system_code_total_bytes
            name: total
      - context: system_drivers
        title: System Driver Memory
        units: bytes
        dimensions:
          - selector: memory_system_driver_resident_bytes
            name: resident
          - selector: memory_system_driver_total_bytes
            name: total
  - family: page faults
    context_namespace: mem
    metrics:
      - memory_page_faults_minor
      - memory_page_faults_major
      - memory_cache_faults
      - memory_demand_zero_faults
      - memory_transition_faults
      - memory_write_copy_faults
      - memory_transition_pages_repurposed
    charts:
      - context: pgfaults
        title: Memory Page Faults
        units: faults/s
        dimensions:
          - selector: memory_page_faults_minor
            name: minor
          - selector: memory_page_faults_major
            name: major
            options:
              multiplier: -1
      - context: page_faults_breakdown
        title: Memory Page Fault Breakdown
        units: faults/s
        dimensions:
          - selector: memory_cache_faults
            name: cache
          - selector: memory_demand_zero_faults
            name: demand_zero
          - selector: memory_transition_faults
            name: transition
          - selector: memory_write_copy_faults
            name: write_copies
      - context: transition_repurposed
        title: Transition Pages Repurposed
        units: pages/s
        dimensions:
          - selector: memory_transition_pages_repurposed
            name: repurposed
  - family: pagefile
    context_namespace: mem
    metrics: [pagefile_free_bytes, pagefile_used_bytes]
    charts:
      - context: pagefile_usage
        title: Paging file usage
        units: bytes
        type: stacked
        instances:
          by_labels: [pagefile]
        dimensions:
          - selector: pagefile_free_bytes
            name: free
          - selector: pagefile_used_bytes
            name: used
  - family: numa
    context_namespace: mem
    metrics: [numa_node_free_and_zero_mebibytes, numa_node_standby_mebibytes]
    charts:
      - context: numa_node_mem_usage
        title: NUMA Node Memory Usage
        units: bytes
        instances:
          by_labels: [node]
        dimensions:
          - selector: numa_node_free_and_zero_mebibytes
            name: free
            options:
              multiplier: 1048576
          - selector: numa_node_standby_mebibytes
            name: standby
            options:
              multiplier: 1048576
  - family: processes
    context_namespace: system
    metrics: [system_processes, system_threads, system_context_switches]
    charts:
      - context: processes
        title: System Processes
        units: processes
        dimensions:
          - selector: system_processes
            name: running
      - context: threads
        title: Threads
        units: threads
        dimensions:
          - selector: system_threads
            name: threads
      - context: ctxt
        title: CPU Context Switches
        units: context switches/s
        dimensions:
          - selector: system_context_switches
            name: switches
  - family: system
    context_namespace: system
    metrics: [system_processor_queue_length]
    charts:
      - context: processor_queue_length
        title: The number of threads in the processor queue.
        units: threads
        dimensions:
          - selector: system_processor_queue_length
            name: threads
  - family: uptime
    context_namespace: system
    metrics: [system_uptime_milliseconds]
    charts:
      - context: uptime
        title: System Uptime
        units: seconds
        dimensions:
          - selector: system_uptime_milliseconds
            name: uptime
            options:
              divisor: 1000
  - family: clock
    context_namespace: wmi
    metrics: [system_clock_offset_microseconds]
    charts:
      - context: clock_offset
        title: Clock Offset From the Collecting Agent
        units: milliseconds
        dimensions:
          - selector: system_clock_offset_microseconds
            name: offset
            options:
              divisor: 1000
  - family: network
    context_namespace: system
    metrics: [network_total_received_bytes, network_total_sent_bytes]
    charts:
      - context: net
        title: Physical Network Interfaces Aggregated Bandwidth
        units: kilobits/s
        type: area
        dimensions:
          - selector: network_total_received_bytes
            name: received
            options:
              multiplier: 8
              divisor: 1000
          - selector: network_total_sent_bytes
            name: sent
            options:
              multiplier: -8
              divisor: 1000
  - family: net
    context_namespace: net
    metrics:
      - network_received_bytes
      - network_sent_bytes
      - network_received_packets
      - network_sent_packets
      - network_speed_bits_per_second
      - network_speed_kilobits_per_second
      - network_inbound_errors
      - network_outbound_errors
      - network_inbound_discards
      - network_outbound_discards
      - network_output_queue_length
      - network_rsc_connections
      - network_rsc_coalesced_packets
      - network_rsc_exceptions
      - network_rsc_average_packet_size_bytes
      - network_chimney_connections
      - network_unknown_protocol_packets
    chart_defaults:
      instances:
        by_labels: [device]
    charts:
      - context: net
        title: Bandwidth
        units: kilobits/s
        type: area
        dimensions:
          - selector: network_received_bytes
            name: received
            options:
              multiplier: 8
              divisor: 1000
          - selector: network_sent_bytes
            name: sent
            options:
              multiplier: -8
              divisor: 1000
        # The stock interface_speed and traffic overflow alerts read the speed
        # in kilobits/s from this variable.
        variables:
          - name: nic_speed_max
            selector: network_speed_kilobits_per_second
      - context: packets
        title: Packets
        units: packets/s
        dimensions:
          - selector: network_received_packets
            name: received
          - selector: network_sent_packets
            name: sent
            options:
              multiplier: -1
      - context: speed
        title: Interface Speed
        units: kilobits/s
        dimensions:
          - selector: network_speed_bits_per_second
            name: speed
            options:
              divisor: 1000
      - context: errors
        title: Interface Errors
        units: errors/s
        dimensions:
          - selector: network_inbound_errors
            name: inbound
          - selector: network_outbound_errors
            name: outbound
            options:
              multiplier: -1
      - context: drops
        title: Interface Drops
        units: drops/s
        dimensions:
          - selector: network_inbound_discards
            name: inbound
          - selector: network_outbound_discards
            name: outbound
            options:
              multiplier: -1
      - context: queue_length
        title: Interface Output Queue Length
        units: packets
        dimensions:
          - selector: network_output_queue_length
            name: length
      - context: rsc_connections
        title: Active TCP Connections Offloaded by RSC
        units: connections
        dimensions:
          - selector: network_rsc_connections
            name: connections
      - context: rsc_packets
        title: TCP RSC Coalesced Packets
        units: packets/s
        dimensions:
          - selector: network_rsc_coalesced_packets
            name: packets
      - context: rsc_exceptions
        title: TCP RSC Exceptions
        units: exceptions/s
        dimensions:
          - selector: network_rsc_exceptions
            name: exceptions
      - context: rsc_average_packet_size
        title: TCP RSC Average Packet Size
        units: bytes
        dimensions:
          - selector: network_rsc_average_packet_size_bytes
            name: average
      - context: chimney_connections
        title: Active TCP Connections Offloaded with Chimney
        units: connections
        dimensions:
          - selector: network_chimney_connections
            name: connections
      - context: unknown_protocol_packets
        title: Packets Received with Unknown Protocol
        units: packets/s
        dimensions:
          - selector: network_unknown_protocol_packets
            name: inbound
  # TCP for both IP versions: the native tcppackets chart, and the Linux charts of the TCP counters the native Windows
  # Agent does not chart. Linux counts TCP for both versions together too.
  - family: tcp
    context_namespace: ip
    metrics:
      - tcp_segments_received
      - tcp_segments_sent
      - tcp_established_connections
      - tcp_active_opens
      - tcp_passive_opens
      - tcp_established_resets
      - tcp_failed_connection_attempts
      - tcp_retransmitted_segments
    charts:
      - context: tcppackets
        title: TCP Packets
        units: packets/s
        type: area
        dimensions:
          - selector: tcp_segments_received
            name: received
          - selector: tcp_segments_sent
            name: sent
            options:
              multiplier: -1
      - context: tcpsock
        title: TCP Connections
        units: active connections
        dimensions:
          - selector: tcp_established_connections
            name: connections
      - context: tcpopens
        title: TCP Opens
        units: connections/s
        dimensions:
          - selector: tcp_active_opens
            name: active
          - selector: tcp_passive_opens
            name: passive
      - context: tcphandshake
        title: TCP Handshake Issues
        units: events/s
        dimensions:
          - selector: tcp_established_resets
            name: EstabResets
          - selector: tcp_failed_connection_attempts
            name: AttemptFails
      - context: tcperrors
        title: TCP Errors
        units: packets/s
        dimensions:
          - selector: tcp_retransmitted_segments
            name: RetransSegs
            options:
              multiplier: -1
  - family: tcp
    context_namespace: ipv4
    metrics: [ipv4_tcp_segments_received, ipv4_tcp_segments_sent]
    charts:
      - context: tcppackets
        title: IPv4 TCP Packets
        units: packets/s
        type: area
        dimensions:
          - selector: ipv4_tcp_segments_received
            name: received
          - selector: ipv4_tcp_segments_sent
            name: sent
            options:
              multiplier: -1
  - family: tcp6
    context_namespace: ipv6
    metrics: [ipv6_tcp_segments_received, ipv6_tcp_segments_sent]
    charts:
      - context: tcppackets
        title: IPv6 TCP Packets
        units: packets/s
        type: area
        dimensions:
          - selector: ipv6_tcp_segments_received
            name: received
          - selector: ipv6_tcp_segments_sent
            name: sent
            options:
              multiplier: -1
  # UDP per IP version: the native udppackets charts, and the Linux udperrors charts.
  - family: udp
    context_namespace: ipv4
    metrics:
      - ipv4_udp_datagrams_received
      - ipv4_udp_datagrams_sent
      - ipv4_udp_receive_errors
      - ipv4_udp_no_port_datagrams
    charts:
      - context: udppackets
        title: IPv4 UDP Packets
        units: packets/s
        type: area
        dimensions:
          - selector: ipv4_udp_datagrams_received
            name: received
          - selector: ipv4_udp_datagrams_sent
            name: sent
            options:
              multiplier: -1
      - context: udperrors
        title: IPv4 UDP Errors
        units: events/s
        dimensions:
          - selector: ipv4_udp_receive_errors
            name: InErrors
          - selector: ipv4_udp_no_port_datagrams
            name: NoPorts
  - family: udp6
    context_namespace: ipv6
    metrics:
      - ipv6_udp_datagrams_received
      - ipv6_udp_datagrams_sent
      - ipv6_udp_receive_errors
      - ipv6_udp_no_port_datagrams
    charts:
      - context: udppackets
        title: IPv6 UDP Packets
        units: packets/s
        type: area
        dimensions:
          - selector: ipv6_udp_datagrams_received
            name: received
          - selector: ipv6_udp_datagrams_sent
            name: sent
            options:
              multiplier: -1
      - context: udperrors
        title: IPv6 UDP Errors
        units: events/s
        dimensions:
          - selector: ipv6_udp_receive_errors
            name: InErrors
          - selector: ipv6_udp_no_port_datagrams
            name: NoPorts
  - family: disk space
    context_namespace: disk
    metrics: [disk_avail_bytes, disk_used_bytes]
    charts:
      - context: space
        title: Disk Space Usage
        units: GiB
        type: stacked
        instances:
          by_labels: [mount_point]
        dimensions:
          - selector: disk_avail_bytes
            name: avail
            options:
              divisor: 1073741824
          - selector: disk_used_bytes
            name: used
            options:
              divisor: 1073741824
  - family: disk
    context_namespace: system
    metrics: [disk_total_read_bytes, disk_total_written_bytes]
    charts:
      - context: io
        title: Disk I/O
        units: KiB/s
        type: area
        dimensions:
          - selector: disk_total_read_bytes
            name: reads
            options:
              divisor: 1024
          - selector: disk_total_written_bytes
            name: writes
            options:
              multiplier: -1
              divisor: 1024
  # Physical disks.
  - context_namespace: disk
    chart_defaults:
      instances:
        by_labels: [device]
    groups:
      - family: io
        metrics: [disk_read_bytes, disk_written_bytes, disk_read_average_bytes, disk_write_average_bytes]
        charts:
          - context: io
            title: Disk I/O Bandwidth
            units: KiB/s
            type: area
            dimensions:
              - selector: disk_read_bytes
                name: reads
                options:
                  divisor: 1024
              - selector: disk_written_bytes
                name: writes
                options:
                  multiplier: -1
                  divisor: 1024
          - context: avgsz
            title: Average Completed I/O Operation Bandwidth
            units: KiB/operation
            type: area
            dimensions:
              - selector: disk_read_average_bytes
                name: reads
                options:
                  divisor: 1024
              - selector: disk_write_average_bytes
                name: writes
                options:
                  multiplier: -1
                  divisor: 1024
      - family: ops
        metrics: [disk_reads, disk_writes, disk_queue_length]
        charts:
          - context: ops
            title: Disk Completed I/O Operations
            units: operations/s
            dimensions:
              - selector: disk_reads
                name: reads
              - selector: disk_writes
                name: writes
                options:
                  multiplier: -1
          - context: qops
            title: Disk Current I/O Operations
            units: operations
            dimensions:
              - selector: disk_queue_length
                name: operations
      - family: utilization
        metrics:
          - disk_utilization_percent
          - disk_busy_milliseconds
          - disk_read_time_milliseconds
          - disk_write_time_milliseconds
        charts:
          - context: util
            title: Disk Utilization Time
            units: '% of time working'
            type: area
            dimensions:
              - selector: disk_utilization_percent
                name: utilization
          - context: busy
            title: Disk Busy Time
            units: milliseconds
            type: area
            dimensions:
              - selector: disk_busy_milliseconds
                name: busy
          - context: iotime
            title: Disk Total I/O Time
            units: milliseconds/s
            type: area
            dimensions:
              - selector: disk_read_time_milliseconds
                name: reads
              - selector: disk_write_time_milliseconds
                name: writes
                options:
                  multiplier: -1
      - family: latency
        metrics: [disk_read_await_microseconds, disk_write_await_microseconds, disk_service_time_microseconds]
        charts:
          - context: await
            title: Average Completed I/O Operation Time
            units: milliseconds/operation
            dimensions:
              - selector: disk_read_await_microseconds
                name: reads
                options:
                  divisor: 1000
              - selector: disk_write_await_microseconds
                name: writes
                options:
                  multiplier: -1
                  divisor: 1000
          - context: svctm
            title: Average Service Time
            units: milliseconds/operation
            dimensions:
              - selector: disk_service_time_microseconds
                name: svctm
                options:
                  divisor: 1000
      - family: iops
        metrics: [disk_split_io]
        charts:
          - context: split
            title: Split I/O Operations
            units: operations/s
            dimensions:
              - selector: disk_split_io
                name: discards
  - family: latency
    context_namespace: ping
    metrics: [ping_rtt_min, ping_rtt_max, ping_rtt_avg, ping_rtt_std_dev]
    charts:
      - context: host_rtt
        title: Ping round-trip time
        units: milliseconds
        type: area
        dimensions:
          - selector: ping_rtt_min
            name: min
            options:
              divisor: 1000
          - selector: ping_rtt_max
            name: max
            options:
              divisor: 1000
          - selector: ping_rtt_avg
            name: avg
            options:
              divisor: 1000
      - context: host_std_dev_rtt
        title: Ping round-trip time standard deviation
        units: milliseconds
        dimensions:
          - selector: ping_rtt_std_dev
            name: std_dev
            options:
              divisor: 1000
  - family: packet loss
    context_namespace: ping
    metrics: [ping_packet_loss]
    charts:
      - context: host_packet_loss
        title: Ping packet loss
        units: percentage
        dimensions:
          - selector: ping_packet_loss
            name: loss
            options:
              divisor: 1000
