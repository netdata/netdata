plugin_name: wmi.plugin
modules:
  - meta:
      id: collector-wmi.plugin-windows
      plugin_name: wmi.plugin
      module_name: windows
      monitored_instance:
        name: Windows (WMI)
        link: https://learn.microsoft.com/en-us/windows/win32/wmisdk/wmi-start-page
        icon_filename: windows.svg
        categories:
          - data-collection.operating-systems
      keywords:
        - windows
        - windows server
        - wmi
        - windows management instrumentation
        - wql
        - dcom
        - winrm
        - agentless
      related_resources:
        integrations:
          list: []
      info_provided_to_referring_integrations:
        description: ''
    overview:
      data_collection:
        metrics_description: |
          Monitor Windows hosts remotely over WMI without installing anything on them: CPU, memory, processes, network, TCP, UDP, disks, SMB shares, time sync and ping.

          A Netdata Agent on another machine reads each host's built-in Windows Management Instrumentation (WMI) data. Use it where the Netdata Agent cannot be installed on the Windows hosts themselves. For each host you get:

          - CPU utilization by mode (user, privileged, interrupts and DPCs), in total and per logical processor;
          - physical and available memory, commit charge, paging activity, page faults, kernel memory pools, the system cache and page lists, the usage of each paging file, and the free and standby memory of each NUMA node;
          - the number of processes and threads, context switches, processor queue length and uptime;
          - how far the host's clock is ahead of or behind the poller's;
          - how the Windows Time service keeps the host's clock synchronized: its offset from the host's time source, the round trip of its latest NTP request and the number of time sources that answer it;
          - traffic, packets, errors, drops, speed and output queue length per network interface, and the total traffic of the host;
          - TCP and UDP packets per IP version, TCP connections, connection opens, failures and resets, TCP retransmissions, and UDP errors;
          - available and used space per fixed drive;
          - bandwidth, operations, latency, utilization and queue per physical disk, and the total disk I/O of the host;
          - the SMB file server's traffic, sessions, logons, open files, logon and access errors and resource shortages, and the open files, requests, connections and traffic of each share;
          - round-trip time and packet loss of ICMP ping from the poller;
          - a node of its own in Netdata, named after the Windows computer name and labeled with its Windows version, hardware and default network address;
          - host status: when the poller can no longer collect from the host, its node turns Stale and an alert on the poller notifies you.

          The charts use the same contexts as the Netdata Agent running on Windows, so the dashboard and the stock Windows alerts treat these hosts like Windows hosts that run the Agent. The ping charts use the contexts of Netdata's Ping collector, so its stock ping alerts apply too. TCP connections, connection opens, failures and resets, retransmissions, UDP errors and the Windows Time service's offset from the time source, which the Netdata Agent on Windows does not chart, use the contexts of the Netdata Agent on Linux; the Linux TCP and UDP alerts do not apply to them. The clock offset from the poller, the NTP round trip and time sources, and the SMB server's server-wide counters, which no other collector charts this way, have contexts of their own.
        method_description: |
          `wmi.plugin` runs on a Netdata Agent, the poller. Every `update_every` seconds (30 by default) it connects to each configured Windows host, runs one read-only WQL query in the `root\cimv2` namespace per enabled metric group (four for the memory group, six for the network group, two for the disk and SMB groups, and one more when a physical disk appears, until it has read the disk's model), and disconnects. Every five minutes the same connection also reads the host's system information for its node labels. The plugin only reads: it changes nothing on the host and opens no shell.

          While the queries run, the plugin also pings the host: it sends three ICMP echo requests, 100 ms apart, and charts the replies.

          For the clock offset, the plugin compares the time the host reports in the System query with the poller's clock at the middle of that query. The result is accurate to half the query's duration, usually a few tens of milliseconds; a collection whose System query takes longer than one second charts no offset.

          A collection that fails publishes nothing for the host. When no collection has succeeded for `3 × update_every + timeout` seconds (105 by default, about three missed collections), the Agent marks the host's node Stale, as it does for a child Agent that stops streaming. The Agent checks for stale nodes at that same interval, so marking can take up to about twice as long. The next successful collection makes the node live again. On the poller, the `wmi_host_last_collected_secs` alert ([wmi.plugin.conf](https://github.com/netdata/netdata/blob/master/src/health/health.d/wmi.plugin.conf)) counts the seconds since each job's last successful collection, turns critical after two to three missed collections (more when collections themselves are slow), and notifies the `sysadmin` role. It starts evaluating after the job's second successful collection. Its value is on the job's Data Collection Duration chart of the poller, so the alert table below, which covers the host's own charts, does not list it.

          It authenticates as the configured Windows account with NTLMv2 and uses one of two transports:

          | Transport | Ports on the Windows host | Protection |
          |---|---|---|
          | DCOM (default) | TCP 135 (RPC endpoint mapper) and the dynamic RPC port of the WMI service | NTLMv2 with RPC packet privacy (encrypted) |
          | WinRM | TCP 5986 (HTTPS listener) | TLS; the poller verifies the listener certificate |

          These are the WMI classes it reads, for audit and access reviews:

          | Data | WMI classes |
          |---|---|
          | CPU | `Win32_PerfRawData_Counters_ProcessorInformation` |
          | Memory | `Win32_OperatingSystem`, `Win32_PerfRawData_PerfOS_Memory`, `Win32_PerfRawData_PerfOS_PagingFile`, `Win32_PerfRawData_PerfOS_NUMANodeMemory` |
          | System | `Win32_PerfRawData_PerfOS_System` |
          | Network | `Win32_PerfRawData_Tcpip_NetworkInterface`, `Win32_PerfRawData_Tcpip_NetworkAdapter`, `Win32_PerfRawData_Tcpip_TCPv4`, `Win32_PerfRawData_Tcpip_TCPv6`, `Win32_PerfRawData_Tcpip_UDPv4`, `Win32_PerfRawData_Tcpip_UDPv6` |
          | Disk | `Win32_LogicalDisk`, `Win32_PerfRawData_PerfDisk_PhysicalDisk`, `Win32_DiskDrive` |
          | SMB | `Win32_PerfRawData_PerfNet_Server`, `Win32_PerfRawData_Counters_SMBServerShares` |
          | Time synchronization | `Win32_PerfRawData_MicrosoftWindowsW32TimePerf_WindowsTimeService` |
          | Node labels | `Win32_OperatingSystem`, `Win32_ComputerSystem`, `Win32_Processor`, `Win32_PhysicalMemory`, `Win32_LogicalDiskToPartition`, `Win32_IP4RouteTable`, `Win32_NetworkAdapter`, `Win32_NetworkAdapterConfiguration` |
      supported_platforms:
        include: [Linux, Windows]
        exclude: []
      multi_instance: true
      additional_permissions:
        description: |
          The Windows account needs remote read access to WMI on each monitored host. Members of the host's local Administrators group have it. For a dedicated non-administrator account, grant:

          | Permission | Needed when |
          |---|---|
          | **Enable Account** and **Remote Enable** on the `root\cimv2` WMI namespace | Always |
          | Membership in the local **Distributed COM Users** group | `transport: dcom` |
          | Membership in the local **Remote Management Users** group | `transport: winrm` |
          | Membership in the local **Performance Monitor Users** group | Always |

          The plugin only reads: do not grant **Execute Methods**, write or full-control permissions. See [Securing a remote WMI connection](https://learn.microsoft.com/en-us/windows/win32/wmisdk/securing-a-remote-wmi-connection).

          On a Linux poller, `wmi.plugin` needs the `CAP_NET_RAW` capability to send ICMP echo requests. The installer grants it that capability and no other privilege.
      default_behavior:
        auto_detection:
          description: The plugin does not discover Windows hosts. The stock configuration has no jobs, so it contacts no host until you add one.
        limits:
          description: |
            - Authentication is NTLMv2 only. Hosts or domains that block NTLM and accept only Kerberos cannot be monitored.
            - Every collection logs in again. With a wrong or expired password, each collection adds one failed logon (and each `autodetection_retry` attempt while the job is starting), which can lock the account under an account lockout policy.
            - A WinRM listener with `CbtHardeningLevel` set to `Strict` rejects the plugin, because it sends no TLS channel binding token.
            - Rates, such as traffic, packets and errors, appear from the second collection after a job starts, because a rate needs two readings.
            - When a host restarts, counters that Windows keeps in 32 bits, such as context switches, start again from zero. If such a counter was close to its 32-bit maximum before the restart, the Agent reads the drop as a counter wrap and its chart shows one spike.
            - Disk space covers fixed drives that have a drive letter. Volumes mounted only into a folder, removable drives and network drives are not charted.
            - Every share of the host gets seven charts, as on the Netdata Agent running on Windows, including the hidden administrative shares that every Windows host has (`C$` and one for each other drive, `ADMIN$`, `IPC$`). A file server with 200 shares gets 1,400 share charts; switch off `collectors.smb` for a host whose SMB charts you do not need.
            - Some stock packet alerts expect the one-second collection of the Netdata Agent running on Windows. At the default `update_every` of 30, `10s_received_packets_storm` cannot reach its thresholds; `net_interface_inbound_packets` and `net_interface_outbound_packets` add up per-second rates, so they show the packets divided by `update_every`; and the drop-ratio alerts evaluate only interfaces that average more than about 500 received or 50 sent packets per second, and report 0 below that.
            - Every job pings its host; ping cannot be switched off. A host that does not answer ICMP echo requests, for example because Windows Firewall blocks them, shows 100% packet loss in every collection and raises the `ping_host_reachable` alert.
            - Ping charts update only in collections whose WMI queries succeed. A host that is down leaves a gap in the ping charts instead of 100% packet loss, so the ping alerts do not report it; its node turns Stale and the `wmi_host_last_collected_secs` alert reports it instead.
            - A host that cannot be reached when its job starts gets no node and no host status alert until the job collects from it, twice for the alert. Set `autodetection_retry` so the job keeps trying.
            - Stopping or removing a job leaves its charts on the generated node, which then turns Stale. A job restarted after an edit does not remove the charts it no longer sends, such as those of a metric group you switched off: they stay on the node without new data.
            - With `update_every` shorter than `timeout`, one unusually slow collection can raise `wmi_host_last_collected_secs` for a moment. Keep `update_every` at least as long as `timeout`, as the defaults (30 and 15 seconds) are.
            - After five failed collections in a row, the plugin waits longer between attempts, up to 10 minutes more than `update_every`. A host that comes back after a long outage can take that long to turn live again.
            - `system_reboot_detection` sees a reboot only when a collection succeeds within the host's first 10 minutes of uptime. After a long outage, the longer wait between attempts can miss that window; the `wmi_host_last_collected_secs` alert reports the outage instead.
            - A collection must finish within `timeout` (15 seconds by default); a collection that does not is discarded and leaves a gap in every chart of the host.
            - The clock offset is measured against the poller's clock, so it includes the poller's own error with the opposite sign: a poller whose clock is 2 seconds behind shows every host 2 seconds ahead. Keep the poller's clock synchronized. When every host of one poller shows a similar offset, check the poller's clock first.
            - Time synchronization needs Windows Server 2016 or later, which added the Windows Time service's counters. On an older host its query fails in every collection and the job logs a warning once a minute; switch off `collectors.time` for that host. The charts show the Windows Time service's own synchronization, not that of another NTP client installed on the host.
        performance_impact:
          description: |
            The poller's own cost is small: a few short-lived connections per job per collection.

            On each Windows host, every collection costs up to seventeen WMI queries, one more while it reads the model of a physical disk that appeared, run by the WMI provider host process (`WmiPrvSE.exe`), and three ICMP echo requests. DCOM opens two authenticated TCP connections per collection (the RPC endpoint mapper and the WMI service); WinRM opens one authenticated HTTPS connection. Every five minutes the node labels add up to eight small queries. To reduce the load, raise `update_every` or switch off the metric groups you do not need under `collectors`.
    setup:
      prerequisites:
        list:
          - title: Build the plugin from source
            description: |
              Netdata packages do not include this experimental plugin yet. On the poller, build and install Netdata from source with the plugin enabled:

              ```bash
              ./netdata-installer.sh --enable-plugin-wmi
              ```

              CMake builds use `-DENABLE_PLUGIN_WMI=ON`. Check that `wmi.plugin` is in the Netdata plugins directory, usually `/usr/libexec/netdata/plugins.d/`.

              The installer also gives `wmi.plugin` the `CAP_NET_RAW` capability, which ping needs. When the `setcap` tool is missing, or the installer runs inside a container, it does not, and prints a warning; the plugin then collects without ping charts until you grant the capability (see the `ICMP ping disabled` error under Troubleshooting).
          - title: Allow the poller through the Windows firewall
            description: |
              On each Windows host, allow inbound connections from the poller for the transport you use. In PowerShell as Administrator, replace `192.0.2.10` with the poller's address.

              For DCOM, enable the built-in WMI rules and limit them to the poller:

              ```powershell
              Enable-NetFirewallRule -DisplayGroup "Windows Management Instrumentation (WMI)"
              Set-NetFirewallRule -DisplayGroup "Windows Management Instrumentation (WMI)" -RemoteAddress 192.0.2.10
              ```

              For WinRM, allow the HTTPS listener port:

              ```powershell
              New-NetFirewallRule -DisplayName "WinRM HTTPS from Netdata" -Direction Inbound -Protocol TCP -LocalPort 5986 -RemoteAddress 192.0.2.10 -Action Allow
              ```

              For the ping charts, allow ICMP echo requests from the poller:

              ```powershell
              New-NetFirewallRule -DisplayName "ICMP echo from Netdata" -Direction Inbound -Protocol ICMPv4 -IcmpType 8 -RemoteAddress 192.0.2.10 -Action Allow
              ```

              For a host monitored over IPv6, use `-Protocol ICMPv6 -IcmpType 128`.

              Network firewalls between the poller and the host need the same ports and ICMP echo. DCOM's WMI port is dynamic, by default in the TCP range 49152-65535.
          - title: Create a WinRM HTTPS listener
            description: |
              WinRM only. The host needs a server authentication certificate whose subject or subject alternative name matches the `host` you configure, in the computer's Personal certificate store. Then create the listener in PowerShell as Administrator:

              ```powershell
              winrm quickconfig -transport:https
              ```

              If a private CA issued the certificate, copy the CA certificate in PEM format to the poller and set `tls_ca` to its path. See [Configure WinRM for HTTPS](https://learn.microsoft.com/en-us/troubleshoot/windows-client/system-management-components/configure-winrm-for-https).
          - title: Grant the monitoring account access to WMI
            description: |
              Skip this step for an account in the host's local Administrators group. Otherwise, grant the permissions listed under Overview:

              1. Add the account to the local groups, for example for DCOM:

                 ```powershell
                 Add-LocalGroupMember -Group "Distributed COM Users" -Member 'EXAMPLE\monitor'
                 Add-LocalGroupMember -Group "Performance Monitor Users" -Member 'EXAMPLE\monitor'
                 ```

                 For WinRM, use the group `Remote Management Users` instead of `Distributed COM Users`.
              2. Run `wmimgmt.msc`, open the properties of **WMI Control**, and on the **Security** tab select `Root\CIMV2`. Click **Security**, add the account, and allow **Enable Account** and **Remote Enable**.

              A local account other than the built-in Administrator gets a filtered token for remote connections even when it is an administrator (remote UAC), so treat it as a non-administrator account and grant the permissions above.
      configuration:
        file:
          name: wmi/windows.conf
          description: Define one job per Windows host.
        options:
          description: Each job monitors one Windows host. Set `update_every` or `autodetection_retry` at the top of the file to apply them to every job.
          folding:
            title: Options
            enabled: false
          list:
            - name: host
              description: "Hostname or IP address of the Windows host."
              default_value: ''
              required: true
              group: Connection
            - name: transport
              description: "Protocol that carries the WMI queries. DCOM uses TCP 135 and a dynamic RPC port; WinRM uses HTTPS on TCP 5986."
              default_value: dcom
              required: false
              group: Connection
            - name: tls_ca
              description: "Path on the poller to the PEM file of the CA that issued the WinRM listener certificate. Leave empty to use the system trust store."
              default_value: ''
              required: false
              group: Connection
            - name: auth
              description: "Authentication protocol for the Windows account. NTLMv2 is the only supported protocol."
              default_value: ''
              required: true
              group: Connection
            - name: username
              description: "Windows account that reads WMI on the host, as `DOMAIN\\user`, `user@domain` or a local account name."
              default_value: ''
              required: true
              group: Connection
            - name: password
              description: "Password of the Windows account."
              default_value: ''
              required: true
              group: Connection
              detailed_description: |
                Keep the password out of the configuration file with a secret reference, for example `${env:WMI_PASSWORD}` with the variable set in the Netdata service environment. See [secrets management](/src/collectors/SECRETS.md).
            - name: update_every
              description: "Data collection interval, in seconds."
              default_value: 30
              required: false
              group: Collection
            - name: autodetection_retry
              description: "How often to retry the initial connection when the job fails to start, in seconds. Zero disables retries."
              default_value: 0
              required: false
              group: Collection
            - name: timeout
              description: "Time limit for one collection, including the connection and every enabled query, in seconds."
              default_value: 15
              required: false
              group: Collection
            - name: collectors
              description: "Metric groups to collect. Each enabled group runs one WMI query per collection, the memory group four, the network group six, and the disk and SMB groups two. Keep at least one group enabled."
              default_value: ''
              required: false
              group: Collection
            - name: collectors.cpu
              description: "Collect processor utilization by mode, in total and per logical processor."
              default_value: true
              required: false
              group: Collection
              detailed_description: |
                As on the Netdata Agent running on Windows, each mode is its share of the time all modes accumulated in the interval. The privileged time Windows reports (`system`) already includes the interrupt (`irq`) and DPC (`dpc`) time, so those two also count within `system`.
            - name: collectors.memory
              description: "Collect physical and available memory, commit charge, paging activity, page faults, kernel memory pools, the system cache and page lists, the usage of each paging file, and the free and standby memory of each NUMA node."
              default_value: true
              required: false
              group: Collection
            - name: collectors.system
              description: "Collect the number of processes and threads, context switches, processor queue length, uptime and the host's clock offset."
              default_value: true
              required: false
              group: Collection
            - name: collectors.network
              description: "Collect traffic, packets, errors, drops, speed and output queue length per network interface, the host's total traffic, and TCP and UDP packets, connections and errors."
              default_value: true
              required: false
              group: Collection
            - name: collectors.disk
              description: "Collect available and used space per fixed drive, and bandwidth, operations, latency, utilization and queue per physical disk."
              default_value: true
              required: false
              group: Collection
            - name: collectors.smb
              description: "Collect the SMB file server's traffic, sessions, logons, open files, logon and access errors and resource shortages, and the open files, requests, connections and traffic of each share."
              default_value: true
              required: false
              group: Collection
            - name: collectors.time
              description: "Collect the Windows Time service's offset from its time source, NTP round-trip delay and number of answering time sources. Needs Windows Server 2016 or later."
              default_value: true
              required: false
              group: Collection
            - name: vnode
              description: "Associates this job with a [Virtual Node](https://learn.netdata.cloud/docs/netdata-agent/configuration/organize-systems-metrics-and-alerts#virtual-nodes)."
              default_value: ''
              required: false
              group: Virtual Node
              detailed_description: |
                Leave `vnode` empty and the job creates a node for the Windows host. Its identity comes from `host`: renaming the Windows computer keeps the node and its history, while changing `host` creates a new node. The node is named after the Windows computer name, carries `host` in the `address` label, and gets these labels from WMI, refreshed every five minutes. A label is left out when Windows does not report its value unambiguously.

                | Labels | Meaning |
                |---|---|
                | `_os_name`, `_os_version`, `_os_marketing_version`, `_os_edition`, `_kernel_version` | Windows product, edition, version and build |
                | `_hw_sys_vendor`, `_hw_product_name`, `_virtualization`, `_virt_detection`, `_hw_product_type` | Manufacturer, model, and the platform of a recognized virtual machine |
                | `_system_cores`, `_architecture`, `_system_cpu_model`, `_system_cpu_freq` | Logical processors, architecture, processor model and clock in Hz |
                | `_system_ram_total` | Sum of the installed memory modules, in bytes |
                | `_system_disk_space` | Total partition size of the fixed drives, in bytes; requires the disk group |
                | `_net_default_iface`, `_net_default_iface_ip`, `_net_default_iface_detection` | Interface and IPv4 address of the default route |

                The generated node turns Stale after about three missed collections, as the Overview describes.

                Set `vnode` to the name of a virtual node defined in `vnodes.conf` to use its name and labels instead; the job then reads no system information. Give that node the label `_os: windows`, which the generated node has, so the stock Windows alerts apply to it. Such a node turns Stale only after its own `stale_after` time (or `_node_stale_after_seconds` label); without one it stays live, with gaps in its charts, while the host is down.
        examples:
          folding:
            title: Configuration example
            enabled: false
          list:
            - name: Basic
              description: Monitor one Windows host over DCOM. The password comes from the `WMI_PASSWORD` environment variable of the Netdata service.
              config: |
                jobs:
                  - name: fileserver
                    host: fileserver.example.com
                    auth: ntlm
                    username: 'EXAMPLE\monitor'
                    password: '${env:WMI_PASSWORD}'
            - name: WinRM over HTTPS with a private CA
              description: Use the host's WinRM HTTPS listener instead of DCOM, trusting the CA that issued its certificate.
              config: |
                jobs:
                  - name: fileserver
                    host: fileserver.example.com
                    transport: winrm
                    tls_ca: /etc/netdata/ssl/windows-ca.pem
                    auth: ntlm
                    username: 'EXAMPLE\monitor'
                    password: '${env:WMI_PASSWORD}'
            - name: CPU and memory only
              description: Skip the system, network, disk, SMB and time synchronization queries.
              config: |
                jobs:
                  - name: fileserver
                    host: fileserver.example.com
                    auth: ntlm
                    username: 'EXAMPLE\monitor'
                    password: '${env:WMI_PASSWORD}'
                    collectors:
                      system: false
                      network: false
                      disk: false
                      smb: false
                      time: false
            - name: Multi-instance
              description: Monitor several Windows hosts with one account. Each job creates its own node.
              config: |
                jobs:
                  - name: fileserver
                    host: fileserver.example.com
                    auth: ntlm
                    username: 'EXAMPLE\monitor'
                    password: '${env:WMI_PASSWORD}'

                  - name: sqlserver
                    host: sql01.example.com
                    auth: ntlm
                    username: 'EXAMPLE\monitor'
                    password: '${env:WMI_PASSWORD}'
    troubleshooting:
      errors:
        list:
          - error: 'secret resolver: provider failure: job output: collector lifecycle failed; resolved configuration details redacted'
            when: The job's password, or another option, is a secret reference such as `${env:WMI_PASSWORD}`.
            cause: The Agent could not resolve the reference, for example because the variable is not set in the Netdata service environment. The Agent hides the details because they can contain resolved values. The plugin's own messages, listed below, still appear for jobs that use secret references.
            fix: Set the variable in the environment of the Netdata service, or correct the reference, as described in [secrets management](/src/collectors/SECRETS.md#troubleshooting).
          - error: 'auth must be ntlm'
            cause: The job omits `auth` or sets another value. The option has no default.
            fix: 'Add `auth: ntlm` to the job.'
          - error: 'transport must be dcom or winrm'
            cause: '`transport` has a value other than `dcom` or `winrm`.'
            fix: 'Set `transport: winrm` for the WinRM HTTPS listener, or remove `transport` to use DCOM.'
          - error: 'tls_ca requires the winrm transport'
            cause: 'The job sets `tls_ca` without `transport: winrm`. DCOM does not use TLS.'
            fix: 'Add `transport: winrm`, or remove `tls_ca` to keep DCOM.'
          - error: 'could not load tls_ca: could not read certificate `"/etc/netdata/ssl/windows-ca.pem"`: open `"/etc/netdata/ssl/windows-ca.pem"`: no such file or directory'
            when: '`tls_ca` is set. Jobs that use secret references show only `could not load tls_ca`.'
            cause: The file does not exist, or the `netdata` user cannot read it. The plugin reads it without its elevated privileges.
            fix: Set `tls_ca` to the absolute path of the CA certificate on the poller, and make the file readable by the `netdata` user.
          - error: 'could not load tls_ca: could not parse any PEM certificates `"/etc/netdata/ssl/windows-ca.pem"`'
            when: '`tls_ca` is set. Jobs that use secret references show only `could not load tls_ca`.'
            cause: The file holds no certificate in PEM format, for example a certificate exported in DER format.
            fix: 'Convert the certificate to PEM, for example with `openssl x509 -inform der -in ca.cer -out ca.pem`, and point `tls_ca` at the result.'
          - error: 'host must be a Windows hostname or IP address without a URL or port'
            cause: '`host` is empty or contains a scheme, path, port or other characters that are not part of a hostname.'
            fix: Set `host` to the bare name or address, for example `fileserver.example.com` instead of `https://fileserver.example.com:5986`.
          - error: 'username is required'
            cause: '`username` is empty, or names a domain with nothing after the backslash.'
            fix: Set the full account name, such as `EXAMPLE\monitor` or `monitor@example.com`.
          - error: 'password is required'
            cause: '`password` is empty, or its secret reference resolved to an empty value.'
            fix: Set the password, or give the referenced variable a value in the Netdata service environment.
          - error: 'timeout must be positive'
            cause: '`timeout` is zero or negative.'
            fix: Remove `timeout` to use the default of 15 seconds, or set a positive number of seconds.
          - error: 'at least one collector group must be enabled'
            cause: Every group under `collectors` is set to `false`.
            fix: Enable at least one of `cpu`, `memory`, `system`, `network`, `disk`, `smb` or `time`, or remove `collectors` to collect them all.
          - error: 'failed to open WMI session: open DCOM object resolver interface: connection refused'
            when: '`transport: dcom`'
            cause: Nothing accepts connections on TCP 135 at the configured `host`, or a firewall rejects them.
            fix: Enable the Windows Management Instrumentation (WMI) firewall rules for the poller, as described under Prerequisites, and check that `host` points at the Windows host.
          - error: 'failed to open WMI session: open DCOM object resolver interface: could not resolve the WMI host'
            when: '`transport: dcom`'
            cause: The poller cannot resolve the configured `host` name.
            fix: Use a name the poller resolves, such as the host's fully qualified domain name, or its IP address.
          - error: 'failed to open WMI session: read DCOM server version: ERROR_ACCESS_DENIED (0x00000005)'
            when: '`transport: dcom`'
            cause: The host rejected the login. The username or password is wrong, or the host does not accept NTLMv2.
            fix: Check `username` and `password`, including the domain part of the username, and that the host's network security policy allows NTLMv2. The host's Security event log records each rejected login as event 4625 from the poller's address. Fix it promptly or disable the job, because every collection retries the login and counts toward account lockout.
          - error: 'failed to open WMI session: activate WMI: E_ACCESSDENIED (0x80070005)'
            when: '`transport: dcom`, with a non-administrator account'
            cause: The account may log in but is not allowed to start WMI remotely over DCOM.
            fix: Add the account to the host's local **Distributed COM Users** group.
          - error: 'failed to open WMI session: open WMI root/cimv2 namespace: StatusAccessDenied (0x80041003)'
            when: '`transport: dcom`, with a non-administrator account'
            cause: The account lacks the **Enable Account** or **Remote Enable** permission on the `root\cimv2` WMI namespace.
            fix: Grant both permissions in `wmimgmt.msc`, as described under Prerequisites.
          - error: 'WMI collection did not finish within the timeout of `duration`'
            cause: The host did not answer in time. With DCOM, the usual cause is a firewall that allows TCP 135 but blocks the WMI service's dynamic RPC port, or a `host` that is not reachable at all.
            fix: Allow the poller through to the WMI service, as described under Prerequisites. If the host is reachable but slow, raise `timeout`.
          - error: 'failed to open WMI session: WinRM returned HTTP 401'
            when: '`transport: winrm`'
            cause: The listener rejected the login. The username or password is wrong, or the account may not use WinRM.
            fix: Check `username` and `password`; the host's Security event log records each rejected login as event 4625 from the poller's address. Every collection retries the login and counts toward account lockout. For a non-administrator account, add it to the host's local **Remote Management Users** group.
          - error: 'failed to open WMI session: WinRM server certificate verification failed'
            when: '`transport: winrm`'
            cause: The poller does not trust the listener certificate, or the certificate does not match the configured `host`.
            fix: Set `tls_ca` to the PEM file of the CA that issued the listener certificate, and set `host` to a name in the certificate.
          - error: 'failed to open WMI session: WinRM request failed: connection refused'
            when: '`transport: winrm`'
            cause: Nothing accepts connections on TCP 5986 at the configured `host`, or a firewall rejects them.
            fix: Create the HTTPS listener and allow TCP 5986 from the poller, as described under Prerequisites.
          - error: 'failed to open WMI session: WinRM request failed: could not resolve the WMI host'
            when: '`transport: winrm`'
            cause: The poller cannot resolve the configured `host` name.
            fix: Use a name the poller resolves and that matches the listener certificate, such as the host's fully qualified domain name.
          - error: 'ICMP ping disabled: the plugin may not open raw ICMP sockets, which on Linux requires the CAP_NET_RAW capability'
            cause: '`wmi.plugin` lacks the `CAP_NET_RAW` capability on the poller, for example because the installer ran without the `setcap` tool or inside a container, where it does not set capabilities. The job logs this once and keeps collecting WMI metrics without ping charts.'
            fix: |
              Grant the capability, then restart the Netdata service:

              ```bash
              sudo setcap cap_net_raw+ep /usr/libexec/netdata/plugins.d/wmi.plugin
              ```

              In a container, run the same command inside it only when the container keeps `cap_net_raw` in its capability bounding set (`capsh --print` lists it under `Bounding set`). A binary whose file capability the container does not allow fails to start, which would stop all WMI collection.
          - error: 'ICMP ping failed: could not resolve the host'
            cause: The poller could not resolve the configured `host` name when it pinged the host, while the WMI queries of that collection succeeded. The usual cause is an intermittent DNS failure, or a DNS server that does not answer within the ping time limit of up to 3 seconds.
            fix: Use a name the poller resolves reliably, such as the host's fully qualified domain name, or its IP address.
          - error: 'ICMP ping failed: `reason`'
            cause: The poller could not send the echo requests, for example because a firewall on the poller rejects outgoing ICMP (`operation not permitted`) or has no route to the host (`no route to host`).
            fix: Allow outgoing ICMP echo requests from the poller to the host, and check the poller's routing to the host's address.
          - error: 'Ping packet loss stays at 100% while the other charts update'
            cause: The host, or a firewall between it and the poller, drops ICMP echo requests or their replies. Windows Firewall blocks inbound echo requests unless a rule allows them.
            fix: |
              Allow ICMP echo requests from the poller, as described under Prerequisites. If ICMP must stay blocked, exclude the host from the `ping_host_reachable` alert with a [`chart labels`](/src/health/REFERENCE.md#alert-line-chart-labels) line in your copy of `health.d/ping.conf`, for example:

              ```text
              chart labels: host=!fileserver.example.com *
              ```
          - error: 'The host''s node is Stale and the `wmi_host_last_collected_secs` alert is critical'
            cause: The poller has missed two to three collections in a row from the host. The host is down or unreachable, or it rejects the login. The job logs the reason with every failed collection, as one of the errors above.
            fix: Fix the cause the job logs. With the next successful collection the node turns live again and the alert clears; the alert's recovery notification is delayed by at least 5 minutes.
          - error: 'The `wmi_host_clock_offset` alert is raised'
            cause: Over the last 5 minutes, the host's clock was on average more than 60 seconds ahead of or behind the poller's. The Windows Time service on the host is stopped or cannot reach its time source, or, when every host of the poller shows a similar offset, the poller's own clock is wrong.
            fix: On the host, check the time source and the last successful synchronization with `w32tm /query /status`, and synchronize with `w32tm /resync`; `wmi.clock_sync_sources` at 0 shows that no time source answers the Windows Time service. When every host of the poller shows a similar offset, fix the time synchronization of the poller instead.
          - error: 'The `wmi_host_time_sources` alert is raised'
            cause: No collection in the last hour counted a time server that answers the host's Windows Time service, so the host keeps time on its own clock, which drifts. Its time source cannot be resolved or reached, or the host keeps time without NTP, such as through Hyper-V time synchronization alone or as a forest-root domain controller on its own clock. The alert notifies nobody; `wmi_host_clock_offset` notifies when the drift grows.
            fix: On the host, check the configured time source with `w32tm /query /peers` and `w32tm /query /status`, and the Windows Time service's events in the System log, such as event 47 (no answer from the time source) and event 134 (its name cannot be resolved). A host that keeps time without NTP needs no fix.
          - error: 'time service WMI query failed: read WMI query results: StatusInvalidClass (0x80041010)'
            when: '`transport: dcom`; with `transport: winrm` the message ends in `WinRM returned a WS-Management fault`'
            cause: The host has no Windows Time service counters, because it runs a Windows version older than Windows Server 2016. The other metric groups keep collecting.
            fix: 'Set `time: false` under `collectors` in the host''s job.'
          - error: '`group` WMI query failed: WinRM returned a WS-Management fault'
            when: '`transport: winrm`'
            cause: The listener accepted the login but refused the query, most often because the account lacks permissions on the `root\cimv2` WMI namespace.
            fix: Grant **Enable Account** and **Remote Enable** on `root\cimv2` in `wmimgmt.msc`, as described under Prerequisites.
    metrics:
      folding:
        title: Metrics
        enabled: false
      description: |
        - Charts belong to the Windows host's node, not to the poller.
        - CPU utilization and the per-second rates, such as traffic, packets, errors, paging and page faults, are averages over each collection interval, computed from Windows' raw performance counters, so a short spike counts toward the interval it happens in.
        - Memory sizes, processes, threads, TCP connections (`ip.tcpsock`), the processor queue length and the disk queue (`disk.qops`) are the values at the moment of the collection. As on the Netdata Agent running on Windows, `system.processes` counts every process on the host as `running`.
        - As on the Netdata Agent running on Windows, `mem.swap` and `mem.committed` show the commit charge against the commit limit, which counts physical memory and all paging files; `mem.pagefile_usage` shows how full each paging file is.
        - As on the Netdata Agent running on Windows, `mem.system_pool_allocs` shows how fast the number of outstanding pool allocations grows, and 0 while it shrinks.
        - As on the Netdata Agent running on Windows, disk utilization, operation times (`disk.await`, `disk.svctm`) and sizes (`disk.avgsz`) are averages over each collection interval, and an interval in which no operation completed shows a time and size of 0. `disk.busy` shows Windows' % Disk Time, which adds up the time of concurrent operations, so it can exceed 1000 ms per second.
        - The `ip.*` TCP charts add up IPv4 and IPv6, as the Netdata Agent on Linux counts TCP and as the Netdata Agent on Windows charts `ip.tcppackets`; `ipv4.*` and `ipv6.*` charts show one version. The charts that use Linux contexts have only the dimensions Windows counts: `ip.tcphandshake` has no `OutRsts` or `SynRetrans`, `ip.tcperrors` only `RetransSegs`, and the `udperrors` charts only `InErrors` and `NoPorts`.
        - A metric group whose query fails leaves a gap in its charts for that collection, while the other groups continue; the `ip.*` TCP charts need both the IPv4 and the IPv6 query. A zero is always a reported value.
        - Ping packet loss is the share of the three echo requests of a collection that got no reply. Round-trip times come from the replies, so a collection without any reply has packet loss but no round-trip time.
        - `wmi.clock_offset` is the host's clock minus the poller's: a positive value means the host's clock is ahead.
        - `system.clock_sync_offset` is how far the host's clock is from its own time source, as the Windows Time service computes it from each NTP answer; it falls while the service corrects the clock. Windows reports only its size, so unlike on the Netdata Agent on Linux it is never negative. It changes only with a new answer from the time source, so it does not show the drift of a host whose time source stopped answering; `wmi.clock_offset` does.
        - `wmi.clock_sync_roundtrip_delay` is the round trip of the Windows Time service's latest NTP request and changes only with its next request. `wmi.clock_sync_sources` counts the time servers that answer the host's NTP client; it is 0 on a host that keeps time without NTP.
        - The `wmi.smb_server_*` charts cover the host's whole SMB file service, as Windows' Server counters count it; the `smb.server_shares_*` charts show it per share, as on the Netdata Agent running on Windows. `wmi.smb_server_logons` counts every logon attempt, failed ones included. In `wmi.smb_server_access_errors`, `logon` counts failed logons, `access_permissions` file opens refused with access denied, and `granted_access` denied accesses to files already open. In `wmi.smb_server_resource_errors`, `system` counts internal server errors, `work_item_shortages` and `blocking_requests_rejected` requests the server had no free work item for, and the pool failures failed kernel memory allocations.
