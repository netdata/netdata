            - name: smb.server_shares_read_requests
              description: Read requests on the SMB share
              unit: requests/s
              chart_type: line
              dimensions:
                - name: reads
            - name: smb.server_shares_metadata_requests
              description: Metadata requests on the SMB share
              unit: requests/s
              chart_type: line
              dimensions:
