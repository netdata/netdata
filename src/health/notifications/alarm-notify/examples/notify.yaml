version: 1
destinations:
  local:
    type: webhook
    url: http://127.0.0.1:18080/notify
  audit:
    type: webhook
    url: http://127.0.0.1:18080/audit
  authenticated:
    type: webhook
    url: ${env:NOTIFY_WEBHOOK_URL}
    bearer_token: ${env:NOTIFY_WEBHOOK_TOKEN}
  slack:
    type: slack
    url: ${env:NOTIFY_SLACK_URL}
  discord:
    type: discord
    url: ${env:NOTIFY_DISCORD_URL}
  telegram:
    type: telegram
    bot_token: ${env:NOTIFY_TELEGRAM_TOKEN}
    chat_id: '-100123'
    message_thread_id: 7
    retries_on_limit: 0
routing:
  default: [local]
  roles:
    sysadmin: [local, audit]
    dba: [audit]
    muted: []
    chatops: [slack]
    discord_ops: [discord]
    telegram_ops: [telegram]
