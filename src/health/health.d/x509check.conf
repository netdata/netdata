
 template: x509check_days_until_expiration
       on: x509check.time_until_expiration
    class: Utilization
     type: Synthetic
component: X.509 certificate
     calc: $expiry / 86400
    units: days
    every: 60s
     warn: $this < 14
     crit: $this < 7
  summary: SSL cert expiring soon (${label:source} cn:${label:common_name})
     info: SSL cert expiring soon (${label:source} cn:${label:common_name})
       to: webmaster

 template: x509check_revocation_status
       on: x509check.revocation_status
    class: Availability
     type: Synthetic
component: X.509 certificate
     calc: $revoked
    units: status
    every: 60s
     crit: $this == 1
  summary: SSL cert revoked (${label:source})
     info: SSL cert revoked (${label:source})
       to: webmaster

# Revocation checks that fail for a reason the operator can fix: an unreachable CRL, OCSP or issuer URL, an unusable
# answer, or a missing issuer certificate. An expired certificate and one without revocation URLs are left out.

 template: x509check_revocation_check_failures
       on: x509check.revocation_check_status
    class: Errors
     type: Synthetic
component: X.509 certificate
   lookup: average -30m unaligned percentage of request_failed,invalid_answer,issuer_not_found
    units: %
    every: 60s
     warn: ($this == nan or $this == inf) ? (nan) : ($this >= (($status >= $WARNING) ? (80) : (90)))
  summary: SSL cert revocation check failing (${label:source})
     info: Percentage of SSL cert revocation checks in the last 30 minutes that failed on a request, an unusable answer or a missing issuer certificate (${label:source})
       to: webmaster
