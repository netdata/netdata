 template: ipmi_sensor_state
       on: ipmi.sensor_state
    class: Availability
     type: Hardware
component: IPMI
     calc: $warning + $critical
    units: state
    every: 10s
     warn: $warning > 0
     crit: $critical > 0
    delay: up 5m down 15m multiplier 1.5 max 1h
  summary: IPMI sensor ${label:sensor} state
     info: IPMI sensor ${label:sensor} (${label:component}) state
       to: sysadmin

 template: ipmi_events
       on: ipmi.sel
    class: Errors
     type: Hardware
component: IPMI
     calc: $events
    units: events
    every: 30s
     warn: $this > 0
    delay: up 5m down 15m multiplier 1.5 max 1h
  summary: IPMI entries in System Event Log
     info: number of events in the IPMI System Event Log (SEL)
       to: silent

# Threshold events are left to ipmi_sensor_state, which alerts on the same crossings.
    template: ipmi_sel_critical_events
          on: ipmi.sel_new_records
       class: Errors
        type: Hardware
   component: IPMI
chart labels: event_type=discrete
      lookup: sum -10m unaligned of critical
       units: records
       every: 10s
        crit: ($this == nan or $this == inf) ? (nan) : ($this > 0)
       delay: down 15m multiplier 1.5 max 1h
     summary: IPMI critical SEL events
        info: number of critical events, other than threshold crossings, that the BMC logged in the System Event Log (SEL) in the last 10 minutes
          to: sysadmin
