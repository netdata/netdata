 template: ipmi_sensor_state
       on: ipmi.sensor_state
    class: Availability
     type: Hardware
component: IPMI
     calc: $warning + $critical
    units: state
    every: 10s
     warn: $warning > 0
     crit: $critical > 0
    delay: up 5m down 15m multiplier 1.5 max 1h
  summary: IPMI sensor ${label:sensor} state
     info: IPMI sensor ${label:sensor} (${label:component}) state
       to: sysadmin

 template: ipmi_events
       on: ipmi.sel
    class: Errors
     type: Hardware
component: IPMI
     calc: $events
    units: events
    every: 30s
     warn: $this > 0
    delay: up 5m down 15m multiplier 1.5 max 1h
  summary: IPMI entries in System Event Log
     info: number of events in the IPMI System Event Log (SEL)
       to: silent

# Threshold events are left to ipmi_sensor_state. SEL records report events, not states: the alert clears when no new
# critical record was observed for 10 minutes, which does not mean the problem was resolved, so it sends no clear
# notification.
    template: ipmi_sel_critical_events
          on: ipmi.sel_new_records
       class: Errors
        type: Hardware
   component: IPMI
chart labels: event_type=discrete
      lookup: sum -10m unaligned of critical
       units: records
       every: 10s
        crit: ($this == nan or $this == inf) ? (nan) : ($this > 0)
     options: no-clear-notification
     summary: IPMI critical SEL events
        info: Number of critical events, other than threshold crossings, observed by the collector in the last 10 minutes. \
              Failed SEL reads can delay reporting. The alert clears when no new one is observed, not when the problem \
              is resolved; the ipmi-sel Live Data view lists the records
          to: sysadmin
