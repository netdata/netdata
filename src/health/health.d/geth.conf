# The header head is expected to be momentarily ahead of the block head; more than 5 blocks ahead means the node is
# out of sync.
 template: geth_chainhead_diff_between_header_block
       on: geth.chainhead
    class: Workload
     type: Application
component: Go-ethereum
    every: 10s
     calc: $header - $block
    units: blocks
     warn: $this > 5
    delay: down 1m multiplier 1.5 max 1h
