# you can disable an alarm notification by setting the 'to' line to: silent

      alarm: 30min_ram_swapped_out
         on: mem.swapio
      class: Workload
       type: System
  component: Memory
host labels: _os=linux freebsd
     lookup: sum -30m unaligned absolute of out
             # we have to convert KB to MB by dividing $this (i.e. the result of the lookup) with 1024
       calc: $this / 1024 * 100 / ( $system.ram.used + $system.ram.cached + $system.ram.free )
      units: % of RAM
      every: 1m
       warn: $this > (($status >= $WARNING)  ? (20) : (30))
      delay: down 15m multiplier 1.5 max 1h
    summary: System memory swapped out
       info: Percentage of the system RAM swapped in the last 30 minutes
         to: silent

      alarm: used_swap
         on: mem.swap
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux freebsd
       calc: (($used + $free) > 0) ? ($used * 100 / ($used + $free)) : 0
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (80) : (90))
       crit: $this > (($status == $CRITICAL) ? (90) : (98))
      delay: up 30s down 15m multiplier 1.5 max 1h
    summary: System swap memory utilization
       info: Swap memory utilization
         to: sysadmin

## Windows
# Windows does not overcommit: every allocation is charged against the commit limit (RAM plus paging files), and new
# allocations fail once the charge reaches it and the paging files cannot grow. A template, so it also attaches to
# Windows virtual nodes, whose chart IDs carry a job prefix.

   template: committed_memory_utilization
         on: mem.committed
      class: Utilization
       type: System
  component: Memory
host labels: _os=windows
       calc: ($limit > 0) ? ($committed * 100 / $limit) : (nan)
      units: %
      every: 10s
       warn: ($this == nan or $this == inf) ? (nan) : ($this > (($status >= $WARNING)  ? (80) : (90)))
       crit: ($this == nan or $this == inf) ? (nan) : ($this > (($status == $CRITICAL) ? (90) : (98)))
      delay: up 30s down 15m multiplier 1.5 max 1h
    summary: System commit charge utilization
       info: Commit charge as a percentage of the commit limit (RAM plus paging files). Allocations fail when it reaches the limit and the paging files cannot grow
         to: sysadmin
