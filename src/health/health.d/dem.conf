# Site Web Vital/no-beacon rules are generated from each native site's alerts
# settings in the DEM state directory. This diagnostic applies to every site.
template: rum_events_dropped
      on: rum.otlp
chart labels: _collect_plugin=dem
   class: Errors
    type: RUM
component: OTLP
  lookup: sum -5m unaligned of dropped
   units: records
   every: 1m
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 0)
   delay: down 15m
    info: RUM event records dropped before reaching the OTLP endpoint in the last 5 minutes
