template: rum_events_dropped
      on: rum.otlp
chart labels: _collect_plugin=dem
   class: Errors
    type: RUM
component: Event logs
  lookup: average -5m unaligned of errors,dropped
   units: records/s
   every: 1m
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 0)
   delay: down 15m
    info: RUM event log delivery failed or records were locally dropped in the last 5 minutes

template: rum_spans_dropped
      on: rum.spans
chart labels: _collect_plugin=dem
   class: Errors
    type: RUM
component: Browser tracing
  lookup: average -5m unaligned of errors,dropped
   units: spans/s
   every: 1m
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 0)
   delay: down 15m
    info: RUM browser span delivery failed or spans were locally dropped in the last 5 minutes

# A completed journey supplies one terminal state. Read its raw values to avoid
# averaging adjacent outcomes. A waiting/running attempt does not refresh them.
# Unknown states and observations older than two intervals are not recovery.
template: dem_journey_failed
      on: dem_synthetic.execution_state
chart labels: _collect_plugin=dem _collect_module=journey
   class: Errors
    type: Synthetic
component: Journey
    calc: ($now > $last_collected_t + 2 * $update_every) ? (nan) : (($failed_raw == 1 or $timeout_raw == 1) ? (1) : (($success_raw == 1) ? (0) : (nan)))
   units: state
   every: 10s
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 0)
    info: Latest fresh journey attempt failed or timed out for ${label:_collect_job}
