# Stock RUM quality alerts use the current receiver-observation window.
# A population requires 30 observations for that metric and no retained loss
# evidence. These are recent-experience alerts, not sustained-incident proofs.
# Exact 25% above a boundary does not exceed the nearest-rank p75 boundary.
# SET writes have independent timestamps. Check freshness and stored gaps,
# then use raw counts for classification without interpolation.
# Use chart-label filters in user health configuration for site-specific policy.

template: rum_lcp_experience_quality
      on: rum.lcp_population
chart labels: _collect_plugin=dem
   class: Latency
    type: RUM
component: Web Vitals
    calc: ($now > $last_collected_t + 2 * $update_every or $observed_raw == nan or $observed_raw == inf or $observed_raw < 30 or $lost_reports_raw != 0 or $good_raw + $needs_improvement_raw + $poor_raw != $observed_raw or $now > $observed_last_collected_t + 2 * $update_every or $observed == nan or $observed == inf or $now > $good_last_collected_t + 2 * $update_every or $good == nan or $good == inf or $now > $needs_improvement_last_collected_t + 2 * $update_every or $needs_improvement == nan or $needs_improvement == inf or $now > $poor_last_collected_t + 2 * $update_every or $poor == nan or $poor == inf or $now > $lost_reports_last_collected_t + 2 * $update_every or $lost_reports == nan or $lost_reports == inf) ? (nan) : (100 * ($needs_improvement_raw + $poor_raw) / $observed_raw)
   units: %
   every: 1m
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 25)
    crit: ($this == nan or $this == inf) ? (nan) : (4 * $poor_raw > $observed_raw)
   delay: down 5m multiplier 1.5 max 1h
    info: Largest Contentful Paint exceeds its good threshold for more than 25% of recent observed document experiences; critical when more than 25% exceed its poor threshold. Requires at least 30 observations and a complete local population.

