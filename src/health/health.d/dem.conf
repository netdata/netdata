# Stock RUM alerts apply independently to each native site chart.
# Use chart-label filters in user health configuration for site-specific policies.

template: rum_lcp_p75
      on: rum.lcp
chart labels: _collect_plugin=dem
   class: Latency
    type: RUM
component: Web Vitals
  lookup: average -10m unaligned of p75
   units: ms
   every: 1m
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 2500)
    crit: ($this == nan or $this == inf) ? (nan) : ($this > 4000)
   delay: down 5m multiplier 1.5 max 1h
    info: p75 Largest Contentful Paint over the last 10 minutes for site ${label:_collect_job}

template: rum_inp_p75
      on: rum.inp
chart labels: _collect_plugin=dem
   class: Latency
    type: RUM
component: Web Vitals
  lookup: average -10m unaligned of p75
   units: ms
   every: 1m
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 200)
    crit: ($this == nan or $this == inf) ? (nan) : ($this > 500)
   delay: down 5m multiplier 1.5 max 1h
    info: p75 Interaction to Next Paint over the last 10 minutes for site ${label:_collect_job}

template: rum_cls_p75
      on: rum.cls
chart labels: _collect_plugin=dem
   class: Latency
    type: RUM
component: Web Vitals
  lookup: average -10m unaligned of p75
   units: score
   every: 1m
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 0.1)
    crit: ($this == nan or $this == inf) ? (nan) : ($this > 0.25)
   delay: down 5m multiplier 1.5 max 1h
    info: p75 Cumulative Layout Shift over the last 10 minutes for site ${label:_collect_job}

template: rum_no_beacons
      on: rum.pageviews
chart labels: _collect_plugin=dem
   class: Errors
    type: RUM
component: Beacon
  lookup: sum -1h unaligned of views
   units: views
   every: 5m
    warn: ($this == nan or $this == inf) ? (nan) : ($this == 0)
   delay: up 10m down 5m
    info: No page views received from site ${label:_collect_job} in the last hour; is the RUM beacon installed?

template: rum_events_dropped
      on: rum.otlp
chart labels: _collect_plugin=dem
   class: Errors
    type: RUM
component: Event logs
  lookup: average -5m unaligned of errors,dropped
   units: records/s
   every: 1m
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 0)
   delay: down 15m
    info: RUM event log delivery failed or records were locally dropped in the last 5 minutes

template: rum_spans_dropped
      on: rum.spans
chart labels: _collect_plugin=dem
   class: Errors
    type: RUM
component: Browser tracing
  lookup: average -5m unaligned of errors,dropped
   units: spans/s
   every: 1m
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 0)
   delay: down 15m
    info: RUM browser span delivery failed or spans were locally dropped in the last 5 minutes

# A completed journey supplies one terminal state. Read its raw values to avoid
# averaging adjacent outcomes. A waiting/running attempt does not refresh them.
# Unknown states and observations older than two intervals are not recovery.
template: dem_journey_failed
      on: dem_synthetic.execution_state
chart labels: _collect_plugin=dem _collect_module=journey
   class: Errors
    type: Synthetic
component: Journey
    calc: ($now > $last_collected_t + 2 * $update_every) ? (nan) : (($failed_raw == 1 or $timeout_raw == 1) ? (1) : (($success_raw == 1) ? (0) : (nan)))
   units: state
   every: 10s
    warn: ($this == nan or $this == inf) ? (nan) : ($this > 0)
    info: Latest fresh journey attempt failed or timed out for ${label:_collect_job}
