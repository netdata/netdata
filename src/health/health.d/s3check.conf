# Authenticated S3 lifecycle probes.

 template: s3check_stage_failed
       on: s3check.stage_status
    class: Errors
     type: Storage
component: S3
     calc: $failed
    units: status
    every: 10s
    crit: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 probe stage ${label:stage} failed (${label:reason})
     info: The authenticated S3 lifecycle probe reported stage ${label:stage} with bounded failure reason ${label:reason}. Raw provider errors are intentionally not exposed.
       to: sysadmin

 template: s3check_stage_latency
       on: s3check.stage_latency_status
    class: Latency
     type: Storage
component: S3
     calc: $exceeded
    units: status
    every: 10s
    warn: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 probe stage ${label:stage} exceeded the configured latency objective
     info: Successful stage ${label:stage} took at least the configured latency_threshold_ms. Tune the objective to the client vantage and workload.
       to: silent

# Active directional multisite S3 replication checks.

 template: s3check_multisite_phase_failed
       on: s3check.multisite_phase_failure
    class: Errors
     type: Storage
component: S3
     calc: $failed
    units: status
    every: 10s
    crit: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 multisite route ${label:source_site} to ${label:destination_site} has a categorical phase failure
     info: The active S3 probe cannot write, verify, delete, reconcile, or clean up its configured ownership namespace. Inspect the phase status chart for the bounded phase and reason.
       to: sysadmin

 template: s3check_multisite_payload_mismatch
       on: s3check.multisite_payload_mismatch
    class: Errors
     type: Storage
component: S3
     calc: $mismatch
    units: status
    every: 10s
    crit: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 object replicated to ${label:destination_site} with a different payload
     info: The destination site returned a different SHA-256 payload than the source probe wrote. The probe removes both objects and keeps the incident open until a later verified payload clears it.
       to: sysadmin

 template: s3check_multisite_replication_rpo_breach
       on: s3check.multisite_rpo_status
    class: Latency
     type: Storage
component: S3
     calc: $breached
    units: status
    every: 10s
    warn: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 multisite replication exceeds the configured RPO
     info: The current directional probe from ${label:source_site} to ${label:destination_site} has not become client-visible within rpo_threshold_ms. Tune the objective to the replication policy.
       to: silent

 template: s3check_multisite_delete_propagation_breach
       on: s3check.multisite_delete_status
    class: Latency
     type: Storage
component: S3
     calc: $breached
    units: status
    every: 10s
    warn: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 multisite delete propagation exceeds the configured objective
     info: The destination copy from ${label:source_site} to ${label:destination_site} remains visible after the source delete for longer than delete_threshold_ms. Tune the objective to the replication policy.
       to: silent
