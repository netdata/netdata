# Authenticated S3 lifecycle probes.

 template: s3check_stage_failed
       on: s3check.stage_status
    class: Errors
     type: Storage
component: S3
     calc: $failed
    units: status
    every: 10s
    crit: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 probe stage ${label:stage} failed (${label:reason})
     info: The authenticated S3 lifecycle probe reported stage ${label:stage} with bounded failure reason ${label:reason}. Raw provider errors are intentionally not exposed.
       to: sysadmin

 template: s3check_stage_latency
       on: s3check.stage_latency_status
    class: Latency
     type: Storage
component: S3
     calc: $exceeded
    units: status
    every: 10s
    warn: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 probe stage ${label:stage} exceeded the configured latency objective
     info: Successful stage ${label:stage} took at least the configured latency_threshold_ms. Tune the objective to the client vantage and workload.
       to: silent
