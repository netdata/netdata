# Active S3 lifecycle and replication checks.

 template: s3check_runtime_failed
       on: s3check.runtime_status
    class: Availability
     type: Synthetic
component: S3 endpoint
     calc: $failed
    units: status
    every: 10s
    crit: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 check runtime failed (${label:reason})
     info: The collector could not validate provider safety or persist ownership state. Inspect the collector log for the raw provider or local-state error.
       to: sysadmin

 template: s3check_probe_failed
       on: s3check.probe_status
    class: Availability
     type: Synthetic
component: S3 endpoint
     calc: $failed
    units: status
    every: 10s
    crit: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 ${label:mode} probe failed (${label:reason})
     info: The active or last terminal probe failed with a bounded reason. Raw provider errors are available only in the collector log.
       to: sysadmin

 template: s3check_payload_mismatch
       on: s3check.payload_mismatch
    class: Errors
     type: Synthetic
component: S3 endpoint
     calc: $mismatch
    units: status
    every: 10s
    crit: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 ${label:mode} payload verification failed
     info: The verification read returned different bytes for the exact key written by the probe.
       to: sysadmin

 template: s3check_write_visibility_objective
       on: s3check.write_visibility_objective
    class: Latency
     type: Synthetic
component: S3 endpoint
     calc: $breached
    units: status
    every: 10s
    warn: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 write visibility exceeds the configured objective
     info: The exact source key has not become readable with the expected payload at ${label:destination} within write_objective.
       to: silent

 template: s3check_delete_visibility_objective
       on: s3check.delete_visibility_objective
    class: Latency
     type: Synthetic
component: S3 endpoint
     calc: $breached
    units: status
    every: 10s
    warn: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 delete visibility exceeds the configured objective
     info: The destination current object remains readable after the source delete for longer than delete_objective.
       to: silent

 template: s3check_mutation_backpressure
       on: s3check.mutation_backpressure
    class: Utilization
     type: Synthetic
component: S3 endpoint
     calc: $active
    units: status
    every: 10s
    warn: ($this == nan or $this == inf) ? (nan) : ($this == 1)
  summary: S3 check suspended new mutations while cleanup is pending
     info: The bounded ownership queue is full. Cleanup and observation continue, but no new probe object is created until a slot is released.
       to: sysadmin
