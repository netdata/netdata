# you can disable an alarm notification by setting the 'to' line to: silent

      alarm: 1hour_memory_hw_corrupted
         on: mem.hwcorrupt
      class: Errors
       type: System
  component: Memory
host labels: _os=linux
       calc: $HardwareCorrupted
      units: MB
      every: 10s
       warn: $this > 0
      delay: down 1h multiplier 1.5 max 1h
    summary: System corrupted memory
       info: Amount of memory corrupted due to a hardware failure
         to: sysadmin

## ECC Controller
# incremental-sum measures net increase. A reset can mask new errors until
# pre-reset samples leave the two-minute window; it is not a positive-delta sum.

   template: ecc_memory_mc_correctable
         on: mem.edac_mc_errors
      class: Errors
       type: System
  component: Memory
host labels: _os=linux
     lookup: incremental-sum -2m unaligned of correctable,correctable_noinfo
      units: errors
      every: 1m
       warn: ($this == nan or $this == inf) ? (nan) : ($this > 0)
    summary: System ECC memory ${label:controller} correctable errors
       info: Memory controller ${label:controller} ECC correctable error net increase over the last 2 minutes
         to: sysadmin

   template: ecc_memory_mc_uncorrectable
         on: mem.edac_mc_errors
      class: Errors
       type: System
  component: Memory
host labels: _os=linux
       calc: $uncorrectable + $uncorrectable_noinfo
      units: errors
      every: 1m
       crit: $this > 0
    summary: System ECC memory ${label:controller} uncorrectable errors
       info: Memory controller ${label:controller} ECC uncorrectable errors
         to: sysadmin

## ECC DIMM

   template: ecc_memory_dimm_correctable
         on: mem.edac_mc_dimm_errors
      class: Errors
       type: System
  component: Memory
