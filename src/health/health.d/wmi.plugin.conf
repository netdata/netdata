# Host status of the remote Windows hosts that wmi.plugin monitors.
#
# A failed collection publishes nothing on the host's node, so the signal is the
# job's collection duration chart on the poller, which updates only after a
# successful collection. A slow collection delays the next one, so the
# threshold adds the last collection's duration (ms) to three intervals; the
# Agent stores no duration for a moment after a long gap, so NaN adds nothing.
# For wmi.plugin jobs this alert replaces the generic
# plugin_data_collection_status alert (go.d.plugin.conf).

    template: wmi_host_last_collected_secs
          on: netdata.plugin_data_collection_duration
chart labels: _collect_plugin=wmi
       class: Availability
        type: System
   component: Windows
        calc: $now - $last_collected_t
       units: seconds ago
       every: 10s
        crit: $this > 3 * $update_every + (($duration == nan) ? (0) : ($duration / 1000))
       delay: down 5m multiplier 1.5 max 1h
     summary: Windows host ${label:_collect_job} WMI collection status
        info: Seconds since the last successful WMI collection from Windows host ${label:_collect_job}. \
              Critical after two to three missed collections: the host is down or unreachable, or it rejects the WMI login.
          to: sysadmin

# Clock offset of the remote Windows hosts against the poller.
#
# The offset is the host's clock minus the poller's, so it carries the poller's
# own clock error too: a similar offset on every host of one poller points at
# the poller. A collection whose clock reading took too long to bound its error
# charts no offset, and a window without any offset leaves the alert undefined.
# The warning matches the common 60-second check of a host against its
# monitoring server; critical comes before Kerberos's default 5-minute clock
# skew tolerance breaks domain logons.

    template: wmi_host_clock_offset
          on: wmi.clock_offset
       class: Availability
        type: System
   component: Windows
      lookup: average -5m unaligned absolute of offset
        calc: $this / 1000
       units: seconds
       every: 1m
        warn: ($this == nan or $this == inf) ? (nan) : ($this > 60)
        crit: ($this == nan or $this == inf) ? (nan) : ($this > 240)
       delay: down 5m multiplier 1.5 max 1h
     summary: Windows host clock offset
        info: Average difference over the last 5 minutes between the Windows host's clock and the clock of the Netdata \
              Agent that collects it over WMI. When every host of one Agent shows it, check that Agent's clock first.
          to: sysadmin
