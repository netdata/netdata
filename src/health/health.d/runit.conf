# you can disable an alarm notification by setting the 'to' line to: silent

    template: runit_service_down_manual
          on: runit.service_state
       class: Availability
        type: System
   component: Runit services
        calc: $down_manual
       units: state
       every: 10s
        warn: $this != nan AND $this == 1
       delay: down 5m multiplier 1.5 max 1h
     summary: runit service ${label:service_name} state
        info: runit service is stopped manually (it is normally up)
          to: sysadmin

    template: runit_service_running_manual
          on: runit.service_state
       class: Availability
        type: System
   component: Runit services
        calc: $running_manual
       units: state
       every: 10s
        warn: $this != nan AND $this == 1
       delay: down 5m multiplier 1.5 max 1h
     summary: runit service ${label:service_name} state
        info: runit service is started manually (it is normally down or will not be restarted)
          to: sysadmin

    template: runit_service_paused_state
          on: runit.service_state
       class: Availability
        type: System
   component: Runit services
        calc: $paused
       units: state
       every: 10s
        warn: $this != nan AND $this == 1
       delay: down 5m multiplier 1.5 max 1h
     summary: runit service ${label:service_name} state
        info: runit service is paused
          to: sysadmin

    template: runit_service_stuck_transitioning
          on: runit.service_state
       class: Latency
        type: System
   component: Runit services
      lookup: average -60s unaligned of starting,stopping
        calc: $this * 100
       units: %
       every: 10s
        crit: $this != nan AND $this > 50
       delay: down 1m multiplier 1.5 max 1h
     summary: runit service ${label:service_name} state
        info: runit service stuck in transitioning state (starting or stopping)
          to: sysadmin

# The chart stores restarts per second,
# so the average over a minute times 60 is the number of restarts in that minute
# whatever the collection interval is.

    template: runit_service_crash_loop
          on: runit.service_restarts
       class: Errors
        type: System
   component: Runit services
      lookup: average -1m unaligned of restarts
        calc: $this * 60
       units: restarts
       every: 10s
        crit: $this != nan AND $this >= 4
       delay: down 5m multiplier 1.5 max 1h
     summary: runit service ${label:service_name} restarts
        info: number of runit service restarts during the last minute (crash loop)
          to: sysadmin
