# Ceph Dashboard API/authentication/active-MGR availability.

 template: ceph_dashboard_api_unavailable
       on: ceph.dashboard_api_status
    class: Errors
     type: Storage
component: Ceph
     calc: $dashboard_api_reachable
    units: up/down
    every: 10s
     crit: $this == 0
 summary: Ceph Dashboard API for cluster ${label:fsid} is unavailable
    info: Ceph Dashboard API, authentication, or active-MGR discovery for cluster ${label:fsid} is unavailable
      to: sysadmin

# Low Ceph disk availability. This chart is opt-in through collect.capacity.

 template: ceph_cluster_physical_capacity_utilization
       on: ceph.cluster_physical_capacity_utilization
    class: Utilization
     type: Storage
component: Ceph
     calc: $utilization
    units: %
    every: 1m
    warn: $this > (($status >= $WARNING ) ? (85) : (90))
    crit: $this > (($status == $CRITICAL) ? (90) : (98))
   delay: down 5m multiplier 1.2 max 1h
 summary: Ceph cluster ${label:fsid} disk space utilization
    info: Ceph cluster ${label:fsid} disk space utilization
      to: sysadmin
