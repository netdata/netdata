
 template: k8s_state_deployment_condition_available
       on: k8s_state.deployment_conditions
    class: Availability
     type: Kubernetes
component: Deployment
    every: 10s
    units: status
     calc: $available
     warn: $this == 0
    delay: down 5m
  summary: Deployment ${label:k8s_deployment_name} does not have the minimum required replicas
     info: Deployment ${label:k8s_deployment_name} does not have the minimum required replicas
       to: silent

 template: k8s_state_cronjob_last_execution_failed
       on: k8s_state.cronjob_last_execution_status
    class: Errors
     type: Kubernetes
component: CronJob
    every: 10s
    units: status
     calc: $failed
     warn: $this == 1
    delay: down 5m
  summary: CronJob ${label:k8s_cronjob_name} in ${label:k8s_namespace} failing
     info: CronJob ${label:k8s_cronjob_name} in ${label:k8s_namespace} failing
       to: sysadmin

 template: k8s_state_pvc_resize_pending
       on: k8s_state.pvc_capacity
    class: Availability
     type: Kubernetes
component: PersistentVolumeClaim
   lookup: min -10m unaligned of requested
     calc: $capacity - $this
    every: 1m
    units: B
     warn: $this < 0
  summary: PVC ${label:k8s_pvc_name} in ${label:k8s_namespace} is smaller than requested
     info: PersistentVolumeClaim ${label:k8s_pvc_name} in namespace ${label:k8s_namespace} has had less capacity \
           than it requests for the last 10 minutes, so a volume expansion is pending or failed
       to: sysadmin
