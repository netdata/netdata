# Alerts on RAS (Reliability, Availability and Serviceability) errors recorded by rasdaemon.
#
# These deliberately do NOT duplicate the ECC alerts in health.d/memory.conf. Those watch
# mem.edac_mc_errors / mem.edac_mc_dimm_errors, which are live EDAC sysfs counters that reset
# on every reboot. The alerts below watch rasdaemon's persistent event database, so a machine
# that reboots after an error still reports it, and they additionally cover PCIe AER, Machine
# Check Exceptions and kernel memory failures, which EDAC sysfs does not expose at all.

## Memory

   template: rasdaemon_memory_uncorrectable_errors
         on: rasdaemon.memory_errors
      class: Errors
       type: System
  component: Memory
     lookup: sum -10m unaligned of uncorrected,fatal
      units: errors
      every: 1m
       crit: $this > 0
      delay: down 1h multiplier 1.5 max 2h
    summary: Uncorrectable memory errors
       info: Uncorrectable memory errors recorded by rasdaemon in the last 10 minutes. Data corruption has already occurred; identify the failing DIMM and replace it.
         to: sysadmin

   template: rasdaemon_memory_correctable_errors
         on: rasdaemon.memory_errors
      class: Errors
       type: System
  component: Memory
     lookup: sum -1h unaligned of corrected
      units: errors
      every: 1m
       warn: $this > 0
      delay: down 1h multiplier 1.5 max 2h
    summary: Correctable memory errors
       info: Correctable memory errors recorded by rasdaemon in the last hour. These are transparently corrected, but a rising rate on one module is an early indicator of DIMM failure.
         to: sysadmin

   template: rasdaemon_dimm_correctable_errors
         on: rasdaemon.dimm_errors
      class: Errors
       type: System
  component: Memory
     lookup: sum -1h unaligned of corrected
      units: errors
      every: 1m
       warn: $this > 0
      delay: down 1h multiplier 1.5 max 2h
    summary: DIMM ${label:dimm} correctable errors
       info: Correctable memory errors on DIMM ${label:dimm} in the last hour. Errors concentrating on a single module indicate that module is failing.
         to: sysadmin

   template: rasdaemon_dimm_uncorrectable_errors
         on: rasdaemon.dimm_errors
      class: Errors
       type: System
  component: Memory
     lookup: sum -10m unaligned of uncorrected,fatal
      units: errors
      every: 1m
       crit: $this > 0
      delay: down 1h multiplier 1.5 max 2h
    summary: DIMM ${label:dimm} uncorrectable errors
       info: Uncorrectable memory errors on DIMM ${label:dimm} in the last 10 minutes. Replace this module.
         to: sysadmin

   template: rasdaemon_memory_failure_events
         on: rasdaemon.memory_failure_events
      class: Errors
       type: System
  component: Memory
     lookup: sum -10m unaligned
      units: events
      every: 1m
       crit: $this > 0
      delay: down 1h multiplier 1.5 max 2h
    summary: Kernel memory failure events
       info: The kernel handled poisoned memory pages in the last 10 minutes, which follows an uncorrectable memory error. Processes may have been killed.
         to: sysadmin

## CPU

   template: rasdaemon_mce_records
         on: rasdaemon.mce_records
      class: Errors
       type: System
  component: CPU
     lookup: sum -10m unaligned
      units: events
      every: 1m
       crit: $this > 0
      delay: down 1h multiplier 1.5 max 2h
    summary: Machine Check Exceptions
       info: Machine Check Exceptions recorded in the last 10 minutes. These report hardware faults detected by the CPU, covering memory, cache, interconnect and bus errors.
         to: sysadmin

## PCIe

   template: rasdaemon_pcie_aer_fatal_errors
         on: rasdaemon.pcie_aer_errors
      class: Errors
       type: System
  component: PCI
     lookup: sum -10m unaligned of fatal,uncorrected
      units: errors
      every: 1m
       crit: $this > 0
      delay: down 1h multiplier 1.5 max 2h
    summary: PCIe AER uncorrectable errors
       info: Uncorrectable PCIe Advanced Error Reporting events in the last 10 minutes. The link or device could not recover; expect device resets or data loss.
         to: sysadmin

   template: rasdaemon_pcie_aer_correctable_errors
         on: rasdaemon.pcie_aer_errors
      class: Errors
       type: System
  component: PCI
     lookup: sum -1h unaligned of corrected
      units: errors
      every: 1m
       warn: $this > 0
      delay: down 1h multiplier 1.5 max 2h
    summary: PCIe AER correctable errors
       info: Correctable PCIe Advanced Error Reporting events in the last hour. These are recovered by the link layer, but a sustained rate points at a marginal slot, riser or cable.
         to: sysadmin
