# Firmware inventory comparisons are not live memory-health measurements.

   template: smbios_memory_confirmed_loss
         on: smbios_memory.confirmed_loss_status
      class: Errors
       type: System
  component: Memory
host labels: _os=linux
       calc: $present
      units: state
      every: 1m
       crit: ($this == nan or $this == inf or $unknown > 0) ? (nan) : ($this > 0)
    summary: Memory inventory loss
       info: Physical memory is missing or smaller than the accepted firmware inventory baseline
         to: sysadmin

   template: smbios_memory_comparison_unavailable
         on: smbios_memory.comparison_status
      class: Errors
       type: System
  component: Memory
host labels: _os=linux
       calc: $unavailable + $uncomparable + $unbaselined + $state_error
      units: state
      every: 1m
       warn: ($this == nan or $this == inf) ? (nan) : ($this > 0)
      delay: up 5m down 0
    summary: Memory inventory comparison unavailable
       info: The current firmware inventory cannot be compared with a durable memory baseline
         to: sysadmin
