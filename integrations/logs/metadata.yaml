# yamllint disable rule:line-length
---
- id: "logs-systemd-journal"
  meta:
    name: "Systemd Journal Logs"
    link: "https://github.com/netdata/netdata/blob/master/src/collectors/systemd-journal.plugin/README.md"
    categories:
      - logs
    icon_filename: "netdata.png"
  keywords:
    - systemd
    - journal
    - logs
  overview:
    description: |
      The `systemd` journal plugin lets you view, explore and analyze `systemd` journal logs from the Netdata dashboard.

      It automatically discovers available journal sources, allows advanced filtering, offers interactive visual representations and supports exploring the logs of both individual servers and the logs on infrastructure wide journal centralization servers.

      The plugin automatically detects the available journal sources, based on the journal files available in `/var/log/journal` (persistent logs) and `/run/log/journal` (volatile logs).
    visualization:
      description: |
        You can start exploring `systemd` journal logs on the "Logs" tab of the Netdata UI.
    key_features:
      description: |
        - Works on both **individual servers** and **journal centralization servers**.
        - Supports `persistent` and `volatile` journals.
        - Supports `system`, `user`, `namespaces` and `remote` journals.
        - Allows filtering on **any journal field** or **field value**, for any time-frame.
        - Allows **full text search** (`grep`) on all journal fields, for any time-frame.
        - Provides a **histogram** for log entries over time, with a breakdown per field-value, for any field and any time-frame.
        - Works directly on journal files, without any other third-party components.
        - Supports coloring log entries, the same way `journalctl` does.
        - In PLAY mode provides the same experience as `journalctl -f`, showing new log entries immediately after they are received.
  setup:
    prerequisites:
      description: |
        - A Netdata Cloud account
- id: "windows-event-logs"
  meta:
    name: "Windows Event Logs"
    link: "https://github.com/netdata/netdata/blob/master/src/collectors/windows-events.plugin/README.md"
    categories:
      - logs
    icon_filename: "windows.svg"
  keywords:
    - windows
    - windows events
    - logs
  overview:
    description: |
      The Windows Events plugin lets you view, explore and analyze Windows events from the Netdata dashboard.

      The plugin automatically detects all the available channels and offers a list of "Event Channels".

      By default, it aggregates events from all event channels, providing a unified view of all events.
    visualization:
      description: |
        You can start exploring Windows event logs on the "Logs" tab of the Netdata UI.
    key_features:
      description: |
        - Supports **Windows Event Logs (WEL)**.
        - Supports **Event Tracing for Windows (ETW)** and **TraceLogging (TL)**, when events are routed to Event Log.
        - Allows filtering on all System Events fields.
        - Allows **full text search** (`grep`) on all System and User fields.
        - Provides a **histogram** for log entries over time, with a breakdown per field-value, for any System Event field and any
          time-frame.
        - Supports coloring log entries based on severity.
        - In PLAY mode it "tails" all the Events, showing new log entries immediately after they are received.
  setup:
    prerequisites:
      description: |
        - Netdata Cloud paid subscription
- id: "macos-unified-logs"
  meta:
    name: "macOS Unified Logs"
    link: "https://github.com/netdata/netdata/blob/master/src/collectors/macos-logs.plugin/README.md"
    categories:
      - logs
    icon_filename: "macos.svg"
  keywords:
    - macos
    - macos logs
    - unified logs
    - oslog
    - logs
  overview:
    description: |
      The macOS Logs plugin lets you view, explore and analyze the macOS unified log from the Netdata dashboard.

      It queries Apple's native OSLog framework directly and does not invoke `log show`, `log stream`, or other external log-query commands during normal query execution.

      The plugin exposes the local macOS unified log store as a structured, searchable Logs tab source.
    visualization:
      description: |
        You can start exploring macOS unified logs on the "Logs" tab of the Netdata UI.
    key_features:
      description: |
        - Supports the native **macOS unified log** store.
        - Uses Apple's public **OSLog** framework.
        - Allows filtering on macOS log fields for any selected time frame.
        - Allows full-text search across collected log fields.
        - Provides a histogram for log entries over time, with a breakdown per field-value.
        - Supports severity coloring based on the OSLog level.
        - Supports PLAY mode through repeated bounded native queries, without running `log stream`.
  setup:
    prerequisites:
      description: |
        - macOS with the OSLog framework available
        - Access to the local unified log store; Apple's OSLog API requires elevated privileges for local system logs, so Netdata installs `macos-logs.plugin` as a root-owned setuid Function plugin
        - A Netdata Cloud account
- id: "logs-opentelemetry"
  meta:
    name: "OpenTelemetry Logs"
    link: "https://github.com/netdata/netdata/blob/master/src/crates/otel-plugin/README.md"
    categories:
      - logs
    icon_filename: "opentelemetry.svg"
  keywords:
    - opentelemetry
    - otel
    - otlp
    - logs
  overview:
    description: |
      The OpenTelemetry plugin lets you view, explore and analyze OpenTelemetry logs from the Netdata dashboard.

      It receives OTLP-formatted log data and indexes it for fast querying. The logs are explored from the "Logs" tab of the Netdata UI, using the same exploration interface used for systemd journal logs.

      Follow [Ingest OpenTelemetry Metrics and Logs](/docs/opentelemetry/otlp-ingestion.md) for a maintained Collector configuration and end-to-end verification steps.
    visualization:
      description: |
        You can start exploring OpenTelemetry logs on the "Logs" tab of the Netdata UI.
    key_features:
      description: |
        - Views logs ingested via **OpenTelemetry OTLP/gRPC** protocol.
        - Allows filtering on **any log field** or **field value**, for any time-frame.
        - Allows **full text search** (`grep`) on all log fields, for any time-frame.
        - Provides a **histogram** for log entries over time, with a breakdown per field-value, for any field and any time-frame.
        - Uses **fast indexed lookups** with pre-built indexes for performance.
        - Supports **faceted search** across log fields (severity, hostname, service, etc.).
        - In PLAY mode shows new log entries immediately after they are received.
        - Uses `service.namespace` and `service.name` resource attributes to identify log streams.
  setup:
    prerequisites:
      description: |
        - A Netdata Cloud account (the `otel-logs` view is access-gated and requires a Netdata Cloud sign-in).
        - The `otel.plugin` enabled, with its OTLP/gRPC endpoint configured in `otel.yaml` (see the [plugin reference](/src/crates/otel-plugin/README.md)).
        - An OpenTelemetry exporter (an OTel Collector or an SDK) pointed at that endpoint to send OTLP logs.
