---
# Upload the kickstart script to the repo servers and R2
name: Upload Kickstart Script
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/kickstart-upload.yml
      - packaging/installer/kickstart.sh
  workflow_dispatch: null
concurrency:
  group: kickstart-upload
  cancel-in-progress: true
jobs:
  upload:
    name: Upload Kickstart Script
    runs-on: ubuntu-latest
    if: github.repository == 'netdata/netdata'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: SSH setup
        id: ssh-setup
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.NETDATABOT_PACKAGES_SSH_KEY }}
          name: id_ecdsa
          known_hosts: ${{ secrets.PACKAGES_KNOWN_HOSTS }}
      - name: Upload to packages.netdata.cloud
        id: upload-primary
        continue-on-error: true
        run: rsync -vp packaging/installer/kickstart.sh netdatabot@packages.netdata.cloud:/home/netdatabot/incoming/kickstart.sh
      - name: Upload to packages2.netdata.cloud
        id: upload-packages2
        run: rsync -vp packaging/installer/kickstart.sh netdatabot@packages2.netdata.cloud:/home/netdatabot/incoming/kickstart.sh
      - name: Install Rclone
        id: install-rclone
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          sudo apt-get update || exit 1
          sudo apt-get install -y rclone || exit 1
      - name: Upload to R2
        id: upload-r2
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          RCLONE_CONFIG_S3_TYPE: "s3"
          RCLONE_CONFIG_S3_PROVIDER: "Cloudflare"
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: "${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}"
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: "${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}"
          RCLONE_CONFIG_S3_ENDPOINT: "${{ secrets.CLOUDFLARE_R2_RELEASE_ENDPOINT }}"
          RCLONE_CONFIG_S3_REGION: "auto"
        run: |
          rclone copy --verbose --fast-list --use-server-modtime --header-upload "Cache-Control: no-transform" --include '/kickstart.sh' packaging/installer/ s3:netdata-agent-repository/
      - name: Failure Notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: 'danger'
          SLACK_ICON_EMOJI: ':github-actions:'
          SLACK_TITLE: 'Kickstart upload failed:'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_MESSAGE: |-
              ${{ github.repository }}: Failed to upload updated kickstart script to repo servers and R2.
              Checkout: ${{ steps.checkout.outcome }}
              Import SSH Key: ${{ steps.ssh-setup.outcome }}
              Upload to packages.netdata.cloud: ${{ steps.upload-primary.outcome }}
              Upload to packages2.netdata.cloud: ${{ steps.upload-packages2.outcome }}
              Install Rclone: ${{ steps.install-rclone.outcome }}
              Upload to R2: ${{ steps.upload-r2.outcome }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: >-
          ${{
            failure()
            && startsWith(github.ref, 'refs/heads/master')
            && github.repository == 'netdata/netdata'
          }}
