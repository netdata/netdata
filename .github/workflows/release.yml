---
# Workflow for triggering a release.
name: Release
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Dispatch runs build and validate, then push to the appropriate storage location.
    inputs:
      type:
        description: Build Type (nightly, major, minor, patch, release-candidate)
        default: nightly
        required: true
      version:
        description: Version Tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.0-rcX)
        default: nightly
        required: true
concurrency: # Serialize tag/branch validation and publication across dispatch refs.
  group: release
  cancel-in-progress: false
jobs:
  update-changelogs:
    name: Update changelog
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      version: ${{ steps.target.outputs.version }}
      type: ${{ steps.target.outputs.type }}
      run: ${{ steps.target.outputs.run }}
      channel: ${{ steps.target.outputs.channel }}
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.NETDATABOT_GITHUB_TOKEN }}
      - name: Prepare base ref
        id: target
        env:
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TYPE: ${{ github.event.inputs.type }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TEST: ${{ secrets.NETDATA_RELEASE_TEST }}
        run: |
          .github/scripts/prepare-release-base.sh \
              "${RELEASE_REPO}" "${RELEASE_EVENT}" "${RELEASE_TYPE}" "${RELEASE_VERSION}" "${RELEASE_TEST}"
      - name: Set up git-cliff
        id: setup-git-cliff
        if: steps.target.outputs.run == 'true'
        uses: kenji-miyake/setup-git-cliff@2778609c643a39a2576c4bae2e493b855eb4aee8 # v2.0.1
      - name: Generate Release Changelog
        id: release-changelog
        if: steps.target.outputs.run == 'true'
        run: packaging/generate-changelog.sh
      - name: Commit Changes
        id: commit
        if: steps.target.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.NETDATABOT_GITHUB_TOKEN }}
          RELEASE_MESSAGE: ${{ steps.target.outputs.message }}
          RELEASE_TYPE: ${{ steps.target.outputs.type }}
          RELEASE_TAG: ${{ steps.target.outputs.ref }}
          RELEASE_BRANCH: ${{ steps.target.outputs.branch }}
          RELEASE_NEW_BRANCH: ${{ steps.target.outputs.new-branch }}
        run: |
          git config user.name "netdatabot"
          git config user.email "bot@netdata.cloud"
          git add packaging/version CHANGELOG.md
          git commit -m "[ci skip] ${RELEASE_MESSAGE}"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          set -- "${RELEASE_BRANCH}"
          if [ "${RELEASE_TYPE}" != "nightly" ]; then
            git tag -a "${RELEASE_TAG}" -m "${RELEASE_MESSAGE}"
            set -- "$@" "refs/tags/${RELEASE_TAG}"
          fi
          if [ -n "${RELEASE_NEW_BRANCH}" ]; then
            git branch "${RELEASE_NEW_BRANCH}"
            set -- "$@" "${RELEASE_NEW_BRANCH}"
          fi
          git push --atomic origin "$@"
      - name: Failure Notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: 'danger'
          SLACK_FOOTER: ''
          SLACK_ICON_EMOJI: ':github-actions:'
          SLACK_TITLE: 'Failed to prepare changelog:'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_MESSAGE: |-
              ${{ github.repository }}: Failed to prepare changelog.
              Checkout: ${{ steps.checkout.outcome }}
              Prepare base ref: ${{ steps.target.outcome }}
              Setup git-cliff: ${{ steps.setup-git-cliff.outcome }}
              Generate changelog: ${{ steps.release-changelog.outcome }}
              Commit changes: ${{ steps.commit.outcome }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: failure()

  runtime-companion:
    needs: update-changelogs
    if: needs.update-changelogs.outputs.run == 'true'
    uses: ./.github/workflows/dem-runtime-release.yml
    with:
      source_sha: ${{ needs.update-changelogs.outputs.source_sha }}
      channel: ${{ needs.update-changelogs.outputs.channel }}
      publish: true
    secrets: inherit

  trigger-artifacts:
    name: Trigger artifact builds
    runs-on: ubuntu-latest
    needs: [update-changelogs, runtime-companion]
    if: needs.update-changelogs.outputs.run == 'true'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update-changelogs.outputs.source_sha }}
      - name: Trigger build
        id: trigger
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          token: ${{ secrets.NETDATABOT_GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          workflow: build.yml
          ref: ${{ needs.update-changelogs.outputs.ref }}
          inputs: '{"version": "${{ needs.update-changelogs.outputs.version }}", "type": "${{ needs.update-changelogs.outputs.type }}", "source_sha": "${{ needs.update-changelogs.outputs.source_sha }}", "companion_run_id": "${{ needs.runtime-companion.outputs.run_id }}"}'
      - name: Failure Notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: 'danger'
          SLACK_FOOTER: ''
          SLACK_ICON_EMOJI: ':github-actions:'
          SLACK_TITLE: 'Failed to trigger ${{ needs.update-changelogs.outputs.type }} artifact builds:'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_MESSAGE: |-
              ${{ github.repository }}: Failed to trigger ${{ needs.update-changelogs.outputs.type }} artifact builds.
              Checkout: ${{ steps.checkout.outcome }}
              Trigger build: ${{ steps.trigger.outcome }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: failure()

  trigger-docker:
    name: Trigger docker builds
    runs-on: ubuntu-latest
    needs: [update-changelogs, runtime-companion]
    if: needs.update-changelogs.outputs.run == 'true'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update-changelogs.outputs.source_sha }}
      - name: Trigger build
        id: trigger
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          token: ${{ secrets.NETDATABOT_GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          workflow: docker.yml
          ref: ${{ needs.update-changelogs.outputs.ref }}
          inputs: '{"version": "${{ needs.update-changelogs.outputs.version }}", "source_sha": "${{ needs.update-changelogs.outputs.source_sha }}", "companion_run_id": "${{ needs.runtime-companion.outputs.run_id }}"}'
      - name: Failure Notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: 'danger'
          SLACK_FOOTER: ''
          SLACK_ICON_EMOJI: ':github-actions:'
          SLACK_TITLE: 'Failed to trigger ${{ needs.update-changelogs.outputs.type }} Docker builds:'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_MESSAGE: |-
              ${{ github.repository }}: Failed to trigger ${{ needs.update-changelogs.outputs.type }} Docker builds.
              Checkout: ${{ steps.checkout.outcome }}
              Trigger build: ${{ steps.trigger.outcome }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: failure()

  trigger-packages:
    name: Trigger package builds
    runs-on: ubuntu-latest
    needs: [update-changelogs, runtime-companion]
    if: needs.update-changelogs.outputs.run == 'true'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update-changelogs.outputs.source_sha }}
      - name: Trigger build
        id: trigger
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          token: ${{ secrets.NETDATABOT_GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          workflow: packaging.yml
          ref: ${{ needs.update-changelogs.outputs.ref }}
          inputs: '{"version": "${{ needs.update-changelogs.outputs.version }}", "type": "${{ needs.update-changelogs.outputs.type }}", "source_sha": "${{ needs.update-changelogs.outputs.source_sha }}", "companion_run_id": "${{ needs.runtime-companion.outputs.run_id }}"}'
      - name: Failure Notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: 'danger'
          SLACK_FOOTER: ''
          SLACK_ICON_EMOJI: ':github-actions:'
          SLACK_TITLE: 'Failed to trigger ${{ needs.update-changelogs.outputs.type }} package builds:'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_MESSAGE: |-
              ${{ github.repository }}: Failed to trigger ${{ needs.update-changelogs.outputs.type }} package builds.
              Checkout: ${{ steps.checkout.outcome }}
              Trigger build: ${{ steps.trigger.outcome }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: failure()
