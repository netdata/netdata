---
# Ci code for building release artifacts.
name: Go Tests
on:
  push: # Master branch checks only validate the build and generate artifacts for testing.
    branches:
      - master
  pull_request: null # PR checks only validate the build and generate artifacts for testing.
concurrency: # This keeps multiple instances of the job from running concurrently for the same ref and event type.
  group: go-test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  file-check: # Check what files changed if we’re being run in a PR or on a push.
    name: Check Modified Files
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check-run.outputs.run }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check files
        id: check-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          since_last_remote_commit: ${{ github.event_name != 'pull_request' }}
          files: |
            **/*.cmake
            CMakeLists.txt
            **/CMakeLists.txt
            .github/workflows/go-tests.yml
            .github/scripts/get-go-version.py
            .github/scripts/normalize-go-test-json.py
            .github/scripts/summarize-go-test-json.py
            .github/scripts/test-go-test-timings.py
            .github/scripts/test-go-build-matrix.py
            packaging/cmake/
            src/go/**
            src/health/notifications/alarm-notify/**
            src/collectors/cgroups.plugin/cgroup-name/**
            src/collectors/ebpf.plugin/ebpfgo.plugin/**
            src/web/mcp/bridges/stdio-golang/**
          files_ignore: |
            **/*.md
            src/go/**/metadata.yaml
            src/collectors/ebpf.plugin/ebpfgo.plugin/metadata.yaml
            packaging/repoconfig/
      - name: List all changed files in pattern
        continue-on-error: true
        env:
          ALL_CHANGED_FILES: ${{ steps.check-files.outputs.all_changed_files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done
      - name: Check Run
        id: check-run
        run: |
          if [ "${{ steps.check-files.outputs.any_modified }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'run=false' >> "${GITHUB_OUTPUT}"
          fi

  matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-version.outputs.matrix }}
      build_matrix: ${{ steps.get-version.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Go build matrix
        run: python3 .github/scripts/test-go-build-matrix.py
      - name: Test Go test timing reports
        run: python3 .github/scripts/test-go-test-timings.py
      - name: Get Go version and modules
        id: get-version
        run: .github/scripts/get-go-version.py

  tests:
    name: Go toolchain tests (${{ matrix.module }})
    if: needs.file-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    needs:
      - file-check
      - matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Go
        id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.version }}
          cache: false
      # Share module downloads; isolate native/race, tagged and cross-target compiled outputs.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
          key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.module }}-${{ hashFiles(format('{0}/go.mod', matrix.module), format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.module }}-
      - name: Cache Go build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.module }}-native-race-${{ hashFiles(format('{0}/go.mod', matrix.module), format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.module }}-native-race-
      - name: Go mod download
        run: go mod download
        working-directory: ${{ matrix.module }}
      - name: Install CGO system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
      - name: Compile
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<< "${TARGETS}"
          mkdir -p "${RUNNER_TEMP}/go-test-build"
          CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/go-test-build/" "${targets[@]}"
        working-directory: ${{ matrix.module }}
      - name: Go fmt
        run: |
          go fmt ./... | tee modified-files
          [ "$(wc -l modified-files | cut -f 1 -d ' ')" -eq 0 ] || exit 1
        working-directory: ${{ matrix.module }}
      # Re-enable after the Go 1.27 go fix source migration is applied and reviewed.
      # - name: Go fix
      #   run: |
      #     go fix ./...
      #     git diff --exit-code
      #   working-directory: ${{ matrix.module }}
      - name: Go vet
        run: |
          CGO_ENABLED=0 go vet -tests=false ./...
        working-directory: ${{ matrix.module }}
      - name: Set up gotestfmt
        uses: GoTestTools/gotestfmt-action@eba2ac97f623e866e7b1b117c99f18b43cd36d18 # v2.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.2.0
      - name: Go test
        id: go-test
        run: |
          set -euo pipefail
          # The race detector requires CGO; explicitly enable it to avoid go emitting
          # non-JSON diagnostics that crash gotestfmt when CGO is disabled upstream.
          # Some toolchain output still lacks package metadata, so normalize the stream
          # before passing it to gotestfmt.
          CGO_ENABLED=1 go test -json ./... -race -count=1 2>&1 \
            | tee "${RUNNER_TEMP}/go-test.jsonl" \
            | "$GITHUB_WORKSPACE/.github/scripts/normalize-go-test-json.py" \
            | gotestfmt -hide all
        working-directory: ${{ matrix.module }}
      - name: Summarize Go test timings
        if: ${{ !cancelled() && (steps.go-test.outcome == 'success' || steps.go-test.outcome == 'failure') }}
        env:
          SUITE: ${{ matrix.module }}
        run: |
          python3 .github/scripts/summarize-go-test-json.py "${RUNNER_TEMP}/go-test.jsonl" --label "$SUITE" \
            > "${RUNNER_TEMP}/go-test-timings.md"
          cat "${RUNNER_TEMP}/go-test-timings.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Go test timings
        if: ${{ !cancelled() && (steps.go-test.outcome == 'success' || steps.go-test.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-timings-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/go-test.jsonl
            ${{ runner.temp }}/go-test-timings.md
          if-no-files-found: error
          retention-days: 7

  ebpf-libbpf-tests:
    name: Go ebpf libbpf-tagged tests
    if: needs.file-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    needs:
      - file-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Go
        id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/collectors/ebpf.plugin/ebpfgo.plugin/go.mod
          cache: false
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
          key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-src/collectors/ebpf.plugin/ebpfgo.plugin-${{ hashFiles('src/collectors/ebpf.plugin/ebpfgo.plugin/go.mod', 'src/collectors/ebpf.plugin/ebpfgo.plugin/go.sum') }}
          restore-keys: |
            go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-src/collectors/ebpf.plugin/ebpfgo.plugin-
      - name: Cache Go build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-src/collectors/ebpf.plugin/ebpfgo.plugin-libbpf-race-${{ hashFiles('src/collectors/ebpf.plugin/ebpfgo.plugin/go.mod', 'src/collectors/ebpf.plugin/ebpfgo.plugin/go.sum') }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-src/collectors/ebpf.plugin/ebpfgo.plugin-libbpf-race-
      - name: Install libbpf
        run: |
          sudo apt-get update
          # libbpf-dev and linux-headers-generic satisfy the libbpf >= 1 + linux/btf.h
          # compile-time check in cachestat_libbpf.c, and provide the libbpf the test
          # binaries link against.  libelf-dev and zlib1g-dev are libbpf's own link
          # dependencies, installed explicitly instead of relying on transitive deps.
          # BPF skeleton headers (*.skel.h) are generated by `bpftool gen skeleton` from
          # compiled BPF objects, which requires a full BPF toolchain not available on
          # standard CI runners.  NETDATA_CACHESTAT_HAS_SKELETON is intentionally absent
          # here; the CO-RE load path is excluded and only the legacy kprobe path is
          # compiled and tested.
          sudo apt-get install -y libbpf-dev libelf-dev zlib1g-dev linux-headers-generic
      - name: Go mod download
        run: go mod download
        working-directory: src/collectors/ebpf.plugin/ebpfgo.plugin
      - name: Set up gotestfmt
        uses: GoTestTools/gotestfmt-action@eba2ac97f623e866e7b1b117c99f18b43cd36d18 # v2.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.2.0
      - name: Go test (libbpf tag)
        id: go-test
        env:
          # The libbpfloader package declares no `#cgo LDFLAGS`; the production build
          # passes them via CGO_LDFLAGS from CMake (EBPF_GO_CGO_LDFLAGS), pointing at the
          # vendored libbpf.  Mirror that here without the vendored -L, so the test
          # binaries link against the distro libbpf installed above.
          CGO_LDFLAGS: -lbpf -lelf -lz
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -tags 'netdata_ebpf_libbpf netdata_ebpf_test' -json ./... -race -count=1 2>&1 \
            | tee "${RUNNER_TEMP}/go-test.jsonl" \
            | "$GITHUB_WORKSPACE/.github/scripts/normalize-go-test-json.py" \
            | gotestfmt -hide all
        working-directory: src/collectors/ebpf.plugin/ebpfgo.plugin
      - name: Summarize Go test timings
        if: ${{ !cancelled() && (steps.go-test.outcome == 'success' || steps.go-test.outcome == 'failure') }}
        env:
          SUITE: ebpf libbpf-tagged tests
        run: |
          python3 .github/scripts/summarize-go-test-json.py "${RUNNER_TEMP}/go-test.jsonl" --label "$SUITE" \
            > "${RUNNER_TEMP}/go-test-timings.md"
          cat "${RUNNER_TEMP}/go-test-timings.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Go test timings
        if: ${{ !cancelled() && (steps.go-test.outcome == 'success' || steps.go-test.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-timings-ebpf-libbpf
          path: |
            ${{ runner.temp }}/go-test.jsonl
            ${{ runner.temp }}/go-test-timings.md
          if-no-files-found: error
          retention-days: 7

  build-tests:
    name: Go build tests (${{ matrix.module }}, ${{ matrix.platform }})
    if: needs.file-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    needs:
      - file-check
      - matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Go
        id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.version }}
          cache: false
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
          key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.module }}-${{ hashFiles(format('{0}/go.mod', matrix.module), format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.module }}-
      - name: Cache Go build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.module }}-build-${{ matrix.platform }}-${{ hashFiles(format('{0}/go.mod', matrix.module), format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.module }}-build-${{ matrix.platform }}-
      - name: Go mod download
        run: go mod download
        working-directory: ${{ matrix.module }}
      - name: Compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGETS: ${{ matrix.targets }}
        run: |
          : "${GOOS:?}" "${GOARCH:?}" "${TARGETS:?}"
          go env GOOS GOARCH
          read -ra targets <<< "${TARGETS}"
          mkdir -p "${RUNNER_TEMP}/go-test-build"
          CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/go-test-build/" "${targets[@]}"
        working-directory: ${{ matrix.module }}
