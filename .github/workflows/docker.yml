        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: 'danger'
          SLACK_FOOTER: ''
          SLACK_ICON_EMOJI: ':github-actions:'
          SLACK_TITLE: 'Docker build failed:'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_MESSAGE: |-
              ${{ github.repository }}: Building or testing a Docker image for ${{ matrix.platform }} failed.
              Checkout: ${{ steps.checkout.outcome }}
              Setup QEMU: ${{ steps.qemu.outcome }}
              Setup buildx: ${{ steps.prepare.outcome }}
              Build regular image: ${{ steps.build.outcome }}
              Build DEM image: ${{ steps.build-dem.outcome }}
              Test image: ${{ steps.test.outcome }}
              Upload regular image cache: ${{ steps.upload-cache.outcome }}
              Upload DEM image cache: ${{ steps.upload-dem-cache.outcome }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: >-
          ${{
            failure()
            && github.event_name != 'pull_request'
            && github.repository == 'netdata/netdata'
            && needs.file-check.outputs.run == 'true'
          }}

  gen-tags:
    name: Generate Docker Tags
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tags: ${{ steps.tag.outputs.tags }}
      nightly: ${{ steps.tag.outputs.nightly }}
      nightly_tag: ${{ steps.tag.outputs.nightly_tag }}
      dem_tags: ${{ steps.tag.outputs.dem_tags }}
      dem_nightly_tag: ${{ steps.tag.outputs.dem_nightly_tag }}
      docker_tags: ${{ steps.tag.outputs.docker_tags }}
      quay_tags: ${{ steps.tag.outputs.quay_tags }}
      ghcr_tags: ${{ steps.tag.outputs.ghcr_tags }}
      docker_repo: ${{ steps.tag.outputs.docker_repo }}
      quay_repo: ${{ steps.tag.outputs.quay_repo }}
      ghcr_repo: ${{ steps.tag.outputs.ghcr_repo }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Generate Tags
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/gen-docker-tags.py "$GITHUB_EVENT_NAME" "$VERSION"

  build-images-docker-hub:
    name: Push Images to Docker Hub
    if: >-
      ${{ !failure() && !cancelled()
          && needs.release-companion.result == 'success'
          && needs.build-images.result == 'success'
          && needs.gen-tags.result == 'success'
          && needs.matrix.result == 'success'
          && github.event_name == 'workflow_dispatch' }}
    needs:
      - release-companion
      - build-images
