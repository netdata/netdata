        env:
          REPOSITORY: ${{ needs.gen-tags.outputs.docker_repo }}
          TAGS: ${{ needs.gen-tags.outputs[format('{0}tags', matrix.variant == 'dem' && 'dem_' || '')] }}
          ARCHES: ${{ matrix.arches }}
        run: |
          read -r -a arches <<< "$ARCHES"
          arguments="$(.github/scripts/gen-docker-imagetool-args.py /tmp/digests "$REPOSITORY" "$TAGS" "${arches[@]}")"
          read -r -a args <<< "$arguments"
          docker buildx imagetools create "${args[@]}"
