        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Stamp the exact Agent release identity
        if: github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          CHANNEL: ${{ inputs.version == 'nightly' && 'nightly' || 'stable' }}
        run: |
          python3 packaging/release_info.py --channel "$CHANNEL" --source "$SOURCE_SHA"
          echo "NETDATA_BUILD_VERSION=$(sed -n 's/^version=//p' packaging/release-info)" >> "$GITHUB_ENV"
          echo "NETDATA_RELEASE_SOURCE=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Download Cache
        id: fetch-cache
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
