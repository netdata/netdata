---
# Build Docker images for CI and releases.
#
# The case of releases is unfortunately rather complicated, as Docker
# tooling does not have great support for handling of multiarch images
# published to multiple registries. As a result, we have to build the
# images, export the cache, and then _rebuild_ the images using the exported
# cache but with different output parameters for buildx. We also need to
# do the second build step as a separate job for each registry so that a
# failure to publish one place won’t break publishing elsewhere.
name: Docker
on:
  push:
    branches:
      - master
  pull_request: null
  workflow_dispatch:
    inputs:
      version:
        description: Version Tag
        default: nightly
        required: true
      source_sha:
        description: Frozen Agent commit (defaults to the dispatch commit)
        required: false
        type: string
      companion_run_id:
        description: Published companion run (omit to build and publish the paired companion)
        required: false
        type: string
env:
  DISABLE_TELEMETRY: 1
  NIGHTLY_COUNT: 4
concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  runtime-companion:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata' && !inputs.companion_run_id
    uses: ./.github/workflows/dem-runtime-release.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      channel: ${{ inputs.version == 'nightly' && 'nightly' || 'stable' }}
      publish: true
    secrets: inherit

  release-companion:
    needs: runtime-companion
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata' &&
      (needs.runtime-companion.result == 'success' || needs.runtime-companion.result == 'skipped')
    uses: ./.github/workflows/dem-runtime-companion-check.yml
    permissions:
      contents: read
      actions: read
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      companion_run_id: ${{ inputs.companion_run_id || needs.runtime-companion.outputs.run_id }}
      channel: ${{ inputs.version == 'nightly' && 'nightly' || 'stable' }}
      version: ${{ inputs.version }}

  file-check: # Check what files changed if we’re being run in a PR or on a push.
    name: Check Modified Files
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check-run.outputs.run }}
      regular: ${{ steps.check-run.outputs.regular }}
      dem: ${{ steps.check-dem.outputs.dem }}
      stock: ${{ steps.check-stock-files.outputs.any_modified }}
      skip-go: ${{ steps.check-go.outputs.skip-go }}
      docker-native: ${{ steps.check-native.outputs.docker-native }}
    steps:
      - name: Checkout
        id: checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Check source files
        id: check-source-files
        if: github.event_name != 'workflow_dispatch'
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          since_last_remote_commit: ${{ github.event_name != 'pull_request' }}
          output_renamed_files_as_deleted_and_added: true
          files: |
            **/*.c
            **/*.cc
            **/*.h
            **/*.hh
            **/*.in
            **/*.patch
            src/crates/
            src/aclk/aclk-schemas/
          files_ignore: |
            src/go/otel-collector/release-config.yaml.in
            **/*.md
      - name: Check build system files
        id: check-build-files
        if: github.event_name != 'workflow_dispatch'
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          since_last_remote_commit: ${{ github.event_name != 'pull_request' }}
          output_renamed_files_as_deleted_and_added: true
          files: |
            .dockerignore
            CMakeLists.txt
            **/CMakeLists.txt
            **/*.cmake
            netdata-installer.sh
            .github/data/distros.yml
            .github/workflows/docker.yml
            .github/scripts/docker-test.sh
            packaging/release_info.py
            packaging/cmake/
            packaging/docker/
            packaging/installer/
            packaging/runtime-check.sh
            packaging/*.version
            packaging/*.checksums
          files_ignore: |
            packaging/installer/tests/**
            **/*.md
            packaging/repoconfig/
      - name: Check Docker files
        id: check-docker-files
        if: github.event_name != 'workflow_dispatch'
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          since_last_remote_commit: ${{ github.event_name != 'pull_request' }}
          output_renamed_files_as_deleted_and_added: true
          files: |
            .dockerignore
            .github/data/distros.yml
            .github/workflows/docker.yml
            .github/scripts/docker-test.sh
            packaging/release_info.py
            packaging/docker/
            packaging/runtime-check.sh
          files_ignore: |
            **/*.md
            packaging/repoconfig/
      - name: Check complete DEM image inputs
        id: check-dem-files
        if: github.event_name != 'workflow_dispatch'
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          since_last_remote_commit: ${{ github.event_name != 'pull_request' }}
          output_renamed_files_as_deleted_and_added: true
          files: |
            .dockerignore
            CMakeLists.txt
            netdata-installer.sh
            .github/data/distros.yml
            .github/workflows/docker.yml
            .github/workflows/dem-runtime-release.yml
            .github/scripts/docker-test-dem.sh
            .github/scripts/prepare-topology-ip-intel-stock.sh
            packaging/docker/**
            packaging/dem-runtime/**
            packaging/installer/netdata-dem-runtime.sh
            packaging/cmake/Modules/NetdataPluginDem.cmake
            packaging/cmake/Modules/NetdataOptions.cmake
            packaging/cmake/Modules/NetdataGo.cmake
            packaging/cmake/Modules/NetdataGoTools.cmake
            packaging/cmake/Modules/NetdataVersion.cmake
            packaging/cmake/Modules/Packaging.cmake
            packaging/release_info.py
            packaging/version
            src/collectors/utils/nd-run.c
            src/collectors/utils/nd-process-tree.*
            src/collectors/utils/nd-file-reader.*
            src/collectors/utils/supervisor-pipes.h
            src/collectors/utils/exec-signals.h
            src/dem-runtime/**
            src/health/health.d/dem.conf
            src/go/cmd/demplugin/**
            src/go/plugin/agent/jobmgr/**
            src/go/plugin/dem/**
            src/go/plugin/framework/collectorapi/**
            src/go/plugin/go.d/pkg/ndexec/**
            src/go/pkg/buildinfo/**
            src/go/pkg/multipath/**
            src/go/pkg/pluginconfig/**
            src/go/pkg/safefile/**
            src/go/tools/dem-runtime-release/**
            src/go/tools/topology-ip-intel-downloader/**
            src/go/go.mod
            src/go/go.sum
          files_ignore: |
            **/*.md
            **/metadata.yaml
            **/test*.py
            **/*_test.go
            **/testdata/**
            **/tests/**
            packaging/dem-runtime/rclone.json
      - name: Check shipped GeoIP attribution
        id: check-stock-files
        if: github.event_name != 'workflow_dispatch'
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          since_last_remote_commit: ${{ github.event_name != 'pull_request' }}
          output_renamed_files_as_deleted_and_added: true
          files: src/go/tools/topology-ip-intel-downloader/stock/README.md
      - name: Select DEM images
        id: check-dem
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata' }}
          CHANGED: ${{ steps.check-dem-files.outputs.any_modified }}
        run: |
          if [ "$RELEASE" = true ] || [ "$CHANGED" = true ]; then
            echo 'dem=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dem=false' >> "$GITHUB_OUTPUT"
          fi
      - name: List all changed files in pattern
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch'
        env:
          CHANGED_SOURCE_FILES: ${{ steps.check-source-files.outputs.all_changed_files }}
          CHANGED_BUILD_FILES: ${{ steps.check-build-files.outputs.all_changed_files }}
        run: |
          for file in ${CHANGED_SOURCE_FILES} ${CHANGED_BUILD_FILES} ; do
            echo "$file was changed"
          done
      - name: Check Run
        id: check-run
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
          SOURCE_CHANGED: ${{ steps.check-source-files.outputs.any_modified }}
          BUILD_CHANGED: ${{ steps.check-build-files.outputs.any_modified }}
          DEM: ${{ steps.check-dem.outputs.dem }}
        run: |
          regular=false
          if [ "$SOURCE_CHANGED" == true ] || [ "$BUILD_CHANGED" == true ] || [ "$RELEASE" == true ]; then
            regular=true
          fi
          echo "regular=$regular" >> "$GITHUB_OUTPUT"
          if [ "$regular" == true ] || [ "$DEM" == true ]; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'run=false' >> "${GITHUB_OUTPUT}"
          fi
      - name: Check Go
        id: check-go
        run: |
          if [ '${{ github.event_name }}' == 'pull_request' ]; then
            if [ "${{ steps.check-build-files.outputs.any_modified }}" == "true" ] || [ "${{ steps.check-dem.outputs.dem }}" == "true" ]; then
              echo 'skip-go=' >> "${GITHUB_OUTPUT}"
            else
              echo 'skip-go=--disable-go' >> "${GITHUB_OUTPUT}"
            fi
          else
            echo 'skip-go=' >> "${GITHUB_OUTPUT}"
          fi
      - name: Check Native
        id: check-native
        run: |
          if [ '${{ github.event_name }}' == 'pull_request' ]; then
            if [ "${{ steps.check-docker-files.outputs.any_modified }}" == "true" ] || [ "${{ !contains(github.event.pull_request.labels.*.name, 'run-ci/non-native') }}" = "true" ]; then
              echo 'docker-native=1' >> "${GITHUB_OUTPUT}"
            else
              echo 'docker-native=0' >> "${GITHUB_OUTPUT}"
            fi
          else
            echo 'docker-native=0' >> "${GITHUB_OUTPUT}"
          fi

  matrix:
    name: Generate Docker Build Matrix
    runs-on: ubuntu-latest
    needs:
      - file-check
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      publish: ${{ steps.set-matrix.outputs.publish }}
      dem: ${{ steps.set-matrix.outputs.dem }}
      test: ${{ steps.set-matrix.outputs.test }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Prepare tools
        id: prepare
        run: |
          sudo apt-get update || true
          sudo apt-get install -y python3-ruamel.yaml
      - name: Read build matrix
        id: set-matrix
        run: |
          matrix="$(.github/scripts/gen-matrix-docker.py "${{ needs.file-check.outputs.docker-native }}" "${{ needs.file-check.outputs.dem }}" "${{ needs.file-check.outputs.regular }}")"
          echo "matrix=$(jq -c '.build' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "publish=$(jq -c '.publish' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "test=$(jq -c '.test' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "dem=$(jq -c '{include: [.build.include[] | select(.variant == "dem")]}' <<< "$matrix")" >> "$GITHUB_OUTPUT"
      - name: Test Docker matrix, tag and manifest behavior
        run: |
          python3 .github/scripts/test-gen-docker-tags.py -v
          python3 -m unittest discover -s .github/scripts/tests -p test_docker_variants.py -v
      - name: Failure Notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: 'danger'
          SLACK_FOOTER: ''
          SLACK_ICON_EMOJI: ':github-actions:'
          SLACK_TITLE: 'Docker build matrix preparation failed:'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_MESSAGE: |-
              ${{ github.repository }}: Failed to prepare build matrix for build checks.
              Checkout: ${{ steps.checkout.outcome }}
              Prepare tools: ${{ steps.prepare.outcome }}
              Read build matrix: ${{ steps.set-matrix.outcome }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: >-
          ${{
            failure()
            && startsWith(github.ref, 'refs/heads/master')
            && github.event_name != 'pull_request'
            && github.repository == 'netdata/netdata'
          }}

  candidate-companion:
    needs: file-check
    if: github.event_name != 'workflow_dispatch' && needs.file-check.outputs.dem == 'true'
    uses: ./.github/workflows/dem-runtime-release.yml
    with:
      source_sha: ${{ github.sha }}
      channel: devel
      publish: false

  prepare-dem-inputs:
    name: Prepare authenticated ${{ matrix.arch }} DEM image inputs
    needs: [file-check, matrix, release-companion, candidate-companion]
    if: >-
      !cancelled() && needs.file-check.outputs.dem == 'true' && needs.matrix.result == 'success' &&
      (needs.release-companion.result == 'success' || needs.candidate-companion.result == 'success')
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.dem) }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      CHANNEL: ${{ github.event_name != 'workflow_dispatch' && 'devel' || (inputs.version == 'nightly' && 'nightly' || 'stable') }}
      DEM_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum
      - name: Download the exact companion artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dem-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/dem-runtime
          run-id: ${{ needs.release-companion.outputs.run_id || needs.candidate-companion.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download the verified publication receipt
        if: needs.release-companion.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dem-runtime-publication-receipt
          path: ${{ runner.temp }}/companion-receipt
          run-id: ${{ needs.release-companion.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download the qualified candidate proof
        if: needs.candidate-companion.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dem-runtime-candidate-proof-${{ matrix.arch }}
          path: ${{ runner.temp }}/candidate-proof
          run-id: ${{ needs.candidate-companion.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare the offline preload context
        env:
          PUBLISHED: ${{ needs.release-companion.result == 'success' }}
        run: |
          set -euo pipefail
          python3 packaging/release_info.py --channel "$CHANNEL" --source "$SOURCE_SHA"
          (cd src/go && go build -trimpath -o "$RUNNER_TEMP/dem-runtime-release" ./tools/dem-runtime-release)
          version="$(sed -n 's/^version=//p' packaging/release-info)"
          artifact="$RUNNER_TEMP/dem-runtime"
          keyring="$RUNNER_TEMP/release-public.gpg"
          descriptor="$RUNNER_TEMP/release.json"
          if [ "$PUBLISHED" = true ]; then
            python3 packaging/dem-runtime/release.py fetch-public-key --output "$keyring"
            curl --disable --fail --silent --show-error --proto '=https' --retry 3 \
              --output "$descriptor" "https://artifacts.netdata.cloud/dem-runtime/$CHANNEL/$version/$DEM_ARCH/release.json"
            trust=(--receipt "$RUNNER_TEMP/companion-receipt")
          else
            keyring="$RUNNER_TEMP/candidate-proof/smoke-public.gpg"
            descriptor="$RUNNER_TEMP/candidate-proof/smoke-release.json"
            trust=(--candidate)
          fi
          python3 packaging/dem-runtime/ci.py prepare-docker --artifacts "$artifact" --arch "$DEM_ARCH" \
            --release-info packaging/release-info "${trust[@]}" --release "$descriptor" \
            --public-key "$keyring" --release-tool "$RUNNER_TEMP/dem-runtime-release" \
            --output "$RUNNER_TEMP/docker-dem-inputs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-dem-inputs-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-dem-inputs/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  prepare-dem-stock:
    name: Prepare shared DEM GeoIP stock
    needs: file-check
    if: needs.file-check.outputs.dem == 'true' || needs.file-check.outputs.stock == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum
      - name: Produce the stock data once for both DEM architectures
        env:
          STOCK_MODE: ${{ github.event_name == 'workflow_dispatch' && 'release' || 'synthetic' }}
        run: |
          .github/scripts/prepare-topology-ip-intel-stock.sh --mode "$STOCK_MODE" --output-dir "$RUNNER_TEMP/topology-ip-intel"
          test -s "$RUNNER_TEMP/topology-ip-intel/README.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.file-check.outputs.dem == 'true'
        with:
          name: docker-dem-stock
          path: ${{ runner.temp }}/topology-ip-intel/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  build-images:
    name: Build Docker Images
    needs:
      - file-check
      - matrix
      - prepare-dem-inputs
      - prepare-dem-stock
    if: >-
      !cancelled() && needs.matrix.result == 'success' &&
      (needs.file-check.outputs.dem != 'true' ||
        (needs.prepare-dem-inputs.result == 'success' && needs.prepare-dem-stock.result == 'success'))
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.test) }}
      fail-fast: false
    steps:
      - name: Skip Check
        id: skip
        if: needs.file-check.outputs.run != 'true'
        run: echo "SKIPPED"
      - name: Checkout
        id: checkout
        if: needs.file-check.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Stamp the exact Agent release identity
        if: matrix.dem || (github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata')
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          CHANNEL: ${{ github.event_name != 'workflow_dispatch' && 'devel' || (inputs.version == 'nightly' && 'nightly' || 'stable') }}
        run: |
          python3 packaging/release_info.py --channel "$CHANNEL" --source "$SOURCE_SHA"
          echo "NETDATA_BUILD_VERSION=$(sed -n 's/^version=//p' packaging/release-info)" >> "$GITHUB_ENV"
          echo "NETDATA_RELEASE_SOURCE=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "NETDATA_RELEASE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
      - name: Set common image build arguments
        id: build-args
        if: needs.file-check.outputs.run == 'true'
        env:
          EXTRA_INSTALL_OPTS: ${{ needs.file-check.outputs.skip-go }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: |
          {
            echo 'args<<EOF'
            echo "EXTRA_INSTALL_OPTS=$EXTRA_INSTALL_OPTS"
            echo "BUILD_ARCH=$BUILD_ARCH"
            echo "RELEASE_CHANNEL=${NETDATA_RELEASE_CHANNEL:-nightly}"
            echo "RELEASE_SOURCE=${NETDATA_RELEASE_SOURCE:-}"
            echo "BUILD_VERSION=${NETDATA_BUILD_VERSION:-test}"
            echo "BUILD_DATE=$BUILD_DATE"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Setup QEMU
        id: qemu
        if: matrix.qemu && needs.file-check.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y qemu-user-static
      - name: Setup Buildx
        id: prepare
        if: needs.file-check.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build regular image
        id: build
        if: needs.file-check.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: regular
          platforms: ${{ matrix.platform }}
          tags: netdata/netdata:test
          load: true
          cache-to: ${{ github.repository == 'netdata/netdata' && github.event_name == 'workflow_dispatch' && 'type=local,dest=/tmp/build-cache-regular,mode=max' || '' }}
          build-args: ${{ steps.build-args.outputs.args }}
      - name: Check regular image inventory
        if: needs.file-check.outputs.run == 'true'
        run: |
          docker run --rm --network none --entrypoint /bin/sh netdata/netdata:test -ec '
            test -x /usr/sbin/netdata
            test -x /usr/libexec/netdata/plugins.d/apps.plugin
            test ! -e /usr/libexec/netdata/plugins.d/dem.plugin
            test ! -e /usr/libexec/netdata/netdata-dem-runtime.sh
            test ! -e /usr/lib/netdata/conf.d/dem.conf
            test ! -e /usr/lib/netdata/conf.d/health.d/dem.conf
            test ! -e /usr/lib/netdata/conf.d/dem
            test ! -e /opt/netdata-dem-runtime'
      - name: Record regular image size
        if: needs.file-check.outputs.run == 'true'
        run: docker image inspect netdata/netdata:test --format '{{.Size}} bytes'
      - name: Upload regular image cache
        id: upload-cache
        if: github.repository == 'netdata/netdata' && needs.file-check.outputs.run == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-regular-${{ matrix.arch }}
          path: /tmp/build-cache-regular/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Download the verified DEM runtime context
        if: matrix.dem
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-dem-inputs-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-dem-inputs
      - name: Download the shared DEM GeoIP stock
        if: matrix.dem
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-dem-stock
          path: ${{ runner.temp }}/docker-dem-inputs/topology-ip-intel
      # Both targets use the same builder and build arguments, so the DEM build
      # reuses the regular image's compiled Agent and base layers.
      - name: Build complete DEM image
        id: build-dem
        if: matrix.dem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dem
          build-contexts: dem-inputs=${{ runner.temp }}/docker-dem-inputs
          platforms: ${{ matrix.platform }}
          tags: netdata/netdata:test-dem
          load: true
          cache-to: ${{ github.repository == 'netdata/netdata' && github.event_name == 'workflow_dispatch' && 'type=local,dest=/tmp/build-cache-dem,mode=max' || '' }}
          build-args: ${{ steps.build-args.outputs.args }}
      - name: Validate and qualify the native DEM image
        if: matrix.dem
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor
          .github/scripts/docker-test-dem.sh netdata/netdata:test-dem
      - name: Record DEM image size
        if: matrix.dem
        run: docker image inspect netdata/netdata:test-dem --format '{{.Size}} bytes'
      - name: Upload DEM image cache
        id: upload-dem-cache
        if: github.repository == 'netdata/netdata' && matrix.dem && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-dem-${{ matrix.arch }}
          path: /tmp/build-cache-dem/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Test regular Agent startup
        id: test
        if: needs.file-check.outputs.run == 'true' && matrix.platform == 'linux/amd64'
        run: .github/scripts/docker-test.sh
