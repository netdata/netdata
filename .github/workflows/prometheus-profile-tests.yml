---
name: Prometheus Profile Tests

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/prometheus-profile-tests.yml'
      - '.gitattributes'
      - '.agents/skills/project-prometheus-profiles/**'
      - 'src/go/**'
  pull_request: null

permissions:
  contents: read

concurrency:
  group: prometheus-profile-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  file-check:
    name: Check Modified Files
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check-run.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check files
        id: check-files
        uses: step-security/changed-files@v45
        with:
          since_last_remote_commit: ${{ github.event_name != 'pull_request' }}
          files: |
            .github/workflows/prometheus-profile-tests.yml
            .gitattributes
            .agents/skills/project-prometheus-profiles/**
            src/go/**

      - name: Check run
        id: check-run
        env:
          ANY_MODIFIED: ${{ steps.check-files.outputs.any_modified }}
        run: |
          if [[ "${ANY_MODIFIED}" == 'true' ]]; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'run=false' >> "${GITHUB_OUTPUT}"
          fi

  proof-tests:
    needs: file-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip check
        if: needs.file-check.outputs.run != 'true'
        run: echo 'No Prometheus profile proof dependencies changed.'

      - name: Checkout
        if: needs.file-check.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Go
        if: needs.file-check.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go/go.mod

      - name: Clone latest testdata master
        if: needs.file-check.outputs.run == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch master --single-branch --filter=blob:none --sparse \
            https://github.com/netdata/testdata.git src/go/testdata

          mapfile -t evidence_dirs < <(
            awk -F '\t' \
              'BEGIN {
                prefix = "src/go/testdata/prometheus/profiles/"
                suffix = "/manifest.yaml"
              }
              index($3, prefix) == 1 && substr($3, length($3) - length(suffix) + 1) == suffix {
                revision = substr($3, length(prefix) + 1, length($3) - length(prefix) - length(suffix))
                if (revision != "" && index(revision, "/") == 0) {
                  print "prometheus/profiles/" revision
                }
              }' \
              src/go/plugin/go.d/collector/prometheus/profile-proofs/*/SHA256SUMS.tsv \
              | sort -u
          )
          test "${#evidence_dirs[@]}" -gt 0
          git -C src/go/testdata sparse-checkout set "${evidence_dirs[@]}"

      - name: Verify external evidence integrity
        if: needs.file-check.outputs.run == 'true'
        env:
          NETDATA_PROMETHEUS_TESTDATA_REQUIRED: '1'
        run: |
          cd src/go
          go test -count=1 -run '^TestDefaultCatalog_StockProfileProofBundles$' \
            ./plugin/go.d/collector/prometheus/promprofiles

      - name: Verify authoring launcher
        if: needs.file-check.outputs.run == 'true'
        run: python3 .agents/skills/project-prometheus-profiles/scripts/test_validate_profile.py

      - name: Verify Prometheus profile proofs
        if: needs.file-check.outputs.run == 'true'
        env:
          NETDATA_PROMETHEUS_TESTDATA_REQUIRED: '1'
        run: |
          cd src/go
          go test -count=1 \
            ./internal/promtestdata \
            ./tools/prometheus-profile-validation \
            ./plugin/go.d/collector/prometheus/...
