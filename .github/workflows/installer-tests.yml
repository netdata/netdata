---
name: Installer tests

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/installer-tests.yml'
      - '.github/ISSUE_TEMPLATE/BUG_REPORT.yml'
      - 'packaging/installer/**'
      - 'packaging/docker/**'
      - 'packaging/makeself/**'
      - 'packaging/cmake/**'
      - 'netdata-installer.sh'
      - 'src/go/plugin/go.d/collector/snmp_topology/testdata/*.zst'
  pull_request:
    paths:
      - '.github/workflows/installer-tests.yml'
      - '.github/ISSUE_TEMPLATE/BUG_REPORT.yml'
      - 'packaging/installer/**'
      - 'packaging/docker/**'
      - 'packaging/makeself/**'
      - 'packaging/cmake/**'
      - 'netdata-installer.sh'
      - 'src/go/plugin/go.d/collector/snmp_topology/testdata/*.zst'

permissions:
  contents: read

concurrency:
  group: netdata-support-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: Support Bundle POSIX sanitization (${{ matrix.shell }}, ${{ matrix.awk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: sh
            awk: gawk
          - shell: dash
            awk: mawk
          - shell: busybox
            awk: busybox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Unix validation tools
        run: sudo apt-get update && sudo apt-get install -y busybox gawk mawk

      - name: Parse and run fixture suites
        env:
          TEST_SHELL: ${{ matrix.shell }}
          TEST_AWK: ${{ matrix.awk }}
          ND_SUPPORT_BUNDLE_DEMOTED: '1'
        run: |
          set -eu
          tools_dir="$RUNNER_TEMP/support-bundle-tools"
          mkdir -p "$tools_dir"
          ln -s "$(command -v "$TEST_AWK")" "$tools_dir/awk"
          export PATH="$tools_dir:$PATH"
          if [ "$TEST_SHELL" = busybox ]; then
            busybox sh -n packaging/installer/netdata-support-bundle
            busybox sh packaging/installer/netdata-support-bundle --selftest
            export SUPPORT_BUNDLE_TEST_SHELL="busybox sh"
          else
            "$TEST_SHELL" -n packaging/installer/netdata-support-bundle
            "$TEST_SHELL" packaging/installer/netdata-support-bundle --selftest
            export SUPPORT_BUNDLE_TEST_SHELL="$TEST_SHELL"
          fi
          python3 -m unittest discover packaging/installer/tests test_support_bundle.py -v

  posix-e2e:
    name: Support Bundle POSIX end-to-end bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate a fixture bundle
        run: |
          set -eu
          sudo install -d -m 755 /etc/netdata
          sudo sh -c 'printf "%s\n" "KEEP-NONSECRET-CONTENT" "password=SENTINEL-E2E-PASSWORD" > /etc/netdata/netdata.conf'
          sudo chmod 644 /etc/netdata/netdata.conf
          # stream.conf fixture: a UTF-8 BOM, CRLF endings and NO final newline,
          # so the encoding-preservation and streaming-api-key contracts are
          # exercised end to end (netdata/netdata#23448)
          printf '\357\273\277[stream]\r\n    enabled = yes\r\n    api key = 11111111-2222-3333-4444-555555555555\r\n    password = SENTINEL-E2E-STREAMPW\r\n[aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee]\r\n    enabled = yes' > /tmp/stream.conf
          sudo cp /tmp/stream.conf /etc/netdata/stream.conf
          sudo chmod 644 /etc/netdata/stream.conf
          sudo install -d -m 755 /var/lib/netdata/snmp/diagnostics
          sudo cp src/go/plugin/go.d/collector/snmp_topology/testdata/topology-diagnostic-archive-replay-v1.zst /var/lib/netdata/snmp/diagnostics/lifecycle.zst
          sudo chmod 644 /var/lib/netdata/snmp/diagnostics/lifecycle.zst
          fixture_dir=$(mktemp -d)
          fixture_root_bin="$fixture_dir/netdata"
          fixture_child_script="$fixture_dir/socket-child.py"
          fixture_port_file="$fixture_dir/port"
          fixture_child_pid_file="$fixture_dir/child.pid"
          cp "$(command -v bash)" "$fixture_root_bin"
          chmod 755 "$fixture_root_bin"
          printf '%s\n' \
            'import signal, socket, sys' \
            's = socket.socket(socket.AF_INET, socket.SOCK_STREAM)' \
            's.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)' \
            's.bind(("127.0.0.1", 0))' \
            's.listen(1)' \
            'open(sys.argv[1], "w").write(str(s.getsockname()[1]))' \
            'signal.pause()' > "$fixture_child_script"
          # the fixture must outlive the whole collection, however slow the
          # runner: it runs until this trap stops it, on every exit path
          fixture_root_pid=
          stop_fixture() {
            if [ -n "$fixture_root_pid" ]; then
              # children first: once the root is gone they cannot be found by parent
              pkill -TERM -P "$fixture_root_pid" 2>/dev/null || true
              kill "$fixture_root_pid" 2>/dev/null || true
              wait "$fixture_root_pid" 2>/dev/null || true
            fi
          }
          trap stop_fixture EXIT
          "$fixture_root_bin" -c 'python3 "$1" "$2" & child=$!; echo "$child" > "$3"; wait' \
            fixture-root "$fixture_child_script" "$fixture_port_file" "$fixture_child_pid_file" &
          fixture_root_pid=$!
          for _ in $(seq 1 30); do
            test -s "$fixture_child_pid_file" && break
            sleep 0.1
          done
          test -s "$fixture_child_pid_file"
          fixture_child_pid=$(cat "$fixture_child_pid_file")
          for _ in $(seq 1 30); do
            test -s "$fixture_port_file" && break
            sleep 0.1
          done
          test -s "$fixture_port_file"
          output=$(mktemp -d)
          extract=$(mktemp -d)
          printf '{"cause":"UNTRUSTED-TMP-SENTINEL"}\n' > /tmp/status-netdata.json
          sudo sh -c 'printf "fixture\n" > /var/lib/netdata/private-job-INVENTORY-SENTINEL'
          sh packaging/installer/netdata-support-bundle --timeout 3 --since 1 --include-snmp-diagnostics -o "$output"
          if ! kill -0 "$fixture_child_pid" 2>/dev/null; then
            echo "socket fixture child $fixture_child_pid exited during collection" >&2
            exit 1
          fi
          bundle=$(find "$output" -maxdepth 1 \( -name '*.tar.gz' -o -name '*.tar.zst' \) -print -quit)
          test -n "$bundle"
          tar -xaf "$bundle" -C "$extract"
          root=$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)
          if ! test -s "$root/01-system/os-release.txt"; then
            echo 'OS release fixture is missing or empty' >&2
            find "$root" -maxdepth 2 -type f -print >&2
            exit 1
          fi
          test -s "$root/08-network/resolv-conf.txt"
          test -s "$root/08-network/netdata-sockets.txt"
          if ! awk -v pid="$fixture_child_pid" '
            $2 == pid || $3 == pid || $0 ~ ("pid=" pid "([,)]|$)") { found = 1 }
            END { exit !found }
          ' "$root/08-network/netdata-sockets.txt"; then
            echo "socket fixture child PID $fixture_child_pid was not collected:" >&2
            cat "$root/08-network/netdata-sockets.txt" >&2
            exit 1
          fi
          test ! -e "$root/08-network/listening-sockets.txt"
          grep -qF 'KEEP-NONSECRET-CONTENT' "$root/04-config/netdata.conf"
          if grep -R -q 'SENTINEL-E2E-PASSWORD' "$root"; then
            echo 'planted secret survived in bundle' >&2
            exit 1
          fi
          jq -e '.schema == "netdata-support-bundle/v2" and (.files | length > 0)' "$root/MANIFEST.json"
          jq -e '.files[] | select(.path == "04-config/netdata.conf" and .bytes > 0)' "$root/MANIFEST.json"

          cmp /var/lib/netdata/snmp/diagnostics/lifecycle.zst "$root/06-state/snmp-diagnostics/lifecycle.zst"
          jq -e '.snmp_diagnostics.files == 1 and .snmp_diagnostics.status == "complete" and .secrets_redacted == false and .pii_obfuscated == false' "$root/MANIFEST.json"
          test -s "$root/09-permissions/plugins-d.txt"

          # streaming api key kept verbatim, other stream.conf secrets redacted,
          # and the source bytes (BOM + CRLF + no final newline) preserved
          sc="$root/04-config/stream.conf"
          grep -qF 'api key = 11111111-2222-3333-4444-555555555555' "$sc"
          grep -qF '[aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee]' "$sc"
          grep -q 'SENTINEL-E2E-STREAMPW' "$sc" && { echo 'a non-api-key secret survived in stream.conf' >&2; exit 1; }
          [ "$(head -c 3 "$sc" | od -An -tx1 | tr -d ' \n')" = efbbbf ] || { echo 'the UTF-8 BOM was not preserved' >&2; exit 1; }
          [ "$(tr -dc '\r' < "$sc" | wc -c)" -ge 4 ] || { echo 'CRLF line endings were not preserved' >&2; exit 1; }

          if grep -R -qE 'UNTRUSTED-TMP-SENTINEL|INVENTORY-SENTINEL' "$root"; then
            echo 'unsafe crash or state filename evidence included' >&2
            exit 1
          fi
          python3 - "$root" <<'VALIDATE'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / 'MANIFEST.json').read_text())
          rows = {row['path']: row for row in manifest['files']}
          files = {str(p.relative_to(root)) for p in root.rglob('*')
                   if p.is_file() and p.name != 'MANIFEST.json'}
          assert len(rows) == len(manifest['files']), 'duplicate manifest rows'
          assert files == set(rows), (files - set(rows), set(rows) - files)
          for path, row in rows.items():
              assert (root / path).stat().st_size == row['bytes'], path
          assert not any(p.name.endswith(('.raw', '.rc', '.san', '.tmp')) for p in root.rglob('*'))
          VALIDATE

  macos-posix:
    name: Support Bundle macOS sanitization
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse and run adversarial self-test
        env:
          ND_SUPPORT_BUNDLE_DEMOTED: '1'
        run: |
          set -eu
          sh -n packaging/installer/netdata-support-bundle
          sh packaging/installer/netdata-support-bundle --selftest
          python3 -m unittest discover packaging/installer/tests test_support_bundle.py -v

  powershell-core:
    name: Support Bundle PowerShell 7 sanitization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run adversarial self-test
        shell: pwsh
        run: ./packaging/installer/netdata-support-bundle.ps1 -SelfTest
      - name: SNMP evidence fixtures
        env:
          SUPPORT_BUNDLE_TEST_SHELL: pwsh
        run: python3 packaging/installer/tests/test_snmp_diagnostics.py -v

  windows-powershell:
    name: Support Bundle Windows PowerShell 5.1 sanitization
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run adversarial self-test
        shell: powershell
        run: .\packaging\installer\netdata-support-bundle.ps1 -SelfTest
      - name: SNMP evidence fixtures
        env:
          SUPPORT_BUNDLE_TEST_SHELL: powershell
        run: python packaging/installer/tests/test_snmp_diagnostics.py -v

      - name: Build and validate a fixture bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $confDir = 'C:\Program Files\Netdata\etc\netdata'
          [System.IO.Directory]::CreateDirectory($confDir) | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
              (Join-Path $confDir 'netdata.conf'),
              "KEEP-NONSECRET-CONTENT`npassword=SENTINEL-E2E-PASSWORD`n",
              $utf8)
          # stream.conf fixture: a UTF-8 BOM, CRLF endings and NO final newline,
          # so the encoding-preservation and streaming-api-key contracts are
          # exercised end to end (netdata/netdata#23448)
          $streamText = "[stream]`r`n    enabled = yes`r`n    api key = 11111111-2222-3333-4444-555555555555`r`n    password = SENTINEL-E2E-STREAMPW`r`n[aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee]`r`n    enabled = yes"
          [System.IO.File]::WriteAllBytes(
              (Join-Path $confDir 'stream.conf'),
              [byte[]](@(0xEF, 0xBB, 0xBF) + $utf8.GetBytes($streamText)))
          $diagDir = 'C:\Program Files\Netdata\var\lib\netdata\snmp\diagnostics'
          [System.IO.Directory]::CreateDirectory($diagDir) | Out-Null
          $diagSource = (Resolve-Path 'src/go/plugin/go.d/collector/snmp_topology/testdata/topology-diagnostic-archive-replay-v1.zst').Path
          Copy-Item $diagSource (Join-Path $diagDir 'lifecycle.zst')
          $fixtureDir = Join-Path $env:RUNNER_TEMP ('netdata-socket-fixture-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $fixtureDir -Force | Out-Null
          $fixtureChildScript = Join-Path $fixtureDir 'socket-child.ps1'
          $fixtureRootScript = Join-Path $fixtureDir 'netdata-root.ps1'
          $fixturePortFile = Join-Path $fixtureDir 'port.txt'
          $fixtureChildPidFile = Join-Path $fixtureDir 'child.pid'
          # the fixture must outlive the whole collection, however slow the
          # runner: it runs until the finally below terminates it
          @'
          param([string]$PortFile)
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $listener.LocalEndpoint.Port | Set-Content -NoNewline $PortFile
          [System.Threading.Thread]::Sleep([System.Threading.Timeout]::Infinite)
          '@ | Set-Content -Encoding UTF8 $fixtureChildScript
          @'
          $child = Start-Process -FilePath (Join-Path $PSHOME 'powershell.exe') -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $args[0], $args[1]) -PassThru
          $child.Id | Set-Content -NoNewline $args[2]
          Wait-Process -Id $child.Id
          '@ | Set-Content -Encoding UTF8 $fixtureRootScript
          $fixtureRootBin = Join-Path $fixtureDir 'netdata.exe'
          Copy-Item (Join-Path $PSHOME 'powershell.exe') $fixtureRootBin
          # returns the positive integer a fixture process writes to $path, and
          # fails fast when that process exits first
          function Wait-FixtureNumber([string]$path, [System.Diagnostics.Process]$writer) {
              $deadline = (Get-Date).AddSeconds(60)
              do {
                  $text = $null
                  try { $text = [System.IO.File]::ReadAllText($path) } catch { }
                  $number = 0
                  if ([int]::TryParse("$text", [ref]$number) -and $number -gt 0) { return $number }
                  if ($writer.HasExited) { throw "socket fixture process $($writer.Id) exited with code $($writer.ExitCode) before writing $path" }
                  Start-Sleep -Milliseconds 100
              } while ((Get-Date) -lt $deadline)
              throw "socket fixture did not write $path within 60s"
          }
          $fixtureRoot = $null
          $fixtureChild = $null
          $archive = $null
          try {
              $fixtureRoot = Start-Process -FilePath $fixtureRootBin -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $fixtureRootScript, $fixtureChildScript, $fixturePortFile, $fixtureChildPidFile) -PassThru
              # cleanup terminates through these handles, never through a PID
              # that Windows may have reused after a fixture process exited
              $null = $fixtureRoot.Handle
              $fixtureChildPid = Wait-FixtureNumber $fixtureChildPidFile $fixtureRoot
              $pinnedChild = Get-Process -Id $fixtureChildPid
              $null = $pinnedChild.Handle
              # the root holds its child's handle until it exits, so while the root
              # runs this PID cannot have been reused: the pinned process is the child
              if ($fixtureRoot.HasExited) { throw "socket fixture root exited with code $($fixtureRoot.ExitCode) before its child was pinned" }
              $fixtureChild = $pinnedChild
              $fixturePort = Wait-FixtureNumber $fixturePortFile $fixtureChild
              $output = Join-Path $env:RUNNER_TEMP ('netdata-support-bundle-e2e-' + [guid]::NewGuid())
              # default per-command timeout: the socket assertion needs its capture
              # to finish, and a Start-Job capture of CIM data can take several
              # seconds on hosted runners
              .\packaging\installer\netdata-support-bundle.ps1 -Output $output -SinceHours 1 -IncludeSnmpDiagnostics
              if ($fixtureChild.HasExited) { throw "socket fixture child exited with code $($fixtureChild.ExitCode) during collection" }
              $zip = Get-ChildItem $output -Filter '*.zip' | Select-Object -First 1
              if (-not $zip) { throw 'bundle zip was not created' }
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
              $manifestEntry = $archive.Entries | Where-Object { $_.FullName -match '(^|[\\/])MANIFEST.json$' } | Select-Object -First 1
              $configEntry = $archive.Entries | Where-Object { $_.FullName -match '(^|[\\/])04-config[\\/]netdata.conf$' } | Select-Object -First 1
              if (-not $manifestEntry -or -not $configEntry -or $configEntry.Length -eq 0) { throw 'required non-empty entries are missing' }
              $reader = New-Object System.IO.StreamReader($configEntry.Open(), $utf8, $true)
              try { $config = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if ($config -notmatch 'KEEP-NONSECRET-CONTENT' -or $config -match 'SENTINEL-E2E-PASSWORD') { throw 'config survival/redaction contract failed' }
              $manifestStream = $manifestEntry.Open()
              try {
                  $memory = New-Object System.IO.MemoryStream
                  try {
                      $manifestStream.CopyTo($memory)
                      $bytes = $memory.ToArray()
                  } finally { $memory.Dispose() }
              } finally { $manifestStream.Dispose() }
              if ($bytes.Length -ge 2 -and $bytes[0] -eq 0xff -and $bytes[1] -eq 0xfe) { throw 'MANIFEST.json is UTF-16LE' }
              $manifest = $utf8.GetString($bytes) | ConvertFrom-Json
              if ($manifest.schema -ne 'netdata-support-bundle/v2' -or $manifest.files.Count -eq 0) { throw 'manifest contract failed' }
              $socketEntry = $archive.Entries | Where-Object { $_.FullName -match '08-network[\\/]netdata-sockets[.]txt$' } | Select-Object -First 1
              if (-not $socketEntry) { throw 'Netdata socket inventory missing' }
              $socketReader = New-Object System.IO.StreamReader($socketEntry.Open(), $utf8, $true)
              try { $socketText = $socketReader.ReadToEnd() } finally { $socketReader.Dispose() }
              # the fixture's TCP row: its port as LocalPort and its PID as
              # OwningProcess, followed by ProcessName unless the table dropped it
              if ($socketText -notmatch "(?m)^TCP\s+\S+\s+$fixturePort\s.*\s$fixtureChildPid(\s+\S+)?\s*$") {
                  throw "socket fixture child PID $fixtureChildPid listening on port $fixturePort was not collected:`n$socketText"
              }

              if ($manifest.snmp_diagnostics.files -ne 1 -or $manifest.snmp_diagnostics.status -ne 'complete' -or
                  $manifest.secrets_redacted -or $manifest.pii_obfuscated) { throw 'raw SNMP manifest contract failed' }
              $diagEntry = $archive.Entries | Where-Object { $_.FullName -match '06-state[\\/]snmp-diagnostics[\\/]lifecycle.zst$' } | Select-Object -First 1
              if (-not $diagEntry) { throw 'SNMP evidence missing' }
              $diagStream = $diagEntry.Open()
              $diagMemory = New-Object System.IO.MemoryStream
              try {
                  $diagStream.CopyTo($diagMemory)
                  if ([Convert]::ToBase64String($diagMemory.ToArray()) -cne [Convert]::ToBase64String([IO.File]::ReadAllBytes($diagSource))) {
                      throw 'SNMP evidence bytes changed'
                  }
              } finally { $diagStream.Dispose(); $diagMemory.Dispose() }

              # streaming api key kept verbatim, other stream.conf secrets redacted,
              # and the source bytes (BOM + CRLF + no final newline) preserved
              $streamEntry = $archive.Entries | Where-Object { $_.FullName -match '(^|[\\/])04-config[\\/]stream.conf$' } | Select-Object -First 1
              if (-not $streamEntry) { throw 'stream.conf was not collected' }
              $ms = New-Object System.IO.MemoryStream
              $es = $streamEntry.Open()
              try { $es.CopyTo($ms) } finally { $es.Dispose() }
              $sb = $ms.ToArray(); $ms.Dispose()
              $stext = $utf8.GetString($sb)
              if ($stext -notmatch 'api key = 11111111-2222-3333-4444-555555555555') { throw 'the streaming api key was redacted' }
              if ($stext -match 'SENTINEL-E2E-STREAMPW') { throw 'a non-api-key secret survived in stream.conf' }
              if (-not ($sb.Length -ge 3 -and $sb[0] -eq 0xEF -and $sb[1] -eq 0xBB -and $sb[2] -eq 0xBF)) { throw 'the UTF-8 BOM was not preserved' }
              if (@([regex]::Matches($stext, "`r`n")).Count -lt 4) { throw 'CRLF line endings were not preserved' }
              if ($sb[$sb.Length - 1] -eq 10) { throw 'a final newline was added to a source that had none' }

              # the ETW channels are actually queried - they are where a Windows
              # agent logs by default, and querying only NetdataWEL found nothing
              $elEntry = $archive.Entries | Where-Object { $_.FullName -match '(^|[\\/])05-logs[\\/]eventlog-netdata.txt$' } | Select-Object -First 1
              if (-not $elEntry) { throw 'the event log capture is missing' }
              $er = New-Object System.IO.StreamReader($elEntry.Open(), $utf8, $true)
              try { $eltext = $er.ReadToEnd() } finally { $er.Dispose() }
              foreach ($ch in @('Netdata/Daemon', 'Netdata/Collectors', 'Netdata/Health', 'Netdata/Aclk', 'Netdata/Access', 'NetdataWEL')) {
                  if ($eltext -notmatch [regex]::Escape($ch)) { throw "the event log capture never queried $ch" }
              }
              if (-not ($archive.Entries | Where-Object { $_.FullName -match '(^|[\\/])09-permissions[\\/]plugins-d.txt$' })) {
                  throw '09-permissions/plugins-d.txt is missing'
              }
          } finally {
              # warnings only: an error thrown here would replace the original failure
              try { if ($archive) { $archive.Dispose() } } catch { Write-Warning "bundle archive: $_" }
              # root first: it exits by itself once its child is gone, which would
              # race with Kill()
              foreach ($fixtureProcess in @($fixtureRoot, $fixtureChild)) {
                  if (-not $fixtureProcess) { continue }
                  try {
                      if (-not $fixtureProcess.HasExited) { $fixtureProcess.Kill() }
                      if (-not $fixtureProcess.WaitForExit(10000)) { Write-Warning "socket fixture process $($fixtureProcess.Id) did not exit" }
                  } catch { Write-Warning "socket fixture cleanup: $_" }
              }
          }

  install-state:
    name: Install State
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run install state tests
        run:
          python3 -m unittest discover packaging/installer/tests test_install_state.py -v

  ipmi-delivery:
    name: IPMI delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install RPM packaging test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/ipmi-test-tools"
          "$RUNNER_TEMP/ipmi-test-tools/bin/pip" install 'cmake>=4.1,<5'
          echo "$RUNNER_TEMP/ipmi-test-tools/bin" >> "$GITHUB_PATH"
      - name: Run IPMI packaging and Docker tests
        run: python3 -m unittest discover packaging/installer/tests 'test_*ipmi*.py' -v

  prepare-fleet:
    name: Prepare Fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run prepare fleet tests
        run:
          python3 -m unittest discover packaging/installer/tests test_prepare_fleet.py -v

  snmp-diagnostics:
    name: SNMP diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run SNMP diagnostics tests
        run:
