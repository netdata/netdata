---
# Daily RustSec advisory scan of src/crates/Cargo.lock; posts to Slack on failure.
name: Rust Advisories
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch: null
concurrency:
  group: rust-advisories-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cargo-deny:
    name: RustSec advisories
    runs-on: ubuntu-latest
    if: github.repository == 'netdata/netdata'
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        id: install
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisories # Policy and vetted exceptions live in src/crates/deny.toml.
        id: check
        working-directory: src/crates
        run: cargo deny --locked check advisories
      - name: Failure Notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_COLOR: 'danger'
          SLACK_FOOTER: ''
          SLACK_ICON_EMOJI: ':github-actions:'
          SLACK_TITLE: 'Rust advisory scan failed:'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_MESSAGE: |-
              ${{ github.repository }}: cargo-deny found RustSec advisories in src/crates (or could not run).
              Checkout: ${{ steps.checkout.outcome }}
              Install cargo-deny: ${{ steps.install.outcome }}
              Check advisories: ${{ steps.check.outcome }}
              Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: failure()
