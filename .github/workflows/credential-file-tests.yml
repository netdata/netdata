---
name: Go Credential File Tests
on:
  pull_request:
    paths:
      - '.github/workflows/credential-file-tests.yml'
      - 'src/collectors/utils/nd-run.c'
      - 'src/collectors/utils/nd-file-reader.*'
      - 'src/collectors/utils/exec-signals.h'
      - 'src/go/pkg/credentialfile/**'
      - 'src/go/pkg/safefile/**'
      - 'src/go/pkg/web/**'
      - 'src/go/pkg/tlscfg/**'
      - 'src/go/plugin/go.d/discovery/sdext/discoverer/httpsd/**'
      - 'src/go/go.mod'
      - 'src/go/go.sum'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/credential-file-tests.yml'
      - 'src/collectors/utils/nd-run.c'
      - 'src/collectors/utils/nd-file-reader.*'
      - 'src/collectors/utils/exec-signals.h'
      - 'src/go/pkg/credentialfile/**'
      - 'src/go/pkg/safefile/**'
      - 'src/go/pkg/web/**'
      - 'src/go/pkg/tlscfg/**'
      - 'src/go/plugin/go.d/discovery/sdext/discoverer/httpsd/**'
      - 'src/go/go.mod'
      - 'src/go/go.sum'
permissions:
  contents: read
concurrency:
  group: credential-file-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum
      - name: Build the actual one-shot helper
        shell: bash
        run: |
          set -euxo pipefail
          helper_dir="$(mktemp -d /tmp/netdata-credentialfile-ci.XXXXXX)"
          cat > "$helper_dir/config.h" <<'EOF'
          #define _GNU_SOURCE 1
          #define NETDATA_USER "nobody"
          #ifdef __linux__
          #define HAVE_SETRESUID 1
          #define HAVE_SETRESGID 1
          #endif
          EOF
          cc -std=gnu11 -Wall -Wextra -Werror -g \
            -I "$helper_dir" -I src/collectors/utils \
            src/collectors/utils/nd-run.c src/collectors/utils/nd-file-reader.c \
            -o "$helper_dir/nd-run"
          echo "NETDATA_TEST_ND_RUN=$helper_dir/nd-run" >> "$GITHUB_ENV"
      - name: Go client and HTTP integration tests
        working-directory: src/go
        run: |
          go test -race -count=1 ./pkg/credentialfile ./pkg/web ./pkg/tlscfg \
            ./plugin/go.d/discovery/sdext/discoverer/httpsd
      - name: Linux elevated-parent integration tests
        if: runner.os == 'Linux'
        working-directory: src/go
        shell: bash
        run: |
          set -euxo pipefail
          for package in pkg/credentialfile pkg/web; do
            test_binary="$RUNNER_TEMP/${package//\//-}.test"
            go test -race -c -o "$test_binary" "./$package"
            sudo env "NETDATA_TEST_ND_RUN=$NETDATA_TEST_ND_RUN" \
              "$test_binary" -test.run '^TestC' -test.v
          done
