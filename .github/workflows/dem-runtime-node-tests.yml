---
name: DEM runtime wire compatibility
on:
  workflow_call:
    inputs:
      run_tests:
        description: Select wire tests; release callers always use the default
        type: boolean
        default: true
      source_sha:
        description: Frozen source commit; defaults to the caller checkout
        type: string
        default: ''
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip unrelated changes
        if: ${{ !inputs.run_tests }}
        run: echo 'No runtime wire inputs changed.'
      - if: inputs.run_tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Read the runtime Node pin
        if: inputs.run_tests
        id: runtime
        run: |
          python3 -c 'import json; print("node=" + json.load(open("src/dem-runtime/manifest.json"))["node_version"])' >> "$GITHUB_OUTPUT"
      - if: inputs.run_tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Test real runner output against the frozen baseline
        if: inputs.run_tests
        working-directory: src/dem-runtime
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
