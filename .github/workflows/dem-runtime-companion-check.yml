---
name: Check Published DEM Companion
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      companion_run_id:
        type: string
        default: ''
      channel:
        required: true
        type: string
      version:
        type: string
        default: ''
    outputs:
      run_id:
        description: Parent run whose successful publication was verified
        value: ${{ jobs.check.outputs.run_id }}
permissions:
  contents: read
  actions: read
jobs:
  check:
    name: Verify the exact released runtime companions
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ inputs.companion_run_id }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - name: Require immutable release transport
        if: github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          COMPANION_RUN: ${{ inputs.companion_run_id }}
          REQUESTED_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPANION_RUN" =~ ^[1-9][0-9]*$ ]]
          canonical="$(cat packaging/version)"
          if [ "$CHANNEL" = nightly ]; then
            test "$REQUESTED_VERSION" = nightly
            case "$canonical" in *-nightly) ;; *) exit 1 ;; esac
          elif [ "$CHANNEL" = stable ] || [ "$CHANNEL" = release-candidate ]; then
            test "${REQUESTED_VERSION#v}" = "${canonical#v}"
          else
            test "$CHANNEL" = devel
          fi
      - name: Stamp the exact Agent identity
        if: github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHANNEL: ${{ inputs.channel }}
        run: python3 packaging/release_info.py --channel "$CHANNEL" --source "$SOURCE_SHA"
      - name: Require successful companion publication by an Agent release lane
        if: github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMPANION_RUN: ${{ inputs.companion_run_id }}
        with:
          script: |
            const request = {...context.repo, run_id: Number(process.env.COMPANION_RUN)};
            const run = (await github.rest.actions.getWorkflowRun(request)).data;
            const owners = ['release', 'build', 'packaging', 'docker'].map(name => `.github/workflows/${name}.yml`);
            if (!owners.includes(run.path)) throw new Error('Companion must come from an Agent release lane');
            const releaseEvent = run.event === 'workflow_dispatch' ||
              (run.path === '.github/workflows/release.yml' && run.event === 'schedule');
            if (!releaseEvent || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Companion must come from a same-repository release invocation, not a pull request');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...request, filter: 'all', per_page: 100});
            if (!jobs.some(job => job.name.endsWith('Publish the tested Agent companion') && job.conclusion === 'success')) {
              throw new Error('The exact companion has not completed publication');
            }
      - name: Download the successful publication receipt
        if: github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dem-runtime-publication-receipt
          path: ${{ runner.temp }}/companion-receipt
          run-id: ${{ inputs.companion_run_id }}
          github-token: ${{ github.token }}
      - name: Verify both architectures and the frozen release identity
        if: github.event_name == 'workflow_dispatch' && github.repository == 'netdata/netdata'
        run: python3 packaging/dem-runtime/ci.py verify-publication-receipt --receipt "$RUNNER_TEMP/companion-receipt" --release-info packaging/release-info
