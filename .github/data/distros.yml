# This defines the full set of distros we run CI on.
# TEMPORARY: trimmed to a small representative set (alpine edge, debian 11+13,
# fedora 44, rocky 8) while the macOS pkg work iterates. Restore the full list
# before merge.
---
platform_map:  # map packaging architectures to docker platforms
  aarch64: linux/arm64/v8
  amd64: linux/amd64
  arm64: linux/arm64/v8
  armhf: linux/arm/v7
  armhfp: linux/arm/v7
  armv6l: linux/arm/v6
  armv7l: linux/arm/v7
  i386: linux/386
  x86_64: linux/amd64
arch_order:  # sort order for per-architecture jobs in CI
  - amd64
  - x86_64
  - i386
  - armhf
  - armhfp
  - armv6l
  - armv7l
  - arm64
  - aarch64
arch_data:  # Mapping of per-architecture matrix behavior.
  amd64: &amd64
    qemu: false
    runner: &x86-runner ubuntu-24.04
  x86_64: *amd64
  i386: *amd64
  armhf: &arm
    qemu: false
    runner: &arm-runner ubuntu-24.04-arm
  armhfp: *arm
  armv6l: *arm
  armv7l: *arm
  arm64: &arm64
    qemu: false
    runner: *arm-runner
  aarch64: *arm64
static_arches:  # Static build architectures
  - x86_64
  - armv6l
  - armv7l
  - aarch64
docker_arches:  # Docker build archtiectures
  - amd64
  - armv7l
  - arm64
default_sentry: &default_sentry # Default configuration for Sentry usage
  amd64: false
  x86_64: false
  i386: false
  armhf: false
  armhfp: false
  arm64: false
  aarch64: false
default_builder_rev: &def_builder_rev v2
include:
  - &alpine
    distro: alpine
    version: edge
    support_type: Community
    notes: ''
    eol_check: false
    bundle_sentry: *default_sentry
    env_prep: |
      apk add -U bash
    jsonc_removal: |
      apk del json-c-dev
    test:
      ebpf-core: true
  - &debian
    distro: debian
    version: "13"
    support_type: Core
    notes: ''
    base_image: debian:trixie
    eol_check: true
    eol_lts: true
    bundle_sentry:
      <<: *default_sentry
      amd64: true
    env_prep: |
      apt-get update
    jsonc_removal: |
      apt-get purge -y libjson-c-dev
    packages: &debian_packages
      type: deb
      repo_distro: debian/trixie
      builder_rev: v2
      arches:
        - amd64
        - armhf
        - arm64
    test:
      ebpf-core: true
  - <<: *debian
    version: "11"
    base_image: debian:bullseye
    packages:
      <<: *debian_packages
      repo_distro: debian/bullseye
      arches:
        - i386
        - amd64
        - armhf
        - arm64
    test:
      ebpf-core: false

  - &fedora
    distro: fedora
    version: "44"
    support_type: Core
    notes: ''
    eol_check: true
    bundle_sentry: *default_sentry
    jsonc_removal: |
      dnf remove -y json-c-devel
    packages: &fedora_packages
      type: rpm
      repo_distro: fedora/44
      builder_rev: *def_builder_rev
      arches:
        - x86_64
        - aarch64
    test:
      ebpf-core: true

  - distro: rockylinux
    version: "8"
    base_image: rockylinux:8
    support_type: Core
    notes: ''
    jsonc_removal: |
      dnf remove -y json-c-devel
    eol_check: true
    bundle_sentry: *default_sentry
    packages:
      type: rpm
      repo_distro: el/8
      builder_rev: *def_builder_rev
      alt_links:
        - el/8Server
        - el/8Client
        - el/8RedHatVirtualizationHost
      arches:
        - x86_64
        - aarch64
    test:
      ebpf-core: true
legacy: [] # TEMPORARY: emptied with the trim above; restore before merge.
no_include: # Info for platforms not covered in CI
  - distro: docker
    version: "19.03 or newer"
    support_type: Core
    notes: ''
    packages:
      arches:
        - linux/i386
        - linux/amd64
        - linux/arm/v7
        - linux/arm64

  - distro: clearlinux
    version: latest
    support_type: Community
    notes: ''

  - &rhel
    distro: rhel
    version: "10.x"
    support_type: Core
    notes: ''
    packages:
      arches:
        - x86_64
        - aarch64
  - <<: *rhel
    version: "9.x"
  - <<: *rhel
    version: "8.x"

  - &freebsd
    distro: freebsd
    version: 13-STABLE
    support_type: Community
    notes: ''

  - &macos
    distro: macos
    version: '13'
    support_type: Community
    notes: ''
  - <<: *macos
    version: '12'
  - <<: *macos
    version: '11'

  - distro: gentoo
    version: latest
    support_type: Community
    notes: ''
