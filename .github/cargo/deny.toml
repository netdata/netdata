# cargo-deny policy for the src/crates workspace. Not auto-discovered: pass it with --config. CI runs only `check advisories`.

[advisories]
# Unmaintained crates that were vetted and accepted. A vulnerability advisory against any of them still fails.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 2 (direct) is unmaintained; vetted and accepted" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml (via serde_yaml) is unmaintained; vetted and accepted" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; also reached via netgauze-bmp-pkt; vetted and accepted" },
    { id = "RUSTSEC-2026-0542", reason = "humantime (via console-subscriber, humantime-serde) is unmaintained because it wraps chrono; vetted and accepted" },
]
