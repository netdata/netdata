receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 1s
exporters:
  file:
    path: /evidence/metrics.json
  otlp_grpc/netdata:
    endpoint: netdata:4317
    tls:
      insecure: true
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, otlp_grpc/netdata]
